<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Dojo — Publications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
:root{
  /* MySQL Workbench Dark Mode palette */
  --bg:#1a1b21; --bg-alt:#1e1f26; --panel:#22232b; --panel-2:#2a2c36;
  --border:#34363f; --text:#e8e9ee; --text-dim:#9a9ba8; --text-faint:#6c6d7a;
  --accent:#3574f0; --accent-2:#e0a458; --good:#22c55e; --bad:#ef4444; --warn:#e0a458;
  --radius:8px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{min-height:100vh;}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 22px;background:var(--bg-alt);
  border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;
}
header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;letter-spacing:.2px;}
header h1 .logo{font-size:22px;}
header h1 small{font-weight:400;color:var(--text-dim);font-size:12px;display:block;margin-top:2px;}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.hud .chip{
  background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
  padding:6px 13px;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.hud .chip b{color:var(--text);}
.hud .chip.streak{color:#ffb020;border-color:#ffb02055;}
button, select, input[type=text], input[type=number]{
  font-family:inherit;font-size:14px;
}
button{
  cursor:pointer;border:1px solid transparent;border-radius:6px;padding:10px 18px;font-weight:600;
  background:var(--accent);color:white;transition:filter .12s ease;
}
button:hover{filter:brightness(1.15);}
button:active{filter:brightness(.92);}
button.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
button.good{background:var(--good);}
button.small{padding:6px 12px;font-size:12.5px;border-radius:5px;}
button:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- layout ---------- */
.layout{display:flex;flex:1;min-height:0;}
aside#sidebar{
  width:280px;flex-shrink:0;background:var(--bg-alt);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;
}
aside#sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin:4px 8px 10px;font-weight:700;}
.schema-filter{
  width:100%;padding:7px 10px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:12.5px;
}
.schema-filter::placeholder{color:var(--text-faint);}
.table-card{background:transparent;border:none;border-radius:4px;margin-bottom:1px;overflow:hidden;}
.table-head{
  display:flex;align-items:center;justify-content:space-between;padding:6px 8px;cursor:pointer;user-select:none;
  border-radius:4px;
}
.table-head:hover{background:var(--panel-2);}
.table-card.open > .table-head{background:var(--accent);}
.table-card.open > .table-head .tname{color:#fff;}
.table-head .tname{font-family:'SF Mono',Consolas,monospace;font-size:13px;color:var(--text);font-weight:500;}
.table-head .tname::before{content:"▤ ";color:var(--text-faint);}
.table-head .arrow{color:var(--text-faint);font-size:10px;transition:transform .15s;}
.table-card.open .arrow{transform:rotate(90deg);}
.table-card.open .table-head .arrow{color:#fff;}
.table-desc{padding:0 8px 6px 24px;font-size:11px;color:var(--text-faint);}
.table-cols{display:none;padding:2px 8px 8px 24px;font-family:'SF Mono',Consolas,monospace;font-size:12px;border-left:1px solid var(--border);margin-left:12px;}
.table-card.open .table-cols{display:block;}
.col-row{display:flex;justify-content:space-between;padding:2px 0;color:var(--text-dim);}
.col-row .ctype{color:var(--text-faint);font-size:10.5px;}
.col-row.pk{color:var(--accent-2);}
.preview-btn{
  margin:4px 8px 10px 24px;font-size:11px;padding:5px 9px;width:calc(100% - 32px);
}

/* ---------- main ---------- */
main{flex:1;min-width:0;overflow-y:auto;padding:22px;display:flex;justify-content:center;}
.screen{width:100%;max-width:900px;}

/* setup screen */
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px;}
.setup-card h2{margin-top:0;}
.field{margin-bottom:22px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.topic-pill{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
  cursor:pointer;background:var(--panel-2);transition:.12s;
}
.topic-pill.active{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 18%, var(--panel-2));}
.topic-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex-shrink:0;}
.topic-pill .tt{font-size:13px;}
.topic-pill .tt small{display:block;color:var(--text-faint);font-size:10.5px;}
.row-inline{display:flex;gap:10px;flex-wrap:wrap;}
.count-btn{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);}
.count-btn.active{border-color:var(--accent);background:#3574f033;color:white;}
.start-row{display:flex;justify-content:center;gap:10px;margin-top:8px;}
.mix-note{background:#2a1414;border:1px solid #ef444455;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.mix-note b{color:#f87171;}
.setup-card + .setup-card{margin-top:18px;}
.freeplay-card{background:linear-gradient(135deg,#152238,var(--panel) 60%);border-color:#3574f044;}

/* lesson screen */
.lesson-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-bottom:16px;}
.lesson-card h2{margin-top:0;display:flex;align-items:center;gap:10px;}
.lesson-step{border-left:3px solid var(--tc,var(--accent));padding:4px 0 4px 16px;margin-bottom:18px;}
.lesson-step h4{margin:0 0 6px;font-size:15px;color:var(--tc,var(--accent));}
.lesson-step p{margin:0 0 8px;font-size:14px;line-height:1.6;color:var(--text-dim);}
.lesson-step .lex{background:#00000033;border-radius:8px;padding:9px 12px;font-family:monospace;font-size:12.5px;color:var(--accent-2);}
.lesson-condensed{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--border);}
.lesson-condensed:last-child{border-bottom:none;}
.lesson-condensed b{color:var(--tc,var(--accent));}

/* hints */
.hint-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.hint-box{background:#152238;border:1px solid #3574f044;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:var(--text-dim);}
.hint-box .hb-tier{color:#7ba8f5;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.hint-box code{display:block;margin-top:6px;background:#00000044;padding:8px 10px;border-radius:6px;font-family:monospace;color:#9ff5c6;white-space:pre-wrap;}
.alt-box{margin-top:12px;background:#0c1a24;border:1px solid #14b8a644;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-dim);}
.alt-box .ab-title{color:#5eead4;font-weight:700;margin-bottom:6px;}
.alt-box code{display:block;margin:6px 0;background:#00000044;padding:8px 10px;border-radius:6px;font-family:monospace;color:#9ff5c6;white-space:pre-wrap;font-size:12px;}

/* explorer-style data browser */
.modal-box.wide{min-width:min(900px,90vw);}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.search-box{padding:7px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);min-width:200px;}
.refcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.refcard summary{padding:10px 12px;cursor:pointer;font-size:12.5px;color:var(--text-dim);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
.refcard summary::-webkit-details-marker{display:none;}
.refcard .refbody{padding:0 12px 12px;font-size:11.5px;color:var(--text-faint);}
.refcard table{width:100%;border-collapse:collapse;margin-top:6px;}
.refcard td{padding:3px 4px;border-bottom:1px solid #232735;}
.refcard td.k{color:var(--accent-2);font-family:monospace;}

/* question screen */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.topic-badge{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:700;
  background:color-mix(in srgb, var(--tc) 22%, transparent);color:var(--tc);border:1px solid color-mix(in srgb, var(--tc) 45%, transparent);
}
.stars{color:#ffd166;font-size:13px;letter-spacing:1px;}
.progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:99px;margin:0 14px;overflow:hidden;min-width:100px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s;}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;}
.q-card p{margin:0;font-size:15.5px;line-height:1.55;}
.editor-wrap{background:#18191f;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}
.editor-toolbar{
  display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1e1f26;
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-faint);
}
.editor-toolbar .kbd{background:#2a2c36;padding:2px 7px;border-radius:5px;font-family:monospace;color:var(--text);}
.CodeMirror{height:150px;font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:14px;line-height:1.5;}

/* ---- MySQL-Workbench-artiges Syntax-Highlighting (auf dracula-Basis umgefärbt) ---- */
.cm-s-dracula.CodeMirror{background:#18191f !important;color:#e8e9ee !important;}
.cm-s-dracula .CodeMirror-gutters{background:#18191f !important;border-right:1px solid #2a2c36 !important;}
.cm-s-dracula .CodeMirror-linenumber{color:#4d4f5a !important;}
.cm-s-dracula .cm-keyword{color:#e0a458 !important;font-weight:600;}
.cm-s-dracula .cm-atom{color:#e0a458 !important;}
.cm-s-dracula .cm-builtin{color:#6fa8dc !important;}
.cm-s-dracula .cm-def{color:#e8e9ee !important;}
.cm-s-dracula .cm-variable, .cm-s-dracula .cm-variable-2, .cm-s-dracula .cm-property{color:#e8e9ee !important;}
.cm-s-dracula .cm-string{color:#9dc76e !important;}
.cm-s-dracula .cm-number{color:#c9a0dc !important;}
.cm-s-dracula .cm-comment{color:#6fa8dc !important;font-style:italic;}
.cm-s-dracula .cm-operator{color:#e8e9ee !important;}
.cm-s-dracula .CodeMirror-selected{background:#3574f044 !important;}
.cm-s-dracula .CodeMirror-cursor{border-left:1.5px solid #e8e9ee !important;}
.cm-s-dracula .CodeMirror-matchingbracket{color:#e0a458 !important;background:#3574f033;}
.run-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.results-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:16px;overflow:hidden;min-height:60px;}
.results-panel .rp-head{padding:10px 16px;font-size:12px;color:var(--text-faint);border-bottom:1px solid var(--border);}
.results-panel .rp-body{overflow:auto;max-height:260px;}
table.result-table{border-collapse:collapse;width:100%;font-size:13px;}
table.result-table th{
  position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 12px;color:var(--accent-2);
  font-family:monospace;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.result-table td{padding:7px 12px;border-bottom:1px solid #232735;color:var(--text-dim);white-space:nowrap;font-family:monospace;}
table.result-table tr:hover td{background:var(--panel-2);}
.empty-note, .error-note{padding:16px;font-size:13.5px;color:var(--text-faint);}
.error-note{color:#ff8080;font-family:monospace;white-space:pre-wrap;}

/* mini-dashboard under multi-row aggregate results */
.mini-chart{border-top:1px solid var(--border);padding:14px 16px;}
.mini-chart .mc-head{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:700;}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.chart-row .chart-label{width:150px;flex-shrink:0;font-size:12px;color:var(--text-dim);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-row .chart-track{flex:1;height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.chart-row .chart-fill{height:100%;background:var(--accent);border-radius:3px;}
.chart-row .chart-val{width:60px;text-align:right;font-size:12px;color:var(--text);font-family:monospace;flex-shrink:0;}

.feedback{border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;border:1.5px solid;}
.feedback.ok{background:#16301f;border-color:#22c55e55;}
.feedback.bad{background:#301616;border-color:#ef444455;}
.feedback h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px;}
.feedback.ok h3{color:#4ade80;}
.feedback.bad h3{color:#fb7185;}
.feedback .body{font-size:14px;line-height:1.6;color:var(--text-dim);}
.feedback .example-box{
  margin-top:10px;background:#00000033;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-dim);
  border-left:3px solid var(--accent);
}
.feedback .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.solution-box{margin-top:12px;background:#0c0d13;border-radius:10px;padding:12px 14px;font-family:monospace;font-size:12.5px;color:#9ff5c6;white-space:pre-wrap;border:1px solid #22c55e33;}

/* summary screen */
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center;}
.summary-card .big-score{font-size:48px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.summary-card .sub{color:var(--text-dim);margin-top:4px;}
.crown{font-size:34px;}
.topic-bars{margin-top:26px;text-align:left;}
.tb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tb-row .tb-label{width:200px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.tb-row .tb-track{flex:1;height:9px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
.tb-row .tb-fill{height:100%;border-radius:99px;}
.tb-row .tb-pct{width:40px;text-align:right;font-size:12px;color:var(--text-faint);}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999;}
.confetti span{
  position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;
  animation:fall 2.6s linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}

/* preview modal */
.modal-backdrop{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;z-index:500;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:90vw;max-height:80vh;overflow:auto;padding:18px;}
.modal-box h3{margin-top:0;font-family:monospace;color:var(--accent-2);}

.hidden{display:none !important;}
.text-faint{color:var(--text-faint);}
@media (max-width:800px){
  aside#sidebar{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo">🐬</span>SQL Dojo <small>Publications-Datenbank &middot; von Beginner zu Advanced</small></h1>
    <div class="hud" id="hud"></div>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <h2>Schema</h2>
      <input class="schema-filter" id="schema-filter" placeholder="🔍 Tabellen filtern…" oninput="filterSchema(this.value)">
      <div id="schema-tree"></div>
    </aside>
    <main>
      <div class="screen" id="screen-setup"></div>
      <div class="screen hidden" id="screen-lesson"></div>
      <div class="screen hidden" id="screen-question"></div>
      <div class="screen hidden" id="screen-summary"></div>
    </main>
  </div>
</div>
<div id="modal-root"></div>
<div id="confetti-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
/* =========================================================================
   SQL DOJO — Lern-Tool für die Publications-Datenbank
   ========================================================================= */

const DB_B64 = "__DB_BASE64_PLACEHOLDER__";

const SCHEMA = [
  {name:"authors", desc:"Autor:innen mit Adresse und Vertragsstatus", cols:[
    ["au_id","TEXT","PK"],["au_lname","TEXT"],["au_fname","TEXT"],["phone","TEXT"],
    ["address","TEXT"],["city","TEXT"],["state","TEXT"],["zip","TEXT"],["contract","INTEGER"]]},
  {name:"titles", desc:"Bücher / Titel", cols:[
    ["title_id","TEXT","PK"],["title","TEXT"],["type","TEXT"],["pub_id","TEXT"],["price","NUMERIC"],
    ["advance","NUMERIC"],["royalty","INTEGER"],["ytd_sales","INTEGER"],["notes","TEXT"],["pubdate","TEXT"]]},
  {name:"titleauthor", desc:"Verknüpfung: welche Autor:in schrieb welches Buch", cols:[
    ["au_id","TEXT","PK"],["title_id","TEXT","PK"],["au_ord","INTEGER"],["royaltyper","INTEGER"]]},
  {name:"publishers", desc:"Verlage", cols:[
    ["pub_id","TEXT","PK"],["pub_name","TEXT"],["city","TEXT"],["state","TEXT"],["country","TEXT"]]},
  {name:"pub_info", desc:"Zusatzinfos zu Verlagen (PR-Text, Logo)", cols:[
    ["pub_id","TEXT","PK"],["logo","BLOB"],["pr_info","TEXT"]]},
  {name:"sales", desc:"Einzelne Verkäufe / Bestellungen", cols:[
    ["stor_id","TEXT","PK"],["ord_num","TEXT","PK"],["ord_date","TEXT"],["qty","INTEGER"],["payterms","TEXT"],["title_id","TEXT","PK"]]},
  {name:"stores", desc:"Buchhandlungen, die verkaufen", cols:[
    ["stor_id","TEXT","PK"],["stor_name","TEXT"],["stor_address","TEXT"],["city","TEXT"],["state","TEXT"],["zip","TEXT"]]},
  {name:"discounts", desc:"Rabatte, die manche Stores anbieten", cols:[
    ["discounttype","TEXT"],["stor_id","TEXT"],["lowqty","INTEGER"],["highqty","INTEGER"],["discount","NUMERIC"]]},
  {name:"roysched", desc:"Staffelung der Tantiemen (royalty) je Buch", cols:[
    ["title_id","TEXT"],["lorange","INTEGER"],["hirange","INTEGER"],["royalty","INTEGER"]]},
  {name:"employee", desc:"Mitarbeitende der Verlage", cols:[
    ["emp_id","TEXT","PK"],["fname","TEXT"],["minit","TEXT"],["lname","TEXT"],["job_id","INTEGER"],
    ["job_lvl","INTEGER"],["pub_id","TEXT"],["hire_date","TEXT"]]},
  {name:"jobs", desc:"Jobbezeichnungen und Gehaltsstufen", cols:[
    ["job_id","INTEGER","PK"],["job_desc","TEXT"],["min_lvl","INTEGER"],["max_lvl","INTEGER"]]},
];

const TOPICS = [
  {id:"select_from", icon:"🔍", color:"#06b6d4", title:"SELECT · FROM · AS · DISTINCT",
   concept:"SELECT bestimmt WELCHE Spalten du sehen willst, FROM WOHER die Daten kommen. AS gibt einer Spalte oder Tabelle in der Ausgabe einen anderen Namen — das ändert nichts an der echten Tabelle. DISTINCT entfernt doppelte Zeilen aus dem Ergebnis.",
   example:"Wenn zwei Autor:innen zufällig beide 'Miller' heißen, gibt dir SELECT au_lname FROM authors zweimal 'Miller' zurück. SELECT DISTINCT au_lname FROM authors zeigt 'Miller' nur einmal.",
   lesson:[
     {t:"SELECT", b:"Mit SELECT sagst du, WELCHE Spalten du am Ende sehen willst. Jedes Element im SELECT wird eine Spalte in deiner Ausgabe, getrennt durch Kommas.", ex:"SELECT au_fname, au_lname FROM authors; — zeigt nur Vor- und Nachname, nicht alle 9 Spalten der Tabelle."},
     {t:"FROM", b:"FROM sagt WOHER die Daten kommen — aus welcher Tabelle. Eine Datenbank besteht meist aus vielen Tabellen, FROM legt fest, mit welcher du gerade arbeitest.", ex:"SELECT * FROM titles; — holt alle Spalten und Zeilen aus der Tabelle titles."},

/* ================= MySQL-Kompatibilitätsschicht ================= */

function mysqlCompat(sql){
  sql = sql.replace(/\bLEFT\s*\(/gi, "LEFTSTR(");
  sql = sql.replace(/\bRIGHT\s*\(/gi, "RIGHTSTR(");
  sql = sql.replace(/(TIMESTAMPDIFF\s*\(\s*)(YEAR|MONTH|DAY|WEEK|HOUR|MINUTE|SECOND)(\s*,)/gi, "$1'$2'$3");
  sql = sql.replace(/^\s*USE\s+\w+\s*;?\s*/i, "");
  return sql;
}

function parseSqlDate(s){
  if (s===null || s===undefined) return null;
  const datePart = String(s).split(" ")[0];
  const d = new Date(datePart+"T00:00:00Z");
  return isNaN(d.getTime()) ? null : d;
}

const MONTHS_DE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS_DE = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function registerUdfs(db){
  db.create_function("CONCAT", function(...args){
    if (args.some(a=>a===null||a===undefined)) return null;
    return args.join("");
  });
  db.create_function("LEFTSTR", function(s,n){ return s===null ? null : String(s).slice(0, Number(n)); });
  db.create_function("RIGHTSTR", function(s,n){
    if (s===null) return null;
    n = Number(n);
    return n>0 ? String(s).slice(-n) : "";
  });
  db.create_function("CURDATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("CURRENT_DATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("DATEDIFF", function(a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    return Math.round((da-db_)/86400000);
  });
  db.create_function("TIMESTAMPDIFF", function(unit,a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    const days = Math.round((db_-da)/86400000);
    unit = String(unit).toUpperCase();
    if (unit==="DAY") return days;
    if (unit==="YEAR"){
      let y = db_.getUTCFullYear()-da.getUTCFullYear();
      if ((db_.getUTCMonth()<da.getUTCMonth()) || (db_.getUTCMonth()===da.getUTCMonth() && db_.getUTCDate()<da.getUTCDate())) y--;
      return y;
    }
    if (unit==="MONTH"){
      let m = (db_.getUTCFullYear()-da.getUTCFullYear())*12 + (db_.getUTCMonth()-da.getUTCMonth());
      if (db_.getUTCDate() < da.getUTCDate()) m--;
      return m;
    }
    return days;
  });
  db.create_function("DATE_FORMAT", function(s, fmt){
    const d = parseSqlDate(s);
    if (!d) return null;
    let out = "";
    for (let i=0;i<fmt.length;i++){
      if (fmt[i]==="%" && i+1<fmt.length){
        const spec = fmt[i+1];
        if (spec==="Y") out += String(d.getUTCFullYear()).padStart(4,"0");
        else if (spec==="m") out += String(d.getUTCMonth()+1).padStart(2,"0");
        else if (spec==="d") out += String(d.getUTCDate()).padStart(2,"0");
        else if (spec==="e") out += String(d.getUTCDate());
        else if (spec==="M") out += MONTHS_DE[d.getUTCMonth()];
        else if (spec==="W") out += WEEKDAYS_DE[(d.getUTCDay()+6)%7];
        else out += spec;
        i++;
      } else out += fmt[i];
    }
    return out;
  });
  db.create_function("CHAR_LENGTH", function(s){ return s===null ? null : String(s).length; });
}

function rewriteRightJoin(sql){
  const m = sql.match(/^(.*?FROM\s+)([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+RIGHT\s+JOIN\s+([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+(ON\s+[\s\S]+?|USING\s*\([\s\S]+?\))(\s+(?:WHERE|GROUP BY|ORDER BY|LIMIT)[\s\S]*)?$/i);
  if (!m) return null;
  const [, pre, tblA, tblB, cond, rest] = m;
  return `${pre}${tblB} LEFT JOIN ${tblA} ${cond}${rest||""}`;
}

function execSqlRaw(sql){
  const res = db.exec(sql);
  if (!res.length) return {columns:[], values:[]};
  return res[res.length-1];
}

function execSqlSafe(sql){
  try{
    return execSqlRaw(sql);
  }catch(e){
    if (/RIGHT\s+JOIN/i.test(sql) && /RIGHT and FULL OUTER JOINs? are not (currently )?supported/i.test(e.message)){
      const rewritten = rewriteRightJoin(sql);
      if (rewritten){ return execSqlRaw(rewritten); }
    }
    throw e;
  }
}

function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ================= Fragen-Engine ================= */

function fillTemplate(tpl, params){
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (params[k]!==undefined ? params[k] : m));
}

function pickParams(q){
  if (!q.param_pool) return {};
  const pool = q.param_pool;
  const result = {};
  for (const key of Object.keys(pool)){
    const values = pool[key];
    const choice = values[Math.floor(Math.random()*values.length)];
    if (Array.isArray(choice)){
      if (key==="lo_hi"){ result.lo=choice[0]; result.hi=choice[1]; }
      else if (key==="pct_factor"){ result.pct=choice[0]; result.factor=choice[1]; }
      else if (key==="name"){ result.fname=choice[0]; result.lname=choice[1]; }
    } else {
      result[key] = choice;
    }
  }
  return result;
}

function buildInstance(q){
  const params = pickParams(q);
  const sql = mysqlCompat(fillTemplate(q.sql, params));
  const promptText = fillTemplate(q.de_prompt, params);
  let refResult = null, refError = null;
  try{ refResult = execSqlSafe(sql); }
  catch(e){ refError = e.message; }
  return {qdef:q, params, sql, promptText, refResult, refError};
}

function normVal(v){
  if (v===null || v===undefined) return null;
  if (typeof v === "number") return Math.round(v*10000)/10000;
  if (typeof v === "string") return v.trim();
  return v;
}
function rowKey(row){ return row.map(v=>String(v)).join(""); }

function compareResults(expected, actual){
  if (!expected) return {ok:false, reason:"no_reference"};
  if (expected.columns.length !== actual.columns.length){
    return {ok:false, reason:"column_count", expCols:expected.columns.length, actCols:actual.columns.length};
  }
  const exp = expected.values.map(r=>r.map(normVal));
  const act = actual.values.map(r=>r.map(normVal));
  if (exp.length !== act.length){
    return {ok:false, reason:"row_count", expRows:exp.length, actRows:act.length};
  }
  const expSorted = [...exp].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  const actSorted = [...act].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  for (let i=0;i<expSorted.length;i++){
    for (let j=0;j<expSorted[i].length;j++){
      if (expSorted[i][j] !== actSorted[i][j]) return {ok:false, reason:"value_mismatch"};
    }
  }
  return {ok:true};
}

function checkMonotonic(actual, colIdx, dir){
  const vals = actual.values.map(r=>r[colIdx]);
  for (let i=1;i<vals.length;i++){
    const a=vals[i-1], b=vals[i];
    if (a===null||b===null) continue;
    if (dir==="asc" && a>b) return false;
    if (dir==="desc" && a<b) return false;
  }
  return true;
}

function gradeAnswer(inst, actual){
  const cmp = compareResults(inst.refResult, actual);
  if (!cmp.ok) return cmp;
  if (inst.qdef.sortCol !== undefined){
    if (!checkMonotonic(actual, inst.qdef.sortCol, inst.qdef.sortDir)){
      return {ok:false, reason:"sort_missing"};
    }
  }
  return {ok:true};
}

function explainFailure(reason, extra, topic){
  const t = TOPICS.find(x=>x.id===topic);
  switch(reason){
    case "column_count":
      return `Deine Abfrage liefert <b>${extra.actCols}</b> Spalte(n), erwartet werden <b>${extra.expCols}</b>. Schau nochmal in der Aufgabenstellung nach, welche Spalten genau gefragt sind.`;
    case "row_count":
      if (extra.actRows > extra.expRows)
        return `Deine Abfrage liefert <b>mehr Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich filtert deine Bedingung nicht genug ein.<br><br>${t.concept}`;
      return `Deine Abfrage liefert <b>weniger Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich ist deine Bedingung zu streng, oder AND/OR sind vertauscht.<br><br>${t.concept}`;
    case "value_mismatch":
      return `Die Anzahl der Zeilen passt, aber die <b>Werte stimmen nicht überein</b>. Prüfe Berechnungen, Gruppierung oder Rundung.<br><br>${t.concept}`;
    case "sort_missing":
      return `Deine Werte stimmen, aber die <b>Sortierung passt nicht</b>. Denk an ORDER BY (und die Richtung ASC/DESC).`;
    case "no_reference":
      return `Für diese Frage konnte im Hintergrund keine Referenzlösung berechnet werden — das ist ein Fehler im Tool, nicht bei dir. Klick auf "Nächste Frage".`;
    default:
      return t.concept;
  }
}

function explainSqlError(msg){
  if (/no such column/i.test(msg)) return `Diese Spalte gibt es in der Tabelle nicht. Schau links in der Seitenleiste nach den passenden Spaltennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/no such table/i.test(msg)) return `Diese Tabelle gibt es nicht. Schau links in der Seitenleiste nach den verfügbaren Tabellennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/syntax error/i.test(msg)) return `Da steckt ein Tippfehler in der SQL-Syntax (z.B. fehlendes Komma, Klammer oder Anführungszeichen).<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  return `SQL-Fehler: <span class="text-faint">${msg}</span>`;
}

/* ---------- Mini-Dashboard: kleines Balkendiagramm unter Mehrzeilen-Ergebnissen ---------- */
function isNumericCol(res, idx){
  return res.values.every(r => r[idx]!==null && r[idx]!=="" && !isNaN(Number(r[idx])));
}
function detectChartData(res){
  if (!res.values.length || res.values.length < 2) return null; // kein Chart bei 0/1 Zeile
  const nCols = res.columns.length;
  let numIdx = -1;
  for (let i = nCols-1; i>=0; i--){
    if (isNumericCol(res, i)){ numIdx = i; break; }
  }
  if (numIdx === -1) return null; // keine numerische Spalte -> kein Chart
  let labelIdx = -1;
  for (let i=0;i<nCols;i++){
    if (i===numIdx) continue;
    if (!isNumericCol(res, i)){ labelIdx = i; break; }
  }
  if (labelIdx === -1){
    labelIdx = res.columns.findIndex((c,i)=>i!==numIdx);
  }
  if (labelIdx === -1) return null;
  const rows = res.values.map(r=>({label:String(r[labelIdx]), value:Number(r[numIdx])}));
  return {labelCol: res.columns[labelIdx], valueCol: res.columns[numIdx], rows};
}
function renderMiniChart(res){
  const data = detectChartData(res);
  if (!data) return "";
  let rows = data.rows;
  const truncated = rows.length > 12;
  if (truncated) rows = rows.slice(0,12);
  const max = Math.max(...rows.map(r=>Math.abs(r.value)), 1);
  const bars = rows.map(r=>{
    const pct = Math.max(2, Math.round(100*Math.abs(r.value)/max));
    return `<div class="chart-row">
      <span class="chart-label" title="${String(r.label).replace(/"/g,'&quot;')}">${r.label}</span>
      <div class="chart-track"><div class="chart-fill" style="width:${pct}%"></div></div>
      <span class="chart-val">${r.value}</span>
    </div>`;
  }).join("");
  return `<div class="mini-chart">
    <div class="mc-head">📊 ${data.valueCol} nach ${data.labelCol}${truncated? ' · erste 12':''}</div>
    ${bars}
  </div>`;
}

let previewState = null;

function previewTable(name){
  let res;
  try{ res = execSqlSafe(`SELECT * FROM ${name}`); }

  previewState = {name, columns: res.columns, rows: res.values, sortCol: null, sortDir: "asc", filter: ""};

}

function renderPreviewModal(){
  const {name, columns, rows, sortCol, sortDir, filter} = previewState;
  let filtered = rows;
  if (filter){
    const f = filter.toLowerCase();
    filtered = rows.filter(r => r.some(v => String(v).toLowerCase().includes(f)));
  }
  let sorted = filtered;
  if (sortCol !== null){
    sorted = [...filtered].sort((a,b)=>{
      const av=a[sortCol], bv=b[sortCol];
      if (av===bv) return 0;
      if (av===null) return 1;
      if (bv===null) return -1;
      return (av>bv?1:-1) * (sortDir==="asc"?1:-1);
    });
  }
  const modal = document.getElementById("modal-root");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closePreview()">
      <div class="modal-box wide">
        <div class="modal-header">
          <h3 style="margin:0;">${name} <span class="text-faint" style="font-size:12px;font-weight:400;">— ${filtered.length} Zeile${filtered.length===1?'':'n'}${filter? ' (gefiltert von '+rows.length+')':''}</span></h3>
          <input class="search-box" id="preview-search" placeholder="🔍 Suchen…" value="${filter.replace(/"/g,'&quot;')}" oninput="previewState.filter=this.value; renderPreviewModal()">
        </div>
        <div class="rp-body" style="max-height:60vh;overflow:auto;">
          <table class="result-table">
            <thead><tr>${columns.map((c,i)=>`<th style="cursor:pointer;user-select:none;" onclick="sortPreview(${i})">${c} ${sortCol===i? (sortDir==="asc"?'▲':'▼'):''}</th>`).join("")}</tr></thead>
            <tbody>${sorted.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<i style="color:#555">NULL</i>':String(v)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${columns.length}" class="text-faint">Keine Treffer.</td></tr>`}</tbody>
          </table>
        </div>
        <div style="text-align:right;margin-top:12px;">
          <button class="secondary" onclick="closePreview()">Schließen</button>
        </div>
      </div>
    </div>`;
  const inp = document.getElementById("preview-search");
  if (inp){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }
}
function sortPreview(colIdx){
  if (previewState.sortCol === colIdx) previewState.sortDir = previewState.sortDir==="asc" ? "desc" : "asc";
  else { previewState.sortCol = colIdx; previewState.sortDir = "asc"; }
  renderPreviewModal();
}

/* ---------- Question session ---------- */
function startSession(topics, count, freeplay){
  // Guarantee at least one question per selected topic first (shuffled order),
  // then fill the rest adaptively based on where mistakes happen.
  const shuffled = [...topics].sort(()=>Math.random()-0.5);
  const fixedQueue = count===null ? [] : shuffled.slice(0, Math.min(count, shuffled.length));

  session = {
    freeplay: !!freeplay, topics, targetCount: count,
    answered:0, correct:0, streak:0, bestStreak:0,
    topicStats:{}, current:null, wrongOnCurrent:0, hintTier:0,
    fixedQueue, queueIndex:0,
  };
  topics.forEach(t=> session.topicStats[t] = {asked:0, correct:0});
  nextQuestion();
  showScreen("question");
  updateHud();
}

function pickTemplate(topics, avoidId){
  const pool = QUESTIONS.filter(q=>topics.includes(q.topic) && q.id!==avoidId);
  const usePool = pool.length ? pool : QUESTIONS.filter(q=>topics.includes(q.topic));
  const weights = usePool.map(q=>{
    const stats = session.topicStats[q.topic] || {asked:0, correct:0};
    const wrongCount = Math.max(0, stats.asked - stats.correct);
    return 1 + wrongCount*1.5;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0;i<usePool.length;i++){ r -= weights[i]; if (r<=0) return usePool[i]; }
  return usePool[usePool.length-1];
}

function nextQuestion(){
  if (session.targetCount!==null && session.answered >= session.targetCount){
    return endSession();
  }
  const avoidId = session.current ? session.current.qdef.id : null;
  let template;
  if (session.queueIndex < session.fixedQueue.length){
    const forcedTopic = session.fixedQueue[session.queueIndex];
    template = pickTemplate([forcedTopic], avoidId);
    session.queueIndex++;
  } else {
    template = pickTemplate(session.topics, avoidId);
  }
  session.current = buildInstance(template);
  session.wrongOnCurrent = 0;
  session.hintTier = 0;
  renderQuestion();
}

function updateHud(){
  const hud = document.getElementById("hud");
  if (!session){ hud.innerHTML=""; return; }
  hud.innerHTML = `
    ${session.freeplay? `<span class="chip" style="color:#7ba8f5;border-color:#3574f055;">🎲 Freeplay</span>`:""}
    <span class="chip">✅ ${session.correct}/${session.answered}${session.targetCount?'/'+session.targetCount:''}</span>
    <span class="chip streak">🔥 Streak ${session.streak}</span>
    <button class="ghost small" onclick="if(confirm('Runde wirklich beenden?')) endSession()">Runde beenden</button>
  `;
}

  "INNER","ON","USING","AS","AND","OR","NOT","IN","LIKE","BETWEEN","IS","NULL","DISTINCT","CASE","WHEN","THEN",
  "ELSE","END","COUNT","SUM","AVG","MIN","MAX","ROUND","CONCAT","LENGTH","CHAR_LENGTH","UPPER","LOWER",
  "SUBSTRING","LEFTSTR","RIGHTSTR","DATEDIFF","TIMESTAMPDIFF","DATE_FORMAT","CURDATE","CURRENT_DATE","DESC","ASC"]);

function sqlToSkeleton(sql){
  let out = sql.replace(/'[^']*'/g, "'___'");
  out = out.replace(/\b\d+(\.\d+)?\b/g, "___");
  out = out.replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g, (word)=>{
    return SQL_KEYWORDS.has(word.toUpperCase()) ? word.toUpperCase() : "___";
  });
  return out;
}

function planFromSql(sql){
  const parts = [];
  if (/\(SELECT/i.test(sql)) parts.push("eine Subquery in Klammern");
  if (/\bJOIN\b/i.test(sql)) parts.push("ein JOIN zwischen Tabellen");
  if (/CASE\s+WHEN/i.test(sql)) parts.push("CASE WHEN für eine neue Kategorien-Spalte");
  if (/GROUP BY/i.test(sql)) parts.push("GROUP BY");
  if (/HAVING/i.test(sql)) parts.push("HAVING (nach dem GROUP BY)");
  if (/\bWHERE\b/i.test(sql)) parts.push("WHERE zum Filtern einzelner Zeilen");
  if (/\bDISTINCT\b/i.test(sql)) parts.push("DISTINCT");
  if (/(COUNT|SUM|AVG|MIN|MAX)\s*\(/i.test(sql)) parts.push("eine Aggregatfunktion (COUNT/SUM/AVG/MIN/MAX)");
  if (/\bLIKE\b/i.test(sql)) parts.push("LIKE mit einem Platzhalter (% oder _)");
  if (/\bIN\s*\(/i.test(sql)) parts.push("IN mit einer Werteliste");
  if (/BETWEEN/i.test(sql)) parts.push("BETWEEN für einen Bereich");
  if (/DATEDIFF|TIMESTAMPDIFF|DATE_FORMAT/i.test(sql)) parts.push("eine Datumsfunktion");
  if (/CONCAT|LENGTH|LEFTSTR|RIGHTSTR|SUBSTRING|UPPER/i.test(sql)) parts.push("eine Textfunktion");
  if (/ORDER BY/i.test(sql)) parts.push("ORDER BY zum Sortieren");
  if (/LIMIT/i.test(sql)) parts.push("LIMIT zum Abschneiden");
  return parts;
}

function explainQuery(sql){
  const plan = planFromSql(sql);
  return plan.length ? "Diese Lösung nutzt: " + plan.join(", ") + "." : "Diese Lösung ist eine einfache SELECT/WHERE-Abfrage ohne weitere Extras.";
}

function currentHintTopic(){ return TOPICS.find(t=>t.id===session.current.qdef.topic); }

function showHint(){
  session.hintTier = Math.min(3, (session.hintTier||0) + 1);
  renderHints();
}

function renderHints(){
  const inst = session.current;
  const tier = session.hintTier||0;
  const topic = currentHintTopic();
  let html = "";
  if (tier>=1){
    const label = session.freeplay
      ? `Das gehört zum Thema <b>${topic.icon} ${topic.title}</b>.`
      : `Erinnerung: ${topic.concept}`;
    html += `<div class="hint-box"><div class="hb-tier">Tipp 1 · Kategorie</div>${label}</div>`;
  }
  if (tier>=2){
    const plan = planFromSql(inst.sql);
    const label = plan.length ? "Du brauchst ungefähr: " + plan.join(", ") + "." : "Hier reicht ein einfaches SELECT mit WHERE — kein besonderes Extra-Werkzeug nötig.";
    html += `<div class="hint-box"><div class="hb-tier">Tipp 2 · Bauplan</div>${label}</div>`;
  }
  if (tier>=3){
    html += `<div class="hint-box"><div class="hb-tier">Tipp 3 · Skelett</div>Fülle die Lücken selbst aus:<code>${sqlToSkeleton(inst.sql).replace(/</g,"&lt;")}</code></div>`;
  }
  document.getElementById("hint-zone").innerHTML = html;
  const btn = document.getElementById("hint-btn");
  if (btn){
    btn.textContent = tier>=3 ? "💡 Tipp (alle genutzt)" : `💡 Tipp (${tier}/3)`;
    btn.disabled = tier>=3;
  }
}

function giveUp(){
  const inst = session.current;
  const stats = session.topicStats[inst.qdef.topic];
  session.answered++; stats.asked++; session.streak = 0;
  const topic = currentHintTopic();
  document.getElementById("feedback-zone").innerHTML = `
    <div class="feedback bad">
      <h3>🏳 Hier ist die Lösung</h3>
      <div class="body">${explainQuery(inst.sql)}</div>
      <div class="solution-box">${inst.sql.replace(/</g,"&lt;")}</div>
      ${session.freeplay ? `<div class="body" style="margin-top:10px;">💡 Thema war: <b>${topic.icon} ${topic.title}</b> — ${topic.concept}</div>` : ""}
      <div class="actions">
        <button onclick="nextQuestion()">Verstanden, nächste Frage →</button>
      </div>
    </div>`;
  document.getElementById("hint-zone").innerHTML = "";
  updateHud();
}

function runAndCheck(){
  const userSql = cm.getValue();
  const resultsPanel = document.getElementById("results-panel").querySelector(".rp-body");
  const feedbackZone = document.getElementById("feedback-zone");
  let actual;
  try{
    actual = execSqlSafe(mysqlCompat(userSql));
  }catch(e){
    resultsPanel.innerHTML = `<div class="error-note">${e.message}</div>`;
    feedbackZone.innerHTML = renderFeedbackHtml(false, explainSqlError(e.message), null);
    session.wrongOnCurrent++;
    return;
  }
  resultsPanel.innerHTML = actual.values.length
    ? renderTableHtml(actual) + renderMiniChart(actual)
    : `<div class="empty-note">Deine Abfrage lief fehlerfrei, liefert aber 0 Zeilen.</div>`;

  const verdict = gradeAnswer(session.current, actual);
  handleVerdict(verdict);
}

function handleVerdict(verdict){
  const inst = session.current;
  const topic = inst.qdef.topic;
  const stats = session.topicStats[topic];
  const feedbackZone = document.getElementById("feedback-zone");

  if (verdict.ok){
    if (session.wrongOnCurrent===0){ session.streak++; session.bestStreak=Math.max(session.bestStreak, session.streak); }
    else { session.streak = 0; }
    session.correct++;
    session.answered++;
    stats.asked++; stats.correct++;
    feedbackZone.innerHTML = renderFeedbackHtml(true, pickPraise(), null);
    if (session.freeplay){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">💡 Thema war: ${TOPICS.find(t=>t.id===topic).icon} ${TOPICS.find(t=>t.id===topic).title}</div>${TOPICS.find(t=>t.id===topic).concept}</div>`;
    }
    if (inst.qdef.alt){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">🔀 Es gibt noch einen anderen guten Weg</div>
        <code>${inst.qdef.alt.sql.replace(/</g,"&lt;")}</code>${inst.qdef.alt.note}</div>`;
    }
    document.getElementById("hint-zone").innerHTML = "";
    updateHud();
    launchConfetti();
  } else {
    session.wrongOnCurrent++;
    if (session.wrongOnCurrent===1) session.streak = 0;
    const explanation = explainFailure(verdict.reason, verdict, topic);
    feedbackZone.innerHTML = renderFeedbackHtml(false, explanation, TOPICS.find(t=>t.id===topic).example);
    updateHud();
  }
}

function pickPraise(){
  const arr = ["Richtig! 🎉","Nailed it! 💪","Genau so! ✨","Sauber gelöst! 🔥","Perfekt! 🚀","Stark! 🧠"];
  return arr[Math.floor(Math.random()*arr.length)];
}

function renderFeedbackHtml(ok, message, example){
  if (ok){
    return `
      <div class="feedback ok">
        <h3>✅ ${message}</h3>
        <div class="actions">
          <button onclick="nextQuestion()">Nächste Frage →</button>
        </div>
      </div>`;
  }
  const inst = session.current;
  return `
    <div class="feedback bad">
      <h3>🤔 Noch nicht ganz</h3>
      <div class="body">${message}</div>
      ${example ? `<div class="example-box"><b>Anderes Beispiel:</b> ${example}</div>` : ""}
      <div class="actions">
        <button class="secondary" onclick="document.getElementById('feedback-zone').innerHTML=''; cm.focus();">Nochmal versuchen</button>
        <button class="ghost" onclick="giveUp()">Lösung anzeigen</button>
      </div>
    </div>`;
}

/* ---------- Confetti ---------- */
function launchConfetti(){
  const root = document.getElementById("confetti-root");
  const colors = ["#3574f0","#e0a458","#22c55e","#ec4899","#6fa8dc","#f59e0b"];
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  for (let i=0;i<28;i++){
    const s = document.createElement("span");
    s.style.left = Math.random()*100+"vw";
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDelay = (Math.random()*0.4)+"s";
    s.style.animationDuration = (1.8+Math.random()*1.2)+"s";
    wrap.appendChild(s);
  }
  root.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 3200);
}

/* ---------- Summary ---------- */
function endSession(){
  const topicRows = Object.entries(session.topicStats).filter(([,s])=>s.asked>0).map(([id,s])=>{
    const t = TOPICS.find(x=>x.id===id);
    const pct = Math.round(100*s.correct/s.asked);
    return `<div class="tb-row">
      <div class="tb-label">${t.icon} ${t.title}</div>
      <div class="tb-track"><div class="tb-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="tb-pct">${pct}%</div>
    </div>`;
  }).join("");

  const perfect = session.answered>0 && session.correct===session.answered;
  lastSession = session;

  const el = document.getElementById("screen-summary");
  el.innerHTML = `
    <div class="summary-card">
      ${perfect ? `<div class="crown">🎉</div><div class="sub">Alles richtig — sauber!</div>` : ""}
      <div class="big-score">${session.correct}/${session.answered}</div>
      <div class="sub">richtig beantwortet &middot; bester Streak: ${session.bestStreak} 🔥</div>
      <div class="topic-bars">${topicRows || '<div class="text-faint" style="font-size:13px;">Keine Fragen beantwortet.</div>'}</div>
      <div class="start-row" style="justify-content:center;margin-top:24px;">
        <button class="secondary" onclick="showScreen('setup'); renderSetup();">Zur Startseite</button>
        <button class="good" onclick="startSession(lastSession.topics, lastSession.targetCount, lastSession.freeplay)">Nochmal, gleiche Runde ↻</button>
      </div>
    </div>`;
  showScreen("summary");
  if (perfect) launchConfetti();
}

/* ================= Boot ================= */
function base64Ready(){
  initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` }).then(SQL=>{
    const bytes = base64ToUint8Array(DB_B64);
    db = new SQL.Database(bytes);
    registerUdfs(db);
    renderSchemaTree();
    renderSetup();
  }).catch(err=>{
    document.getElementById("screen-setup").innerHTML = `<div class="setup-card"><h2>Fehler beim Laden</h2><p>${err.message}</p></div>`;
  });
}
base64Ready();
