<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Dojo — Publications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
:root{
  /* MySQL Workbench Dark Mode palette */
  --bg:#1a1b21; --bg-alt:#1e1f26; --panel:#22232b; --panel-2:#2a2c36;
  --border:#34363f; --text:#e8e9ee; --text-dim:#9a9ba8; --text-faint:#6c6d7a;
  --accent:#3574f0; --accent-2:#e0a458; --good:#22c55e; --bad:#ef4444; --warn:#e0a458;
  --radius:8px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{min-height:100vh;}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 22px;background:var(--bg-alt);
  border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;
}
header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;letter-spacing:.2px;}
header h1 .logo{font-size:22px;}
header h1 small{font-weight:400;color:var(--text-dim);font-size:12px;display:block;margin-top:2px;}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.hud .chip{
  background:var(--panel-2);border:1px solid var(--border);border-radius:6px;
  padding:6px 13px;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.hud .chip b{color:var(--text);}
.hud .chip.streak{color:#ffb020;border-color:#ffb02055;}
button, select, input[type=text], input[type=number]{
  font-family:inherit;font-size:14px;
}
button{
  cursor:pointer;border:1px solid transparent;border-radius:6px;padding:10px 18px;font-weight:600;
  background:var(--accent);color:white;transition:filter .12s ease;
}
button:hover{filter:brightness(1.15);}
button:active{filter:brightness(.92);}
button.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
button.good{background:var(--good);}
button.small{padding:6px 12px;font-size:12.5px;border-radius:5px;}
button:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- layout ---------- */
.layout{display:flex;flex:1;min-height:0;}
aside#sidebar{
  width:280px;flex-shrink:0;background:var(--bg-alt);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;
}
aside#sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin:4px 8px 10px;font-weight:700;}
.schema-filter{
  width:100%;padding:7px 10px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:12.5px;
}
.schema-filter::placeholder{color:var(--text-faint);}
.table-card{background:transparent;border:none;border-radius:4px;margin-bottom:1px;overflow:hidden;}
.table-head{
  display:flex;align-items:center;justify-content:space-between;padding:6px 8px;cursor:pointer;user-select:none;
  border-radius:4px;
}
.table-head:hover{background:var(--panel-2);}
.table-card.open > .table-head{background:var(--accent);}
.table-card.open > .table-head .tname{color:#fff;}
.table-head .tname{font-family:'SF Mono',Consolas,monospace;font-size:13px;color:var(--text);font-weight:500;}
.table-head .tname::before{content:"▤ ";color:var(--text-faint);}
.table-head .arrow{color:var(--text-faint);font-size:10px;transition:transform .15s;}
.table-card.open .arrow{transform:rotate(90deg);}
.table-card.open .table-head .arrow{color:#fff;}
.table-desc{padding:0 8px 6px 24px;font-size:11px;color:var(--text-faint);}
.table-cols{display:none;padding:2px 8px 8px 24px;font-family:'SF Mono',Consolas,monospace;font-size:12px;border-left:1px solid var(--border);margin-left:12px;}
.table-card.open .table-cols{display:block;}
.col-row{display:flex;justify-content:space-between;padding:2px 0;color:var(--text-dim);}
.col-row .ctype{color:var(--text-faint);font-size:10.5px;}
.col-row.pk{color:var(--accent-2);}
.preview-btn{
  margin:4px 8px 10px 24px;font-size:11px;padding:5px 9px;width:calc(100% - 32px);
}

/* ---------- main ---------- */
main{flex:1;min-width:0;overflow-y:auto;padding:22px;display:flex;justify-content:center;}
.screen{width:100%;max-width:900px;}

/* setup screen */
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px;}
.setup-card h2{margin-top:0;}
.field{margin-bottom:22px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.topic-pill{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
  cursor:pointer;background:var(--panel-2);transition:.12s;
}
.topic-pill.active{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 18%, var(--panel-2));}
.topic-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex-shrink:0;}
.topic-pill .tt{font-size:13px;}
.topic-pill .tt small{display:block;color:var(--text-faint);font-size:10.5px;}
.row-inline{display:flex;gap:10px;flex-wrap:wrap;}
.count-btn{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);}
.count-btn.active{border-color:var(--accent);background:#3574f033;color:white;}
.start-row{display:flex;justify-content:center;gap:10px;margin-top:8px;}
.mix-note{background:#2a1414;border:1px solid #ef444455;border-radius:8px;padding:12px 14px;margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.mix-note b{color:#f87171;}
.setup-card + .setup-card{margin-top:18px;}
.freeplay-card{background:linear-gradient(135deg,#152238,var(--panel) 60%);border-color:#3574f044;}

/* lesson screen */
.lesson-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-bottom:16px;}
.lesson-card h2{margin-top:0;display:flex;align-items:center;gap:10px;}
.lesson-step{border-left:3px solid var(--tc,var(--accent));padding:4px 0 4px 16px;margin-bottom:18px;}
.lesson-step h4{margin:0 0 6px;font-size:15px;color:var(--tc,var(--accent));}
.lesson-step p{margin:0 0 8px;font-size:14px;line-height:1.6;color:var(--text-dim);}
.lesson-step .lex{background:#00000033;border-radius:8px;padding:9px 12px;font-family:monospace;font-size:12.5px;color:var(--accent-2);}
.lesson-condensed{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--border);}
.lesson-condensed:last-child{border-bottom:none;}
.lesson-condensed b{color:var(--tc,var(--accent));}

/* hints */
.hint-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.hint-box{background:#152238;border:1px solid #3574f044;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:var(--text-dim);}
.hint-box .hb-tier{color:#7ba8f5;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.hint-box code{display:block;margin-top:6px;background:#00000044;padding:8px 10px;border-radius:6px;font-family:monospace;color:#9ff5c6;white-space:pre-wrap;}
.alt-box{margin-top:12px;background:#0c1a24;border:1px solid #14b8a644;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-dim);}
.alt-box .ab-title{color:#5eead4;font-weight:700;margin-bottom:6px;}
.alt-box code{display:block;margin:6px 0;background:#00000044;padding:8px 10px;border-radius:6px;font-family:monospace;color:#9ff5c6;white-space:pre-wrap;font-size:12px;}

/* explorer-style data browser */
.modal-box.wide{min-width:min(900px,90vw);}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.search-box{padding:7px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);min-width:200px;}
.refcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.refcard summary{padding:10px 12px;cursor:pointer;font-size:12.5px;color:var(--text-dim);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
.refcard summary::-webkit-details-marker{display:none;}
.refcard .refbody{padding:0 12px 12px;font-size:11.5px;color:var(--text-faint);}
.refcard table{width:100%;border-collapse:collapse;margin-top:6px;}
.refcard td{padding:3px 4px;border-bottom:1px solid #232735;}
.refcard td.k{color:var(--accent-2);font-family:monospace;}

/* question screen */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.topic-badge{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:700;
  background:color-mix(in srgb, var(--tc) 22%, transparent);color:var(--tc);border:1px solid color-mix(in srgb, var(--tc) 45%, transparent);
}
.stars{color:#ffd166;font-size:13px;letter-spacing:1px;}
.progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:99px;margin:0 14px;overflow:hidden;min-width:100px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s;}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;}
.q-card p{margin:0;font-size:15.5px;line-height:1.55;}
.editor-wrap{background:#18191f;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;}
.editor-toolbar{
  display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1e1f26;
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-faint);
}
.editor-toolbar .kbd{background:#2a2c36;padding:2px 7px;border-radius:5px;font-family:monospace;color:var(--text);}
.CodeMirror{height:150px;font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:14px;line-height:1.5;}

/* ---- MySQL-Workbench-artiges Syntax-Highlighting (auf dracula-Basis umgefärbt) ---- */
.cm-s-dracula.CodeMirror{background:#18191f !important;color:#e8e9ee !important;}
.cm-s-dracula .CodeMirror-gutters{background:#18191f !important;border-right:1px solid #2a2c36 !important;}
.cm-s-dracula .CodeMirror-linenumber{color:#4d4f5a !important;}
.cm-s-dracula .cm-keyword{color:#e0a458 !important;font-weight:600;}
.cm-s-dracula .cm-atom{color:#e0a458 !important;}
.cm-s-dracula .cm-builtin{color:#6fa8dc !important;}
.cm-s-dracula .cm-def{color:#e8e9ee !important;}
.cm-s-dracula .cm-variable, .cm-s-dracula .cm-variable-2, .cm-s-dracula .cm-property{color:#e8e9ee !important;}
.cm-s-dracula .cm-string{color:#9dc76e !important;}
.cm-s-dracula .cm-number{color:#c9a0dc !important;}
.cm-s-dracula .cm-comment{color:#6fa8dc !important;font-style:italic;}
.cm-s-dracula .cm-operator{color:#e8e9ee !important;}
.cm-s-dracula .CodeMirror-selected{background:#3574f044 !important;}
.cm-s-dracula .CodeMirror-cursor{border-left:1.5px solid #e8e9ee !important;}
.cm-s-dracula .CodeMirror-matchingbracket{color:#e0a458 !important;background:#3574f033;}
.run-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.results-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:16px;overflow:hidden;min-height:60px;}
.results-panel .rp-head{padding:10px 16px;font-size:12px;color:var(--text-faint);border-bottom:1px solid var(--border);}
.results-panel .rp-body{overflow:auto;max-height:260px;}
table.result-table{border-collapse:collapse;width:100%;font-size:13px;}
table.result-table th{
  position:sticky;top:0;background:var(--panel-2);text-align:left;padding:8px 12px;color:var(--accent-2);
  font-family:monospace;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.result-table td{padding:7px 12px;border-bottom:1px solid #232735;color:var(--text-dim);white-space:nowrap;font-family:monospace;}
table.result-table tr:hover td{background:var(--panel-2);}
.empty-note, .error-note{padding:16px;font-size:13.5px;color:var(--text-faint);}
.error-note{color:#ff8080;font-family:monospace;white-space:pre-wrap;}

/* mini-dashboard under multi-row aggregate results */
.mini-chart{border-top:1px solid var(--border);padding:14px 16px;}
.mini-chart .mc-head{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:700;}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.chart-row .chart-label{width:150px;flex-shrink:0;font-size:12px;color:var(--text-dim);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-row .chart-track{flex:1;height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.chart-row .chart-fill{height:100%;background:var(--accent);border-radius:3px;}
.chart-row .chart-val{width:60px;text-align:right;font-size:12px;color:var(--text);font-family:monospace;flex-shrink:0;}

.feedback{border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;border:1.5px solid;}
.feedback.ok{background:#16301f;border-color:#22c55e55;}
.feedback.bad{background:#301616;border-color:#ef444455;}
.feedback h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px;}
.feedback.ok h3{color:#4ade80;}
.feedback.bad h3{color:#fb7185;}
.feedback .body{font-size:14px;line-height:1.6;color:var(--text-dim);}
.feedback .example-box{
  margin-top:10px;background:#00000033;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-dim);
  border-left:3px solid var(--accent);
}
.feedback .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.solution-box{margin-top:12px;background:#0c0d13;border-radius:10px;padding:12px 14px;font-family:monospace;font-size:12.5px;color:#9ff5c6;white-space:pre-wrap;border:1px solid #22c55e33;}

/* summary screen */
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;text-align:center;}
.summary-card .big-score{font-size:48px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.summary-card .sub{color:var(--text-dim);margin-top:4px;}
.crown{font-size:34px;}
.topic-bars{margin-top:26px;text-align:left;}
.tb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tb-row .tb-label{width:200px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.tb-row .tb-track{flex:1;height:9px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
.tb-row .tb-fill{height:100%;border-radius:99px;}
.tb-row .tb-pct{width:40px;text-align:right;font-size:12px;color:var(--text-faint);}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999;}
.confetti span{
  position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;
  animation:fall 2.6s linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}

/* preview modal */
.modal-backdrop{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;z-index:500;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:90vw;max-height:80vh;overflow:auto;padding:18px;}
.modal-box h3{margin-top:0;font-family:monospace;color:var(--accent-2);}

.hidden{display:none !important;}
.text-faint{color:var(--text-faint);}
@media (max-width:800px){
  aside#sidebar{display:none;}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo">🐬</span>SQL Dojo <small>Publications-Datenbank &middot; von Beginner zu Advanced</small></h1>
    <div class="hud" id="hud"></div>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <h2>Schema</h2>
      <input class="schema-filter" id="schema-filter" placeholder="🔍 Tabellen filtern…" oninput="filterSchema(this.value)">
      <div id="schema-tree"></div>
    </aside>
    <main>
      <div class="screen" id="screen-setup"></div>
      <div class="screen hidden" id="screen-lesson"></div>
      <div class="screen hidden" id="screen-question"></div>
      <div class="screen hidden" id="screen-summary"></div>
    </main>
  </div>
</div>
<div id="modal-root"></div>
<div id="confetti-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

const TOPICS = [
  {id:"select_from", icon:"🔍", color:"#06b6d4", title:"SELECT · FROM · AS · DISTINCT",
   concept:"SELECT bestimmt WELCHE Spalten du sehen willst, FROM WOHER die Daten kommen. AS gibt einer Spalte oder Tabelle in der Ausgabe einen anderen Namen — das ändert nichts an der echten Tabelle. DISTINCT entfernt doppelte Zeilen aus dem Ergebnis.",
   example:"Wenn zwei Autor:innen zufällig beide 'Miller' heißen, gibt dir SELECT au_lname FROM authors zweimal 'Miller' zurück. SELECT DISTINCT au_lname FROM authors zeigt 'Miller' nur einmal.",
   lesson:[
     {t:"SELECT", b:"Mit SELECT sagst du, WELCHE Spalten du am Ende sehen willst. Jedes Element im SELECT wird eine Spalte in deiner Ausgabe, getrennt durch Kommas.", ex:"SELECT au_fname, au_lname FROM authors; — zeigt nur Vor- und Nachname, nicht alle 9 Spalten der Tabelle."},
     {t:"FROM", b:"FROM sagt WOHER die Daten kommen — aus welcher Tabelle. Eine Datenbank besteht meist aus vielen Tabellen, FROM legt fest, mit welcher du gerade arbeitest.", ex:"SELECT * FROM titles; — holt alle Spalten und Zeilen aus der Tabelle titles."},
     {t:"AS (Alias)", b:"AS gibt einer Spalte (oder Tabelle) in der AUSGABE einen anderen Namen. Das ändert nichts an der echten Tabelle in der Datenbank, nur wie das Ergebnis bei dir angezeigt wird.", ex:"SELECT au_fname AS vorname FROM authors; — die Spalte heißt in der Ausgabe 'vorname', in der Datenbank bleibt sie au_fname."},
     {t:"DISTINCT", b:"DISTINCT entfernt doppelte Zeilen aus dem Ergebnis — jeder Wert (oder jede Werte-Kombination) taucht nur noch einmal auf.", ex:"Drei Autor:innen kommen aus 'CA'. SELECT state FROM authors zeigt 'CA' dreimal. SELECT DISTINCT state FROM authors zeigt 'CA' nur einmal."}
   ]},
  {id:"where", icon:"🧭", color:"#f59e0b", title:"WHERE · AND / OR / NOT",
   concept:"WHERE filtert einzelne Zeilen. Mit AND müssen alle Bedingungen gleichzeitig wahr sein, mit OR reicht eine. Ohne Klammern wertet SQL AND vor OR aus — das kann zu überraschenden Ergebnissen führen.",
   example:"WHERE city = 'Oakland' OR city = 'Berkeley' AND contract = 1 liefert ALLE aus Oakland (egal ob Vertrag) PLUS die aus Berkeley MIT Vertrag. Mit Klammern (city = 'Oakland' OR city = 'Berkeley') AND contract = 1 bekommst du nur Personen aus einer der beiden Städte, die zusätzlich einen Vertrag haben.",
   lesson:[
     {t:"WHERE — Grundprinzip", b:"WHERE filtert Zeilen: nur Zeilen, bei denen die Bedingung wahr ist, landen im Ergebnis. Alle anderen werden verworfen.", ex:"SELECT * FROM authors WHERE state = 'CA'; — nur Autor:innen aus Kalifornien."},
     {t:"Vergleichsoperatoren", b:"=, !=, <>, >, >=, <, <= vergleichen Werte. != und <> bedeuten beide 'ungleich' — zwei Schreibweisen für dasselbe.", ex:"WHERE price >= 20 — nur Bücher, die 20 oder mehr kosten."},
     {t:"AND vs. OR", b:"AND: ALLE Bedingungen müssen gleichzeitig stimmen. OR: mindestens EINE muss stimmen.", ex:"WHERE state='CA' AND contract=1 (nur CA UND Vertrag) vs. WHERE state='CA' OR state='UT' (CA ODER UT)."},
     {t:"Klammern nicht vergessen", b:"Mischst du AND und OR, wertet SQL AND zuerst aus — ohne Klammern kann das zu überraschenden Ergebnissen führen. Klammern erzwingen die Reihenfolge, die DU willst.", ex:"city='Oakland' OR city='Berkeley' AND contract=1 liefert ALLE aus Oakland (egal ob Vertrag) plus Berkeley MIT Vertrag. Mit (city='Oakland' OR city='Berkeley') AND contract=1 bekommst du nur Leute aus einer der beiden Städte, die zusätzlich Vertrag haben."},
     {t:"IS NULL", b:"Um zu prüfen, ob ein Wert FEHLT, brauchst du IS NULL — nicht = NULL, das liefert nämlich nie ein Ergebnis.", ex:"WHERE address IS NULL — findet Zeilen ohne hinterlegte Adresse."}
   ]},
  {id:"sort_agg", icon:"📊", color:"#8b5cf6", title:"ORDER BY · LIMIT · Aggregatfunktionen",
   concept:"ORDER BY sortiert das gesamte Ergebnis, LIMIT schneidet danach nur die ersten n Zeilen ab — deshalb wird erst sortiert, dann limitiert. MIN/MAX/COUNT/AVG/SUM fassen viele Zeilen zu EINEM Wert zusammen.",
   example:"COUNT(*) zählt alle Zeilen inklusive NULL-Werten, COUNT(spalte) zählt nur Zeilen, in denen diese Spalte nicht NULL ist. Bei 5 Bestellungen, von denen eine kein Zahlungsziel hat, gibt COUNT(*) 5 zurück, COUNT(payterms) nur 4.",
   lesson:[
     {t:"ORDER BY", b:"Ohne ORDER BY ist die Reihenfolge deiner Ergebniszeilen nicht garantiert. ORDER BY sortiert nach einer oder mehreren Spalten. Standard ist aufsteigend (ASC), DESC dreht die Richtung um.", ex:"SELECT title, price FROM titles ORDER BY price DESC; — teuerste Bücher zuerst."},
     {t:"LIMIT", b:"LIMIT schneidet danach nur die ersten n Zeilen ab. SQL sortiert ZUERST, dann wird limitiert — erst sortieren, dann abschneiden.", ex:"...ORDER BY price DESC LIMIT 5; — die 5 teuersten Bücher."},
     {t:"MIN() / MAX()", b:"Liefern den kleinsten bzw. größten Wert einer Spalte — als EIN einzelner Wert, nicht die ganze Zeile.", ex:"SELECT MAX(price) FROM titles; — nur die Zahl, nicht welches Buch das ist."},
     {t:"COUNT() / SUM() / AVG()", b:"COUNT zählt Zeilen, SUM addiert, AVG bildet den Durchschnitt. COUNT(*) zählt ALLE Zeilen inkl. NULL-Werten, COUNT(spalte) zählt nur Zeilen, in denen genau diese Spalte nicht NULL ist.", ex:"5 Bestellungen, eine ohne Zahlungsziel: COUNT(*) = 5, COUNT(payterms) = 4."},
     {t:"ROUND()", b:"Rundet eine Zahl auf eine bestimmte Anzahl Nachkommastellen — praktisch bei AVG(), das oft viele Nachkommastellen produziert.", ex:"SELECT ROUND(AVG(price), 2) FROM titles;"}
   ]},
  {id:"pattern", icon:"🔎", color:"#ec4899", title:"LIKE · IN · BETWEEN",
   concept:"= sucht einen exakten Wert. LIKE erlaubt Platzhalter (% = beliebig viele Zeichen, _ = genau ein Zeichen). IN prüft, ob ein Wert in einer Liste vorkommt (aber ohne Platzhalter). BETWEEN prüft einen Bereich inklusive beider Grenzen.",
   example:"WHERE title LIKE '%ing' findet Titel, die auf 'ing' enden. WHERE au_lname LIKE 'D___' findet nur 4-Buchstaben-Nachnamen, die mit D beginnen. WHERE type IN ('business','psychology') ist kurz für type = 'business' OR type = 'psychology'.",
   lesson:[
     {t:"LIKE mit %", b:"% steht für BELIEBIG VIELE Zeichen (auch null Zeichen). Damit findest du Muster statt exakter Werte.", ex:"WHERE title LIKE '%ing' — alle Titel, die auf 'ing' enden, egal wie lang der Rest ist."},
     {t:"LIKE mit _", b:"_ steht für GENAU EIN Zeichen. Damit legst du die Länge eines Teils exakt fest.", ex:"WHERE au_lname LIKE 'D___' — findet nur Nachnamen mit exakt 4 Buchstaben, die mit D beginnen ('Dull' ja, 'DeFrance' nein, weil zu lang)."},
     {t:"IN", b:"Prüft, ob ein Wert in einer Liste vorkommt — kurz für mehrere OR-Bedingungen. IN kennt keine Platzhalter wie % oder _.", ex:"WHERE type IN ('psychology','trad_cook') ist kurz für type='psychology' OR type='trad_cook'."},
     {t:"BETWEEN...AND", b:"Prüft einen Bereich, INKLUSIVE beider Grenzen. Funktioniert mit Zahlen genauso wie mit Datumswerten.", ex:"WHERE qty BETWEEN 25 AND 45 — schließt 25 und 45 selbst mit ein."}
   ]},
  {id:"group_having", icon:"🗂️", color:"#10b981", title:"GROUP BY · HAVING",
   concept:"GROUP BY fasst Zeilen mit gleichem Wert zu einer Gruppe zusammen. WHERE filtert VOR der Gruppierung einzelne Zeilen, HAVING filtert NACH der Gruppierung die fertigen Gruppen (z.B. nach einem COUNT/AVG/SUM-Ergebnis). Deshalb darf in WHERE keine Aggregatfunktion stehen.",
   example:"Nur Autor:innen mit Vertrag zählen: WHERE contract = 1 (einzelne Zeilen). Nur Bundesländer mit mehr als 3 Autor:innen sehen: GROUP BY state HAVING COUNT(*) > 3 (fertige Gruppen).",
   lesson:[
     {t:"GROUP BY", b:"Fasst Zeilen mit gleichem Wert in einer Spalte zu einer Gruppe zusammen. Für jede Gruppe bekommst du am Ende genau EINE Ergebniszeile.", ex:"SELECT state, COUNT(*) FROM authors GROUP BY state; — eine Zeile pro Bundesstaat."},
     {t:"Aggregatfunktion pro Gruppe", b:"Innerhalb jeder Gruppe kannst du mit COUNT/SUM/AVG/MIN/MAX zusammenfassen. Jede Spalte im SELECT muss entweder in GROUP BY stehen oder eine Aggregatfunktion sein.", ex:"SELECT pub_id, AVG(price) FROM titles GROUP BY pub_id; — Durchschnittspreis je Verlag."},
     {t:"WHERE vs. HAVING", b:"WHERE filtert VOR der Gruppierung einzelne Zeilen. HAVING filtert NACH der Gruppierung die fertigen Gruppen — meist anhand eines Aggregat-Ergebnisses. In WHERE darf deshalb keine Aggregatfunktion stehen: die existiert an der Stelle noch gar nicht. Das ist übrigens auch die tatsächliche Reihenfolge, in der MySQL eine Query abarbeitet: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT — nicht die Reihenfolge, in der du sie hinschreibst.", ex:"Nur Autor:innen mit Vertrag zählen: WHERE contract=1. Nur Bundesländer mit mehr als 3 Autor:innen sehen: GROUP BY state HAVING COUNT(*) > 3."}
   ]},
  {id:"joins", icon:"🔗", color:"#3b82f6", title:"LEFT / RIGHT / INNER JOIN",
   concept:"INNER JOIN zeigt nur Zeilen, die in BEIDEN Tabellen einen Treffer haben. LEFT JOIN zeigt ALLE Zeilen der linken Tabelle, auch ohne Treffer rechts (dann NULL). RIGHT JOIN macht dasselbe umgekehrt. ON erlaubt unterschiedliche Spaltennamen, USING nur wenn beide Tabellen die Spalte gleich benennen.",
   example:"18 Bücher, aber nur 8 davon haben Verkäufe: INNER JOIN titles+sales zeigt nur die 8 verkauften Bücher. LEFT JOIN (titles zuerst) zeigt alle 18, bei den unverkauften steht bei qty NULL.",
   lesson:[
     {t:"Warum überhaupt JOIN?", b:"Daten liegen oft über mehrere Tabellen verteilt. JOIN verbindet sie über eine gemeinsame Spalte, meist ein ID-Feld. (In MySQL sind JOIN, INNER JOIN und CROSS JOIN übrigens dasselbe — drei Namen, eine Funktion.)", ex:"titles hat pub_id, publishers hat auch pub_id — darüber lassen sich beide verknüpfen."},
     {t:"INNER JOIN", b:"Zeigt nur Zeilen, die in BEIDEN Tabellen einen Treffer haben. Passt eine Zeile auf keiner Seite, fällt sie komplett raus.", ex:"18 Bücher, aber nur 8 davon haben Verkäufe: INNER JOIN titles+sales zeigt nur diese 8."},
     {t:"LEFT JOIN / RIGHT JOIN", b:"LEFT JOIN zeigt ALLE Zeilen der linken Tabelle, auch ohne Treffer rechts (dort steht dann NULL). RIGHT JOIN macht dasselbe umgekehrt für die rechte Tabelle.", ex:"LEFT JOIN titles+sales (titles zuerst) zeigt alle 18 Bücher — bei den unverkauften steht bei qty NULL."},
     {t:"ON vs. USING", b:"Beide legen fest, über welche Spalten verknüpft wird. USING geht nur, wenn die Spalte in beiden Tabellen GLEICH heißt. Heißen die Spalten unterschiedlich, brauchst du ON.", ex:"...JOIN publishers USING(pub_id) ist kurz für ...JOIN publishers ON titles.pub_id = publishers.pub_id."}
   ]},
  {id:"case", icon:"🧩", color:"#eab308", title:"CASE WHEN",
   concept:"CASE WHEN erstellt eine neue Spalte mit eigener Wenn-dann-sonst-Logik. Die Bedingungen werden von oben nach unten geprüft, die erste zutreffende gewinnt — die Reihenfolge der WHEN-Zeilen ist deshalb wichtig.",
   example:"CASE WHEN qty >= 50 THEN 'high' WHEN qty >= 20 THEN 'medium' ELSE 'low' END: eine Zeile mit qty=60 landet in 'high', obwohl auch 'qty >= 20' zuträfe — SQL prüft nicht weiter, sobald eine Bedingung passt.",
   lesson:[
     {t:"Grundgerüst", b:"CASE WHEN Bedingung THEN Wert ... ELSE Wert END erstellt eine neue, selbst definierte Spalte. Sie steht im SELECT-Teil, wie jede andere Spalte auch.", ex:"CASE WHEN qty >= 50 THEN 'high' ELSE 'low' END AS kategorie"},
     {t:"Reihenfolge der Bedingungen zählt", b:"SQL prüft die WHEN-Zeilen von oben nach unten und nimmt die ERSTE, die zutrifft — auch wenn eine spätere Bedingung auch passen würde.", ex:"WHEN qty>=50 THEN 'high' WHEN qty>=20 THEN 'medium': eine Zeile mit qty=60 landet in 'high', obwohl auch 'qty>=20' zuträfe."},
     {t:"ELSE nicht vergessen", b:"Ohne ELSE werden Zeilen, die zu keiner Bedingung passen, in der neuen Spalte NULL.", ex:"CASE WHEN state='CA' THEN 'West' END ohne ELSE — alle Nicht-CA-Zeilen werden NULL."},
     {t:"CASE + GROUP BY", b:"Du kannst nach der berechneten CASE-Spalte gruppieren, um z.B. Summen pro Kategorie zu bekommen.", ex:"GROUP BY CASE WHEN qty>=50 THEN 'high' ELSE 'low' END"}
   ]},
  {id:"subquery", icon:"🪆", color:"#a855f7", title:"Subqueries",
   concept:"Eine Subquery ist eine Abfrage in einer Abfrage, meist in Klammern. Sie wird zuerst berechnet, ihr Ergebnis wird dann außen benutzt (mit =, IN oder als Vergleichswert). Eine correlated Subquery verweist zusätzlich auf eine Spalte der äußeren Abfrage und läuft deshalb für jede Zeile neu.",
   example:"WHERE price = (SELECT MAX(price) FROM titles) funktioniert nur, wenn die Subquery genau EINEN Wert liefert. Liefert sie mehrere Werte, brauchst du IN statt =.",
   lesson:[
     {t:"Was ist eine Subquery?", b:"Eine Abfrage IN einer Abfrage, meist in Klammern. Sie wird zuerst berechnet, ihr Ergebnis wird danach in der äußeren Abfrage benutzt.", ex:"WHERE price = (SELECT MAX(price) FROM titles) — die Klammer wird zuerst ausgewertet und liefert einen einzelnen Wert."},
     {t:"= vs. IN", b:"Liefert die Subquery garantiert genau EINEN Wert, kannst du = benutzen. Kann sie mehrere Werte liefern, brauchst du IN — sonst gibt's einen Fehler.", ex:"WHERE pub_id IN (SELECT pub_id FROM publishers WHERE country='USA') — die Subquery kann mehrere pub_id liefern."},
     {t:"Correlated Subquery", b:"Eine Subquery, die zusätzlich auf eine Spalte der äußeren Abfrage verweist. Sie wird dadurch für JEDE Zeile der äußeren Abfrage neu berechnet.", ex:"SELECT au_lname, (SELECT COUNT(*) FROM titleauthor ta WHERE ta.au_id = a.au_id) FROM authors a — für jede Zeile a wird die innere Zählung neu ausgeführt."}
   ]},
  {id:"functions", icon:"🧮", color:"#14b8a6", title:"Funktionen (Text & Datum)",
   concept:"String-Funktionen (LENGTH, UPPER, CONCAT, LEFT) verändern Text, Datumsfunktionen (DATEDIFF, TIMESTAMPDIFF, DATE_FORMAT) rechnen mit Datumswerten. Meist im SELECT-Teil, um Daten lesbarer zu machen oder neue berechnete Spalten zu erzeugen.",
   example:"DATEDIFF(a, b) gibt immer a MINUS b in Tagen zurück. DATEDIFF(heute, pubdate) ist positiv (Buch liegt in der Vergangenheit), DATEDIFF(pubdate, heute) wäre negativ.",
   lesson:[
     {t:"String-Funktionen", b:"LENGTH (Zeichenanzahl), UPPER/LOWER (Groß-/Kleinschreibung), CONCAT (Texte zusammenfügen), LEFT/SUBSTRING (Teilstück herausschneiden) — meist im SELECT-Teil, um Daten lesbarer zu machen.", ex:"SELECT CONCAT(au_fname, ' ', au_lname) FROM authors; — Vor- und Nachname in einer Spalte."},
     {t:"Datumsfunktionen", b:"DATEDIFF(a, b) rechnet a MINUS b in Tagen — die Reihenfolge der Argumente bestimmt das Vorzeichen. TIMESTAMPDIFF(einheit, a, b) rechnet in einer wählbaren Einheit (DAY, MONTH, YEAR). DATE_FORMAT formatiert ein Datum nach einem Muster.", ex:"DATEDIFF(CURDATE(), pubdate) ist positiv, wenn pubdate in der Vergangenheit liegt. DATEDIFF(pubdate, CURDATE()) wäre negativ."}
   ]},
  {id:"advanced", icon:"🏆", color:"#ef4444", title:"Advanced Mix (+ Bonus)",
   concept:"Hier kombinierst du alles: mehrere JOINs, Subqueries, GROUP BY und Rechenoperationen (+ - * / %) in einer Abfrage. Zerlege die Aufgabe in kleine Schritte und teste jeden Schritt einzeln, bevor du alles zusammensetzt.",
   example:"Umsatz pro Buch berechnen: erst den JOIN allein testen, dann price * qty hinzufügen, dann erst GROUP BY und SUM().",
   lesson:[
     {t:"Rechenoperatoren", b:"SQL kann direkt rechnen: + - * / und % (Modulo, der Rest einer Division — praktisch um gerade/ungerade Zahlen zu prüfen).", ex:"WHERE menge % 2 = 0 — nur gerade Mengen. price * qty — Umsatz einer einzelnen Zeile."},
     {t:"Mehrere JOINs kombinieren", b:"Für komplexere Fragen brauchst du oft eine Kette aus 2-3 JOINs über mehrere Tabellen hinweg.", ex:"titles → sales → stores: erst Buch mit Verkauf verbinden, dann Verkauf mit Store."},
     {t:"Strategie: Schritt für Schritt", b:"Schreib nicht die ganze komplexe Query auf einmal. Baue sie in kleinen, testbaren Schritten auf und prüfe nach jedem Schritt, ob das Zwischenergebnis plausibel aussieht.", ex:"Umsatz pro Buch: 1) JOIN allein testen, 2) price*qty als neue Spalte hinzufügen, 3) erst dann GROUP BY + SUM() ergänzen."}
   ]},
];

const QUESTIONS = [{"id": "select-1", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle Spalten und Zeilen aus der Tabelle authors aus.", "sql": "SELECT * FROM authors", "test_params": [{}]}, {"id": "select-2", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname (au_fname, au_lname) aller Autor:innen aus.", "sql": "SELECT au_fname, au_lname FROM authors", "test_params": [{}]}, {"id": "select-3", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle den Vornamen aller Autor:innen aus, aber benenne die Spalte in der Ausgabe in first_name um (AS).", "sql": "SELECT au_fname AS first_name FROM authors", "test_params": [{}]}, {"id": "select-4", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle unterschiedlichen (keine Duplikate) Nachnamen der Autor:innen aus (DISTINCT).", "sql": "SELECT DISTINCT au_lname FROM authors", "test_params": [{}]}, {"id": "select-5", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle eindeutigen title_id aus, die jemals in der Tabelle sales verkauft wurden.", "sql": "SELECT DISTINCT title_id FROM sales", "test_params": [{}]}, {"id": "select-6", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle title, price und ytd_sales aus der Tabelle titles aus.", "sql": "SELECT title, price, ytd_sales FROM titles", "test_params": [{}]}, {"id": "select-7", "topic": "select_from", "difficulty": 2, "de_prompt": "Wähle job_id und job_desc aus der Tabelle jobs aus. Benenne die Spalten in der Ausgabe in id und description um.", "sql": "SELECT job_id AS id, job_desc AS description FROM jobs", "test_params": [{}]}, {"id": "select-8", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle die Namen aller Verlage (pub_name) aus der Tabelle publishers aus.", "sql": "SELECT pub_name FROM publishers", "test_params": [{}]}, {"id": "where-1", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname der Autor:innen mit Nachname 'Ringer' aus.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname = 'Ringer'", "test_params": [{}]}, {"id": "where-2", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname der Autor:innen mit Nachname '{lname}' aus.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname = '{lname}'", "param_pool": {"lname": ["Carson", "Green", "White", "Dull", "Smith", "Straight", "Bennet"]}, "test_params": [{"lname": "Carson"}, {"lname": "Green"}, {"lname": "White"}]}, {"id": "where-3", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Bestellnummer, Bestelldatum und Menge aus sales aus, bei denen genau {qty} Bücher verkauft wurden.", "sql": "SELECT ord_num, ord_date, qty FROM sales WHERE qty = {qty}", "param_pool": {"qty": [3, 5, 10, 15, 20, 25, 30, 35, 40, 50, 75]}, "allow_empty": true, "test_params": [{"qty": 20}, {"qty": 15}, {"qty": 75}]}, {"id": "where-4", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vor- und Nachname der Autor:innen aus, deren Vorname 'Anne' UND Nachname 'Ringer' ist.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_fname = 'Anne' AND au_lname = 'Ringer'", "test_params": [{}]}, {"id": "where-5", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name und Stadt aller Verlage aus, die entweder in Deutschland ('Germany') ODER Frankreich ('France') sitzen.", "sql": "SELECT pub_name, city FROM publishers WHERE country = 'Germany' OR country = 'France'", "test_params": [{}]}, {"id": "where-6", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vorname, Nachname und Stadt der Autor:innen aus, deren Vorname 'Dean' ist UND die entweder aus 'Oakland' oder 'Berkeley' kommen. Tipp: Klammern nicht vergessen.", "sql": "SELECT au_fname, au_lname, city FROM authors WHERE au_fname = 'Dean' AND (city = 'Oakland' OR city = 'Berkeley')", "test_params": [{}]}, {"id": "where-7", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name, Stadt und Land aller Verlage aus, die NICHT in den USA sitzen.", "sql": "SELECT pub_name, city, country FROM publishers WHERE country != 'USA'", "test_params": [{}]}, {"id": "where-8", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vorname, Nachname und Stadt der Autor:innen aus 'Oakland' oder 'Berkeley', deren Nachname NICHT 'Straight' ist.", "sql": "SELECT au_fname, au_lname, city FROM authors WHERE (city = 'Oakland' OR city = 'Berkeley') AND au_lname != 'Straight'", "test_params": [{}]}, {"id": "where-9", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name, Stadt, Bundesland und Land aller Verlage aus, bei denen das Bundesland (state) fehlt (IS NULL).", "sql": "SELECT pub_name, city, state, country FROM publishers WHERE state IS NULL", "test_params": [{}]}, {"id": "where-10", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Name, Stadt und Bundesland aller Stores aus, die NICHT in Kalifornien ('CA') liegen. Probier diesmal <> statt !=.", "sql": "SELECT stor_name, city, state FROM stores WHERE state <> 'CA'", "test_params": [{}]}, {"id": "sort-1", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wähle title und ytd_sales aus titles aus, aufsteigend sortiert nach ytd_sales.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales", "sortCol": 1, "sortDir": "asc", "test_params": [{}]}, {"id": "sort-2", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wiederhole die letzte Abfrage, aber sortiere diesmal absteigend.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "sort-3", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wähle die Top 5 Titel mit den meisten ytd_sales aus.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC LIMIT 5", "test_params": [{}]}, {"id": "sort-4", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Was ist die maximale Anzahl an Büchern, die jemals in einer einzigen Bestellung verkauft wurde?", "sql": "SELECT MAX(qty) FROM sales", "test_params": [{}], "alt": {"sql": "SELECT title_id, qty FROM sales ORDER BY qty DESC LIMIT 1", "note": "MAX() ist kompakter und macht sofort klar, dass du einen Extremwert suchst — du bekommst aber nur die Zahl selbst. ORDER BY + LIMIT 1 ist etwas länger, zeigt dir dafür die ganze Zeile, z.B. WELCHE Bestellung das war."}}, {"id": "sort-5", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Was kostet das günstigste Buch (MIN)?", "sql": "SELECT MIN(price) FROM titles", "test_params": [{}], "alt": {"sql": "SELECT title, price FROM titles WHERE price IS NOT NULL ORDER BY price LIMIT 1", "note": "Gleiches Prinzip wie bei MAX(): MIN() liefert nur die Zahl, ORDER BY + LIMIT zeigt zusätzlich, welcher Titel das ist. Achte bei ORDER BY auf NULL-Werte — die stehen bei ASC ganz vorne, deshalb hier WHERE price IS NOT NULL."}}, {"id": "sort-6", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wie viele Zeilen gibt es in der Tabelle authors?", "sql": "SELECT COUNT(*) FROM authors", "test_params": [{}]}, {"id": "sort-7", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wie hoch ist die Summe aller year-to-date sales (ytd_sales)?", "sql": "SELECT SUM(ytd_sales) FROM titles", "test_params": [{}]}, {"id": "sort-8", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist der durchschnittliche Buchpreis, gerundet auf 2 Nachkommastellen?", "sql": "SELECT ROUND(AVG(price), 2) FROM titles", "test_params": [{}]}, {"id": "sort-9", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wähle in einer einzigen Abfrage Anzahl, Durchschnitt und Summe der qty aus sales aus.", "sql": "SELECT COUNT(qty), AVG(qty), SUM(qty) FROM sales", "test_params": [{}]}, {"id": "sort-10", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist die durchschnittliche verkaufte Menge (qty) für den Store mit der stor_id '{stor_id}'?", "sql": "SELECT AVG(qty) FROM sales WHERE stor_id = '{stor_id}'", "param_pool": {"stor_id": ["6380", "7066", "7067", "7131", "7896", "8042"]}, "allow_empty": true, "test_params": [{"stor_id": "7131"}, {"stor_id": "7067"}, {"stor_id": "8042"}]}, {"id": "sort-11", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist der durchschnittliche Preis der Bücher vom Typ '{type}'?", "sql": "SELECT AVG(price) FROM titles WHERE type = '{type}'", "param_pool": {"type": ["business", "mod_cook", "psychology", "trad_cook", "popular_comp"]}, "test_params": [{"type": "psychology"}, {"type": "business"}, {"type": "trad_cook"}]}, {"id": "sort-12", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Aus wie vielen unterschiedlichen Bundesstaaten kommen unsere Autor:innen (COUNT DISTINCT)?", "sql": "SELECT COUNT(DISTINCT state) FROM authors", "test_params": [{}]}, {"id": "pattern-1", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Buchtitel aus, die das Wort 'cooking' enthalten (LIKE).", "sql": "SELECT title FROM titles WHERE title LIKE '%cooking%'", "test_params": [{}]}, {"id": "pattern-2", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Titel aus, die mit 'The' beginnen.", "sql": "SELECT title FROM titles WHERE title LIKE 'The%'", "test_params": [{}]}, {"id": "pattern-3", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Vor- und Nachname der Autor:innen aus, deren Nachname mit '{letter}' beginnt.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname LIKE '{letter}%'", "param_pool": {"letter": ["S", "C", "G", "D", "B", "M"]}, "allow_empty": true, "test_params": [{"letter": "S"}, {"letter": "C"}, {"letter": "G"}]}, {"id": "pattern-4", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle Name und Adresse aller Stores aus, deren Adresse auf 'Ave.' endet.", "sql": "SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.'", "test_params": [{}]}, {"id": "pattern-5", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Name und Adresse aller Stores aus, die in einer 'Ave.' ODER 'St.' liegen.", "sql": "SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.' OR stor_address LIKE '%St.'", "test_params": [{}]}, {"id": "pattern-6", "topic": "pattern", "difficulty": 2, "de_prompt": "In der Tabelle employee steckt im emp_id ein Muster, das zeigt, ob die Person weiblich oder männlich ist. Wähle alle Mitarbeitenden aus, deren emp_id auf 'F' endet.", "sql": "SELECT * FROM employee WHERE emp_id LIKE '%F'", "test_params": [{}]}, {"id": "pattern-7", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle Name und Bundesstaat aller Stores aus, die entweder in Kalifornien ('CA') oder Oregon ('OR') liegen. Benutze IN.", "sql": "SELECT stor_name, state FROM stores WHERE state IN ('CA', 'OR')", "test_params": [{}]}, {"id": "pattern-8", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Titel vom Typ 'psychology', 'mod_cook' oder 'trad_cook' aus (IN).", "sql": "SELECT title FROM titles WHERE type IN ('psychology', 'mod_cook', 'trad_cook')", "test_params": [{}]}, {"id": "pattern-9", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle alle Autor:innen aus, die NICHT aus 'Salt Lake City', 'Ann Arbor' oder 'Oakland' kommen (NOT IN).", "sql": "SELECT * FROM authors WHERE city NOT IN ('Salt Lake City', 'Ann Arbor', 'Oakland')", "test_params": [{}]}, {"id": "pattern-10", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Bestellnummern aus sales aus, bei denen zwischen 25 und 45 Büchern verkauft wurden (BETWEEN).", "sql": "SELECT ord_num FROM sales WHERE qty BETWEEN 25 AND 45", "test_params": [{}]}, {"id": "pattern-11", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Titel und Preis aller Bücher aus, deren Preis zwischen {lo} und {hi} liegt.", "sql": "SELECT title, price FROM titles WHERE price BETWEEN {lo} AND {hi}", "param_pool": {"lo_hi": [[5, 10], [10, 15], [15, 20], [8, 12]]}, "allow_empty": true, "test_params": [{"lo": 5, "hi": 10}, {"lo": 10, "hi": 15}, {"lo": 15, "hi": 20}]}, {"id": "pattern-12", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Verkäufe aus, die zwischen '1993-03-11' und '1994-09-13' getätigt wurden (BETWEEN mit Datum).", "sql": "SELECT * FROM sales WHERE ord_date BETWEEN '1993-03-11' AND '1994-09-13'", "test_params": [{}]}, {"id": "pattern-13", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle die Nachnamen der Autor:innen aus, die mit 'D' beginnen UND genau 4 Buchstaben lang sind. Tipp: dafür brauchst du den Unterstrich-Platzhalter _, nicht %.", "sql": "SELECT au_lname FROM authors WHERE au_lname LIKE 'D___'", "test_params": [{}]}, {"id": "group-1", "topic": "group_having", "difficulty": 1, "de_prompt": "Finde die Gesamtzahl der Autor:innen pro Bundesstaat (GROUP BY state).", "sql": "SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state", "test_params": [{}], "alt": {"sql": "SELECT state, COUNT(au_id) AS total_authors FROM authors GROUP BY state", "note": "COUNT(*) zählt alle Zeilen, COUNT(au_id) nur Zeilen, in denen au_id nicht NULL ist. Hier macht es keinen Unterschied, weil au_id ein Primärschlüssel ist (nie NULL). Bei Spalten, die NULL enthalten können, liefern beide Varianten unterschiedliche Ergebnisse — dann bewusst wählen!"}}, {"id": "group-2", "topic": "group_having", "difficulty": 2, "de_prompt": "Wiederhole die letzte Abfrage, aber sortiere absteigend nach der Anzahl.", "sql": "SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state ORDER BY total_authors DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "group-3", "topic": "group_having", "difficulty": 2, "de_prompt": "Was ist der Preis des teuersten Titels pro Verlag (GROUP BY pub_id)?", "sql": "SELECT pub_id, ROUND(MAX(price),2) AS max_price FROM titles GROUP BY pub_id", "test_params": [{}]}, {"id": "group-4", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde die Top 3 Stores mit den meisten verkauften Büchern (SUM(qty)).", "sql": "SELECT stor_id, SUM(qty) AS total_qty FROM sales GROUP BY stor_id ORDER BY total_qty DESC LIMIT 3", "test_params": [{}]}, {"id": "group-5", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde das durchschnittliche job_lvl pro job_id aus employee, aufsteigend sortiert.", "sql": "SELECT job_id, AVG(job_lvl) AS avg_lvl FROM employee GROUP BY job_id ORDER BY avg_lvl ASC", "sortCol": 1, "sortDir": "asc", "test_params": [{}]}, {"id": "group-6", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde für jede Kombination aus Buchtyp (type) und Verlag (pub_id), wie viele Bücher es gibt.", "sql": "SELECT type, pub_id, COUNT(*) AS book_number FROM titles GROUP BY type, pub_id", "test_params": [{}]}, {"id": "group-7", "topic": "group_having", "difficulty": 2, "de_prompt": "Erweitere die letzte Abfrage um den durchschnittlichen Preis pro Kombination, gerundet auf 2 Nachkommastellen.", "sql": "SELECT type, pub_id, COUNT(*) AS qty, ROUND(AVG(price),2) AS avg_price FROM titles GROUP BY type, pub_id", "test_params": [{}]}, {"id": "group-8", "topic": "group_having", "difficulty": 3, "de_prompt": "Behalte aus der letzten Abfrage nur die Kombinationen mit einem Durchschnittspreis über 12 (HAVING statt WHERE!).", "sql": "SELECT type, pub_id, COUNT(*) AS numb, AVG(price) AS avg_price FROM titles GROUP BY type, pub_id HAVING avg_price > 12", "test_params": [{}]}, {"id": "group-9", "topic": "group_having", "difficulty": 3, "de_prompt": "Zeige alle Bundesstaaten und Städte, in denen es {n} oder mehr Autor:innen mit Vertrag gibt (SUM(contract) >= {n}).", "sql": "SELECT state, city, SUM(contract) AS sum_contract FROM authors GROUP BY state, city HAVING sum_contract >= {n}", "param_pool": {"n": [1, 2]}, "test_params": [{"n": 1}, {"n": 2}]}, {"id": "join-1", "topic": "joins", "difficulty": 1, "de_prompt": "Wähle die Bestellnummer (ord_num) aus sales aus, gib der Tabelle den Alias 's' und benutze die Schreibweise s.ord_num.", "sql": "SELECT s.ord_num FROM sales AS s", "test_params": [{}]}, {"id": "join-2", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Titel und Verlagsname aller Bücher aus (auch wenn kein Verlag zugeordnet ist).", "sql": "SELECT t.title, p.pub_name FROM titles t LEFT JOIN publishers p ON t.pub_id = p.pub_id", "test_params": [{}]}, {"id": "join-3", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Bestellnummer, Menge und Buchtitel für alle Verkäufe aus (nutze USING).", "sql": "SELECT s.ord_num, s.qty, t.title FROM sales s LEFT JOIN titles t USING(title_id)", "test_params": [{}]}, {"id": "join-4", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle den vollständigen Namen aller Mitarbeitenden und den Namen des Verlags, für den sie arbeiten.", "sql": "SELECT e.fname, e.minit, e.lname, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id", "test_params": [{}]}, {"id": "join-5", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle den vollständigen Namen und die Jobbezeichnung (job_desc) aller Mitarbeitenden aus.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc FROM employee e LEFT JOIN jobs j ON e.job_id = j.job_id", "test_params": [{}]}, {"id": "join-6", "topic": "joins", "difficulty": 3, "de_prompt": "Wähle Name, Jobbezeichnung und Verlagsname aller Mitarbeitenden aus – dafür brauchst du zwei JOINs in einer Abfrage.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id", "test_params": [{}]}, {"id": "join-7", "topic": "joins", "difficulty": 3, "de_prompt": "Wähle Name, Jobbezeichnung und Verlagsname der Mitarbeitenden aus, die für '{pub_name}' arbeiten.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e INNER JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id WHERE p.pub_name = '{pub_name}'", "param_pool": {"pub_name": ["New Moon Books", "Binnet & Hardley", "Algodata Infosystems", "Five Lakes Publishing", "Ramona Publishers", "GGG&G", "Scootney Books", "Lucerne Publishing"]}, "allow_empty": true, "test_params": [{"pub_name": "Binnet & Hardley"}, {"pub_name": "New Moon Books"}, {"pub_name": "Algodata Infosystems"}]}, {"id": "join-8", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Verlagsname und PR-Info (pub_info) aller Verlage aus Berkeley, Kalifornien aus.", "sql": "SELECT p.pub_name, pubi.pr_info FROM publishers p LEFT JOIN pub_info pubi USING(pub_id) WHERE p.city = 'Berkeley' AND p.state = 'CA'", "test_params": [{}]}, {"id": "join-9", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Name, stor_id, Rabatttyp und Rabatt (discounttype, discount) aus discounts für ALLE Stores – auch die ohne Rabatt.", "sql": "SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s LEFT JOIN discounts d USING(stor_id)", "test_params": [{}]}, {"id": "join-10", "topic": "joins", "difficulty": 2, "de_prompt": "Wiederhole die letzte Abfrage, aber zeige nur Stores an, die tatsächlich einen Rabatt anbieten.", "sql": "SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s INNER JOIN discounts d USING(stor_id)", "test_params": [{}]}, {"id": "join-11", "topic": "joins", "difficulty": 2, "de_prompt": "Nutze RIGHT JOIN: Wähle Rabatttyp und Store-Name aller Einträge aus discounts aus.", "sql": "SELECT d.discounttype, s.stor_name FROM discounts d LEFT JOIN stores s USING(stor_id)", "test_params": [{}]}, {"id": "case-1", "topic": "case", "difficulty": 2, "de_prompt": "Wähle alles aus sales aus und füge eine neue Spalte sales_category hinzu: qty >= 50 'high sales', 20 <= qty < 50 'medium sales', sonst 'low sales'.", "sql": "SELECT *, CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category FROM sales", "test_params": [{}], "alt": {"sql": "SELECT *, CASE WHEN qty < 20 THEN 'low sales' WHEN qty < 50 THEN 'medium sales' ELSE 'high sales' END AS sales_category FROM sales", "note": "Beide Varianten liefern hier dasselbe Ergebnis, weil sich die Bedingungen nicht überschneiden — einmal fängst du oben (größter Wert zuerst) an, einmal unten (kleinster Wert zuerst) und sparst dir dadurch eine Bedingung. Wichtig: sobald sich Bedingungen überschneiden könnten, entscheidet allein die Reihenfolge der WHEN-Zeilen, welche Kategorie gewinnt — SQL prüft von oben nach unten und nimmt die erste, die passt."}}, {"id": "case-2", "topic": "case", "difficulty": 3, "de_prompt": "Berechne für jede der drei sales_category (high/medium/low sales) die Gesamtmenge verkaufter Bücher (SUM(qty)).", "sql": "SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category", "test_params": [{}]}, {"id": "case-3", "topic": "case", "difficulty": 3, "de_prompt": "Erweitere die letzte Abfrage: zeige nur Kategorien mit einer Summe über 100, absteigend sortiert.", "sql": "SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category HAVING total_sold > 100 ORDER BY total_sold DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "case-4", "topic": "case", "difficulty": 3, "de_prompt": "Finde den durchschnittlichen Buchpreis pro Verlag für die Preiskategorien <=5 'super low', <=10 'low', <=15 'medium', sonst 'high'. Beschränke dich auf die Typen 'business', 'trad_cook' und 'psychology'. Runde den Durchschnitt.", "sql": "SELECT pub_id, CASE WHEN price <= 5 THEN 'super low' WHEN price <= 10 THEN 'low' WHEN price <= 15 THEN 'medium' ELSE 'high' END AS price_category, ROUND(AVG(price)) AS average_price FROM titles WHERE type IN ('business','trad_cook','psychology') GROUP BY pub_id, price_category", "test_params": [{}]}, {"id": "sub-1", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde den Namen des Verlags mit dem höchsten Vorschuss (advance) – benutze eine Subquery.", "sql": "SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles ORDER BY advance DESC LIMIT 1)", "test_params": [{}], "alt": {"sql": "SELECT pub_name FROM publishers WHERE pub_id IN (SELECT pub_id FROM titles WHERE advance = (SELECT MAX(advance) FROM titles))", "note": "Die erste Variante (ORDER BY + LIMIT 1) ist kürzer. Die zweite mit MAX() in einer zweiten Subquery ist etwas länger, verhält sich aber anders bei einem Gleichstand: sie zeigt ALLE Verlage mit dem Höchstwert, nicht nur einen zufälligen."}}, {"id": "sub-2", "topic": "subquery", "difficulty": 2, "de_prompt": "Liste die Titel aller Bücher auf, die von Verlagen aus 'Boston' veröffentlicht wurden.", "sql": "SELECT title FROM titles WHERE pub_id IN (SELECT pub_id FROM publishers WHERE city = 'Boston')", "test_params": [{}], "alt": {"sql": "SELECT t.title FROM titles t JOIN publishers p USING(pub_id) WHERE p.city = 'Boston'", "note": "Die Subquery ist gut lesbar, wenn du nur EINE Bedingung aus der anderen Tabelle brauchst. Sobald du zusätzlich Spalten aus der anderen Tabelle mit ausgeben willst (z.B. den Verlagsnamen selbst), lohnt sich der JOIN, weil die Subquery dir diese Spalten gar nicht zur Verfügung stellt."}}, {"id": "sub-3", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde die Autor:innen, die mehr als ein Buch geschrieben haben.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_id IN (SELECT au_id FROM titleauthor GROUP BY au_id HAVING COUNT(title_id) > 1)", "test_params": [{}], "alt": {"sql": "SELECT au_fname, au_lname FROM authors a WHERE (SELECT COUNT(*) FROM titleauthor ta WHERE ta.au_id = a.au_id) > 1", "note": "Beide kommen zum gleichen Ergebnis. Die GROUP BY/HAVING-Subquery läuft nur EINMAL komplett durch titleauthor. Die correlated Subquery rechnet für JEDE Zeile aus authors neu nach — bei kleinen Tabellen wie hier egal, bei großen Datenmengen spürbar langsamer."}}, {"id": "sub-4", "topic": "subquery", "difficulty": 3, "de_prompt": "Liste alle Autor:innen mit der Anzahl ihrer Bücher auf – benutze eine correlated Subquery im SELECT-Teil.", "sql": "SELECT au_lname, au_fname, (SELECT COUNT(title_id) FROM titleauthor ta WHERE ta.au_id = a.au_id) AS book_no FROM authors a", "test_params": [{}]}, {"id": "sub-5", "topic": "subquery", "difficulty": 3, "de_prompt": "Finde alle Titel, deren Preis mehr als {pct}% über dem Durchschnittspreis liegt.", "sql": "SELECT title, price FROM titles WHERE price > (SELECT AVG(price) * {factor} FROM titles)", "param_pool": {"pct_factor": [[10, 1.1], [20, 1.2], [15, 1.15]]}, "allow_empty": true, "test_params": [{"pct": 10, "factor": 1.1}, {"pct": 20, "factor": 1.2}]}, {"id": "sub-6", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde den Namen des Verlags, der die meisten Bücher veröffentlicht hat.", "sql": "SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles GROUP BY pub_id ORDER BY COUNT(*) DESC LIMIT 1)", "test_params": [{}], "alt": {"sql": "SELECT p.pub_name FROM publishers p JOIN titles t ON p.pub_id = t.pub_id GROUP BY p.pub_name ORDER BY COUNT(t.title_id) DESC LIMIT 1", "note": "Die Subquery mit LIMIT 1 ist kurz und funktioniert gut, wenn du wirklich nur den EINEN Spitzenreiter brauchst. Der JOIN mit GROUP BY ist die bessere Basis, wenn du die Abfrage später erweitern willst — z.B. auf die Top 5 statt nur Platz 1."}}, {"id": "sub-7", "topic": "subquery", "difficulty": 2, "de_prompt": "Liste die Titel auf, die noch nie verkauft wurden (NOT IN).", "sql": "SELECT title FROM titles WHERE title_id NOT IN (SELECT title_id FROM sales)", "test_params": [{}]}, {"id": "sub-8", "topic": "subquery", "difficulty": 3, "de_prompt": "Finde die Mitarbeitenden mit demselben Job wie '{fname} {lname}'.", "sql": "SELECT fname, lname, job_id FROM employee WHERE job_id = (SELECT job_id FROM employee WHERE fname = '{fname}' AND lname = '{lname}')", "param_pool": {"name": [["Aria", "Cruz"], ["Annette", "Roulet"], ["Ann", "Devon"], ["Carlos", "Hernadez"], ["Daniel", "Tonini"]]}, "test_params": [{"fname": "Aria", "lname": "Cruz"}, {"fname": "Daniel", "lname": "Tonini"}]}, {"id": "func-1", "topic": "functions", "difficulty": 1, "de_prompt": "Füge eine Spalte hinzu, die zeigt /* ================= MySQL-Kompatibilitätsschicht ================= */

function mysqlCompat(sql){
  sql = sql.replace(/\bLEFT\s*\(/gi, "LEFTSTR(");
  sql = sql.replace(/\bRIGHT\s*\(/gi, "RIGHTSTR(");
  sql = sql.replace(/(TIMESTAMPDIFF\s*\(\s*)(YEAR|MONTH|DAY|WEEK|HOUR|MINUTE|SECOND)(\s*,)/gi, "$1'$2'$3");
  sql = sql.replace(/^\s*USE\s+\w+\s*;?\s*/i, "");
  return sql;
}

function parseSqlDate(s){
  if (s===null || s===undefined) return null;
  const datePart = String(s).split(" ")[0];
  const d = new Date(datePart+"T00:00:00Z");
  return isNaN(d.getTime()) ? null : d;
}

const MONTHS_DE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS_DE = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function registerUdfs(db){
  db.create_function("CONCAT", function(...args){
    if (args.some(a=>a===null||a===undefined)) return null;
    return args.join("");
  });
  db.create_function("LEFTSTR", function(s,n){ return s===null ? null : String(s).slice(0, Number(n)); });
  db.create_function("RIGHTSTR", function(s,n){
    if (s===null) return null;
    n = Number(n);
    return n>0 ? String(s).slice(-n) : "";
  });
  db.create_function("CURDATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("CURRENT_DATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("DATEDIFF", function(a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    return Math.round((da-db_)/86400000);
  });
  db.create_function("TIMESTAMPDIFF", function(unit,a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    const days = Math.round((db_-da)/86400000);
    unit = String(unit).toUpperCase();
    if (unit==="DAY") return days;
    if (unit==="YEAR"){
      let y = db_.getUTCFullYear()-da.getUTCFullYear();
      if ((db_.getUTCMonth()<da.getUTCMonth()) || (db_.getUTCMonth()===da.getUTCMonth() && db_.getUTCDate()<da.getUTCDate())) y--;
      return y;
    }
    if (unit==="MONTH"){
      let m = (db_.getUTCFullYear()-da.getUTCFullYear())*12 + (db_.getUTCMonth()-da.getUTCMonth());
      if (db_.getUTCDate() < da.getUTCDate()) m--;
      return m;
    }
    return days;
  });
  db.create_function("DATE_FORMAT", function(s, fmt){
    const d = parseSqlDate(s);
    if (!d) return null;
    let out = "";
    for (let i=0;i<fmt.length;i++){
      if (fmt[i]==="%" && i+1<fmt.length){
        const spec = fmt[i+1];
        if (spec==="Y") out += String(d.getUTCFullYear()).padStart(4,"0");
        else if (spec==="m") out += String(d.getUTCMonth()+1).padStart(2,"0");
        else if (spec==="d") out += String(d.getUTCDate()).padStart(2,"0");
        else if (spec==="e") out += String(d.getUTCDate());
        else if (spec==="M") out += MONTHS_DE[d.getUTCMonth()];
        else if (spec==="W") out += WEEKDAYS_DE[(d.getUTCDay()+6)%7];
        else out += spec;
        i++;
      } else out += fmt[i];
    }
    return out;
  });
  db.create_function("CHAR_LENGTH", function(s){ return s===null ? null : String(s).length; });
}

function rewriteRightJoin(sql){
  const m = sql.match(/^(.*?FROM\s+)([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+RIGHT\s+JOIN\s+([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+(ON\s+[\s\S]+?|USING\s*\([\s\S]+?\))(\s+(?:WHERE|GROUP BY|ORDER BY|LIMIT)[\s\S]*)?$/i);
  if (!m) return null;
  const [, pre, tblA, tblB, cond, rest] = m;
  return `${pre}${tblB} LEFT JOIN ${tblA} ${cond}${rest||""}`;
}

function execSqlRaw(sql){
  const res = db.exec(sql);
  if (!res.length) return {columns:[], values:[]};
  return res[res.length-1];
}

function execSqlSafe(sql){
  try{
    return execSqlRaw(sql);
  }catch(e){
    if (/RIGHT\s+JOIN/i.test(sql) && /RIGHT and FULL OUTER JOINs? are not (currently )?supported/i.test(e.message)){
      const rewritten = rewriteRightJoin(sql);
      if (rewritten){ return execSqlRaw(rewritten); }
    }
    throw e;
  }
}

function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ================= Fragen-Engine ================= */

function fillTemplate(tpl, params){
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (params[k]!==undefined ? params[k] : m));
}

function pickParams(q){
  if (!q.param_pool) return {};
  const pool = q.param_pool;
  const result = {};
  for (const key of Object.keys(pool)){
    const values = pool[key];
    const choice = values[Math.floor(Math.random()*values.length)];
    if (Array.isArray(choice)){
      if (key==="lo_hi"){ result.lo=choice[0]; result.hi=choice[1]; }
      else if (key==="pct_factor"){ result.pct=choice[0]; result.factor=choice[1]; }
      else if (key==="name"){ result.fname=choice[0]; result.lname=choice[1]; }
    } else {
      result[key] = choice;
    }
  }
  return result;
}

function buildInstance(q){
  const params = pickParams(q);
  const sql = mysqlCompat(fillTemplate(q.sql, params));
  const promptText = fillTemplate(q.de_prompt, params);
  let refResult = null, refError = null;
  try{ refResult = execSqlSafe(sql); }
  catch(e){ refError = e.message; }
  return {qdef:q, params, sql, promptText, refResult, refError};
}

function normVal(v){
  if (v===null || v===undefined) return null;
  if (typeof v === "number") return Math.round(v*10000)/10000;
  if (typeof v === "string") return v.trim();
  return v;
}
function rowKey(row){ return row.map(v=>String(v)).join(""); }

function compareResults(expected, actual){
  if (!expected) return {ok:false, reason:"no_reference"};
  if (expected.columns.length !== actual.columns.length){
    return {ok:false, reason:"column_count", expCols:expected.columns.length, actCols:actual.columns.length};
  }
  const exp = expected.values.map(r=>r.map(normVal));
  const act = actual.values.map(r=>r.map(normVal));
  if (exp.length !== act.length){
    return {ok:false, reason:"row_count", expRows:exp.length, actRows:act.length};
  }
  const expSorted = [...exp].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  const actSorted = [...act].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  for (let i=0;i<expSorted.length;i++){
    for (let j=0;j<expSorted[i].length;j++){
      if (expSorted[i][j] !== actSorted[i][j]) return {ok:false, reason:"value_mismatch"};
    }
  }
  return {ok:true};
}

function checkMonotonic(actual, colIdx, dir){
  const vals = actual.values.map(r=>r[colIdx]);
  for (let i=1;i<vals.length;i++){
    const a=vals[i-1], b=vals[i];
    if (a===null||b===null) continue;
    if (dir==="asc" && a>b) return false;
    if (dir==="desc" && a<b) return false;
  }
  return true;
}

function gradeAnswer(inst, actual){
  const cmp = compareResults(inst.refResult, actual);
  if (!cmp.ok) return cmp;
  if (inst.qdef.sortCol !== undefined){
    if (!checkMonotonic(actual, inst.qdef.sortCol, inst.qdef.sortDir)){
      return {ok:false, reason:"sort_missing"};
    }
  }
  return {ok:true};
}

function explainFailure(reason, extra, topic){
  const t = TOPICS.find(x=>x.id===topic);
  switch(reason){
    case "column_count":
      return `Deine Abfrage liefert <b>${extra.actCols}</b> Spalte(n), erwartet werden <b>${extra.expCols}</b>. Schau nochmal in der Aufgabenstellung nach, welche Spalten genau gefragt sind.`;
    case "row_count":
      if (extra.actRows > extra.expRows)
        return `Deine Abfrage liefert <b>mehr Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich filtert deine Bedingung nicht genug ein.<br><br>${t.concept}`;
      return `Deine Abfrage liefert <b>weniger Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich ist deine Bedingung zu streng, oder AND/OR sind vertauscht.<br><br>${t.concept}`;
    case "value_mismatch":
      return `Die Anzahl der Zeilen passt, aber die <b>Werte stimmen nicht überein</b>. Prüfe Berechnungen, Gruppierung oder Rundung.<br><br>${t.concept}`;
    case "sort_missing":
      return `Deine Werte stimmen, aber die <b>Sortierung passt nicht</b>. Denk an ORDER BY (und die Richtung ASC/DESC).`;
    case "no_reference":
      return `Für diese Frage konnte im Hintergrund keine Referenzlösung berechnet werden — das ist ein Fehler im Tool, nicht bei dir. Klick auf "Nächste Frage".`;
    default:
      return t.concept;
  }
}

function explainSqlError(msg){
  if (/no such column/i.test(msg)) return `Diese Spalte gibt es in der Tabelle nicht. Schau links in der Seitenleiste nach den passenden Spaltennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/no such table/i.test(msg)) return `Diese Tabelle gibt es nicht. Schau links in der Seitenleiste nach den verfügbaren Tabellennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/syntax error/i.test(msg)) return `Da steckt ein Tippfehler in der SQL-Syntax (z.B. fehlendes Komma, Klammer oder Anführungszeichen).<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  return `SQL-Fehler: <span class="text-faint">${msg}</span>`;
}

/* ---------- Mini-Dashboard: kleines Balkendiagramm unter Mehrzeilen-Ergebnissen ---------- */
function isNumericCol(res, idx){
  return res.values.every(r => r[idx]!==null && r[idx]!=="" && !isNaN(Number(r[idx])));
}
function detectChartData(res){
  if (!res.values.length || res.values.length < 2) return null; // kein Chart bei 0/1 Zeile
  const nCols = res.columns.length;
  let numIdx = -1;
  for (let i = nCols-1; i>=0; i--){
    if (isNumericCol(res, i)){ numIdx = i; break; }
  }
  if (numIdx === -1) return null; // keine numerische Spalte -> kein Chart
  let labelIdx = -1;
  for (let i=0;i<nCols;i++){
    if (i===numIdx) continue;
    if (!isNumericCol(res, i)){ labelIdx = i; break; }
  }
  if (labelIdx === -1){
    labelIdx = res.columns.findIndex((c,i)=>i!==numIdx);
  }
  if (labelIdx === -1) return null;
  const rows = res.values.map(r=>({label:String(r[labelIdx]), value:Number(r[numIdx])}));
  return {labelCol: res.columns[labelIdx], valueCol: res.columns[numIdx], rows};
}
function renderMiniChart(res){
  const data = detectChartData(res);
  if (!data) return "";
  let rows = data.rows;
  const truncated = rows.length > 12;
  if (truncated) rows = rows.slice(0,12);
  const max = Math.max(...rows.map(r=>Math.abs(r.value)), 1);
  const bars = rows.map(r=>{
    const pct = Math.max(2, Math.round(100*Math.abs(r.value)/max));
    return `<div class="chart-row">
      <span class="chart-label" title="${String(r.label).replace(/"/g,'&quot;')}">${r.label}</span>
      <div class="chart-track"><div class="chart-fill" style="width:${pct}%"></div></div>
      <span class="chart-val">${r.value}</span>
    </div>`;
  }).join("");
  return `<div class="mini-chart">
    <div class="mc-head">📊 ${data.valueCol} nach ${data.labelCol}${truncated? ' · erste 12':''}</div>
    ${bars}
  </div>`;
}

let previewState = null;

function previewTable(name){
  let res;
  try{ res = execSqlSafe(`SELECT * FROM ${name}`); }

  previewState = {name, columns: res.columns, rows: res.values, sortCol: null, sortDir: "asc", filter: ""};

function renderPreviewModal(){
  const {name, columns, rows, sortCol, sortDir, filter} = previewState;
  let filtered = rows;
  if (filter){
    const f = filter.toLowerCase();
    filtered = rows.filter(r => r.some(v => String(v).toLowerCase().includes(f)));
  }
  let sorted = filtered;
  if (sortCol !== null){
    sorted = [...filtered].sort((a,b)=>{
      const av=a[sortCol], bv=b[sortCol];
      if (av===bv) return 0;
      if (av===null) return 1;
      if (bv===null) return -1;
      return (av>bv?1:-1) * (sortDir==="asc"?1:-1);
    });
  }
  const modal = document.getElementById("modal-root");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closePreview()">
      <div class="modal-box wide">
        <div class="modal-header">
          <h3 style="margin:0;">${name} <span class="text-faint" style="font-size:12px;font-weight:400;">— ${filtered.length} Zeile${filtered.length===1?'':'n'}${filter? ' (gefiltert von '+rows.length+')':''}</span></h3>
          <input class="search-box" id="preview-search" placeholder="🔍 Suchen…" value="${filter.replace(/"/g,'&quot;')}" oninput="previewState.filter=this.value; renderPreviewModal()">
        </div>
        <div class="rp-body" style="max-height:60vh;overflow:auto;">
          <table class="result-table">
            <thead><tr>${columns.map((c,i)=>`<th style="cursor:pointer;user-select:none;" onclick="sortPreview(${i})">${c} ${sortCol===i? (sortDir==="asc"?'▲':'▼'):''}</th>`).join("")}</tr></thead>
            <tbody>${sorted.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<i style="color:#555">NULL</i>':String(v)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${columns.length}" class="text-faint">Keine Treffer.</td></tr>`}</tbody>
          </table>
        </div>
        <div style="text-align:right;margin-top:12px;">
          <button class="secondary" onclick="closePreview()">Schließen</button>
        </div>
      </div>
    </div>`;
  const inp = document.getElementById("preview-search");
  if (inp){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }
}
function sortPreview(colIdx){
  if (previewState.sortCol === colIdx) previewState.sortDir = previewState.sortDir==="asc" ? "desc" : "asc";
  else { previewState.sortCol = colIdx; previewState.sortDir = "asc"; }
  renderPreviewModal();
}

/* ---------- Question session ---------- */
function startSession(topics, count, freeplay){
  // Guarantee at least one question per selected topic first (shuffled order),
  // then fill the rest adaptively based on where mistakes happen.
  const shuffled = [...topics].sort(()=>Math.random()-0.5);
  const fixedQueue = count===null ? [] : shuffled.slice(0, Math.min(count, shuffled.length));

  session = {
    freeplay: !!freeplay, topics, targetCount: count,
    answered:0, correct:0, streak:0, bestStreak:0,
    topicStats:{}, current:null, wrongOnCurrent:0, hintTier:0,
    fixedQueue, queueIndex:0,
  };
  topics.forEach(t=> session.topicStats[t] = {asked:0, correct:0});
  nextQuestion();
  showScreen("question");
  updateHud();
}

function pickTemplate(topics, avoidId){
  const pool = QUESTIONS.filter(q=>topics.includes(q.topic) && q.id!==avoidId);
  const usePool = pool.length ? pool : QUESTIONS.filter(q=>topics.includes(q.topic));
  const weights = usePool.map(q=>{
    const stats = session.topicStats[q.topic] || {asked:0, correct:0};
    const wrongCount = Math.max(0, stats.asked - stats.correct);
    return 1 + wrongCount*1.5;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0;i<usePool.length;i++){ r -= weights[i]; if (r<=0) return usePool[i]; }
  return usePool[usePool.length-1];
}

function nextQuestion(){
  if (session.targetCount!==null && session.answered >= session.targetCount){
    return endSession();
  }
  const avoidId = session.current ? session.current.qdef.id : null;
  let template;
  if (session.queueIndex < session.fixedQueue.length){
    const forcedTopic = session.fixedQueue[session.queueIndex];
    template = pickTemplate([forcedTopic], avoidId);
    session.queueIndex++;
  } else {
    template = pickTemplate(session.topics, avoidId);
  }
  session.current = buildInstance(template);
  session.wrongOnCurrent = 0;
  session.hintTier = 0;
  renderQuestion();
}

function updateHud(){
  const hud = document.getElementById("hud");
  if (!session){ hud.innerHTML=""; return; }
  hud.innerHTML = `
