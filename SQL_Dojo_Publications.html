<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Dojo — Publications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Premium Obsidian Dark Mode */
  --bg:#0a0a0d; --bg-alt:#0e0f13; --panel:#131419; --panel-2:#1a1b21;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.14);
  --text:#f2f2f5; --text-dim:#a3a3ad; --text-faint:#6e6e78;
  --accent:#7477d8; --accent-soft:rgba(116,119,216,.16); --accent-2:#e0a458;
  --good:#22c55e; --bad:#ef4444; --warn:#e0a458;
  --radius:10px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 6px 20px -6px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
  --font-mono:'SF Mono', 'Fira Code', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{min-height:100vh;}
#app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:var(--bg-alt);
  border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;
}
header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;letter-spacing:.2px;font-weight:600;color:var(--text);}
header h1 .logo{font-size:22px;}
header h1 small{font-weight:400;color:var(--text-faint);font-size:12px;display:block;margin-top:2px;letter-spacing:.1px;}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.hud .chip{
  background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
  padding:6px 13px;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:6px;
}
.hud .chip b{color:var(--text);font-weight:600;}
.hud .chip.streak{color:#ffb020;border-color:#ffb02040;}
button, select, input[type=text], input[type=number]{
  font-family:inherit;font-size:14px;
}
button{
  cursor:pointer;border:1px solid transparent;border-radius:8px;padding:10px 18px;font-weight:600;
  background:var(--accent);color:#f5f5ff;box-shadow:var(--shadow-sm);
  transition:filter .12s ease, transform .12s ease, box-shadow .12s ease;
}
button:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:var(--shadow);}
button:active{filter:brightness(.95);transform:translateY(0);}
button.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
button.secondary:hover{border-color:var(--border-strong);}
button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);box-shadow:none;}
button.ghost:hover{color:var(--text);border-color:var(--border-strong);box-shadow:none;transform:none;}
button.good{background:var(--good);color:#08170d;}
button.small{padding:6px 12px;font-size:12.5px;border-radius:6px;}
button:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- layout ---------- */
.layout{display:flex;flex:1;min-height:0;}
aside#sidebar{
  width:280px;flex-shrink:0;background:var(--bg-alt);border-right:1px solid var(--border);
  padding:20px 14px;overflow-y:auto;
}
aside#sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin:4px 8px 12px;font-weight:700;}
.schema-filter{
  width:100%;padding:8px 11px;margin-bottom:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:12.5px;
}
.schema-filter::placeholder{color:var(--text-faint);}
.table-card{background:transparent;border:none;border-radius:6px;margin-bottom:2px;overflow:hidden;}
.table-head{
  display:flex;align-items:center;justify-content:space-between;padding:7px 9px;cursor:pointer;user-select:none;
  border-radius:6px;transition:background .12s ease;
}
.table-head:hover{background:var(--panel-2);}
.table-card.open > .table-head{background:var(--accent-soft);}
.table-card.open > .table-head .tname{color:var(--text);}
.table-head .tname{font-family:var(--font-mono);font-size:13px;color:var(--text);font-weight:500;}
.table-head .tname::before{content:"▤ ";color:var(--text-faint);}
.table-head .arrow{color:var(--text-faint);font-size:10px;transition:transform .15s;}
.table-card.open .arrow{transform:rotate(90deg);}
.table-card.open .table-head .arrow{color:var(--accent);}
.table-desc{padding:0 9px 7px 25px;font-size:11px;color:var(--text-faint);}
.table-cols{display:none;padding:3px 9px 9px 25px;font-family:var(--font-mono);font-size:12px;border-left:1px solid var(--border);margin-left:13px;}
.table-card.open .table-cols{display:block;}
.col-row{display:flex;justify-content:space-between;padding:2.5px 0;color:var(--text-dim);}
.col-row .ctype{color:var(--text-faint);font-size:10.5px;}
.col-row.pk{color:var(--accent-2);}
.preview-btn{
  margin:5px 9px 11px 25px;font-size:11px;padding:5px 9px;width:calc(100% - 34px);
}

/* ---------- main ---------- */
main{flex:1;min-width:0;overflow-y:auto;padding:32px;display:flex;justify-content:center;}
.screen{width:100%;max-width:900px;}

/* setup screen */
.setup-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);}
.setup-card h2{margin-top:0;font-weight:600;letter-spacing:.1px;}
.field{margin-bottom:26px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:9px;font-weight:600;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;}
.topic-pill{
  display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  cursor:pointer;background:var(--panel-2);transition:.15s ease;
}
.topic-pill:hover{border-color:var(--border-strong);}
.topic-pill.active{border-color:var(--tc);background:color-mix(in srgb, var(--tc) 14%, var(--panel-2));box-shadow:var(--shadow-sm);}
.topic-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex-shrink:0;}
.topic-pill .tt{font-size:13px;color:var(--text);}
.topic-pill .tt small{display:block;color:var(--text-faint);font-size:10.5px;}
.row-inline{display:flex;gap:10px;flex-wrap:wrap;}
.count-btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);transition:.15s ease;}
.count-btn:hover{border-color:var(--border-strong);color:var(--text);}
.count-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
.start-row{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.mix-note{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:14px 16px;margin-top:12px;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.mix-note b{color:#f87171;}
.setup-card + .setup-card{margin-top:22px;}
.freeplay-card{background:linear-gradient(135deg,rgba(116,119,216,.08),var(--panel) 60%);border-color:rgba(116,119,216,.25);}
.roundrobin-card{background:linear-gradient(135deg,rgba(16,185,129,.07),var(--panel) 60%);border-color:rgba(16,185,129,.25);}

/* lesson screen */
.lesson-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:18px;box-shadow:var(--shadow);}
.lesson-card h2{margin-top:0;display:flex;align-items:center;gap:10px;font-weight:600;color:var(--accent);}
.lesson-intro{background:color-mix(in srgb, var(--tc,var(--accent)) 8%, var(--panel-2));border:1px solid color-mix(in srgb, var(--tc,var(--accent)) 30%, transparent);border-radius:12px;padding:18px 20px;margin-bottom:22px;font-size:14.5px;line-height:1.7;color:var(--text);}
.lesson-intro b{color:var(--tc,var(--accent));}
.worked-wrap{margin-bottom:24px;}
.worked-note{font-size:12.5px;color:var(--text-faint);margin-bottom:9px;}
.worked-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:13px;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.worked-table th{background:rgba(0,0,0,.28);text-align:left;padding:8px 13px;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.worked-table td{padding:8px 13px;border-top:1px solid var(--border);color:var(--text);}
.worked-table td.hl{background:color-mix(in srgb, var(--tc,var(--accent)) 18%, transparent);color:var(--tc,var(--accent));font-weight:700;}
.lesson-step{border-left:2px solid var(--tc,var(--accent));padding:4px 0 4px 18px;margin-bottom:20px;position:relative;}
.lesson-step h4{margin:0 0 7px;font-size:15px;font-weight:600;color:var(--tc,var(--accent));display:flex;align-items:center;gap:9px;}
.lesson-step .step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--tc,var(--accent));color:#0a0a0d;font-size:11.5px;font-weight:800;flex-shrink:0;}
.lesson-step p{margin:0 0 9px;font-size:14px;line-height:1.65;color:var(--text-dim);}
.lesson-step .lex{background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-family:var(--font-mono);font-size:12.5px;color:var(--text);white-space:pre-wrap;}
.lex .tok-kw{color:var(--accent);font-weight:700;}
.lex .tok-str{color:#9dc76e;}
.lex .tok-num{color:#c9a0dc;}
.lex .tok-id{color:var(--text);}
.merk-box{background:color-mix(in srgb, var(--tc,var(--accent)) 14%, transparent);border-left:3px solid var(--tc,var(--accent));border-radius:0 8px 8px 0;padding:8px 13px;margin:2px 0 11px;font-weight:700;font-size:13.5px;color:var(--text);}
.detail-heading{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:24px 0 13px;padding-top:16px;border-top:1px dashed var(--border);}
.lesson-step.detail{border-left:2px dashed color-mix(in srgb, var(--tc,var(--accent)) 55%, var(--border));opacity:.92;}
.lesson-step.detail h4{font-size:13.5px;}
.lesson-step.detail .step-num{background:transparent;border:1.5px solid var(--tc,var(--accent));color:var(--tc,var(--accent));}
.lesson-condensed{display:flex;align-items:flex-start;gap:12px;padding:15px 4px;border-bottom:1px solid var(--border);}
.lesson-condensed:last-child{border-bottom:none;}
.lesson-condensed b{color:var(--tc,var(--accent));}
.lesson-condensed .lc-icon{font-size:22px;width:34px;height:34px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--tc) 16%, var(--panel-2));}
.lesson-condensed .lex{margin-top:9px;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--accent-2);}

/* inline code chips inside prose */
.lesson-intro code, .lesson-step code, .ns-note code{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);font-family:var(--font-mono);padding:1px 6px;border-radius:5px;font-size:.92em;}
.ns-intro-title{font-size:15px;font-weight:700;color:var(--tc,var(--accent));margin-bottom:8px;}

/* fixed 4-part lesson format: Was macht der Befehl? / Einfach erklärt / Bauanleitung / Beispiel */
.ns-block{margin-bottom:14px;}
.ns-block:last-child{margin-bottom:0;}
.ns-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tc,var(--accent));font-weight:700;margin-bottom:6px;}
.ns-was{font-size:14.5px;font-weight:600;color:var(--text);margin:0;line-height:1.55;}
.ns-tip{margin-top:8px;background:color-mix(in srgb, var(--tc,var(--accent)) 12%, transparent);border:1px solid color-mix(in srgb, var(--tc,var(--accent)) 30%, transparent);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
.ns-sublabel{font-size:12px;color:var(--text-faint);margin:10px 0 5px;font-weight:600;}
.ns-sublabel:first-child{margin-top:0;}
.ns-note{font-size:13px;color:var(--text-faint);margin:6px 0 0;font-style:italic;}

/* hints */
.hint-row{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap;}
.hint-box{background:rgba(116,119,216,.08);border:1px solid rgba(116,119,216,.25);border-radius:10px;padding:13px 15px;margin-bottom:13px;font-size:13.5px;color:var(--text-dim);}
.hint-box .hb-tier{color:#9a9cec;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.hint-box code{display:block;margin-top:7px;background:rgba(0,0,0,.3);border:1px solid var(--border);padding:9px 11px;border-radius:7px;font-family:var(--font-mono);color:#9ff5c6;white-space:pre-wrap;}
.alt-box{margin-top:13px;background:rgba(20,184,166,.07);border:1px solid rgba(20,184,166,.25);border-radius:11px;padding:13px 15px;font-size:13px;color:var(--text-dim);}
.alt-box .ab-title{color:#5eead4;font-weight:700;margin-bottom:7px;}
.alt-box code{display:block;margin:7px 0;background:rgba(0,0,0,.3);border:1px solid var(--border);padding:9px 11px;border-radius:7px;font-family:var(--font-mono);color:#9ff5c6;white-space:pre-wrap;font-size:12px;}

/* explorer-style data browser */
.modal-box.wide{min-width:min(900px,90vw);}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
.search-box{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);min-width:200px;}
.refcard{background:var(--panel);border:1px solid var(--border);border-radius:11px;margin-bottom:15px;overflow:hidden;box-shadow:var(--shadow-sm);}
.refcard summary{padding:11px 13px;cursor:pointer;font-size:12.5px;color:var(--text-dim);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;}
.refcard summary::-webkit-details-marker{display:none;}
.refcard .refbody{padding:0 13px 13px;font-size:11.5px;color:var(--text-faint);}
.refcard table{width:100%;border-collapse:collapse;margin-top:7px;}
.refcard td{padding:4px 5px;border-bottom:1px solid var(--border);}
.refcard td.k{color:var(--accent-2);font-family:var(--font-mono);}

/* question screen */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.topic-badge{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:700;
  background:color-mix(in srgb, var(--tc) 18%, transparent);color:var(--tc);border:1px solid color-mix(in srgb, var(--tc) 40%, transparent);
}
.stars{color:#ffd166;font-size:13px;letter-spacing:1px;}
.progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:99px;margin:0 14px;overflow:hidden;min-width:100px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .3s;}
.q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);}
.q-card p{margin:0;font-size:15.5px;line-height:1.6;color:var(--text);}
.editor-wrap{background:#101116;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
.editor-toolbar{
  display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#16171d;
  border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-faint);
}
.editor-toolbar .kbd{background:var(--panel-2);border:1px solid var(--border);padding:2px 7px;border-radius:5px;font-family:var(--font-mono);color:var(--text);}
.CodeMirror{height:150px;font-family:var(--font-mono);font-size:14px;line-height:1.5;}

/* ---- MySQL-Workbench-artiges Syntax-Highlighting (auf dracula-Basis umgefärbt) ---- */
.cm-s-dracula.CodeMirror{background:#101116 !important;color:#f2f2f5 !important;}
.cm-s-dracula .CodeMirror-gutters{background:#101116 !important;border-right:1px solid var(--border) !important;}
.cm-s-dracula .CodeMirror-linenumber{color:#4d4f5a !important;}
.cm-s-dracula .cm-keyword{color:#e0a458 !important;font-weight:600;}
.cm-s-dracula .cm-atom{color:#e0a458 !important;}
.cm-s-dracula .cm-builtin{color:#6fa8dc !important;}
.cm-s-dracula .cm-def{color:#f2f2f5 !important;}
.cm-s-dracula .cm-variable, .cm-s-dracula .cm-variable-2, .cm-s-dracula .cm-property{color:#f2f2f5 !important;}
.cm-s-dracula .cm-string{color:#9dc76e !important;}
.cm-s-dracula .cm-number{color:#c9a0dc !important;}
.cm-s-dracula .cm-comment{color:#6fa8dc !important;font-style:italic;}
.cm-s-dracula .cm-operator{color:#f2f2f5 !important;}
.cm-s-dracula .CodeMirror-selected{background:rgba(116,119,216,.28) !important;}
.cm-s-dracula .CodeMirror-cursor{border-left:1.5px solid #f2f2f5 !important;}
.cm-s-dracula .CodeMirror-matchingbracket{color:#e0a458 !important;background:rgba(116,119,216,.22);}
.run-row{display:flex;justify-content:center;align-items:center;margin-bottom:18px;}
.topic-refcard{margin-bottom:15px;}
.topic-refcard summary{font-weight:600;color:var(--text);}
.topic-syntax{background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-family:var(--font-mono);font-size:12.5px;color:var(--accent-2);white-space:pre-wrap;margin-bottom:7px;line-height:1.5;}
.results-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;margin-bottom:18px;overflow:hidden;min-height:60px;box-shadow:var(--shadow);}
.results-panel .rp-head{padding:11px 17px;font-size:12px;color:var(--text-faint);border-bottom:1px solid var(--border);}
.results-panel .rp-body{overflow:auto;max-height:260px;}
table.result-table{border-collapse:collapse;width:100%;font-size:13px;}
table.result-table th{
  position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 13px;color:var(--accent-2);
  font-family:var(--font-mono);border-bottom:1px solid var(--border);white-space:nowrap;
}
table.result-table td{padding:8px 13px;border-bottom:1px solid var(--border);color:var(--text-dim);white-space:nowrap;font-family:var(--font-mono);}
table.result-table tr:hover td{background:var(--panel-2);}
.empty-note, .error-note{padding:17px;font-size:13.5px;color:var(--text-faint);}
.error-note{color:#ff8080;font-family:var(--font-mono);white-space:pre-wrap;}

/* mini-dashboard under multi-row aggregate results */
.mini-chart{border-top:1px solid var(--border);padding:15px 17px;}
.mini-chart .mc-head{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px;font-weight:700;}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.chart-row .chart-label{width:150px;flex-shrink:0;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-row .chart-track{flex:1;height:14px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.chart-row .chart-fill{height:100%;background:var(--accent);border-radius:4px;}
.chart-row .chart-val{width:60px;text-align:right;font-size:12px;color:var(--text);font-family:var(--font-mono);flex-shrink:0;}

.feedback{border-radius:var(--radius);padding:19px 21px;margin-bottom:18px;border:1px solid;box-shadow:var(--shadow);}
.feedback.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);}
.feedback.bad{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);}
.feedback h3{margin:0 0 9px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
.feedback.ok h3{color:#4ade80;}
.feedback.bad h3{color:#fb7185;}
.feedback .body{font-size:14px;line-height:1.6;color:var(--text-dim);}
.feedback .example-box{
  margin-top:11px;background:rgba(0,0,0,.22);border-radius:10px;padding:13px 15px;font-size:13px;color:var(--text-dim);
  border-left:3px solid var(--accent);
}
.feedback .actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;}
.solution-box{margin-top:13px;background:rgba(0,0,0,.35);border-radius:10px;padding:13px 15px;font-family:var(--font-mono);font-size:12.5px;color:#9ff5c6;white-space:pre-wrap;border:1px solid rgba(34,197,94,.25);}

/* summary screen */
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:36px;text-align:center;box-shadow:var(--shadow);}
.summary-card .big-score{font-size:48px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.summary-card .sub{color:var(--text-dim);margin-top:5px;}
.crown{font-size:34px;}
.topic-bars{margin-top:28px;text-align:left;}
.tb-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.tb-row .tb-label{width:200px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.tb-row .tb-track{flex:1;height:9px;background:var(--panel-2);border-radius:99px;overflow:hidden;}
.tb-row .tb-fill{height:100%;border-radius:99px;}
.tb-row .tb-pct{width:40px;text-align:right;font-size:12px;color:var(--text-faint);}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999;}
.confetti span{
  position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;
  animation:fall 2.6s linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.3;}}

/* preview modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:500;}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:90vw;max-height:80vh;overflow:auto;padding:20px;box-shadow:var(--shadow);}
.modal-box h3{margin-top:0;font-family:var(--font-mono);color:var(--accent-2);}

.app-footer{text-align:center;padding:12px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border);background:var(--bg-alt);}
.app-footer a{color:var(--text-faint);}
.hidden{display:none !important;}
.text-faint{color:var(--text-faint);}
@media (max-width:800px){
  aside#sidebar{display:none;}
}
</style>

const TOPICS = [
  {id:"select_from", icon:"🔍", color:"#06b6d4", title:"SELECT · FROM · AS · DISTINCT",
   concept:"SELECT bestimmt WELCHE Spalten du sehen willst, FROM WOHER die Daten kommen. AS gibt einer Spalte oder Tabelle in der Ausgabe einen anderen Namen — das ändert nichts an der echten Tabelle. DISTINCT entfernt doppelte Zeilen aus dem Ergebnis.",
   example:"Ohne DISTINCT:<br>SELECT au_lname FROM authors<br>→ 'Ringer' taucht zweimal auf (zwei Autor:innen mit diesem Nachnamen)<br><br>Mit DISTINCT:<br>SELECT DISTINCT au_lname FROM authors<br>→ 'Ringer' nur einmal",
   syntax:"SELECT [DISTINCT] spalte1 [AS alias1], spalte2, ...\nFROM tabelle;",
   intro:"<div class=\"ns-intro-title\">🧱 Die Grundbausteine: SELECT und FROM</div><b>Wozu brauchst du das überhaupt?</b> Stell dir vor, du hast eine gigantische Tabelle mit hunderten von Spalten vor dir, aber für deine Arbeit brauchst du eigentlich nur den Vor- und Nachnamen. Genau dafür gibt es diese beiden Befehle. Jede einzelne Datenbank-Abfrage der Welt besteht aus diesen zwei Grundbausteinen: Du musst sagen, was genau du sehen willst (<code>SELECT</code>) und woher die Daten kommen sollen (<code>FROM</code>).",
   lesson:[
     {title:"SELECT (Die Einkaufsliste)",
      was:"Er wählt aus, welche Spalten in deinem finalen Ergebnis angezeigt werden sollen.",
      einfach:"SELECT ist wortwörtlich deine Einkaufsliste. Du sagst der Datenbank damit exakt, welche Informations-Häppchen sie aus dem Lager holen soll. Jedes Wort, das du hier aufschreibst, wird zu einer Spalte in deiner Ansicht. Wenn du zu faul bist, alles aufzuschreiben und einfach alle Spalten sehen willst, benutzt du den Platzhalter `*` (das Sternchen). Das bedeutet für die Datenbank: \"Bring mir einfach alles!\"",
      syntax:"SELECT spalte_1, spalte_2",
      tipp:"Die Spalten werden immer mit einem Komma getrennt. Nach der allerletzten Spalte kommt KEIN Komma mehr!",
      beispiele:[{code:"SELECT au_lname, state", note:"(Holt dir exakt diese zwei Spalten – nicht mehr und nicht weniger.)"}]},
     {title:"FROM (Die Wegbeschreibung)",
      was:"Er sagt der Datenbank, in welcher Tabelle sie suchen soll.",
      einfach:"Das ist die Wegbeschreibung in dein Lagerhaus. Deine Datenbank hat oft viele verschiedene Regale (Tabellen) – zum Beispiel eine für Autoren, eine für Bücher und eine für Verkäufe. Mit `FROM` schickst du das System gezielt an das richtige Regal. Ohne `FROM` steht die Datenbank völlig verloren da und weiß nicht, wo sie suchen soll.",
      syntax:"FROM tabellenname",
      beispiele:[{code:"SELECT au_lname, state\nFROM authors;", note:"(Bedeutet: Zeig mir den Nachnamen und das Bundesland, und hol dir diese Infos aus dem Regal der Autoren.)"}]},
     {title:"AS (Das neue Preisschild)",
      was:"Er gibt einer Spalte für deine Ansicht einen neuen, schöneren Namen (einen sogenannten Alias).",
      einfach:"Manchmal heißen die Spalten in der echten Datenbank furchtbar technisch, zum Beispiel `au_lname` für den Nachnamen eines Autors. Mit `AS` nimmst du einfach ein neues Preisschild und klebst es für deine Anzeige darüber. Die echten Daten im Lagerhaus behalten ihren komplizierten Namen, aber dein Schaufenster (dein Ergebnis) sieht für Menschen wunderbar lesbar aus.",
      syntax:"SELECT original_spalte AS neuer_name",
      beispiele:[{code:"SELECT au_lname AS Nachname\nFROM authors;", note:"(Bedeutet: Die Spalte heißt in deinem Ergebnis jetzt \"Nachname\". Die echte Datenbank bleibt unverändert.)"}]},
     {title:"DISTINCT (Der Aufräumer)",
      was:"Er filtert doppelte Einträge aus deiner Ansicht heraus, sodass jeder Wert nur noch ein einziges Mal auftaucht.",
      einfach:"Stell dir vor, du willst wissen, aus welchen Bundesländern deine Autoren kommen. Wenn fünf Autoren aus Kalifornien (CA) kommen, würde eine normale Abfrage fünfmal stumpf \"CA\" untereinander auflisten. `DISTINCT` räumt hier auf. Es sagt der Datenbank: \"Zeig mir jeden Wert nur ein einziges Mal. Mich interessieren keine Wiederholungen.\" Du bekommst dadurch eine saubere, übersichtliche Liste.",
      syntax:"SELECT DISTINCT spalte_die_gefiltert_werden_soll",
      tipp:"Das Wort DISTINCT steht immer direkt nach dem SELECT!",
      beispiele:[
        {label:"Normale Abfrage ohne Aufräumer:", code:"SELECT state FROM authors;", note:"(Ergebnis: CA, CA, CA, UT, UT)"},
        {label:"Mit unserem Aufräumer:", code:"SELECT DISTINCT state FROM authors;", note:"(Ergebnis: CA, UT – kurz und knackig.)"}
      ]}
   ]},
  {id:"where", icon:"🧭", color:"#f59e0b", title:"WHERE · AND / OR / NOT",
   concept:"WHERE filtert einzelne Zeilen. Mit AND müssen alle Bedingungen gleichzeitig wahr sein, mit OR reicht eine. Ohne Klammern wertet SQL AND vor OR aus — das kann zu überraschenden Ergebnissen führen.",
   example:"❌ Ohne Klammern:<br>WHERE city='Oakland' OR city='Berkeley' AND contract=1<br>→ Green + Stringer (Oakland, Vertrag egal) + Bennet (Berkeley MIT Vertrag) → Stringer hat aber gar keinen Vertrag!<br><br>✅ Mit Klammern:<br>WHERE (city='Oakland' OR city='Berkeley') AND contract=1<br>→ nur Green + Bennet, Stringer korrekt draußen",
   syntax:"SELECT ...\nFROM tabelle\nWHERE bedingung1 [AND|OR bedingung2 ...];",
   intro:"<div class=\"ns-intro-title\">🧭 Der Türsteher: <code>WHERE</code> · <code>AND</code> / <code>OR</code> / <code>NOT</code></div><b>Wozu brauchst du das überhaupt?</b> Ohne Filter bekommst du aus deinem Lagerhaus bei einer Abfrage immer alle Zeilen auf einmal geliefert (bei unseren Autoren zum Beispiel alle 23). Meistens suchst du aber etwas ganz Bestimmtes: Nur die Produkte aus einer bestimmten Stadt oder nur die, die gerade auf Lager sind. Hier kommt dein persönlicher Türsteher ins Spiel. Er prüft jede einzelne Zeile in deiner Tabelle und lässt nur die durch, die exakt auf deine Beschreibung passen.",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"WHERE (Der Türsteher)",
      was:"Er filtert deine Tabelle und lässt nur die Zeilen durch, die eine bestimmte Bedingung erfüllen. Alle anderen werden verworfen.",
      einfach:"`WHERE` steht buchstäblich an der Tür zu deinem Schaufenster. Du gibst ihm eine Regel mit (z.B. \"Nur Autoren aus Oakland\"), und er schaut sich jede Zeile einzeln an. Passt die Zeile? Darf sie rein. Passt sie nicht? Wird sie eiskalt aussortiert.",
      syntax:"WHERE spalte = 'dein_suchbegriff'",
      beispiele:[{code:"SELECT * FROM authors WHERE city = 'Oakland';", note:"(Ergebnis: Du siehst nur die Autoren, bei denen in der Spalte 'city' genau 'Oakland' steht. Verträge spielen hier noch keine Rolle.)"}]},
     {title:"Vergleichsoperatoren (Die Maßbänder)",
      was:"Sie vergleichen Werte miteinander und legen fest, wie genau der Türsteher prüfen soll (`=`, `!=`, `<>`, `>`, `>=`, `<`, `<=`).",
      einfach:"Du musst nicht immer nach exakten Wörtern suchen. Manchmal willst du Zahlen vergleichen (z.B. \"Zeig mir alle Bücher, die teurer als 10 Euro sind\"). Dafür gibt es die bekannten mathematischen Zeichen.<br><br>(💡 Gut zu wissen: Wenn etwas nicht übereinstimmen soll, also \"ungleich\" ist, schreiben Datenbank-Profis meistens `!=` oder `<>`. Beide Zeichenfolgen bedeuten exakt das Gleiche.)",
      syntax:"WHERE spalte > zahl",
      beispiele:[{code:"WHERE contract = 1;", note:"(Ergebnis: Nur die Autoren, bei denen eine 1 für \"hat einen Vertrag\" steht. Alle mit einer 0 fallen raus.)"}]},
     {title:"AND / OR (Die Kombinierer)",
      was:"Sie verknüpfen mehrere Bedingungen miteinander.",
      einfach:"Oft reicht eine einzige Regel nicht aus. `AND` (UND) ist hierbei sehr streng: Es müssen alle genannten Bedingungen gleichzeitig erfüllt sein, sonst bleibt die Tür zu. `OR` (ODER) ist viel entspannter: Es reicht völlig, wenn mindestens eine der Bedingungen zutrifft, damit die Zeile durchgelassen wird.",
      syntax:"WHERE bedingung_1 AND bedingung_2",
      beispiele:[
        {label:"Streng (`AND`):", code:"WHERE city = 'Oakland' AND contract = 1;", note:"(Muss aus Oakland kommen UND einen Vertrag haben. Eins allein reicht nicht!)"},
        {label:"Entspannt (`OR`):", code:"WHERE city = 'Oakland' OR city = 'Berkeley';", note:"(Egal welche von beiden Städten, Hauptsache eine davon passt.)"}
      ]},
     {title:"Klammern ( ) (Die Vorfahrtsregeln)",
      was:"Sie steuern zwingend, welche Bedingungen zuerst geprüft werden, wenn du `AND` und `OR` in einer Abfrage mischst.",
      einfach:"Mischst du `AND` und `OR` wild durcheinander, verhält sich die Datenbank wie ein sturer Taschenrechner: Sie wertet das `AND` nämlich immer zuerst aus! Das kann dein Ergebnis völlig verfälschen. Wenn du Klammern setzt, erzwingst du die Reihenfolge, die du willst. Alles in der Klammer wird immer als Erstes erledigt.",
      syntax:"WHERE (bedingung_1 OR bedingung_2) AND bedingung_3",
      beispiele:[
        {label:"❌ Falsch (Ohne Klammern):", code:"WHERE city = 'Oakland' OR city = 'Berkeley' AND contract = 1;", note:"(Ergebnis: Gibt dir auch Leute aus Oakland, die gar keinen Vertrag haben, weil das AND nur an Berkeley klebt.)"},
        {label:"✅ Richtig (Mit Klammern):", code:"WHERE (city = 'Oakland' OR city = 'Berkeley') AND contract = 1;", note:"(Ergebnis: Die Klammer sorgt dafür, dass zuerst geklärt wird: \"Kommt diese Person aus einer der beiden Städte?\" Erst danach wird geschaut, ob sie auch wirklich einen Vertrag hat.)"}
      ]},
     {kind:"detail", title:"Der Rebell: `NOT`",
      text:"Manchmal ist es viel einfacher zu sagen, was du nicht willst, anstatt eine lange Liste von Dingen aufzuzählen, die du willst. `NOT` dreht eine Bedingung einfach um: Alles, was nicht zutrifft, landet im Ergebnis. Schreibst du `WHERE NOT contract = 1`, bekommst du sofort alle Autor:innen ohne Vertrag. Das entspricht genau einem `WHERE contract != 1`."},
     {kind:"detail", title:"Das absolute Nichts finden: `IS NULL`",
      text:"Erinnerst du dich an das leere Nichts, das in der Datenbank NULL genannt wird? Du kannst nach fehlenden Werten nicht mit einem normalen Gleichheitszeichen suchen (`WHERE spalte = NULL` liefert nie ein Ergebnis!). Um zu prüfen, ob ein Wert wirklich fehlt, brauchst du zwingend `IS NULL`. Schreibst du `WHERE price IS NULL`, findest du sofort die Datensätze, wo schlichtweg noch kein Preis eingetragen wurde."}
   ]},
  {id:"sort_agg", icon:"📊", color:"#8b5cf6", title:"ORDER BY · LIMIT · Aggregatfunktionen",
   concept:"ORDER BY sortiert das gesamte Ergebnis, LIMIT schneidet danach nur die ersten n Zeilen ab — deshalb wird erst sortiert, dann limitiert. MIN/MAX/COUNT/AVG/SUM fassen viele Zeilen zu EINEM Wert zusammen.",
   example:"COUNT(*):<br>zählt ALLE Zeilen, auch NULL-Werte<br><br>COUNT(spalte):<br>zählt nur Zeilen, in denen die Spalte nicht NULL ist<br><br>Beispiel: 18 Titel, 2 davon ohne Preis<br>→ COUNT(*) = 18, COUNT(price) = 16",
   syntax:"SELECT spalte, MIN|MAX|COUNT|SUM|AVG(spalte)\nFROM tabelle\nORDER BY spalte [ASC|DESC]\nLIMIT n;",
   intro:"<div class=\"ns-intro-title\">📊 Die Sortiermaschine und der Taschenrechner: <code>ORDER BY</code> · <code>LIMIT</code> · Aggregatfunktionen</div><b>Wozu brauchst du das überhaupt?</b> Eine Tabelle liefert dir ihre Zeilen normalerweise in einem völlig chaotischen Haufen aus dem Lagerhaus. Willst du die teuersten Produkte ganz oben sehen oder nur die \"Top 3\" anzeigen? Dann brauchst du deine Sortiermaschine (<code>ORDER BY</code> und <code>LIMIT</code>).<br><br>Willst du hingegen nicht jedes einzelne Produkt sehen, sondern wissen, wie viele es insgesamt gibt oder was der Durchschnittspreis ist? Dann brauchst du sogenannte Aggregatfunktionen – das ist dein eingebauter Taschenrechner, der viele einzelne Zeilen zu einem einzigen Wert zusammenfasst.",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"ORDER BY (Die Sortiermaschine)",
      was:"Er legt die Reihenfolge deiner Ergebniszeilen fest (aufsteigend oder absteigend).",
      einfach:"Ohne `ORDER BY` wirft dir die Datenbank die Ergebnisse einfach in irgendeiner Reihenfolge vor die Füße. Du willst Struktur? Dieser Befehl sortiert alles sauber durch. Der Standard ist aufsteigend (klein nach groß, A bis Z). Willst du es umdrehen (z.B. teuerste Bücher zuerst), hängst du einfach ein `DESC` (für \"descending\" = absteigend) an.",
      syntax:"ORDER BY spalte DESC",
      beispiele:[{code:"SELECT title, price FROM titles ORDER BY price DESC;", note:"(Ergebnis: Holt dir Titel und Preis, und sortiert sie so, dass das allerteuerste Buch ganz oben steht.)"}]},
     {title:"LIMIT (Der Türsteher für die Top-Listen)",
      was:"Er schneidet dein Ergebnis nach einer von dir bestimmten Anzahl von Zeilen einfach ab.",
      einfach:"Manchmal willst du keine riesige Liste mit tausenden Einträgen, sondern nur die \"Top 3\". `LIMIT` macht genau das. Ganz wichtig: Die Datenbank sortiert immer zuerst und schneidet danach ab – niemals umgekehrt!",
      syntax:"LIMIT zahl",
      beispiele:[{code:"ORDER BY price DESC LIMIT 3;", note:"(Ergebnis: Sortiert zuerst nach dem höchsten Preis und zeigt dir dann nur die obersten 3 Zeilen – deine Top 3!)"}]},
     {title:"Aggregatfunktionen (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`)",
      was:"Sie fassen viele Zeilen zu einem einzigen mathematischen Ergebnis zusammen.",
      einfach:"Das ist dein Taschenrechner! `COUNT` zählt durch, wie viele Zeilen es gibt. `SUM` addiert alle Werte zusammen. `AVG` (Average) rechnet den Durchschnitt aus. `MIN` und `MAX` suchen dir den kleinsten oder größten Wert raus. Wichtig: Du siehst danach keine einzelnen Bücher mehr, sondern nur noch die fertige Rechnung!",
      syntax:"FUNKTION(spalte)",
      beispiele:[{code:"SELECT MAX(price), AVG(price) FROM titles;", note:"(Ergebnis: Gibt dir genau eine einzige Zeile zurück – nämlich den Preis des allerteuersten Buches und den Durchschnittspreis aller Bücher.)"}]},
     {title:"Die Tücke beim Zählen: `COUNT(*)` vs. `COUNT(spalte)`",
      was:"`COUNT(*)` zählt wirklich jede Zeile, `COUNT(spalte)` überspringt hingegen die leeren Felder (NULL).",
      einfach:"Erinnerst du dich an das leere Nichts (NULL)? Wenn du einfach nur `COUNT(*)` (mit dem Sternchen) sagst, zählt die Datenbank stumpf jede Zeile in deinem Lagerhaus durch, egal ob da Infos drin stehen oder nicht. Sagst du aber `COUNT(price)`, guckt die Datenbank ganz genau in die Preis-Spalte und zählt nur die Zeilen, wo auch wirklich ein Preis auf dem Etikett steht!",
      syntax:"COUNT(*)",
      beispiele:[{code:"SELECT COUNT(*), COUNT(price) FROM titles;", note:"(Ergebnis: Gibt dir z.B. 18 für alle Titel, aber nur 16 für Bücher mit einem echten Preis – 2 Bücher hatten gar keinen Preis hinterlegt und wurden ignoriert.)"}]},
     {kind:"detail", title:"Tie-Breaker: Mehrere Spalten sortieren",
      text:"Du kannst `ORDER BY` auch mehrere Spalten geben (durch Komma getrennt). Die erste Spalte ist der Chef und bestimmt die Hauptrichtung. Nur wenn es dort einen Gleichstand gibt (z.B. zwei Autoren aus dem gleichen Bundesstaat), wird die zweite Spalte als Tie-Breaker benutzt (z.B. um sie dann innerhalb des Bundesstaates noch einmal alphabetisch nach Nachnamen zu sortieren)."},
     {kind:"detail", title:"Seiten blättern mit `OFFSET`",
      text:"Stell dir vor, du baust Seite 2 eines Online-Shops. Du schreibst `LIMIT 3 OFFSET 3`. Das bedeutet: \"Überspringe die allerersten 3 Ergebnisse komplett und zeige mir dann erst die nächsten 3.\""},
     {kind:"detail", title:"Schönere Zahlen mit `ROUND`",
      text:"Funktionen wie `AVG` spucken oft wilde, unleserliche Kommazahlen aus. Mit `ROUND(AVG(price), 2)` rundest du dein Ergebnis sauber auf 2 Nachkommastellen ab. Lässt du die 2 am Ende einfach weg, rundet die Datenbank knallhart auf eine glatte, ganze Zahl."}
   ]},
  {id:"pattern", icon:"🔎", color:"#ec4899", title:"LIKE · IN · BETWEEN",
   concept:"= sucht einen exakten Wert. LIKE erlaubt Platzhalter (% = beliebig viele Zeichen, _ = genau ein Zeichen). IN prüft, ob ein Wert in einer Liste vorkommt (aber ohne Platzhalter). BETWEEN prüft einen Bereich inklusive beider Grenzen.",
   example:"WHERE title LIKE '%ing'<br>→ Titel, die auf 'ing' enden<br><br>WHERE au_lname LIKE 'D___'<br>→ 4-Buchstaben-Nachnamen, die mit D beginnen<br><br>WHERE type IN ('business','psychology')<br>→ kurz für type='business' OR type='psychology'",
   syntax:"SELECT ... FROM tabelle WHERE spalte LIKE 'muster%';\nSELECT ... FROM tabelle WHERE spalte IN (wert1, wert2, ...);\nSELECT ... FROM tabelle WHERE spalte BETWEEN wert1 AND wert2;",
   intro:"<div class=\"ns-intro-title\">🔎 Die Spürhunde: <code>LIKE</code> · <code>IN</code> · <code>BETWEEN</code></div><b>Wozu brauchst du das überhaupt?</b> Bisher kennst du das Gleichheitszeichen (<code>=</code>). Das ist aber extrem streng: Es findet nur exakte, 100-prozentige Treffer. Was aber, wenn du nur weißt, dass ein Nachname mit \"M\" anfängt? Oder wenn du alle Preise zwischen 10 und 20 Euro sehen willst? Für diese weicheren Suchen brauchst du unsere drei Spürhunde: <code>LIKE</code> (für Text-Muster), <code>IN</code> (für Wunschlisten) und <code>BETWEEN</code> (für Zahlenbereiche).",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"LIKE (Der Muster-Sucher)",
      was:"Er sucht nicht nach exakten Wörtern, sondern nach einem bestimmten Text-Muster, das du vorgibst.",
      einfach:"Stell dir vor, du hast ein Wort auf der Zunge, aber dir fehlt ein Teil. `LIKE` nutzt dafür Platzhalter. Das Prozentzeichen `%` steht für \"hier dürfen beliebig viele Zeichen kommen (oder gar keine)\". Der Unterstrich `_` steht für \"hier fehlt exakt EIN Buchstabe\". (💡 Gut zu wissen: MySQL ist hier entspannt und unterscheidet standardmäßig nicht zwischen Groß- und Kleinschreibung.)",
      syntax:"WHERE spalte LIKE 'muster'",
      beispiele:[{code:"WHERE title LIKE '%ing';", note:"(Ergebnis: Findet alle Titel, die auf \"ing\" enden – ganz egal, was vorher im Text steht. Zum Beispiel 'The Psychology of Computer Cooking'.)"}]},
     {title:"IN (Die Wunschliste)",
      was:"Er prüft auf einen Schlag, ob ein Wert in einer von dir festgelegten Liste vorkommt.",
      einfach:"Erinnerst du dich an den Kombinierer `OR`? Anstatt umständlich zu schreiben \"Ist es Buch A? ODER ist es Buch B? ODER ist es Buch C?\", schreibst du einfach eine bequeme Einkaufsliste in Klammern. `IN` hakt dann ab, ob das Produkt auf dieser Liste steht. Wichtig: Hier gibt es keine Platzhalter wie `%`, die Wörter müssen exakt passen!",
      syntax:"WHERE spalte IN ('wert_1', 'wert_2', 'wert_3')",
      beispiele:[{code:"WHERE type IN ('business', 'psychology');", note:"(Ergebnis: Gibt dir sofort alle Bücher, die entweder zur Kategorie Business oder zur Kategorie Psychologie gehören. Alles andere fliegt raus.)"}]},
     {title:"BETWEEN...AND (Das Maßband)",
      was:"Er prüft, ob ein Wert innerhalb eines bestimmten Bereichs liegt (inklusive der beiden Grenzen!).",
      einfach:"Wenn du nach Produkten suchst, die \"zwischen 20 und 40 Euro\" kosten, sparst du dir mit `BETWEEN` eine Menge Tipparbeit. Das funktioniert mit Zahlen genauso gut wie mit Datumsangaben.<br><br>⚠️ Absolute Stolperfalle: Die kleinere Zahl muss immer zuerst stehen! Schreibst du es falsch herum (z.B. 40 bis 20), gibt dir die Datenbank kein einziges Ergebnis zurück, obwohl es logisch derselbe Bereich wäre.",
      syntax:"WHERE spalte BETWEEN kleinere_zahl AND größere_zahl",
      beispiele:[{code:"WHERE qty BETWEEN 20 AND 40;", note:"(Ergebnis: Gibt dir alle Bestellungen, bei denen die Menge im Bereich 20 bis 40 liegt. Bestellungen mit exakt 20 oder 40 sind da fest mit eingeschlossen!)"}]},
     {kind:"detail", title:"Listen ausschließen mit `NOT IN`",
      text:"Willst du eine ganze Liste von Dingen ausschließen? Das Ungleich-Zeichen (`!=`) funktioniert immer nur bei einem einzigen Wort. Für eine ganze Liste brauchst du `NOT IN`. Schreibst du `WHERE city NOT IN ('Oakland', 'Berkeley')`, fliegen alle Autor:innen aus diesen beiden Städten sofort aus deinem Ergebnis."},
     {kind:"detail", title:"Zahlen mögen kein `LIKE`",
      text:"Merke dir: `LIKE` ist nur für Text da! Versuche bitte nie, echte Zahlen damit zu filtern. Schreibst du `WHERE menge LIKE '2%'` in der Hoffnung, alle 20er-Mengen zu finden, sucht die Datenbank einfach nach Text, der mit der Ziffer 2 anfängt – und liefert dir fälschlicherweise auch 200, 2000 oder 250 aus. Nimm für Zahlen immer `=`, `<`, `>` oder `BETWEEN`!"}
   ]},
  {id:"group_having", icon:"🗂️", color:"#10b981", title:"GROUP BY · HAVING",
   concept:"GROUP BY fasst Zeilen mit gleichem Wert zu einer Gruppe zusammen. WHERE filtert VOR der Gruppierung einzelne Zeilen, HAVING filtert NACH der Gruppierung die fertigen Gruppen — meist anhand einer Aggregatfunktion (Sammelbegriff für COUNT, SUM, AVG, MIN, MAX: Funktionen, die viele Zeilen zu einem einzigen Wert zusammenfassen, z.B. 'wie viele Zeilen hat diese Gruppe'). Deshalb darf in WHERE keine Aggregatfunktion stehen — die ist an der Stelle noch gar nicht berechnet.",
   example:"WHERE contract=1<br>→ filtert einzelne Zeilen (vor der Gruppierung)<br><br>GROUP BY state HAVING COUNT(*) > 3<br>→ filtert fertige Gruppen (nach der Gruppierung)",
   syntax:"SELECT spalte, MIN|MAX|COUNT|SUM|AVG(spalte)\nFROM tabelle\n[WHERE zeilen_bedingung]\nGROUP BY spalte\n[HAVING gruppen_bedingung];",
   intro:"<div class=\"ns-intro-title\">🗂️ Kisten packen und filtern: <code>GROUP BY</code> · <code>HAVING</code></div><b>Wozu brauchst du das überhaupt?</b> Oft willst du dir im Lagerhaus nicht jeden Artikel einzeln ansehen, sondern eine Zusammenfassung pro Kategorie haben. Du fragst dich zum Beispiel: \"Wie viele Autor:innen haben wir eigentlich in jedem Bundesstaat?\"<br><br>Um das herauszufinden, müssen wir die Daten erst in verschiedene Kisten sortieren (<code>GROUP BY</code>) und dann für jede Kiste einen Wert berechnen (z.B. mit unserem Taschenrechner <code>COUNT</code>).",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"GROUP BY (Der Kisten-Packer)",
      was:"Er fasst alle Zeilen, die in einer Spalte denselben Wert haben, zu einer einzigen Gruppe zusammen.",
      einfach:"`GROUP BY` sortiert deine Daten in Kisten. Kommen fünf Autor:innen aus Kalifornien (CA), packt der Befehl sie alle zusammen in die Kiste mit der Aufschrift \"CA\". Du bekommst am Ende für jede Kiste genau eine Ergebniszeile. Aus 23 einzelnen Autor:innen werden so ganz übersichtlich 8 Zeilen – eine für jeden Bundesstaat.",
      syntax:"GROUP BY spalte",
      beispiele:[{code:"SELECT state, COUNT(*) FROM authors GROUP BY state;", note:"(Ergebnis: Gibt dir genau 8 Zeilen zurück. In einer Spalte steht der Bundesstaat, in der anderen die Anzahl der Autor:innen, die in dieser Kiste liegen.)"}]},
     {title:"Aggregatfunktionen im Einsatz (Der Kisten-Zähler)",
      was:"Sie rechnen Werte (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`) für jede Gruppe getrennt aus.",
      einfach:"Wenn du Daten in Kisten packst, musst du der Datenbank sagen, was sie mit dem Inhalt machen soll. Soll sie die Einträge zählen (`COUNT`)? Soll sie Preise addieren (`SUM`)?<br><br>⚠️ Die goldene Faustregel: Jede Spalte, die du ganz oben in deinem `SELECT` aufschreibst, muss entweder die Kiste selbst sein (also im `GROUP BY` stehen) oder sie muss eine Rechnung (Aggregatfunktion) sein. Sonst weiß die Datenbank nicht, welchen der vielen Werte in der Kiste sie dir zeigen soll!",
      syntax:"FUNKTION(spalte)",
      beispiele:[{code:"SELECT state, COUNT(*) FROM authors GROUP BY state;", note:"(Hier ist `COUNT(*)` die Aggregatfunktion – sie zählt fleißig durch, wie viele Zeilen in der jeweiligen State-Kiste stecken.)"}]},
     {title:"HAVING (Der Türsteher für Kisten)",
      was:"Er filtert die fertigen Gruppen, meistens anhand der berechneten Ergebnisse (wie COUNT oder SUM).",
      einfach:"Du kennst bereits `WHERE` als Türsteher. Aber `WHERE` filtert einzelne Zeilen, bevor sie in die Kisten gepackt werden. Was ist, wenn du dir am Ende nur die Kisten ansehen willst, in denen mehr als 3 Leute stecken? Dafür gibt es `HAVING`. Es ist der Türsteher, der erst ganz am Ende die fertig gepackten Kisten kontrolliert. Deshalb dürfen Rechnungen wie `COUNT` auch nur in `HAVING` stehen, niemals in `WHERE`!",
      syntax:"HAVING bedingung",
      beispiele:[{code:"SELECT state, COUNT(*) FROM authors GROUP BY state HAVING COUNT(*) > 3;", note:"(Ergebnis: Von allen Bundesstaaten bleibt nur noch 'CA' übrig, weil alle anderen Staaten höchstens 2 Autor:innen in ihrer Kiste hatten.)"}]},
     {kind:"detail", title:"Noch speziellere Kisten: Mehrspaltiges `GROUP BY`",
      text:"Du kannst auch nach mehreren Spalten gleichzeitig gruppieren (einfach durch Komma trennen). Schreibst du `GROUP BY state, city`, baust du noch speziellere Kisten. Dann landen nicht mehr alle aus Kalifornien in einer großen Kiste, sondern es gibt eine Kiste für \"Kalifornien, Oakland\" und eine extra Kiste für \"Kalifornien, Berkeley\"."},
     {kind:"detail", title:"Die unsichtbare Reihenfolge der Datenbank",
      text:"Eine Datenbank arbeitet deine Befehle nicht in der Reihenfolge ab, in der du sie schreibst! Die echte, unsichtbare Reihenfolge ist:<br>`FROM` ➔ `WHERE` ➔ `GROUP BY` ➔ `HAVING` ➔ `SELECT` ➔ `ORDER BY` ➔ `LIMIT`.<br>Das erklärt auch logisch, warum du in `WHERE` noch nicht rechnen (`COUNT/SUM`) darfst: Das Kistenpacken (`GROUP BY`) und Zählen passiert erst danach!"}
   ]},
  {id:"joins", icon:"🔗", color:"#3b82f6", title:"LEFT / RIGHT / INNER JOIN",
   concept:"INNER JOIN zeigt nur Zeilen, die in BEIDEN Tabellen einen Treffer haben. LEFT JOIN zeigt ALLE Zeilen der linken Tabelle, auch ohne Treffer rechts (dann NULL). RIGHT JOIN macht dasselbe umgekehrt. ON erlaubt unterschiedliche Spaltennamen, USING nur wenn beide Tabellen die Spalte gleich benennen.",
   example:"INNER JOIN titles+sales:<br>→ nur die 16 Titel, die tatsächlich verkauft wurden<br><br>LEFT JOIN titles+sales (titles zuerst):<br>→ alle 18 Titel, unverkaufte zeigen NULL bei qty",
   syntax:"SELECT ...\nFROM tabelleA\n[INNER|LEFT|RIGHT] JOIN tabelleB ON tabelleA.spalte = tabelleB.spalte;",
   diagram:"joins",
   intro:"<div class=\"ns-intro-title\">🔗 Die Brückenbauer: <code>LEFT</code> / <code>RIGHT</code> / <code>INNER JOIN</code></div><b>Wozu brauchst du das überhaupt?</b> Daten liegen in deinem Lagerhaus fast nie in einer einzigen, riesigen Tabelle. Sie sind auf verschiedene Regale verteilt: Bücher stehen im Regal 'titles', Verkäufe im Regal 'sales'. Beide Regale teilen sich aber eine Gemeinsamkeit – die Artikelnummer (<code>title_id</code>). Mit einem <code>JOIN</code> baust du eine Brücke zwischen diesen Regalen. So kannst du dir mit einer einzigen Abfrage den Buchtitel und gleichzeitig seine Verkaufszahlen anzeigen lassen, als wären sie in einer Tabelle!",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter und Stolperfallen",
   lesson:[
     {title:"INNER JOIN (Der strenge Brückenbauer)",
      was:"Er zeigt nur Zeilen an, bei denen es auf beiden Seiten der Brücke einen echten Treffer gibt.",
      einfach:"Der `INNER JOIN` (in MySQL oft einfach nur `JOIN` genannt) ist sehr streng. Er verknüpft dein Buch-Regal mit dem Verkaufs-Regal. Findet er ein Buch, das noch nie verkauft wurde? Dann wirft er es eiskalt aus dem Ergebnis! Es müssen zwingend auf beiden Seiten passende Daten vorhanden sein.",
      syntax:"FROM tabelle_1 INNER JOIN tabelle_2 ON tabelle_1.spalte = tabelle_2.spalte",
      tipp:"Praxistipp: Nutze kurze Spitznamen/Aliase wie `t` für titles und `s` für sales, das spart enorm viel Tipparbeit!",
      beispiele:[{code:"SELECT t.title FROM titles t INNER JOIN sales s ON t.title_id = s.title_id;", note:"(Ergebnis: Zeigt dir nur die Titel, die auch wirklich verkauft wurden. Unverkaufte Bücher fallen hier komplett raus.)"}]},
     {title:"LEFT JOIN (Das gutmütige Sicherheitsnetz)",
      was:"Er behält alle Zeilen der linken Tabelle, auch wenn es in der rechten Tabelle gar keinen Treffer gibt.",
      einfach:"`LEFT JOIN` ist dein Sicherheitsnetz. Wenn du sagst \"Zeig mir alle Bücher (links) und häng die Verkäufe dran (rechts)\", sorgt der `LEFT JOIN` dafür, dass kein einziges Buch verloren geht. Hat ein Buch keine Verkäufe? Dann bleibt es trotzdem in der Liste und bekommt in der Verkaufs-Spalte einfach ein leeres Nichts (`NULL`) eingetragen. (Ein `RIGHT JOIN` macht exakt dasselbe, nur spiegelverkehrt für die rechte Seite.)",
      syntax:"FROM linke_tabelle LEFT JOIN rechte_tabelle ON linke_tabelle.spalte = rechte_tabelle.spalte",
      beispiele:[{code:"SELECT t.title, s.qty FROM titles t LEFT JOIN sales s ON t.title_id = s.title_id;", note:"(Ergebnis: Zeigt dir wirklich alle Bücher. Bei den unverkauften Büchern steht in der Verkaufsmenge `qty` nun einfach `NULL`.)"}]},
     {title:"Die Platzwahl (Wer kommt nach links?)",
      was:"Die Basistabelle, aus der du alles sehen willst, steht immer links vom `LEFT JOIN`.",
      einfach:"Eine praktische Faustregel für deine Übungsaufgaben: Wenn die Frage verlangt \"Zeige mir alle Titel, auch die unverkauften\", dann ist 'titles' ganz klar deine linke Basistabelle. Du schreibst also `titles LEFT JOIN sales`. Geht es in der Aufgabe aber um \"Zeige mir nur die Titel, die tatsächlich verkauft wurden\", dann reicht der strenge `INNER JOIN` völlig aus.",
      syntax:"FROM tabelle_von_der_du_alles_willst LEFT JOIN andere_tabelle",
      beispiele:[{label:"Aufgabe: \"Zeige mir alle Autor:innen\"", code:"FROM authors LEFT JOIN ..."}]},
     {kind:"detail", title:"Der fatale Fehler ohne `ON`",
      text:"Wenn du bei einem JOIN vergisst, die `ON`-Bedingung (die gemeinsame Brücke) anzugeben, meldet die Datenbank keinen Fehler! Stattdessen kombiniert sie völlig wild jede Zeile von links mit jeder Zeile von rechts. Bei 3 Autor:innen und 2 Verlagen hast du plötzlich 6 Zeilen völligen Unsinn (ein sogenanntes kartesisches Produkt). Das ist ein Logikfehler, kein Syntaxfehler – und deshalb besonders tückisch!"},
     {kind:"detail", title:"Plötzlich Duplikate?",
      text:"Wenn ein Buch vier verschiedene Verkäufe hat, taucht dieses eine Buch nach einem JOIN plötzlich viermal in deiner Liste auf! Das ist kein Fehler, sondern völlig normal: Die Datenbank zeigt dir die linke Zeile (das Buch) genau so oft an, wie sie rechts Treffer (Verkäufe) findet. Erst ein `GROUP BY` packt das später bei Bedarf wieder in eine einzige Zeile zusammen."},
     {kind:"detail", title:"Die Abkürzung: `USING` statt `ON`",
      text:"Wenn die Verbindungs-Spalte in beiden Tabellen exakt gleich heißt (z.B. beide heißen `pub_id`), kannst du dir Tipparbeit sparen. Statt `ON titles.pub_id = publishers.pub_id` schreibst du einfach kurz `USING(pub_id)`. Heißen die Spalten unterschiedlich, musst du zwingend `ON` verwenden."}
   ]},
  {id:"case", icon:"🧩", color:"#eab308", title:"CASE WHEN",
   concept:"CASE WHEN erstellt eine neue Spalte mit eigener Wenn-dann-sonst-Logik: WENN eine Bedingung zutrifft, DANN dieser Wert, SONST (ELSE) ein anderer. SQL prüft die Bedingungen der Reihe nach und nimmt die erste, die passt.",
   example:"CASE<br>WHEN qty >= 50 THEN 'high'<br>WHEN qty >= 20 THEN 'medium'<br>ELSE 'low' END<br><br>Zeile mit qty=60 → landet in 'high'<br>(obwohl 'qty >= 20' auch zuträfe — SQL stoppt bei der ersten Treffer-Bedingung)",
   syntax:"SELECT spalte,\n  CASE\n    WHEN bedingung1 THEN wert1\n    WHEN bedingung2 THEN wert2\n    ELSE wert3\n  END AS neue_spalte\nFROM tabelle;",
   intro:"<div class=\"ns-intro-title\">🧩 Die Ampel-Logik: <code>CASE WHEN</code></div><b>Wozu brauchst du das überhaupt?</b> Ein normales <code>SELECT</code> zeigt dir immer nur die rohen Daten, die sowieso schon in deinem Lagerhaus liegen. Oft willst du diese Daten aber bewerten und einschätzen: Ist eine Bestellmenge von 60 Stück \"GROSS\", \"MITTEL\" oder \"KLEIN\"? Diese Kategorie steht nirgends in der Datenbank – du musst sie ihr erst beibringen!<br><br>Dafür gibt es <code>CASE WHEN</code>. Das ist die Wenn-Dann-Sonst-Logik von SQL. Stell es dir vor wie eine Ampel: WENN eine bestimmte Bedingung zutrifft, DANN nimm diesen Wert, SONST nimm einen anderen. Das Ergebnis taucht am Ende als eine ganz normale, brandneue Spalte in deinem Schaufenster auf.",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"CASE WHEN (Die neue Spalte bauen)",
      was:"Er erstellt anhand von eigenen Regeln eine komplett neue Ergebnis-Spalte für deine Ausgabe.",
      einfach:"Du schreibst `CASE` genau dorthin in deine Einkaufsliste (`SELECT`), wo auch normale Spalten (wie Vorname oder Preis) stehen. Dann legst du mit `WHEN` (Wenn) deine Bedingung fest. Trifft sie zu, sagst du der Datenbank mit `THEN` (Dann), welches Wort dort stehen soll. Am Ende musst du zwingend mit `END` sagen, dass deine Ampel-Regel jetzt fertig ist. Wie immer klebst du mit `AS` noch ein schickes Preisschild (einen Namen) an deine neue Spalte.",
      syntax:"CASE WHEN bedingung THEN 'wert' END AS neuer_spaltenname",
      beispiele:[{code:"SELECT qty, CASE WHEN qty >= 50 THEN 'high' ELSE 'low' END AS kategorie FROM sales;", note:"(Ergebnis: Zeigt dir die echte Menge und zaubert direkt daneben eine neue Spalte namens \"kategorie\", in der automatisch \"high\" oder \"low\" steht.)"}]},
     {title:"Die Reihenfolge (Der Flur mit offenen Türen)",
      was:"Er prüft mehrere `WHEN`-Regeln streng von oben nach unten und stoppt sofort beim allerersten Treffer.",
      einfach:"Wenn du mehrere Regeln aufstellst, geht SQL sie strikt von oben nach unten durch. Stell dir einen Flur mit mehreren Türen vor: SQL geht Tür für Tür entlang und bleibt an der allerersten offenen Tür stehen. Alles, was danach kommt, wird gar nicht mehr angesehen!<br><br>⚠️ Wichtige Regel: Die genaueste Bedingung muss immer ganz oben stehen! Sonst schnappt sich eine zu allgemeine Tür weiter oben schon alle deine Treffer weg.",
      syntax:"CASE \n  WHEN bedingung_1 THEN 'wert_1' \n  WHEN bedingung_2 THEN 'wert_2' \nEND",
      beispiele:[{code:"CASE \n  WHEN qty >= 50 THEN 'high' \n  WHEN qty >= 20 THEN 'medium' \n  ELSE 'low' \nEND", note:"(Ergebnis: Bei einer Bestellmenge von 60 stoppt SQL sofort an Tür 1 (\"high\"). Bei einer Menge von 32 ist Tür 1 zu, SQL geht weiter und stoppt erfolgreich an Tür 2 (\"medium\").)"}]},
     {title:"ELSE (Der Auffangkorb)",
      was:"Er definiert den Standard-Wert für alle Zeilen, bei denen keine einzige deiner `WHEN`-Regeln zutrifft.",
      einfach:"`ELSE` (Sonst) ist dein sicherer Auffangkorb ganz am Ende des Flurs. Wenn keine einzige Tür für einen Datensatz offen war, fällt die Zeile automatisch hier hinein.<br><br>Was passiert, wenn du diesen Korb weglässt? Dann fallen die übrig gebliebenen Zeilen einfach ins Leere und in deiner neuen Spalte steht das absolute Nichts: NULL. Lass das `ELSE` also nur dann weg, wenn du wirklich ganz bewusst leere Felder erzeugen möchtest.",
      syntax:"ELSE 'standard_wert'",
      beispiele:[{code:"CASE WHEN state = 'CA' THEN 'West' END AS region", note:"(Ergebnis: Hier hast du den Auffangkorb vergessen! Alle Autor:innen aus Kalifornien bekommen brav das Wort \"West\", aber alle anderen Staaten bekommen knallhart ein leeres `NULL` eingetragen.)"}]},
     {kind:"detail", title:"Die Abkürzung: Simple CASE",
      text:"Wenn du keine komplexen Größer-Kleiner-Rechnungen machst, sondern nur auf absolute Gleichheit prüfst (z.B. \"Ist es eine 9? Ist es eine 10?\"), geht das auch kürzer. Du schreibst den Namen der Spalte direkt hinter das `CASE` und prüfst dann nur noch die Ergebnisse ab: `CASE grade WHEN 9 THEN 'Freshman' WHEN 10 THEN 'Sophomore' END`. Das spart ungemein viel Tipparbeit! (💡 Tipp: Auch ein `IN ('wort1', 'wort2')` funktioniert wunderbar innerhalb einer `WHEN`-Regel, um mehrere Werte auf einmal abzufangen!)"},
     {kind:"detail", title:"Kisten packen mit der neuen Spalte (`GROUP BY`)",
      text:"Du kannst deine selbstgebaute `CASE`-Spalte direkt nutzen, um deine Daten in neue Kisten zu sortieren! Du schreibst deinen ganzen `CASE`-Block dafür einfach unten ins `GROUP BY`. So kannst du dir am Ende wunderbar zusammenrechnen lassen, wie viele Verkäufe in deiner Kategorie \"high\" und wie viele in \"low\" gelandet sind."}
   ]},
  {id:"subquery", icon:"🪆", color:"#a855f7", title:"Subqueries",
   concept:"Eine Subquery ist eine Abfrage in einer Abfrage, meist in Klammern. Sie wird zuerst berechnet, ihr Ergebnis wird dann außen benutzt (mit =, IN oder als Vergleichswert). Eine correlated Subquery verweist zusätzlich auf eine Spalte der äußeren Abfrage und läuft deshalb für jede Zeile neu.",
   example:"WHERE price = (SELECT MAX(price) FROM titles) funktioniert nur, wenn die Subquery genau EINEN Wert liefert. Liefert sie mehrere Werte, brauchst du IN statt =.",
   syntax:"SELECT ... FROM tabelle\nWHERE spalte = (SELECT ... FROM ... );\n\nSELECT ... FROM tabelle\nWHERE spalte IN (SELECT ... FROM ... );",
   intro:"<div class=\"ns-intro-title\">🪆 Die Matroschka-Puppen: Subqueries</div><b>Wozu brauchst du das überhaupt?</b> Manchmal brauchst du für eine Bedingung erst das Ergebnis einer ganz anderen Abfrage. Ein Beispiel: \"Zeig mir das teuerste Buch\". Das Problem? Du weißt vorher gar nicht, wie hoch dieser Preis genau ist!<br><br>Eine Subquery (Unterabfrage) löst genau dieses Problem. Sie ist eine Abfrage in einer Abfrage, fast immer versteckt in Klammern (wie eine russische Matroschka-Puppe). Sie wird heimlich zuerst berechnet, und ihr Ergebnis wird danach in deiner eigentlichen Hauptabfrage weiterbenutzt.",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"Die Klammer-Regel (Die versteckte Vorab-Rechnung)",
      was:"Er führt eine versteckte Vorab-Rechnung aus, deren Ergebnis dann im Hauptbefehl als Filter genutzt wird.",
      einfach:"Die Subquery steht meistens in Klammern. Die Datenbank ist schlau und löst immer zuerst die Rechnung in der Klammer auf. Sobald sie das Ergebnis der Klammer hat, setzt sie diesen fertigen Wert einfach in deine Hauptabfrage ein und macht mit der eigentlichen Arbeit weiter.",
      syntax:"WHERE spalte = (SELECT spalte FROM tabelle)",
      beispiele:[{code:"SELECT title FROM titles WHERE price = (SELECT MAX(price) FROM titles);", note:"(Ergebnis: Die Klammer sucht zuerst heimlich nach dem höchsten Preis, z.B. 22.95. Danach filtert die äußere Hauptabfrage ganz normal nach dem Buch, das exakt diese 22.95 kostet.)"}]},
     {title:"`=` vs. `IN` (Wie viele Werte kommen zurück?)",
      was:"Das Gleichheitszeichen `=` funktioniert nur bei einem einzigen Wert. `IN` brauchst du zwingend, wenn die Klammer mehrere Werte ausspucken könnte.",
      einfach:"Liefert deine Vorab-Rechnung in der Klammer garantiert nur eine einzige Zahl (wie beim allerhöchsten Preis)? Dann reicht ein normales `=`.<br><br>Wenn deine Klammer aber eine ganze Liste von Werten zurückgeben kann (z.B. alle Verlags-IDs aus den USA), verschluckt sich das `=` und die Datenbank wirft einen Fehler. Nutze in diesem Fall stattdessen `IN` (unsere bekannte Wunschliste), um die Treffer abzugleichen.",
      syntax:"WHERE spalte IN (SELECT spalte FROM tabelle WHERE bedingung)",
      beispiele:[{code:"WHERE pub_id IN (SELECT pub_id FROM publishers WHERE country = 'USA');", note:"(Ergebnis: Da es mehrere Verlage in den USA geben kann, liefert die Klammer eine ganze Liste von IDs. Das IN verarbeitet diese Liste dann fehlerfrei.)"}]},
     {title:"`NOT IN` (Die Fehlenden finden)",
      was:"Er findet gezielt die Datensätze, die in einer anderen Tabelle nicht existieren.",
      einfach:"Das ist eine der praktischsten Anwendungen im Arbeitsalltag! Willst du wissen, welche Bücher noch nie verkauft wurden? Du lässt die Klammer einfach alle Buch-IDs aus der Verkaufs-Tabelle sammeln. Mit `NOT IN` sagst du der Hauptabfrage dann: \"Zeig mir alle Titel, die NICHT auf dieser Verkaufs-Liste stehen!\"",
      syntax:"WHERE spalte NOT IN (SELECT spalte FROM andere_tabelle)",
      beispiele:[{code:"SELECT title FROM titles WHERE title_id NOT IN (SELECT title_id FROM sales);", note:"(Ergebnis: Spuckt dir genau die traurigen Bücher aus, die bisher keinen einzigen Eintrag im Verkaufs-Regal hatten.)"}]},
     {kind:"detail", title:"Subqueries als völlig neue Spalte",
      text:"Unterabfragen müssen nicht zwingend unten im `WHERE`-Filter stehen. Du kannst sie auch ganz oben in deine `SELECT`-Einkaufsliste packen, um eine neue, berechnete Spalte zu erzeugen! Zum Beispiel, um den Preis jedes einzelnen Buches mit dem Durchschnittspreis aller Bücher zu vergleichen. Wichtig: Wenn eine Subquery im `SELECT`-Teil steht, musst du ihr am Ende zwingend mit `AS` einen neuen Namen geben."},
     {kind:"detail", title:"Die gekoppelte Subquery (Correlated)",
      text:"Normale Subqueries laufen nur ein einziges Mal ab. Es gibt aber auch spezielle Versionen, die direkt auf eine Spalte der Hauptabfrage verweisen. Diese laufen dann wie in einer Endlosschleife für jede einzelne Zeile deiner Hauptabfrage immer wieder neu ab! Das ist extrem nützlich, wenn du zum Beispiel für jeden einzelnen Autor individuell zählen willst, wie viele Bücher er geschrieben hat."}
   ]},
  {id:"functions", icon:"🧮", color:"#14b8a6", title:"Funktionen (Text & Datum)",
   concept:"String-Funktionen (LENGTH, UPPER, CONCAT, LEFT) verändern Text, Datumsfunktionen (DATEDIFF, TIMESTAMPDIFF, DATE_FORMAT) rechnen mit Datumswerten. Meist im SELECT-Teil, um Daten lesbarer zu machen oder neue berechnete Spalten zu erzeugen.",
   example:"DATEDIFF(a, b) = a MINUS b in Tagen<br><br>DATEDIFF(heute, pubdate)<br>→ positiv (Buch liegt in der Vergangenheit)<br><br>DATEDIFF(pubdate, heute)<br>→ negativ (umgekehrte Reihenfolge)",
   syntax:"SELECT LENGTH|UPPER|LOWER|CONCAT|LEFT(spalte, n)\nFROM tabelle;\n\nSELECT DATEDIFF(a,b) | TIMESTAMPDIFF(einheit,a,b) | DATE_FORMAT(spalte,muster)\nFROM tabelle;",
   intro:"<div class=\"ns-intro-title\">🧮 Werkzeuge für Text &amp; Datum: Der Feinschliff für deine Daten</div><b>Wozu brauchst du das überhaupt?</b> Rohdaten in einer Tabelle sind selten schon so, wie du sie am Ende im Schaufenster (deinem Ergebnis) präsentieren willst. Oft stehen Vor- und Nachname in getrennten Spalten oder ein Datum hat das völlig falsche Format. Mit Text- und Datumsfunktionen polierst du diese Werte direkt im <code>SELECT</code>-Teil auf, ohne die echten Daten im Lagerhaus anzufassen. Du änderst nur die finale Anzeige!",
   detailHeading:"🤓 Gut zu wissen: Deine kleinen Retter im Alltag",
   lesson:[
     {title:"Text-Werkzeuge (String-Funktionen)",
      was:"Sie verändern, kombinieren oder beschneiden Text direkt in deiner Ausgabe, um Daten lesbarer zu machen.",
      einfach:"<br>• `CONCAT` ist dein Kleber: Es fügt mehrere Texte zusammen. Wichtig: Du musst das Leerzeichen als eigenen Baustein mit in den Kleber mischen!<br>• `UPPER` und `LOWER` zwingen deinen Text in reine Groß- oder Kleinschreibung.<br>• `LENGTH` zählt ganz simpel die Zeichenanzahl eines Wortes.<br>• `LEFT` (oder `SUBSTRING`) schneidet dir ein genaues Teilstück aus dem Text heraus.",
      syntax:"CONCAT(spalte_1, ' ', spalte_2)\nUPPER(spalte)\nLENGTH(spalte)\nLEFT(spalte, anzahl_zeichen)",
      beispiele:[{label:"`CONCAT`:", code:"SELECT CONCAT(au_fname, ' ', au_lname) AS name FROM authors;", note:"(Ergebnis: Klebt Vor- und Nachname zu 'Johnson White' zusammen. Ohne das Leerzeichen in der Mitte hieße es fälschlicherweise 'JohnsonWhite'.)"}]},
     {title:"Datums-Werkzeuge",
      was:"Sie nehmen dir die nervige Mathearbeit mit Zeiträumen ab oder formatieren Datumsangaben um.",
      einfach:"<br>• `DATEDIFF` rechnet stumpf \"Datum A minus Datum B\" in Tagen. Die Reihenfolge der Werte in der Klammer entscheidet darüber, ob das Vorzeichen am Ende positiv oder negativ ist!<br>• `TIMESTAMPDIFF` ist der große Bruder: Hier rechnest du nicht nur in Tagen, sondern darfst die Einheit (DAY, MONTH, YEAR) frei wählen.<br>• `DATE_FORMAT` bringt ein hässliches Computer-Datum in ein Muster, das Menschen gerne lesen.",
      syntax:"DATEDIFF(datum_a, datum_b)\nTIMESTAMPDIFF(einheit, datum_a, datum_b)",
      beispiele:[{label:"`DATEDIFF`:", code:"DATEDIFF(CURDATE(), pubdate)", note:"(Ergebnis: Rechnet das heutige Datum `CURDATE()` minus das Erscheinungsdatum `pubdate`. Das Ergebnis ist eine positive Zahl, weil das Erscheinen des Buches logischerweise in der Vergangenheit liegt.)"}]},
     {kind:"detail", title:"Der Lückenfüller: `COALESCE` / `IFNULL`",
      text:"NULL-Werte (also leere Felder) sehen in einer fertigen Ausgabe extrem unschön aus und verwirren den Leser. `COALESCE` (oder `IFNULL`) ist dein Lückenfüller. Du sagst damit: \"Wenn in dieser Spalte NULL steht, zeig stattdessen bitte eine 0 oder einen Ersatzwert.\" Die echte Tabelle bleibt völlig unverändert. So sieht's aus: `SELECT title, COALESCE(price, 0) FROM titles;` (Macht aus einem fehlenden Preis sauber eine 0 statt dem Wort NULL)."},
     {kind:"detail", title:"Die Tücke beim Zählen: `LENGTH` vs. `CHAR_LENGTH`",
      text:"Ein fieses Detail im Alltag mit echtem MySQL: Die Funktion `LENGTH` zählt eigentlich nicht die sichtbaren Buchstaben, sondern den verbrauchten Speicherplatz (Bytes). Bei englischem Text ist das völlig egal. Aber bei Sonderzeichen wie Umlauten (z.B. 'ü' oder 'ä') verbraucht ein Buchstabe plötzlich zwei Bytes! Bei dem Namen 'Müller' würde `LENGTH` dir also fälschlicherweise eine 7 ausspucken. Wenn du zuverlässig tatsächliche Buchstaben zählen willst, nutze im Zweifel immer `CHAR_LENGTH()`."}
   ]},
  {id:"advanced", icon:"🏆", color:"#ef4444", title:"Advanced Mix (+ Bonus)",
   concept:"Hier kombinierst du alles: mehrere JOINs, Subqueries, GROUP BY und Rechenoperationen (+ - * / %) in einer Abfrage. Zerlege die Aufgabe in kleine Schritte und teste jeden Schritt einzeln, bevor du alles zusammensetzt.",
   example:"Umsatz pro Buch berechnen: erst den JOIN allein testen, dann price * qty hinzufügen, dann erst GROUP BY und SUM().",
   syntax:"-- Baukasten, je nach Aufgabe kombiniert:\nSELECT spalte, AGG_FUNKTION(a.spalte * b.spalte)\nFROM tabelleA a\nJOIN tabelleB b ON a.id = b.id\nWHERE spalte % 2 = 0\nGROUP BY spalte\nHAVING AGG_FUNKTION(...) > wert;",
   intro:"<b>Wozu brauchst du das überhaupt?</b> Die bisherigen Themen einzeln reichen oft nicht für echte Fragen — 'wie viel Umsatz hat jeder Titel gemacht?' braucht gleichzeitig einen JOIN (Titel mit Verkauf verbinden), eine Rechnung (price × qty) und GROUP BY (pro Titel zusammenfassen). Hier kombinierst du alles, was du bisher gelernt hast, in einer einzigen Abfrage.",
   worked:{
     note:"Umsatz pro Titel (price × qty, aufsummiert über alle Verkäufe) — kombiniert JOIN, Rechnen und GROUP BY:",
     headers:["title","Umsatz (SUM(price*qty))"],
     rows:[["Is Anger the Enemy?","1182.60"],["Secrets of Silicon Valley","1000.00"],["Onions, Leeks, and Garlic...","838.00"]],
     highlightCol:1
   },
   lesson:[
     {t:"Rechenoperatoren: + - * / %", merk:"% (Modulo) ist der Rest einer Division — praktisch für gerade/ungerade.", b:"SQL kann direkt rechnen: + - * / und % (Modulo, der Rest einer Division — praktisch um gerade/ungerade Zahlen zu prüfen).", ex:"WHERE qty % 2 = 0;\n→ 10 von 21 Bestellungen haben eine gerade Menge\n\nprice * qty\n→ Umsatz einer einzelnen Verkaufszeile"},
     {t:"Strategie: Schritt für Schritt aufbauen", merk:"Erst Teilschritte einzeln testen, dann erst zusammensetzen.", b:"Schreib nicht die ganze komplexe Query auf einmal. Baue sie in kleinen, testbaren Schritten auf und prüfe nach jedem Schritt, ob das Zwischenergebnis plausibel aussieht.", ex:"Umsatz pro Titel:\n1) JOIN allein testen (titles + sales)\n2) price*qty als neue Spalte hinzufügen\n3) erst dann GROUP BY + SUM() ergänzen\n\n→ Ergebnis: die Tabelle oben"},
     {t:"Mehrere JOINs kombinieren", merk:"Bei mehreren JOINs: eine Verbindung nach der anderen denken.", b:"Für komplexere Fragen brauchst du oft eine Kette aus 2-3 JOINs über mehrere Tabellen hinweg.", ex:"titles → sales → stores:\nSELECT st.stor_name, t.title\nFROM titles t\nJOIN sales s ON t.title_id=s.title_id\nJOIN stores st ON s.stor_id=st.stor_id;\n\n→ verbindet Titel, Verkauf UND Buchhandlung in einer Abfrage"},
     {t:"Weitere Rechenfunktionen (Bonus)", kind:"detail", merk:"ABS, CEIL, FLOOR, POWER, SQRT — für Sonderfälle beim Rechnen.", b:"Neben ROUND() gibt es noch ein paar weitere eingebaute Rechenfunktionen, die dir seltener, aber ab und zu begegnen: ABS() (macht negative Zahlen positiv), CEIL() (rundet immer AUF), FLOOR() (rundet immer AB), POWER(zahl, hoch) (Potenz) und SQRT() (Quadratwurzel).", ex:"SELECT CEIL(4.2), FLOOR(4.8), POWER(2,3), SQRT(9);\n→ ergibt 5, 4, 8, 3"}
   ]},
  {id:"self_join", icon:"🪞", color:"#f97316", title:"Self Join",
   concept:"Ein Self Join verbindet eine Tabelle mit sich selbst — technisch dieselbe JOIN-Syntax wie immer, nur dass beide Seiten aus derselben Tabelle kommen. Über zwei Aliase (z.B. a und b) behandelst du sie wie zwei getrennte Tabellen. Eine Zusatzbedingung wie a.id < b.id verhindert, dass eine Zeile sich selbst matcht und dass Paare doppelt erscheinen.",
   example:"FROM authors a JOIN authors b ON a.au_lname = b.au_lname AND a.au_id < b.au_id<br>→ findet Autor:innen-Paare mit demselben Nachnamen, jedes Paar nur einmal",
   syntax:"SELECT a.spalte, b.spalte\nFROM tabelle a\nJOIN tabelle b ON a.gemeinsamkeit = b.gemeinsamkeit AND a.id < b.id;",
   intro:"<b>Wozu brauchst du das überhaupt?</b> Bisher hast du IMMER zwei VERSCHIEDENE Tabellen mit JOIN verbunden (z.B. titles mit publishers). Ein Self Join ist ungewöhnlich, weil du dieselbe Tabelle mit SICH SELBST verbindest — z.B. um innerhalb von 'authors' herauszufinden, welche zwei Autor:innen denselben Nachnamen haben. Das klingt zunächst verwirrend, ist aber technisch nichts Neues: du benutzt exakt dieselbe JOIN-Syntax wie immer, nur dass beide Seiten des JOINs zufällig aus derselben Tabelle kommen.",
   worked:{
     note:"Die Tabelle 'authors' zweimal gleichzeitig benutzt (einmal als 'a', einmal als 'b') — gesucht: gleicher Nachname, unterschiedliche Person:",
     headers:["a.au_fname","a.au_lname","b.au_fname","b.au_lname"],
     rows:[["Anne","Ringer","Albert","Ringer"]],
   },
   lesson:[
     {t:"Der Trick: dieselbe Tabelle zweimal benutzen, mit zwei Aliasen", merk:"Du gibst derselben Tabelle zwei verschiedene Alias-Namen — SQL behandelt sie dann wie zwei getrennte Tabellen.", b:"Ein Self Join sieht syntaktisch aus wie ein ganz normaler JOIN — der einzige Unterschied: FROM und JOIN nennen BEIDE dieselbe Tabelle, z.B. authors. Damit SQL (und du selbst) die beiden Seiten auseinanderhalten kann, gibst du jeder ein eigenes Alias, z.B. 'a' und 'b'. Ab da tust du einfach so, als wären es zwei komplett unabhängige Tabellen.", ex:"FROM authors a\nJOIN authors b ON a.au_lname = b.au_lname\n\n→ 'a' und 'b' sind beide die Tabelle authors, SQL behandelt sie trotzdem getrennt"},
     {t:"Die ON-Bedingung: was soll übereinstimmen?", merk:"Die ON-Bedingung bei Self Join ist meist eine inhaltliche Gemeinsamkeit, kein ID-Feld.", b:"Anders als bei normalen JOINs (die meist über eine ID-Spalte verknüpfen) verbindest du bei einem Self Join oft über eine inhaltliche Spalte — hier: 'hat denselben Nachnamen'.", ex:"ON a.au_lname = b.au_lname\n\n→ verbindet jede Zeile mit jeder anderen Zeile, die denselben Nachnamen hat"},
     {t:"Die Stolperfalle: ohne Zusatzbedingung matcht jede Zeile sich selbst", merk:"a.id < b.id verhindert, dass eine Zeile sich selbst matcht und dass Paare doppelt erscheinen.", b:"Ohne weitere Einschränkung matcht z.B. Anne Ringer auch MIT SICH SELBST (au_lname='Ringer' = au_lname='Ringer' ist für die gleiche Zeile logisch wahr) — das ist nutzlos. Und ohne Einschränkung würde jedes Paar zweimal auftauchen (einmal als a=Anne/b=Albert, einmal umgekehrt als a=Albert/b=Anne). Die Lösung: eine zusätzliche Bedingung wie a.au_id < b.au_id — sie schließt den Vergleich mit sich selbst aus UND lässt jedes Paar nur einmal übrig.", ex:"SELECT a.au_fname, a.au_lname, b.au_fname, b.au_lname\nFROM authors a\nJOIN authors b ON a.au_lname = b.au_lname AND a.au_id < b.au_id;\n\n→ genau ein Treffer: Anne Ringer + Albert Ringer (das einzige Paar in dieser Datenbank)"}
   ]},
  {id:"union", icon:"🔀", color:"#84cc16", title:"UNION",
   concept:"UNION stapelt die Ergebnisse von zwei SELECT-Abfragen untereinander (mehr Zeilen), statt sie wie JOIN nebeneinanderzulegen (mehr Spalten). Beide SELECTs brauchen dieselbe Anzahl Spalten. UNION entfernt Duplikate automatisch, UNION ALL behält jede Zeile.",
   example:"SELECT pub_id FROM titles UNION ALL SELECT pub_id FROM employee<br>→ 61 Zeilen (mit Duplikaten)<br><br>SELECT pub_id FROM titles UNION SELECT pub_id FROM employee<br>→ 8 Zeilen (jeder Verlag nur einmal)",
   syntax:"SELECT spalte FROM tabelleA\nUNION [ALL]\nSELECT spalte FROM tabelleB\n[ORDER BY spalte];",
   intro:"<b>Wozu brauchst du das überhaupt?</b> Ein JOIN verbindet zwei Tabellen NEBENEINANDER (mehr Spalten pro Zeile). UNION dagegen stapelt die Ergebnisse von zwei SELECT-Abfragen UNTEREINANDER (mehr Zeilen, gleiche Spalten) — als wären es von Anfang an eine einzige Abfrage gewesen. Typischer Einsatz: du willst zwei Listen aus unterschiedlichen Tabellen zu EINER gemeinsamen Liste zusammenfassen, z.B. 'alle Verlage, die entweder ein Buch ODER Mitarbeitende haben' in einer einzigen Spalte.",
   worked:{
     note:"pub_id aus 'titles' UND aus 'employee' — mit UNION zu einer Liste zusammengefasst, ohne Duplikate:",
     headers:["Abfrage","Anzahl Zeilen im Ergebnis"],
     rows:[["... UNION ALL ...","61 (alle Zeilen, mit Duplikaten)"],["... UNION ...","8 (jeder Verlag nur einmal)"]],
     highlightCol:1
   },
   lesson:[
     {t:"UNION stapelt zwei Abfragen untereinander", merk:"UNION braucht in beiden SELECTs die GLEICHE Anzahl Spalten, in der gleichen Bedeutung.", b:"Bei UNION schreibst du zwei komplette SELECT-Abfragen und verbindest sie mit dem Schlüsselwort UNION dazwischen. Wichtig: beide SELECTs müssen die gleiche ANZAHL Spalten liefern (die Spaltennamen dürfen unterschiedlich sein, das Ergebnis übernimmt einfach die Namen der ERSTEN Abfrage).", ex:"SELECT pub_id FROM titles\nUNION\nSELECT pub_id FROM employee;\n\n→ eine einzige Spalte 'pub_id', mit Zeilen aus BEIDEN Tabellen"},
     {t:"UNION entfernt Duplikate automatisch, UNION ALL nicht", merk:"UNION = wie DISTINCT über beide Abfragen hinweg. UNION ALL behält jede Zeile, auch doppelte.", b:"UNION vergleicht das komplette Ergebnis und entfernt doppelt vorkommende Zeilen — genau wie DISTINCT, nur über zwei Abfragen hinweg statt über eine. UNION ALL macht das NICHT: es hängt einfach alle Zeilen aneinander, Duplikate inklusive. UNION ALL ist außerdem schneller, weil SQL sich die Dedup-Arbeit spart.", ex:"SELECT pub_id FROM titles UNION ALL SELECT pub_id FROM employee;\n→ 61 Zeilen (siehe Tabelle oben, mit Duplikaten)\n\nSELECT pub_id FROM titles UNION SELECT pub_id FROM employee;\n→ 8 Zeilen (jeder der 8 Verlage nur einmal)"},
     {t:"Wann UNION statt JOIN?", merk:"JOIN = mehr Spalten pro Zeile (nebeneinander). UNION = mehr Zeilen (untereinander).", b:"Ein JOIN beantwortet 'zeig mir Zeile A UND die dazu passende Zeile B in einer Zeile'. UNION beantwortet dagegen 'zeig mir Zeile A ODER Zeile B als jeweils eigene Zeile in derselben Liste'.", ex:"UNION: zwei Listen zu einer zusammenfassen (mehr Zeilen).\nz.B. 'welche Verlage haben Bücher ODER Mitarbeitende'\n\nJOIN: zwei Tabellen nebeneinanderlegen (mehr Spalten).\nz.B. 'zeig Buchtitel UND den zugehörigen Verlagsnamen'"},
     {t:"ORDER BY bei UNION — nur einmal, ganz am Ende", kind:"detail", merk:"ORDER BY gehört nur ans Ende der GESAMTEN UNION-Abfrage, nicht in die einzelnen SELECTs.", b:"Willst du das kombinierte Ergebnis sortieren, steht ORDER BY nur EINMAL, ganz am Ende der gesamten Abfrage — nicht in jedem der beiden SELECTs einzeln.", ex:"SELECT pub_id FROM titles\nUNION\nSELECT pub_id FROM employee\nORDER BY pub_id;\n\n→ sortiert das gesamte kombinierte Ergebnis"}
   ]},
  {id:"exists", icon:"🕵️", color:"#6366f1", title:"EXISTS",
   concept:"EXISTS prüft mit einer Subquery nur, OB überhaupt mindestens eine passende Zeile existiert (wahr/falsch) — nicht WELCHE Werte sie liefert. Die Subquery bezieht sich fast immer auf die äußere Zeile (correlated). NOT EXISTS findet das Gegenteil: Zeilen, für die es KEINEN passenden Eintrag gibt.",
   example:"SELECT au_lname FROM authors a WHERE EXISTS (SELECT 1 FROM titleauthor ta WHERE ta.au_id = a.au_id)<br>→ 19 von 23 Autor:innen — die mit mindestens einem Buch",
   syntax:"SELECT ... FROM tabelleA a\nWHERE [NOT] EXISTS (SELECT 1 FROM tabelleB b WHERE b.spalte = a.spalte);",
   intro:"<b>Wozu brauchst du das überhaupt?</b> Du kennst schon IN und NOT IN mit Subqueries — die prüfen, ob ein WERT in einer Liste vorkommt. EXISTS prüft etwas anderes: nicht WELCHEN Wert eine Subquery liefert, sondern nur OB sie überhaupt mindestens eine Zeile liefert (wahr/falsch). Das klingt ähnlich zu IN, ist aber oft klarer zu lesen, vor allem wenn die Subquery mehrere Bedingungen gleichzeitig prüfen muss.",
   worked:{
     note:"23 Autor:innen insgesamt — EXISTS prüft für jede: gibt es mindestens einen Eintrag in 'titleauthor'?",
     headers:["au_lname","hat mindestens ein Buch?"],
     rows:[["White","ja"],["Green","ja"],["Smith","nein"],["Greene","nein"]],
     highlightCol:1
   },
   lesson:[
