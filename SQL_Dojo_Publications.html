/* ---------- Mini-Dashboard: kleines Balkendiagramm unter Mehrzeilen-Ergebnissen ---------- */
function shouldShowChart(sql){
  // Nur bei echten Zusammenfassungen sinnvoll (GROUP BY / Aggregatfunktion im SELECT-Teil),
  // nicht bei rohen SELECT *-Dumps ohne jede Aggregation.
  if (!sql) return false;
  const selectPart = sql.split(/\bFROM\b/i)[0] || "";
  return /\bGROUP\s+BY\b/i.test(sql) || /\b(COUNT|SUM|AVG|MIN|MAX)\s*\(/i.test(selectPart);
}
function isNumericCol(res, idx){
  return res.values.every(r => r[idx]!==null && r[idx]!=="" && !isNaN(Number(r[idx])));
}
function detectChartData(res){
  if (!res.values.length || res.values.length < 2) return null; // kein Chart bei 0/1 Zeile
  const nCols = res.columns.length;
  let numIdx = -1;
  for (let i = nCols-1; i>=0; i--){
    if (isNumericCol(res, i)){ numIdx = i; break; }
  }
  if (numIdx === -1) return null; // keine numerische Spalte -> kein Chart
  let labelIdx = -1;
  for (let i=0;i<nCols;i++){
    if (i===numIdx) continue;
    if (!isNumericCol(res, i)){ labelIdx = i; break; }
  }
  if (labelIdx === -1){
    labelIdx = res.columns.findIndex((c,i)=>i!==numIdx);
  }
  if (labelIdx === -1) return null;
  const rows = res.values.map(r=>({label:String(r[labelIdx]), value:Number(r[numIdx])}));
  return {labelCol: res.columns[labelIdx], valueCol: res.columns[numIdx], rows};
}
function renderMiniChart(res){
  const data = detectChartData(res);
  if (!data) return "";
  let rows = data.rows;
  const truncated = rows.length > 12;
  if (truncated) rows = rows.slice(0,12);
  const max = Math.max(...rows.map(r=>Math.abs(r.value)), 1);
  const bars = rows.map(r=>{
    const pct = Math.max(2, Math.round(100*Math.abs(r.value)/max));
    return `<div class="chart-row">
      <span class="chart-label" title="${String(r.label).replace(/"/g,'&quot;')}">${r.label}</span>
      <div class="chart-track"><div class="chart-fill" style="width:${pct}%"></div></div>
      <span class="chart-val">${r.value}</span>
    </div>`;
  }).join("");
  return `<div class="mini-chart">
    <div class="mc-head">📊 ${data.valueCol} nach ${data.labelCol}${truncated? ' · erste 12':''}</div>
    ${bars}
  </div>`;
}

/* ---------- Explorer-style data browser (full table, sortable, searchable) ---------- */
let previewState = null;

function previewTable(name){
  let res;
  try{ res = execSqlSafe(`SELECT * FROM ${name}`); }
  catch(e){ res = {columns:["Fehler"], values:[[e.message]]}; }
  previewState = {name, columns: res.columns, rows: res.values, sortCol: null, sortDir: "asc", filter: ""};
  renderPreviewModal();
}

function renderPreviewModal(){
  const {name, columns, rows, sortCol, sortDir, filter} = previewState;
  let filtered = rows;
  if (filter){
    const f = filter.toLowerCase();
    filtered = rows.filter(r => r.some(v => String(v).toLowerCase().includes(f)));
  }
  let sorted = filtered;
  if (sortCol !== null){
    sorted = [...filtered].sort((a,b)=>{
      const av=a[sortCol], bv=b[sortCol];
      if (av===bv) return 0;
      if (av===null) return 1;
      if (bv===null) return -1;
      return (av>bv?1:-1) * (sortDir==="asc"?1:-1);
    });
  }
  const modal = document.getElementById("modal-root");
  modal.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closePreview()">
      <div class="modal-box wide">
        <div class="modal-header">
          <h3 style="margin:0;">${name} <span class="text-faint" style="font-size:12px;font-weight:400;">— ${filtered.length} Zeile${filtered.length===1?'':'n'}${filter? ' (gefiltert von '+rows.length+')':''}</span></h3>
          <input class="search-box" id="preview-search" placeholder="🔍 Suchen…" value="${filter.replace(/"/g,'&quot;')}" oninput="previewState.filter=this.value; renderPreviewModal()">
        </div>
        <div class="rp-body" style="max-height:60vh;overflow:auto;">
          <table class="result-table">
            <thead><tr>${columns.map((c,i)=>`<th style="cursor:pointer;user-select:none;" onclick="sortPreview(${i})">${c} ${sortCol===i? (sortDir==="asc"?'▲':'▼'):''}</th>`).join("")}</tr></thead>
            <tbody>${sorted.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<i style="color:#555">NULL</i>':String(v)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${columns.length}" class="text-faint">Keine Treffer.</td></tr>`}</tbody>
          </table>
        </div>
        <div style="text-align:right;margin-top:12px;">
          <button class="secondary" onclick="closePreview()">Schließen</button>
        </div>
      </div>
    </div>`;
  const inp = document.getElementById("preview-search");
  if (inp){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }
}
function sortPreview(colIdx){
  if (previewState.sortCol === colIdx) previewState.sortDir = previewState.sortDir==="asc" ? "desc" : "asc";
  else { previewState.sortCol = colIdx; previewState.sortDir = "asc"; }
  renderPreviewModal();
}
function closePreview(){ document.getElementById("modal-root").innerHTML = ""; previewState = null; }

function execAndShowClaimResults(){
  const userSql = cm.getValue();
  const resultsPanel = document.getElementById("claim-results-panel").querySelector(".rp-body");
  let actual, error;
  try{
    actual = execSqlSafe(mysqlCompat(userSql));
  }catch(e){
    error = e;
    resultsPanel.innerHTML = `<div class="error-note">${e.message}</div>`;
    return {error};
  }
  resultsPanel.innerHTML = actual.values.length
    ? renderTableHtml(actual) + (shouldShowChart(userSql) ? renderMiniChart(actual) : "")
    : `<div class="empty-note">Deine Abfrage lief fehlerfrei, liefert aber 0 Zeilen.</div>`;
  return {actual};
}

  // Nur ausführen und Ergebnis zeigen — keine Bewertung. Zum freien Explorieren des Schemas.

  document.getElementById("claim-feedback-zone").innerHTML = "";

function submitClaimAnswer(){
  const c = currentClaim();
  const {actual, error} = execAndShowClaimResults();
  const feedbackZone = document.getElementById("claim-feedback-zone");
  if (error){
    feedbackZone.innerHTML = `
      <div class="feedback bad">

          <button class="ghost" onclick="revealClaimAnswer()">Lösung anzeigen</button>
        </div>
      </div>`;
    return;
  }

  let refResult = null;
  try{ refResult = execSqlSafe(mysqlCompat(c.sql)); }catch(e){ refResult = null; }
  const verdict = compareResults(refResult, actual);
  if (verdict.ok){
    claimSession.solved++;
    feedbackZone.innerHTML = renderClaimResolution(c, false);

/* ---------- Gezieltes Üben mit Knoten-Kette (Pilot: Joins) ---------- */
let masteryStore = {}; // {topicId: {subId: {asked, correct}}} — bleibt für die laufende Sitzung erhalten
let chainSession = null; // {topicId, difficulty, activeSub, nodes:{[subId]:{instance, draft, wrongOnCurrent}}}

function masteryLabel(stats){
  if (!stats || stats.asked===0) return {text:"Noch nicht geübt", cls:""};
  const pct = stats.correct/stats.asked;
  if (stats.asked>=2 && pct>=0.8) return {text:`✅ Sitzt gut (${stats.correct}/${stats.asked} richtig)`, cls:"good"};
  if (pct>=0.6) return {text:`👍 ${stats.correct}/${stats.asked} richtig — noch eine zur Sicherheit?`, cls:""};
  return {text:`⚠️ ${stats.correct}/${stats.asked} richtig — lohnt sich, nochmal zu üben`, cls:"warn"};
}

function subskillPool(topic, subId){
  const sub = topic.subskills.find(s=>s.id===subId);
  if (!sub) return QUESTIONS.filter(q=>q.topic===topic.id);
  return QUESTIONS.filter(q=>q.topic===topic.id && sub.match(q.sql));
}

function difficultyFilteredPool(topic, subId){
  let pool = subskillPool(topic, subId);
  if (chainSession.difficulty){
    const narrowed = pool.filter(q=>q.difficulty===chainSession.difficulty);
    if (narrowed.length) pool = narrowed;
  }
  return pool;
}

function startNodePractice(topicId, startSubId){
  const topic = TOPICS.find(t=>t.id===topicId);
  chainSession = { topicId, difficulty:null, activeSub:null, nodes:{} };
  topic.subskills.forEach(s=>{ chainSession.nodes[s.id] = {instance:null, draft:null, wrongOnCurrent:0}; });
  if (!masteryStore[topicId]) masteryStore[topicId] = {};
  topic.subskills.forEach(s=>{ if (!masteryStore[topicId][s.id]) masteryStore[topicId][s.id] = {asked:0, correct:0}; });
  session = {
    freeplay:false, roundRobin:false, topics:[topicId], targetCount:null,
    answered:0, correct:0, streak:0, bestStreak:0,
    topicStats:{[topicId]:{asked:0, correct:0}}, current:null, wrongOnCurrent:0, hintTier:0,
    fixedQueue:[], queueIndex:0,
    subMode:true, subSkillId:null, subPool:null, chainMode:true,
  };
  const initialSub = (startSubId && topic.subskills.some(s=>s.id===startSubId)) ? startSubId : topic.subskills[0].id;
  switchToNode(initialSub);
  showScreen("question");
}

function openBrainView(){

  }

  renderSetup();

function jumpToSubNode(topicId, subId){
  startNodePractice(topicId, subId);
}

const BRAIN_SEED = [
  {a:0.20, r:80}, {a:0.55, r:130}, {a:1.10, r:95}, {a:1.50, r:150}, {a:1.90, r:70},
  {a:2.30, r:120}, {a:2.70, r:160}, {a:3.10, r:90}, {a:3.60, r:135}, {a:4.00, r:105},
  {a:4.50, r:75}, {a:4.90, r:145}, {a:5.40, r:115}, {a:5.90, r:85},
];

function buildBrainViewHtml(){
  const cx = 450, cy = 340;
  const scale = 3.8;
  const topicCounts = TOPICS.map(t=>QUESTIONS.filter(q=>q.topic===t.id).length);
  const maxCount = Math.max(...topicCounts);
  const minCount = Math.min(...topicCounts);
  const topicSpread = (maxCount-minCount) || 1;

  // Pro-Subskill-Poolgrößen VORAB global sammeln, damit die Punktgröße wirklich das
  // Frage-Volumen jedes einzelnen Subskills widerspiegelt (nicht nur eine feste Größe) —
  // global normalisiert, damit "viel" und "wenig" über alle Themen hinweg vergleichbar bleibt.
  const subCountsFlat = [];
  TOPICS.forEach(t=>(t.subskills||[]).forEach(s=>{
    subCountsFlat.push(QUESTIONS.filter(q=>q.topic===t.id && s.match(q.sql)).length);
  }));
  const subMax = Math.max(...subCountsFlat, 1);
  const subMin = Math.min(...subCountsFlat, 0);
  const subSpread = (subMax-subMin) || 1;

  let nodesHtml = "";
  TOPICS.forEach((t, i)=>{
    const seed = BRAIN_SEED[i % BRAIN_SEED.length];
    const R = seed.r * scale;
    const nx = cx + R*Math.cos(seed.a);
    const ny = cy + R*Math.sin(seed.a);
    const count = topicCounts[i];
    // Deutlich spürbarer Größenunterschied zwischen kleinen und großen Themen (Min-Max-Spreizung
    // statt nur relativ zum größten Thema) — "Spiel und Finesse" statt gleichförmiger Kreise.
    const nodeR = 17 + ((count-minCount)/topicSpread) * 33;

    nodesHtml += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#dfe3f5" stroke-width="1" opacity="0.14"/>`;

    const subs = t.subskills || [];
    const subCount = subs.length;
    // Fächerbreite pro Thema ist FEST gedeckelt (nicht proportional zur Subskill-Anzahl) —
    // sonst würde ein Thema mit 5 Unterthemen (Advanced Mix) so weit auffächern, dass es in
    // die Nachbar-Themen hineinragt. Bei vielen Subskills stehen sie enger, bei wenigen weiter.
    const fanWidth = 1.4;
    const fanStep = subCount>1 ? fanWidth/(subCount-1) : 0;
    subs.forEach((s, j)=>{
      const subAngle = seed.a + (j - (subCount-1)/2) * fanStep;
      const subQCount = QUESTIONS.filter(q=>q.topic===t.id && s.match(q.sql)).length;
      const subDotR = 6 + ((subQCount-subMin)/subSpread) * 8; // ~6..14
      const subR = nodeR + 46 + (j%3)*38;
      const sx = nx + subR*Math.cos(subAngle);
      const sy = ny + subR*Math.sin(subAngle);
      const ms = (masteryStore[t.id] && masteryStore[t.id][s.id]) || {asked:0, correct:0};
      const done = ms.correct > 0;
      const cosA = Math.cos(subAngle), sinA = Math.sin(subAngle);
      // Label radiates outward along the SAME angle as the dot (not a fixed left/right offset) —
      // this keeps labels of near-vertical dots from swinging sideways into a neighboring dot's space.
      const labelDist = subR + 15;
      const lx = nx + labelDist*cosA;
      const ly = ny + labelDist*sinA;
      const anchor = cosA > 0.28 ? "start" : cosA < -0.28 ? "end" : "middle";
      // Ganze Gruppe (Linie+unsichtbare große Trefferfläche+Punkt+Label) ist EIN Klick-/Hover-Ziel —
      // dadurch reicht es, irgendwo in der Nähe des Labels zu klicken, nicht nur exakt auf den winzigen Punkt.
      nodesHtml += `<g class="brain-subgroup" onclick="jumpToSubNode('${t.id}','${s.id}')">
        <line x1="${nx.toFixed(1)}" y1="${ny.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}" stroke="#dfe3f5" stroke-width="1" opacity="0.22"/>
        <circle class="brain-subdot-hit" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${(subDotR+9).toFixed(1)}" fill="transparent"/>
        <circle class="brain-subdot" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${subDotR.toFixed(1)}" fill="${done?t.color:'#161a26'}" stroke="${t.color}" stroke-width="1.6" opacity="${done?0.95:0.65}" style="filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));"><title>${escapeHtml(t.title)} — ${escapeHtml(s.label)}: ${escapeHtml(s.desc)}${done?' (schon geübt)':' (noch offen)'}</title></circle>
        <text class="brain-sublabel" x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" font-weight="${done?700:500}" fill="${done?t.color:'#a6abb8'}" style="paint-order:stroke;stroke:#0b0e16;stroke-width:3px;stroke-linejoin:round;">${escapeHtml(s.label)}</text>
      </g>`;
    });

    nodesHtml += `<g class="brain-hubgroup" onclick="selectTopic('${t.id}')">
      <circle class="brain-hub" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="${nodeR.toFixed(1)}" fill="#12141f" stroke="${t.color}" stroke-width="2.5" style="filter:drop-shadow(0 0 16px ${t.color}77) drop-shadow(0 10px 22px rgba(0,0,0,.6));"><title>${escapeHtml(t.title)}</title></circle>
      <text x="${nx.toFixed(1)}" y="${(ny+nodeR*0.35).toFixed(1)}" text-anchor="middle" font-size="${(nodeR*0.85).toFixed(1)}" style="pointer-events:none;">${t.icon}</text>
      <text class="brain-hub-title" x="${nx.toFixed(1)}" y="${(ny+nodeR+16).toFixed(1)}" text-anchor="middle" fill="#c7cad4" font-size="11" font-weight="700" style="pointer-events:none;paint-order:stroke;stroke:#0b0e16;stroke-width:3px;">${escapeHtml(t.title.split(' · ')[0].split(' (')[0])}</text>
    </g>`;
  });

  return `
    <div class="brain-card">
      <svg viewBox="-350 -340 1560 1450" class="brain-svg" preserveAspectRatio="xMidYMid meet">
        <circle cx="${cx}" cy="${cy}" r="14" fill="#161a26" stroke="#3a3f52" stroke-width="1.2" style="filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));"/>
        ${nodesHtml}
      </svg>
    </div>
  `;
}

function switchToNode(subId){
  const topic = TOPICS.find(t=>t.id===chainSession.topicId);
  // Aktuellen Stand (Frage + Entwurf) im bisherigen Knoten sichern, bevor gewechselt wird
  if (chainSession.activeSub){
    const prevNode = chainSession.nodes[chainSession.activeSub];
    prevNode.instance = session.current;
    prevNode.draft = cm ? cm.getValue() : prevNode.draft;
    prevNode.wrongOnCurrent = session.wrongOnCurrent;
  }
  chainSession.activeSub = subId;
  session.subSkillId = subId;
  const node = chainSession.nodes[subId];
  if (node.instance){
    session.current = node.instance;
  } else {
    const pool = difficultyFilteredPool(topic, subId);
    session.current = buildInstance(pool[Math.floor(Math.random()*pool.length)]);
    node.instance = session.current;
  }
  session.wrongOnCurrent = node.wrongOnCurrent || 0;
  session.hintTier = 0;
  renderQuestion();
  if (node.draft) setTimeout(()=>{ if (cm) cm.setValue(node.draft); }, 0);
}

function drawNewNodeQuestion(){
  const topic = TOPICS.find(t=>t.id===chainSession.topicId);
  const subId = chainSession.activeSub;
  const node = chainSession.nodes[subId];
  const pool = difficultyFilteredPool(topic, subId);
  const avoidId = session.current ? session.current.qdef.id : null;
  const candidates = pool.filter(q=>q.id!==avoidId);
  const usePool = candidates.length ? candidates : pool;
  session.current = buildInstance(usePool[Math.floor(Math.random()*usePool.length)]);
  session.wrongOnCurrent = 0;
  session.hintTier = 0;
  node.instance = session.current;
  node.draft = null;
  node.wrongOnCurrent = 0;
  renderQuestion();
}

function setChainDifficulty(level){
  chainSession.difficulty = chainSession.difficulty===level ? null : level;
  drawNewNodeQuestion();
}

function renderChainBar(){
  const topic = TOPICS.find(t=>t.id===chainSession.topicId);
  if (topic.subskills.length<2) return ""; // nur 1 Pseudo-Knoten: nichts zum Wechseln, Leiste macht keinen Sinn
  const chips = topic.subskills.map(s=>{
    const ms = masteryStore[topic.id][s.id];
    const done = ms && ms.correct>0;
    const active = chainSession.activeSub===s.id;
    return `<div class="chain-node ${done?'done':''} ${active?'active':''}" style="--tc:${topic.color}" onclick="switchToNode('${s.id}')" title="${s.desc}">
      <span class="cn-icon">${done?'✅':s.icon}</span><span class="cn-label">${s.label}</span>
    </div>`;
  }).join("");
  return `<div class="chain-bar">${chips}</div>`;
}

function renderDifficultyPicker(){
  const levels = [{n:1,icon:"🌶️",label:"mild"},{n:2,icon:"🌶️🌶️",label:"scharf"},{n:3,icon:"🌶️🌶️🌶️",label:"sehr scharf"}];
  return `<div class="chili-row">
    <span class="text-faint" style="font-size:11.5px;">Schwierigkeit:</span>
    ${levels.map(l=>`<button class="chili-btn small ${chainSession.difficulty===l.n?'active':''}" onclick="setChainDifficulty(${l.n})">${l.icon} ${l.label}</button>`).join("")}
  </div>`;
}

function trackSubskillResult(ok){
  if (!session.subMode || !session.subSkillId) return;
  const ms = masteryStore[session.topics[0]][session.subSkillId];
  ms.asked++;
  if (ok) ms.correct++;
}

function renderSubMasteryLine(){
  const topic = TOPICS.find(t=>t.id===session.topics[0]);
  const sub = topic.subskills.find(s=>s.id===session.subSkillId);
  const m = masteryLabel(masteryStore[topic.id][sub.id]);
  return `<div class="submastery ${m.cls}">${sub.icon} ${sub.label}: ${m.text}</div>`;
}

/* ---------- Question session ---------- */
function startSession(topics, count, freeplay, roundRobin, level){
  // Guarantee at least one question per selected topic first (shuffled order),
  // then fill the rest adaptively based on where mistakes happen.
  const shuffled = [...topics].sort(()=>Math.random()-0.5);
  const fixedQueue = count===null ? [] : shuffled.slice(0, Math.min(count, shuffled.length));

  session = {
    freeplay: !!freeplay, roundRobin: !!roundRobin, topics, targetCount: count, level: level || "surprise",
    answered:0, correct:0, streak:0, bestStreak:0,
    topicStats:{}, current:null, wrongOnCurrent:0, hintTier:0,
    fixedQueue, queueIndex:0,
  };
  topics.forEach(t=> session.topicStats[t] = {asked:0, correct:0});
  nextQuestion();
  showScreen("question");
  updateHud();
}

function pickTemplate(topics, avoidId){
  let base = QUESTIONS.filter(q=>topics.includes(q.topic));
  if (session && session.subPool) base = base.filter(q=>session.subPool.includes(q.id));
  if (session && session.level && session.level!=="surprise"){
    const wantDiff = levelDiff(session.level);
    const narrowed = base.filter(q=>q.difficulty===wantDiff);
    if (narrowed.length) base = narrowed;
  }
  const pool = base.filter(q=>q.id!==avoidId);
  const usePool = pool.length ? pool : base;
  const weights = usePool.map(q=>{
    const stats = session.topicStats[q.topic] || {asked:0, correct:0};
    const wrongCount = Math.max(0, stats.asked - stats.correct);
    return 1 + wrongCount*1.5;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0;i<usePool.length;i++){ r -= weights[i]; if (r<=0) return usePool[i]; }
  return usePool[usePool.length-1];
}

function nextQuestion(){
  if (session.chainMode){
    return drawNewNodeQuestion();
  }
  if (session.targetCount!==null && session.answered >= session.targetCount){
    return endSession();
  }
  const avoidId = session.current ? session.current.qdef.id : null;
  let template;
  if (session.queueIndex < session.fixedQueue.length){
    const forcedTopic = session.fixedQueue[session.queueIndex];
    template = pickTemplate([forcedTopic], avoidId);
    session.queueIndex++;
  } else {
    template = pickTemplate(session.topics, avoidId);
  }
  session.current = buildInstance(template);
  session.wrongOnCurrent = 0;
  session.hintTier = 0;
  renderQuestion();
}

function updateHud(){
  const hud = document.getElementById("hud");
  if (!session){ hud.innerHTML=""; return; }
  hud.innerHTML = `
    ${session.freeplay? `<span class="chip" style="color:#9a9cec;border-color:#7477d855;">🎲 Freeplay</span>`:""}
    ${session.roundRobin? `<span class="chip" style="color:#34d399;border-color:#10b98155;">🔁 Themen-Rundgang</span>`:""}
    ${(session.freeplay||session.roundRobin) && session.level ? `<span class="chip" style="color:#ffd166;border-color:#eab30855;">${LEVELS.find(l=>l.id===session.level).icon} ${LEVELS.find(l=>l.id===session.level).label}</span>`:""}
    ${session.chainMode ? "" : `<span class="chip">✅ ${session.correct}/${session.answered}${session.targetCount?'/'+session.targetCount:''}</span>`}
    ${session.subMode
      ? `<button class="ghost small" onclick="backToOverview()">← Übersicht</button>`
      : `<span class="chip streak">🔥 Streak ${session.streak}</span><button class="ghost small" onclick="if(confirm('Runde wirklich beenden?')) endSession()">Runde beenden</button>`}
  `;
}

function renderQuestion(){
  updateHud();
  const inst = session.current;
  inst._shownAt = Date.now(); // Start der Zeitmessung fürs Dashboard
  const topic = TOPICS.find(t=>t.id===inst.qdef.topic);
  const pct = session.targetCount ? Math.min(100, Math.round(100*session.answered/session.targetCount)) : Math.min(100, session.answered*4);

  const activeSub = (session.subMode && session.subSkillId) ? topic.subskills.find(s=>s.id===session.subSkillId) : null;
  const badgeHtml = session.freeplay
    ? `<span class="topic-badge" style="--tc:#7477d8">❓ Freeplay — worum geht's wohl?</span>`
    : activeSub
      ? `<span class="topic-badge" style="--tc:${topic.color}">${activeSub.icon} ${activeSub.label}</span>`
      : `<span class="topic-badge" style="--tc:${topic.color}">${topic.icon} ${topic.title}</span>`;

  const el = document.getElementById("screen-question");
  el.innerHTML = `
    ${session.chainMode ? renderChainBar() : ""}
    <div class="q-header">
      ${badgeHtml}
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="text-faint" style="font-size:12px;">${session.roundRobin ? `noch ${session.targetCount-session.answered} Frage${session.targetCount-session.answered===1?'':'n'}` : `${session.answered+1}${session.targetCount?'/'+session.targetCount:''}`}</span>
    </div>
    <div class="q-card"><p>${inst.promptText}</p></div>
    <div class="editor-wrap">
      <div class="editor-toolbar">
        <span>MySQL-Editor</span>
        <span><span class="kbd">Cmd</span> / <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> zum Ausführen</span>
      </div>
      <div id="editor-container"></div>
    </div>
    <div class="run-row">
      <button class="secondary" onclick="runQuery()">▶ Ausführen</button>
      <button onclick="submitAnswer()">✓ Antwort abgeben</button>
      ${session.chainMode ? `<button class="ghost small" onclick="drawNewNodeQuestion()">🔄 Andere Frage</button>` : ""}
    </div>
    ${session.chainMode ? renderDifficultyPicker() : ""}
    <div class="hint-row">
      <button class="secondary small" id="hint-btn" onclick="showHint()">💡 Tipp (0/3)</button>
      <button class="ghost small" onclick="if(confirm('Aufgeben und Lösung zeigen?')) giveUp()">🏳 Aufgeben</button>
    </div>
    <div id="hint-zone"></div>
    <div class="results-panel" id="results-panel">
      <div class="rp-head">Ergebnis</div>
      <div class="rp-body"><div class="empty-note">Noch keine Abfrage ausgeführt.</div></div>
    </div>
    <div id="feedback-zone"></div>
  `;

  if (cm) cm.toTextArea && cm.toTextArea();
  cm = CodeMirror(document.getElementById("editor-container"), {
    value: "-- Schreib deine Abfrage hier...\n",
    mode: "text/x-mysql",
    theme: "dracula",
    lineNumbers: true,
    matchBrackets: true,
    indentUnit: 4,
    extraKeys: {
      "Cmd-Enter": runQuery,
      "Ctrl-Enter": runQuery,
    }
  });
  setTimeout(()=>cm.focus(), 50);
  document.getElementById("hint-zone").innerHTML = "";
  renderSyntaxPanel(session.freeplay ? null : topic);
}

function renderSyntaxPanel(topic){
  const panel = document.getElementById("syntax-panel");
  const resizerRight = document.getElementById("resizer-right");
  const body = document.getElementById("syntax-panel-body");
  if (!topic){
    panel.classList.add("hidden");
    resizerRight.classList.add("hidden");
    body.innerHTML = "";
    return;
  }
  panel.classList.remove("hidden");
  resizerRight.classList.remove("hidden");
  body.innerHTML = `
    <div class="topic-badge" style="--tc:${topic.color};margin-bottom:5px;">${topic.icon} ${topic.title}</div>
    <div class="text-faint" style="font-size:11px;margin-bottom:14px;">zum Nachschlagen, während du übst</div>
    <div class="topic-syntax">${topic.syntax.replace(/</g,"&lt;")}</div>
    ${topic.diagram==="joins" ? renderJoinDiagram() : ""}
    ${(()=>{ let n=0; return topic.lesson.map(step=>lessonStepHtml(step, topic.color, step.kind==="detail"?null:++n)).join(""); })()}
  `;
}

/* ---------- Tiered hints ---------- */
const SQL_KEYWORDS = new Set(["SELECT","FROM","WHERE","GROUP","BY","HAVING","ORDER","LIMIT","JOIN","LEFT","RIGHT",
  "INNER","ON","USING","AS","AND","OR","NOT","IN","LIKE","BETWEEN","IS","NULL","DISTINCT","CASE","WHEN","THEN",
  "ELSE","END","COUNT","SUM","AVG","MIN","MAX","ROUND","CONCAT","LENGTH","CHAR_LENGTH","UPPER","LOWER",
  "SUBSTRING","LEFTSTR","RIGHTSTR","DATEDIFF","TIMESTAMPDIFF","DATE_FORMAT","CURDATE","CURRENT_DATE","DESC","ASC"]);

function sqlToSkeleton(sql){
  let out = sql.replace(/'[^']*'/g, "'___'");
  out = out.replace(/\b\d+(\.\d+)?\b/g, "___");
  out = out.replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g, (word)=>{
    return SQL_KEYWORDS.has(word.toUpperCase()) ? word.toUpperCase() : "___";
  });
  return out;
}

function planFromSql(sql){
  const parts = [];
  if (/\(SELECT/i.test(sql)) parts.push("eine Subquery in Klammern");
  if (/\bJOIN\b/i.test(sql)) parts.push("ein JOIN zwischen Tabellen");
  if (/CASE\s+WHEN/i.test(sql)) parts.push("CASE WHEN für eine neue Kategorien-Spalte");
  if (/GROUP BY/i.test(sql)) parts.push("GROUP BY");
  if (/HAVING/i.test(sql)) parts.push("HAVING (nach dem GROUP BY)");
  if (/\bWHERE\b/i.test(sql)) parts.push("WHERE zum Filtern einzelner Zeilen");
  if (/\bDISTINCT\b/i.test(sql)) parts.push("DISTINCT");
  if (/(COUNT|SUM|AVG|MIN|MAX)\s*\(/i.test(sql)) parts.push("eine Aggregatfunktion (COUNT/SUM/AVG/MIN/MAX)");
  if (/\bLIKE\b/i.test(sql)) parts.push("LIKE mit einem Platzhalter (% oder _)");
  if (/\bIN\s*\(/i.test(sql)) parts.push("IN mit einer Werteliste");
  if (/BETWEEN/i.test(sql)) parts.push("BETWEEN für einen Bereich");
  if (/DATEDIFF|TIMESTAMPDIFF|DATE_FORMAT/i.test(sql)) parts.push("eine Datumsfunktion");
  if (/CONCAT|LENGTH|LEFTSTR|RIGHTSTR|SUBSTRING|UPPER/i.test(sql)) parts.push("eine Textfunktion");
  if (/ORDER BY/i.test(sql)) parts.push("ORDER BY zum Sortieren");
  if (/LIMIT/i.test(sql)) parts.push("LIMIT zum Abschneiden");
  return parts;
}

function explainQuery(sql){
  const plan = planFromSql(sql);
  return plan.length ? "Diese Lösung nutzt: " + plan.join(", ") + "." : "Diese Lösung ist eine einfache SELECT/WHERE-Abfrage ohne weitere Extras.";
}

function currentHintTopic(){ return TOPICS.find(t=>t.id===session.current.qdef.topic); }

function showHint(){
  session.hintTier = Math.min(3, (session.hintTier||0) + 1);
  renderHints();
}

function renderHints(){
  const inst = session.current;
  const tier = session.hintTier||0;
  const topic = currentHintTopic();
  let html = "";
  if (tier>=1){
    const label = session.freeplay
      ? `Das gehört zum Thema <b>${topic.icon} ${topic.title}</b>.`
      : `Erinnerung: ${topic.concept}`;
    html += `<div class="hint-box"><div class="hb-tier">Tipp 1 · Kategorie</div>${label}</div>`;
  }
  if (tier>=2){
    const plan = planFromSql(inst.sql);
    const label = plan.length ? "Du brauchst ungefähr: " + plan.join(", ") + "." : "Hier reicht ein einfaches SELECT mit WHERE — kein besonderes Extra-Werkzeug nötig.";
    html += `<div class="hint-box"><div class="hb-tier">Tipp 2 · Bauplan</div>${label}</div>`;
  }
  if (tier>=3){
    html += `<div class="hint-box"><div class="hb-tier">Tipp 3 · Skelett</div>Fülle die Lücken selbst aus:<code>${sqlToSkeleton(inst.sql).replace(/</g,"&lt;")}</code></div>`;
  }
  document.getElementById("hint-zone").innerHTML = html;
  const btn = document.getElementById("hint-btn");
  if (btn){
    btn.textContent = tier>=3 ? "💡 Tipp (alle genutzt)" : `💡 Tipp (${tier}/3)`;
    btn.disabled = tier>=3;
  }
}

function giveUp(){
  const inst = session.current;
  const stats = session.topicStats[inst.qdef.topic];
  session.answered++; stats.asked++; session.streak = 0;
  trackSubskillResult(false);
  logPracticeEvent(false, true);
  const topic = currentHintTopic();
  document.getElementById("feedback-zone").innerHTML = `
    <div class="feedback bad">
      <h3>🏳 Hier ist die Lösung</h3>
      <div class="body">${explainQuery(inst.sql)}</div>
      <div class="solution-box">${inst.sql.replace(/</g,"&lt;")}</div>
      ${session.freeplay ? `<div class="body" style="margin-top:10px;">💡 Thema war: <b>${topic.icon} ${topic.title}</b> — ${topic.concept}</div>` : ""}
      ${(session.subMode && session.subSkillId) ? renderSubMasteryLine() : ""}
      <div class="actions">
        <button onclick="nextQuestion()">Verstanden, nächste Frage →</button>
        ${session.subMode ? `<button class="secondary" onclick="backToOverview()">← Zur Übersicht</button>` : ""}
      </div>
    </div>`;
  document.getElementById("hint-zone").innerHTML = "";
  updateHud();
}

function execAndShowResults(){
  const userSql = cm.getValue();
  const resultsPanel = document.getElementById("results-panel").querySelector(".rp-body");
  let actual, error;
  try{
    actual = execSqlSafe(mysqlCompat(userSql));
  }catch(e){
    error = e;
    resultsPanel.innerHTML = `<div class="error-note">${e.message}</div>`;
    return {error};
  }
  resultsPanel.innerHTML = actual.values.length
    ? renderTableHtml(actual) + (shouldShowChart(userSql) ? renderMiniChart(actual) : "")
    : `<div class="empty-note">Deine Abfrage lief fehlerfrei, liefert aber 0 Zeilen.</div>`;
  return {actual};
}

function runQuery(){
  // Nur ausführen und Ergebnis zeigen — keine Bewertung. Zum freien Explorieren des Schemas.
  execAndShowResults();
  document.getElementById("feedback-zone").innerHTML = "";
}

function submitAnswer(){
  // Führt (erneut) aus UND bewertet als Antwort — erst hier zählt es als Versuch.
  const {actual, error} = execAndShowResults();
  const feedbackZone = document.getElementById("feedback-zone");
  if (error){
    feedbackZone.innerHTML = renderFeedbackHtml(false, explainSqlError(error.message), null);
    session.wrongOnCurrent++;
    return;
  }
  const verdict = gradeAnswer(session.current, actual);
  handleVerdict(verdict);
}

function handleVerdict(verdict){
  const inst = session.current;
  const topic = inst.qdef.topic;
  const stats = session.topicStats[topic];
  const feedbackZone = document.getElementById("feedback-zone");

  if (verdict.ok){
    if (session.wrongOnCurrent===0){ session.streak++; session.bestStreak=Math.max(session.bestStreak, session.streak); }
    else { session.streak = 0; }
    session.correct++;
    session.answered++;
    stats.asked++; stats.correct++;
    trackSubskillResult(true);
    logPracticeEvent(true, false);
    feedbackZone.innerHTML = renderFeedbackHtml(true, pickPraise(), null);
    if (session.freeplay){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">💡 Thema war: ${TOPICS.find(t=>t.id===topic).icon} ${TOPICS.find(t=>t.id===topic).title}</div>${TOPICS.find(t=>t.id===topic).concept}</div>`;
    }
    if (inst.qdef.alt){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">🔀 Es gibt noch einen anderen guten Weg</div>
        <code>${inst.qdef.alt.sql.replace(/</g,"&lt;")}</code>${inst.qdef.alt.note}</div>`;
    }
    document.getElementById("hint-zone").innerHTML = "";
    updateHud();
    launchConfetti();
  } else {
    session.wrongOnCurrent++;
    if (session.wrongOnCurrent===1) session.streak = 0;
    const explanation = explainFailure(verdict.reason, verdict, topic);
    feedbackZone.innerHTML = renderFeedbackHtml(false, explanation, TOPICS.find(t=>t.id===topic).example);
    updateHud();
  }
}

function pickPraise(){
  const arr = ["Richtig! 🎉","Nailed it! 💪","Genau so! ✨","Sauber gelöst! 🔥","Perfekt! 🚀","Stark! 🧠"];
  return arr[Math.floor(Math.random()*arr.length)];
}

function renderFeedbackHtml(ok, message, example){
  const navBtn = session.subMode ? `<button class="secondary" onclick="backToOverview()">← Zur Übersicht</button>` : "";
  if (ok){
    const subLine = (session.subMode && session.subSkillId) ? renderSubMasteryLine() : "";
    return `
      <div class="feedback ok">
        <h3>✅ ${message}</h3>
        ${subLine}
        <div class="actions">
          <button onclick="nextQuestion()">Nächste Frage →</button>
          ${navBtn}
        </div>
      </div>`;
  }
  const inst = session.current;
  return `
    <div class="feedback bad">
      <h3>🤔 Noch nicht ganz</h3>
      <div class="body">${message}</div>
      ${example ? `<div class="example-box"><b>Anderes Beispiel:</b> ${example}</div>` : ""}
      <div class="actions">
        <button class="secondary" onclick="document.getElementById('feedback-zone').innerHTML=''; cm.focus();">Nochmal versuchen</button>
        <button class="ghost" onclick="giveUp()">Lösung anzeigen</button>
        ${navBtn}
      </div>
    </div>`;
}

/* ---------- Confetti ---------- */
function launchConfetti(){
  const root = document.getElementById("confetti-root");
  const colors = ["#7477d8","#e0a458","#22c55e","#ec4899","#6fa8dc","#f59e0b"];
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  for (let i=0;i<28;i++){
    const s = document.createElement("span");
    s.style.left = Math.random()*100+"vw";
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDelay = (Math.random()*0.4)+"s";
    s.style.animationDuration = (1.8+Math.random()*1.2)+"s";
    wrap.appendChild(s);
  }
  root.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 3200);
}

/* ---------- Zurück-Navigation ---------- */
// Reiner "zurück"-Klick aus einer laufenden Themen-Übung: sofort zur Startseite, OHNE
// Zwischenstopp bei der Zusammenfassung. Die Session gilt trotzdem als beendet (kein
// "Fortsetzen"-Banner mehr) — nur eben ohne den nervigen Extra-Klick durch die Statistik.
function backToOverview(){
  lastSession = session;
  pausedSession = null;
  showScreen("setup");
  renderSetup();
}

/* ---------- Summary ---------- */
function endSession(){
  lastSession = session;
  pausedSession = null; // bewusst beendet, keine offene Übung mehr zum Fortsetzen
  const el = document.getElementById("screen-summary");

  if (session.subMode){
    const topic = TOPICS.find(t=>t.id===session.topics[0]);
    const nodeRows = session.chainMode ? topic.subskills.map(s=>{
      const m = masteryLabel(masteryStore[topic.id][s.id]);
      return `<div class="submastery ${m.cls}" style="margin-top:6px;">${s.icon} ${s.label}: ${m.text}</div>`;
    }).join("") : (()=>{
      const sub = session.subSkillId ? topic.subskills.find(s=>s.id===session.subSkillId) : null;
      const m = sub ? masteryLabel(masteryStore[topic.id][sub.id]) : null;
      return m ? `<div class="submastery ${m.cls}" style="margin-top:14px;font-size:14px;">${m.text}</div>` : "";
    })();
    el.innerHTML = `
      <div class="summary-card">
        <div class="sub" style="font-size:15px;margin-bottom:8px;">${topic.icon} ${topic.title}</div>
        ${session.chainMode ? "" : `<div class="big-score">${session.correct}/${session.answered}</div><div class="sub">richtig in dieser Übungssequenz</div>`}
        ${nodeRows}
        <div class="start-row" style="justify-content:center;margin-top:24px;">
          <button class="secondary" onclick="showScreen('setup'); renderSetup();">← Themen-Übersicht</button>
          <button class="good" onclick="showScreen('question'); renderQuestion();">Weiter üben →</button>
        </div>
      </div>`;
    showScreen("summary");
    if (session.answered>0 && session.correct===session.answered) launchConfetti();
    return;
  }

  const topicRows = Object.entries(session.topicStats).filter(([,s])=>s.asked>0).map(([id,s])=>{
    const t = TOPICS.find(x=>x.id===id);
    const pct = Math.round(100*s.correct/s.asked);
    return `<div class="tb-row">
      <div class="tb-label">${t.icon} ${t.title}</div>
      <div class="tb-track"><div class="tb-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="tb-pct">${pct}%</div>
    </div>`;
  }).join("");

  const perfect = session.answered>0 && session.correct===session.answered;

  el.innerHTML = `
    <div class="summary-card">
      ${perfect ? `<div class="crown">🎉</div><div class="sub">Alles richtig — sauber!</div>` : ""}
      <div class="big-score">${session.correct}/${session.answered}</div>
      <div class="sub">richtig beantwortet &middot; bester Streak: ${session.bestStreak} 🔥</div>
      <div class="topic-bars">${topicRows || '<div class="text-faint" style="font-size:13px;">Keine Fragen beantwortet.</div>'}</div>
      <div class="start-row" style="justify-content:center;margin-top:24px;">
        <button class="secondary" onclick="showScreen('setup'); renderSetup();">Zur Startseite</button>
        <button class="good" onclick="startSession(lastSession.topics, lastSession.targetCount, lastSession.freeplay, lastSession.roundRobin, lastSession.level)">Nochmal, gleiche Runde ↻</button>
      </div>
    </div>`;
  showScreen("summary");
  if (perfect) launchConfetti();
}

/* ================= Boot ================= */
function base64Ready(){
  initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` }).then(SQL=>{
    const bytes = base64ToUint8Array(DB_B64);
    db = new SQL.Database(bytes);
    registerUdfs(db);
    renderSchemaTree();
    renderSetup();
  }).catch(err=>{
    document.getElementById("screen-setup").innerHTML = `<div class="setup-card"><h2>Fehler beim Laden</h2><p>${err.message}</p></div>`;
  });
}
base64Ready();
