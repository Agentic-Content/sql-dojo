      einfach:"Erinnerst du dich an den Matheunterricht in der Schule? Plus, Minus, Mal, Geteilt. Und vor allem: Punkt- vor Strichrechnung.<br><br>Die gute Nachricht: SQL hält sich exakt an diese klassischen Regeln aus deiner Schulzeit. Klammern werden zuerst berechnet, Multiplikation kommt vor Addition.<br><br>**Aber hier musst du umdenken:** Beim Coding rechnest du nicht erst ganz am Ende, wenn die Daten schon da sind (wie in Excel). Du schreibst die Rechenaufgabe direkt oben in deine `SELECT`-Einkaufsliste. Die Datenbank rechnet dann heimlich im Hintergrund und liefert dir nur noch das fertige Ergebnis.",
      merksatz:["💡 Der goldene Analysten-Merksatz: Exportiere niemals rohe Daten, um sie später mühsam in Excel zu berechnen. Lass die Datenbank die schwere Rechenarbeit machen – sie ist dafür gebaut und tausendmal schneller."],
      syntax:"SELECT (spalte_1 * spalte_2) AS neues_ergebnis FROM tabelle;",
      beispiele:[{code:"SELECT title, (price * qty) AS umsatz FROM sales;", note:"(Ergebnis: Anstatt dir nur den Einzelpreis zu zeigen, multipliziert SQL den Preis direkt mit der Menge und gibt dir den fertigen Umsatzwert aus.)"}]},
     {title:"Die Geheimwaffe: Modulo (`%`)",
      text:"Neben den klassischen Rechenzeichen gibt es noch das Prozentzeichen (`%`). In SQL heißt das **Modulo**.<br><br>Modulo macht etwas völlig anderes als normales Teilen: **Es gibt dir nur den Rest einer Division zurück.**<br><br>Teilst du 10 durch 2, bleibt kein Rest (Modulo = 0).<br>Teilst du 11 durch 2, bleibt ein Rest von 1 (Modulo = 1).",
      merksatz:["💡 Warum ist das genial? (Der A/B-Test): Stell dir vor, du willst fair testen, ob ein neuer Button auf der Website besser funktioniert. Du teilst die User-ID durch 2 (`user_id % 2`). Bleibt als Rest 0, landet der User in Gruppe A. Bleibt als Rest 1, landet er in Gruppe B. Ein perfekter, fehlerfreier Split in gerade und ungerade – ganz ohne teure Software!"]},
     {title:"Mehrere Brücken bauen (Die JOIN-Kette)",
      was:"Er verknüpft nicht nur zwei, sondern drei, vier oder sogar noch mehr Tabellen zu einer einzigen großen Ansicht.",
      einfach:"Stell dir deine Tabellen wie einzelne Inseln im Ozean vor.<br><br>Du stehst auf Insel A (Buchtitel). Du willst aber Infos von Insel C (Buchhandlungen). Das Problem: Es gibt keine direkte Brücke zwischen A und C.<br><br>**Wer kommt zuerst?** Du startest immer auf deiner Heimatinsel (`FROM titles`).<br>Dann baust du die erste Brücke zur Nachbarinsel B, den Verkäufen (`JOIN sales`).<br>Erst wenn du sicher auf Insel B stehst, kannst du von dort die nächste Brücke zu Insel C, den Buchhandlungen, bauen (`JOIN stores`).",
      merksatz:["💡 Der goldene Brücken-Merksatz: Immer schön der Reihe nach! Du kannst keine Brücke zu einer Tabelle bauen, zu der du noch gar keine logische Verbindung hergestellt hast. Ein Schritt ergibt sich aus dem vorherigen."],
      syntax:"FROM insel_A\nJOIN insel_B ON insel_A.passwort = insel_B.passwort\nJOIN insel_C ON insel_B.passwort = insel_C.passwort",
      beispiele:[{code:"SELECT st.stor_name, t.title\nFROM titles t\nJOIN sales s ON t.title_id = s.title_id\nJOIN stores st ON s.stor_id = st.stor_id;"}]},
     {title:"Die Bau-Strategie (Schicht für Schicht)",
      text:"Wie schreibt man so eine riesige Abfrage, ohne durchzudrehen?<br><br>Der größte Anfängerfehler ist es, zehn Zeilen Code am Stück zu tippen, auf \"Ausführen\" zu drücken und dann von einer roten Fehlermeldung erschlagen zu werden.<br><br>**Ein guter Professor sagt: Baue wie ein Maurer, Schicht für Schicht.**<br>• **1. Das Fundament:** Tippe nur das `FROM` und den ersten `JOIN`. Teste, ob die Brücke hält.<br>• **2. Der Rohbau:** Füge jetzt die Rechnungen im `SELECT` (z.B. `price * qty`) hinzu. Kontrolliere, ob die Mathematik stimmt.<br>• **3. Das Dach:** Schreibe erst ganz am Ende dein `GROUP BY`, um die fertigen, sauberen Zahlen zusammenzufassen."},
     {kind:"detail",
      blocks:[
        {text:"Manchmal reicht normales Auf- und Abrunden nicht aus, weil die Realität im Unternehmen härter ist. Hier sind vier Spezialisten, die du als Analyst kennen musst:"},
        {text:"**📦 CEIL() – Knallhart Aufrunden**<br><strong>Wann brauche ich das?</strong> In der Logistik oder bei Serverkosten.<br><br>Wenn du ausrechnest, dass deine Waren 2,1 Kartons Platz brauchen, hilft normales Runden auf \"2\" nicht. Du brauchst zwingend 3 Kartons, weil es keine halben Kartons gibt. `CEIL()` rundet gnadenlos immer nach oben."},
        {code:"SELECT CEIL(2.1); -- Liefert eine saubere 3"},
        {text:"**⏳ FLOOR() – Knallhart Abrunden**<br><strong>Wann brauche ich das?</strong> Bei Jubiläen und Altersprüfungen (\"Vollendete Tatsachen\").<br><br>Ein Kunde ist seit 4,9 Jahren im Treueclub. Bekommt er den automatischen 5-Jahres-Bonus? Nein. Er hat das fünfte Jahr noch nicht vollendet. `FLOOR()` schneidet alles nach dem Komma eiskalt ab."},
        {code:"SELECT FLOOR(4.9); -- Liefert eine harte 4"},
        {text:"**⚖️ ABS() – Die absolute Wahrheit (Immer positiv)**<br><strong>Wann brauche ich das?</strong> Im Controlling, wenn du Fehler oder Abweichungen messen willst.<br><br>Stell dir vor, du verkaufst am Montag 1.000 Euro zu wenig (-1.000) und am Dienstag 1.000 Euro zu viel (+1.000). Rechnest du beides einfach zusammen, ist dein Fehler \"0\". Das ist eine gefährliche Lüge!<br><br>Du hast dich an beiden Tagen massiv verschätzt. `ABS()` macht jede Zahl (auch Minuszahlen) positiv. Aus -1.000 wird +1.000. So siehst du die echte, ungeschönte Abweichung."},
        {table:{headers:["Tag","Prognose","Ist-Wert","Roher Fehler","Echte Abweichung (ABS)"], rows:[["Montag","10.000 €","9.000 €","-1.000 €","1.000 €"],["Dienstag","10.000 €","11.000 €","+1.000 €","1.000 €"]], highlightCol:4}},
        {text:"**Ohne ABS (die rohen Zahlen mit Vorzeichen addieren):**<br>-1.000 + 1.000 = 0<br><br>Das sieht aus, als hättest du im Schnitt perfekt geplant. Aber das ist eine Lüge! Du warst an BEIDEN Tagen daneben – die Fehler haben sich nur zufällig gegenseitig aufgehoben, weil einer nach unten und einer nach oben ging. Ein Chef, der nur die \"0\" sieht, denkt \"super Prognose\", obwohl du an keinem einzigen Tag richtig lagst."},
        {text:"**Mit ABS (den Betrag nehmen, Vorzeichen ignorieren):**<br>`ABS()` macht aus jeder Zahl einfach \"wie weit war ich daneben\", egal in welche Richtung. `ABS(-1.000)` = 1.000. `ABS(+1.000)` = 1.000. Jetzt addierst du diese beiden \"Wie-weit-war-ich-daneben\"-Werte: 1.000 + 1.000 = **2.000**.<br><br>Eine Analogie: Du gehst 1.000 Schritte nach vorne und dann 1.000 Schritte zurück. Deine **Position** am Ende ist wieder 0 – du stehst da, wo du gestartet bist. Aber die Strecke, die du tatsächlich **gelaufen** bist, war nicht 0, sondern 2.000 Schritte! Genau das macht `ABS()`: Es misst nicht die Endposition (wo die Fehler sich gegenseitig canceln), sondern die tatsächlich zurückgelegte \"Fehlerstrecke\" – wie sehr du insgesamt danebenlagst, egal in welche Richtung. Deshalb ist die 2.000 € die ehrliche Zahl: Über die zwei Tage warst du insgesamt 2.000 € von deiner Prognose entfernt, nicht 0 €."},
        {text:"**📈 POWER() & SQRT() – Für die Forscher**<br><strong>Wann brauche ich das?</strong> Wenn du Zinseszins, exponentielles Wachstum (`POWER` = Potenzen) oder räumliche Distanzen auf Karten (`SQRT` = Quadratwurzel) berechnen willst. Sie sind seltener, aber für tiefere Analysen unverzichtbar."}
      ]}
   ]},
  {id:"self_join", icon:"🪞", color:"#f97316", title:"Self Join",
   concept:"Ein Self Join verbindet eine Tabelle mit sich selbst — technisch dieselbe JOIN-Syntax wie immer, nur dass beide Seiten aus derselben Tabelle kommen. Über zwei Aliase (z.B. a und b) behandelst du sie wie zwei getrennte Tabellen. Eine Zusatzbedingung wie a.id < b.id verhindert, dass eine Zeile sich selbst matcht und dass Paare doppelt erscheinen.",
   example:"FROM authors a JOIN authors b ON a.au_lname = b.au_lname AND a.au_id < b.au_id<br>→ findet Autor:innen-Paare mit demselben Nachnamen, jedes Paar nur einmal",
   syntax:"SELECT a.spalte, b.spalte\nFROM tabelle a\nJOIN tabelle b ON a.gemeinsamkeit = b.gemeinsamkeit AND a.id < b.id;",
   subskills:[
     {id:"all", icon:"🪞", label:"Self Join", desc:"Eine Tabelle mit sich selbst vergleichen — von einfachen bis komplexeren Fällen.",
      match:(sql)=>true},
   ],
   intro:"<div class=\"ns-intro-title\">🪞 Der Spiegel-Trick: Self Join</div><b>Wozu brauchst du das überhaupt?</b> Bisher haben wir beim Brückenbauen (<code>JOIN</code>) immer zwei völlig verschiedene Tabellen verbunden. Zum Beispiel die Buchtitel mit den Verlagen.<br><br>Ein <b>Self Join</b> klingt beim ersten Hören verrückt: Du verbindest eine Tabelle mit sich selbst.<br><br>Wann macht man so etwas? Stell dir vor, du stehst in einem Raum voller Autoren (deine <code>authors</code>-Tabelle) und fragst in die Runde: \"Gibt es hier zwei verschiedene Personen, die zufällig denselben Nachnamen haben?\" Um das herauszufinden, musst du die Personen im selben Raum miteinander vergleichen. Technisch benutzt du dafür exakt dieselbe JOIN-Syntax wie immer – mit einem kleinen genialen Trick.",
   lesson:[
     {title:"Der Klon-Trick & Die Namensschilder",
      was:"Er lässt dich dieselbe Tabelle zweimal gleichzeitig verwenden, indem du ihr zwei unterschiedliche Alias-Namen gibst.",
      einfach:"Wie kann SQL eine Tabelle mit sich selbst vergleichen, ohne durcheinanderzukommen? Die Antwort: Wir klonen die Tabelle gedanklich. Wir rufen dieselbe Tabelle zweimal auf und kleben ihr zwei Namensschilder (Aliase) auf die Stirn — der linken Seite das Schild `a`, der rechten das Schild `b`.<br><br>**Achtung bei der Einkaufsliste (`SELECT`)!** Da es die Tabelle jetzt zweimal gibt, gibt es auch den Vornamen (`au_fname`) zweimal. Fragst du einfach nach \"Vornamen\", gibt SQL eine Fehlermeldung — die Datenbank weiß nicht, aus welchem Klon sie den Wert holen soll. Du musst das Namensschildchen also zwingend mitschreiben!",
      syntax:"SELECT a.au_fname, a.au_lname, b.au_fname, b.au_lname\nFROM authors a\nJOIN authors b ...",
      beispiele:[]},
     {title:"Die Brücke: Auf Inhalte prüfen",
      was:"Sie legt fest, worüber die beiden Tabellen-Klone verbunden werden — bei einem Self Join meist eine inhaltliche Gemeinsamkeit statt einer ID.",
      einfach:"Bei einem normalen `JOIN` bauen wir die Brücke meistens über Ausweisnummern (IDs). Bei einem Self Join suchen wir aber fast immer nach einer **inhaltlichen Gemeinsamkeit**. Wir sagen SQL: \"Verbinde jede Person von Klon A mit der Person von Klon B, bei der der Nachname identisch ist.\"",
      syntax:"... ON a.au_lname = b.au_lname;",
      beispiele:[]},
     {title:"Die Katastrophe: Was passiert, wenn wir jetzt ausführen?",
      was:"Ohne zusätzliche Bedingung matcht jede Zeile sich selbst, und jedes echte Paar taucht doppelt auf — genau das zeigt diese Abfrage live.",
      einfach:"Lass uns genau diesen Befehl einmal abschicken. Das Ergebnis ist eine halbe Katastrophe: für den Nachnamen \"Ringer\" spuckt SQL uns plötzlich **vier** Zeilen aus. Ohne zusätzliche Filterung matcht jede Person logischerweise mit sich selbst (Ringer = Ringer), und jedes echte Paar (Anne & Albert) wird zweimal begrüßt – einmal von links nach rechts, einmal von rechts nach links.",
      syntax:"SELECT a.au_fname, a.au_lname, b.au_fname, b.au_lname\nFROM authors a\nJOIN authors b ON a.au_lname = b.au_lname;",
      beispiele:[{table:{headers:["Vorname (A)","Nachname (A)","Vorname (B)","Nachname (B)","Was ist hier passiert?"], rows:[
        ["Albert","Ringer","Albert","Ringer","<span class=\"wt-bad\">Fehler 1: Albert findet sich selbst. (Spiegelbild)</span>"],
        ["Albert","Ringer","Anne","Ringer","<span class=\"wt-good\">Das gesuchte Paar!</span> (Erster Händedruck)"],
        ["Anne","Ringer","Albert","Ringer","<span class=\"wt-bad\">Fehler 2: Dasselbe Paar noch mal. (Doppelter Händedruck)</span>"],
        ["Anne","Ringer","Anne","Ringer","<span class=\"wt-bad\">Fehler 1: Anne findet sich selbst. (Spiegelbild)</span>"]
      ]}, note:"(Echtes Ergebnis von ON a.au_lname = b.au_lname, noch ohne ID-Bedingung — insgesamt 25 Zeilen, hier nur die 4 betroffenen Zeilen für 'Ringer'.)"}]},
     {title:"Die geniale Lösung: Das Spiegelbild ausschließen",
      was:"Sie filtert zusätzlich über die IDs, sodass Selbstmatches und doppelte Paare aus dem Ergebnis verschwinden.",
      einfach:"Wir brauchen noch eine kleine Bedingung, um das Chaos aufzuräumen. Wir zwingen SQL, zusätzlich die IDs der Personen zu vergleichen: Die ID von Klon A muss strikt kleiner sein als die von Klon B (`a.au_id < b.au_id`).",
      merksatz:["💡 Warum das Kleiner-Als-Zeichen (<) pure Magie ist: Stell dir vor, Anne hat die ID **10** und Albert die ID **20**.<br>1. Anne vergleicht sich mit sich selbst: Ist 10 < 10? **Nein.** (Das nutzlose Spiegelbild fliegt raus!)<br>2. Anne vergleicht sich mit Albert: Ist 10 < 20? **Ja!** (Das echte Paar wird angezeigt.)<br>3. Albert vergleicht sich mit Anne: Ist 20 < 10? **Nein.** (Der doppelte Händedruck fliegt raus!)"],
      syntax:"SELECT a.au_fname, a.au_lname, b.au_fname, b.au_lname\nFROM authors a\nJOIN authors b ON a.au_lname = b.au_lname AND a.au_id < b.au_id;",
      beispiele:[{table:{headers:["Vorname (Person A)","Nachname (Person A)","Vorname (Person B)","Nachname (Person B)"], rows:[["Anne","Ringer","Albert","Ringer"]]}, note:"(Von den 25 Zeilen eben bleibt jetzt genau 1 einzige übrig — das gesuchte Paar, kein Selbstmatch, kein Duplikat mehr.)"}]}
   ]},
  {id:"union", icon:"🔀", color:"#84cc16", title:"UNION",
   concept:"UNION stapelt die Ergebnisse von zwei SELECT-Abfragen untereinander (mehr Zeilen), statt sie wie JOIN nebeneinanderzulegen (mehr Spalten). Beide SELECTs brauchen dieselbe Anzahl Spalten. UNION entfernt Duplikate automatisch, UNION ALL behält jede Zeile.",
   example:"SELECT pub_id FROM titles UNION ALL SELECT pub_id FROM employee<br>→ 61 Zeilen (mit Duplikaten)<br><br>SELECT pub_id FROM titles UNION SELECT pub_id FROM employee<br>→ 8 Zeilen (jeder Verlag nur einmal)",
   syntax:"SELECT spalte FROM tabelleA\nUNION [ALL]\nSELECT spalte FROM tabelleB\n[ORDER BY spalte];",
   subskills:[
     {id:"dedup", icon:"🧹", label:"UNION (ohne Duplikate)", desc:"Kombiniert und entfernt Duplikate.",
      match:(sql)=>/\bUNION\b/i.test(sql) && !/\bUNION\s+ALL\b/i.test(sql)},
     {id:"all", icon:"📚", label:"UNION ALL", desc:"Kombiniert und behält jede Zeile.",
      match:(sql)=>/\bUNION\s+ALL\b/i.test(sql)},
   ],
   intro:"<b>Wozu brauchst du das überhaupt?</b> Ein JOIN verbindet zwei Tabellen NEBENEINANDER (mehr Spalten pro Zeile). UNION dagegen stapelt die Ergebnisse von zwei SELECT-Abfragen UNTEREINANDER (mehr Zeilen, gleiche Spalten) — als wären es von Anfang an eine einzige Abfrage gewesen. Typischer Einsatz: du willst zwei Listen aus unterschiedlichen Tabellen zu EINER gemeinsamen Liste zusammenfassen, z.B. 'alle Verlage, die entweder ein Buch ODER Mitarbeitende haben' in einer einzigen Spalte.",
   worked:{
     note:"pub_id aus 'titles' UND aus 'employee' — mit UNION zu einer Liste zusammengefasst, ohne Duplikate:",
     headers:["Abfrage","Anzahl Zeilen im Ergebnis"],
     rows:[["... UNION ALL ...","61 (alle Zeilen, mit Duplikaten)"],["... UNION ...","8 (jeder Verlag nur einmal)"]],
     highlightCol:1
   },
   lesson:[
     {t:"UNION stapelt zwei Abfragen untereinander", merk:"UNION braucht in beiden SELECTs die GLEICHE Anzahl Spalten, in der gleichen Bedeutung.", b:"Bei UNION schreibst du zwei komplette SELECT-Abfragen und verbindest sie mit dem Schlüsselwort UNION dazwischen. Wichtig: beide SELECTs müssen die gleiche ANZAHL Spalten liefern (die Spaltennamen dürfen unterschiedlich sein, das Ergebnis übernimmt einfach die Namen der ERSTEN Abfrage).", ex:"SELECT pub_id FROM titles\nUNION\nSELECT pub_id FROM employee;\n\n→ eine einzige Spalte 'pub_id', mit Zeilen aus BEIDEN Tabellen"},
     {t:"UNION entfernt Duplikate automatisch, UNION ALL nicht", merk:"UNION = wie DISTINCT über beide Abfragen hinweg. UNION ALL behält jede Zeile, auch doppelte.", b:"UNION vergleicht das komplette Ergebnis und entfernt doppelt vorkommende Zeilen — genau wie DISTINCT, nur über zwei Abfragen hinweg statt über eine. UNION ALL macht das NICHT: es hängt einfach alle Zeilen aneinander, Duplikate inklusive. UNION ALL ist außerdem schneller, weil SQL sich die Dedup-Arbeit spart.", ex:"SELECT pub_id FROM titles UNION ALL SELECT pub_id FROM employee;\n→ 61 Zeilen (siehe Tabelle oben, mit Duplikaten)\n\nSELECT pub_id FROM titles UNION SELECT pub_id FROM employee;\n→ 8 Zeilen (jeder der 8 Verlage nur einmal)"},
     {t:"Wann UNION statt JOIN?", merk:"JOIN = mehr Spalten pro Zeile (nebeneinander). UNION = mehr Zeilen (untereinander).", b:"Ein JOIN beantwortet 'zeig mir Zeile A UND die dazu passende Zeile B in einer Zeile'. UNION beantwortet dagegen 'zeig mir Zeile A ODER Zeile B als jeweils eigene Zeile in derselben Liste'.", ex:"UNION: zwei Listen zu einer zusammenfassen (mehr Zeilen).\nz.B. 'welche Verlage haben Bücher ODER Mitarbeitende'\n\nJOIN: zwei Tabellen nebeneinanderlegen (mehr Spalten).\nz.B. 'zeig Buchtitel UND den zugehörigen Verlagsnamen'"},
     {t:"ORDER BY bei UNION — nur einmal, ganz am Ende", kind:"detail", merk:"ORDER BY gehört nur ans Ende der GESAMTEN UNION-Abfrage, nicht in die einzelnen SELECTs.", b:"Willst du das kombinierte Ergebnis sortieren, steht ORDER BY nur EINMAL, ganz am Ende der gesamten Abfrage — nicht in jedem der beiden SELECTs einzeln.", ex:"SELECT pub_id FROM titles\nUNION\nSELECT pub_id FROM employee\nORDER BY pub_id;\n\n→ sortiert das gesamte kombinierte Ergebnis"}
   ]},
  {id:"exists", icon:"🕵️", color:"#6366f1", title:"EXISTS",
   concept:"EXISTS prüft mit einer Subquery nur, OB überhaupt mindestens eine passende Zeile existiert (wahr/falsch) — nicht WELCHE Werte sie liefert. Die Subquery bezieht sich fast immer auf die äußere Zeile (correlated). NOT EXISTS findet das Gegenteil: Zeilen, für die es KEINEN passenden Eintrag gibt.",
   example:"SELECT au_lname FROM authors a WHERE EXISTS (SELECT 1 FROM titleauthor ta WHERE ta.au_id = a.au_id)<br>→ 19 von 23 Autor:innen — die mit mindestens einem Buch",
   syntax:"SELECT ... FROM tabelleA a\nWHERE [NOT] EXISTS (SELECT 1 FROM tabelleB b WHERE b.spalte = a.spalte);",
   subskills:[
     {id:"exists_pos", icon:"✅", label:"EXISTS", desc:"Mindestens eine passende Zeile gefunden.",
      match:(sql)=>/\bEXISTS\b/i.test(sql) && !/\bNOT\s+EXISTS\b/i.test(sql)},
     {id:"not_exists", icon:"🚫", label:"NOT EXISTS", desc:"Keine passende Zeile gefunden.",
      match:(sql)=>/\bNOT\s+EXISTS\b/i.test(sql)},
   ],
   intro:"<div class=\"ns-intro-title\">🕵️ Der Nachtwächter: EXISTS &amp; NOT EXISTS</div><b>Wozu brauchst du das überhaupt?</b> Du kennst bereits <code>IN</code>. Damit fragst du die Datenbank nach konkreten Werten: <i>\"Ist der Name 'Müller' auf dieser Liste?\"</i><br><br><code>EXISTS</code> macht etwas völlig anderes. Es prüft nicht, welcher Wert in einer Liste steht. Es prüft nur eine simple Ja/Nein-Frage: <b>Gibt es hier überhaupt irgendetwas?</b><br><br>Das klingt erstmal sehr ähnlich, ist aber bei komplexen Abfragen oft viel leichter zu lesen und rettet dich im Alltag vor einem der gefährlichsten Bugs in SQL.",
   detailHeading:"🤓 Gut zu wissen: Die tödliche <code>NULL</code>-Falle (<code>IN</code> vs. <code>EXISTS</code>)",
   lesson:[
     {title:"Die Logik: Wahr oder Falsch? (Warum `SELECT 1`?)",
      was:"Es prüft nur eine simple Ja/Nein-Frage: Gibt es zu dieser Zeile mindestens einen passenden Eintrag in der Subquery? Welche Werte das genau sind, ist ihm völlig egal.",
      einfach:"Stell dir `EXISTS` wie einen Nachtwächter vor, den du in ein Gebäude schickst. Du sagst nicht: <i>\"Bring mir eine Liste aller Leute, die noch im Büro sitzen.\"</i> Du sagst nur: <i>\"Geh gucken, ob da überhaupt noch Licht brennt!\"</i><br><br>Der Wächter kommt zurück und sagt nur **\"Ja (Wahr)\"** oder **\"Nein (Falsch)\"**. Es ist ihm völlig egal, wer da sitzt oder wie viele es sind — sobald er die erste Person sieht, funkt er \"Wahr\" und geht nach Hause.",
      merksatz:["💡 Das Geheimnis hinter `SELECT 1`: Weil es `EXISTS` völlig egal ist, welche Daten gefunden werden, schreiben Profis in die Subquery einfach immer `SELECT 1`. Das bedeutet für die Datenbank: Verschwende keine Zeit mit echten Spaltennamen — gib mir einfach eine \"1\" zurück, sobald du auch nur eine passende Zeile gefunden hast."],
      syntax:"SELECT au_lname FROM authors a\nWHERE EXISTS (SELECT 1 FROM titleauthor ta ...);",
      beispiele:[]},
     {title:"Die magische Brücke (Correlated Subquery)",
      was:"Sie verknüpft die äußere Abfrage (den Autor) mit der inneren Subquery (die Bücher), damit `EXISTS` für JEDE Zeile einzeln neu geprüft wird.",
      einfach:"Fragst du nur <i>\"Gibt es Bücher in der Bibliothek?\"</i>, wird die Antwort immer \"Ja\" sein. Das hilft dir nicht, wenn du wissen willst, ob ein **bestimmter Autor** ein Buch geschrieben hat.<br><br>Du musst die äußere Zeile mit der inneren Suche verknüpfen. Das nennt man eine <i>Correlated Subquery</i> (verknüpfte Unterabfrage) — sie bezieht sich direkt auf die äußere Zeile.",
      syntax:"SELECT au_lname FROM authors a\nWHERE EXISTS (\n    SELECT 1 FROM titleauthor ta\n    WHERE ta.au_id = a.au_id -- HIER IST DIE BRÜCKE!\n);",
      beispiele:[{note:"(SQL nimmt Autor 1, schickt den Wächter los: \"Hat dieser Autor ein Buch?\" — Wächter sagt Ja. SQL nimmt Autor 2, schickt den Wächter los... und so weiter für jede einzelne Zeile.)"}]},
     {title:"Der Fahnder: `NOT EXISTS`",
      was:"Es findet gezielt die Zeilen, für die es KEINEN passenden Eintrag gibt — oft die spannendsten Business-Fragen überhaupt.",
      einfach:"Das Gegenteil ist für Analyst:innen oft noch viel spannender. Mit `NOT EXISTS` suchst du nach Dingen, die fehlen:<br><br>• Welche Autoren haben noch nie ein Buch veröffentlicht?<br>• Welche Bücher haben sich noch nicht ein einziges Mal verkauft?<br>• Welche Kunden haben keinen Newsletter abonniert?",
      syntax:"SELECT title FROM titles t\nWHERE NOT EXISTS (\n    SELECT 1 FROM sales s\n    WHERE s.title_id = t.title_id\n);",
      beispiele:[{label:"Dashboard-Check: Hat der Autor mindestens ein Buch? (`EXISTS`)", table:{headers:["Autor_Nachname","Ergebnis der Subquery","Wird im Ergebnis angezeigt?"], rows:[
        ["White","Liefert 1 (Wahr)","<span class=\"wt-good\">Ja (EXISTS)</span>"],
        ["Green","Liefert 1 (Wahr)","<span class=\"wt-good\">Ja (EXISTS)</span>"],
        ["Smith","Liefert nichts (Falsch)","<span class=\"wt-bad\">Nein (gefunden von NOT EXISTS)</span>"]
      ]}, note:"(Echtes Ergebnis, gegen die Datenbank geprüft: EXISTS findet 19 von 23 Autor:innen mit mindestens einem Buch. White hat 1 Buch, Green sogar 2 — Smith dagegen keins.)"}]},
     {kind:"detail", title:"Die tödliche `NULL`-Falle (`IN` vs. `EXISTS`)",
      text:"Oft kannst du frei wählen, ob du `IN` oder `EXISTS` benutzt — beide finden (fast immer) dasselbe. Der Grund, warum Profis bei komplexen Abfragen trotzdem so oft `EXISTS` bevorzugen, ist ein gefährlicher Bug rund um leere Felder (`NULL`): Enthält die Liste bei `NOT IN` auch nur einen einzigen `NULL`-Wert, bricht die Logik komplett zusammen — **`NOT IN` liefert dann plötzlich GAR KEIN Ergebnis mehr**, eine leere Tabelle, obwohl eigentlich Treffer da wären. Dein Dashboard stürzt ab oder zeigt falsche Nullen, und du suchst stundenlang nach dem Fehler.<br><br>`NOT EXISTS` hat dieses Problem nicht: unser Nachtwächter lässt sich von einem leeren Feld nicht aus der Ruhe bringen und meldet zuverlässig, ob die Zeile existiert oder nicht.",
      merksatz:["💡 Der Profi-Merksatz: Für simple Listen (`WHERE id IN (1, 2, 3)`) ist `IN` wunderbar und leicht zu lesen. Sobald du aber das Fehlen von Daten über zwei Tabellen hinweg suchst (eine Subquery), nutze immer `NOT EXISTS` statt `NOT IN`. Es ist ausfallsicher, selbst wenn deine Daten schmutzig sind."]}
   ]},
  {id:"full_join", icon:"➕", color:"#f43f5e", title:"FULL JOIN",
   concept:"FULL JOIN zeigt ALLE Zeilen aus BEIDEN Tabellen, mit oder ohne Treffer auf der jeweils anderen Seite — quasi LEFT JOIN und RIGHT JOIN gleichzeitig. Fehlende Gegenstücke werden NULL, das kann jetzt auf beiden Seiten passieren.",
   example:"stores FULL JOIN discounts:<br>→ 8 Zeilen insgesamt: 6 Stores (5 davon ohne eigenen Rabatt) + 2 Rabatte ohne zugeordneten Store",
   syntax:"SELECT ...\nFROM tabelleA a\nFULL JOIN tabelleB b ON a.spalte = b.spalte;",
   subskills:[
     {id:"basis", icon:"🔗", label:"FULL JOIN (Basis)", desc:"Alle Zeilen aus beiden Tabellen.",
      match:(sql)=>!/\bIS\s+NULL\b/i.test(sql)},
     {id:"fehlersuche", icon:"🕵️", label:"Fehlersuche (IS NULL)", desc:"FULL JOIN + IS NULL, um Lücken zu finden.",
      match:(sql)=>/\bIS\s+NULL\b/i.test(sql)},
   ],
   intro:"<div class=\"ns-intro-title\">➕ Der Alles-Fänger: FULL JOIN</div><b>Wozu brauchst du das überhaupt?</b> Du kennst bereits <code>LEFT JOIN</code> (wir behalten alles von der linken Tabelle) und <code>RIGHT JOIN</code> (wir behalten alles von der rechten Tabelle). Findet die Datenbank kein passendes Gegenstück, füllt sie die Lücke einfach mit <code>NULL</code> auf.<br><br>Aber was ist, wenn du <b>auf gar keinen Fall irgendetwas verlieren</b> darfst? Wenn du beide Tabellen als absolut gleichberechtigt ansehen musst?<br><br>Der <code>FULL JOIN</code> kombiniert beides. Er zeigt dir ausnahmslos ALLE Zeilen aus BEIDEN Tabellen — egal, ob sie einen Treffer auf der anderen Seite haben oder nicht. Nichts fällt unter den Tisch.",
   detailHeading:"🤓 Nerd-Fakt für den Alltag",
   lesson:[
     {title:"Die Logik: Das Abgleichen von zwei Listen",
      was:"Er zeigt dir ausnahmslos ALLE Zeilen aus BEIDEN Tabellen — mit oder ohne Treffer auf der jeweils anderen Seite. Nichts fällt unter den Tisch.",
      einfach:"Stell dir eine Hochzeit vor. Die Familie der Braut bringt eine Gästeliste mit (Tabelle A), die Familie des Bräutigams bringt eine mit (Tabelle B).<br><br>Du klebst beide Listen nebeneinander. Manche Gäste stehen auf beiden Listen. Manche stehen nur auf der Liste der Braut (beim Bräutigam steht dann `NULL`). Und manche stehen nur auf der Liste des Bräutigams (bei der Braut steht `NULL`). Der `FULL JOIN` ist die finale, vollständige Liste, auf der wirklich jeder auftaucht.",
      syntax:"SELECT s.stor_name, d.discounttype\nFROM stores s\nFULL JOIN discounts d ON s.stor_id = d.stor_id;",
      beispiele:[{table:{headers:["Name der Buchhandlung (Links)","Zugeordneter Rabatt (Rechts)","Was ist hier passiert?"], rows:[
        ["Bookbeat","Customer Discount","<span class=\"wt-good\">Perfekter Match:</span> Laden hat einen Rabatt."],
        ["Eric the Read Books","<span class=\"wt-bad\">NULL</span>","<span class=\"wt-bad\">Lücke rechts:</span> Laden existiert, hat aber keinen Rabatt bekommen."],
        ["<span class=\"wt-bad\">NULL</span>","Initial Customer","<span class=\"wt-bad\">Lücke links:</span> Rabatt existiert im System, ist aber keinem Laden zugeordnet!"],
        ["<span class=\"wt-bad\">NULL</span>","Volume Discount","<span class=\"wt-bad\">Lücke links:</span> noch ein Rabatt, der völlig in der Luft hängt."]
      ]}, note:"(Echtes Ergebnis, gegen die Datenbank geprüft: FULL JOIN liefert hier insgesamt 8 Zeilen — 6 Stores, davon 5 ohne eigenen Rabatt, plus 2 Rabatte ohne zugeordneten Store. Oben siehst du 4 repräsentative Zeilen davon.)"}]},
     {title:"Der Analysten-Use-Case: Fehler-Detektiv spielen (`IS NULL`)",
      was:"Er kombiniert FULL JOIN mit IS NULL, um gezielt die 'einsamen' Zeilen auf der einen oder anderen Seite zu finden — dein wichtigstes Werkzeug für Data Auditing.",
      einfach:"In der Praxis eines Datenanalysten ist der `FULL JOIN` dein wichtigstes Werkzeug für das sogenannte Data Auditing (Datenprüfung).<br><br>Wenn du die IT-Systeme von zwei Firmenabteilungen abgleichen musst (z.B. Kundendaten aus dem Vertrieb vs. Rechnungsdaten aus der Buchhaltung), willst du genau die Fälle finden, bei denen etwas kaputt ist. Dafür kombinierst du den `FULL JOIN` am Ende einfach mit `IS NULL`.",
      syntax:"... WHERE d.discounttype IS NULL;   -- einsame linke Zeilen\n... WHERE s.stor_name IS NULL;      -- einsame rechte Zeilen",
      beispiele:[
        {label:"Finde die einsamen linken Zeilen (Stores ohne Rabatt):", code:"SELECT s.stor_name FROM stores s\nFULL JOIN discounts d ON s.stor_id = d.stor_id\nWHERE d.discounttype IS NULL;", note:"(Echtes Ergebnis: 5 von 6 Filialen — Eric the Read Books, Barnum's, News & Brews, Doc-U-Mat: Quality Laundry and Books, Fricative Bookshop. Analysten-Logik: \"Zeig mir alle Filialen, bei denen die Marketing-Abteilung vergessen hat, einen Rabatt zu hinterlegen.\")"},
        {label:"Finde die einsamen rechten Zeilen (Rabatt-Leichen):", code:"SELECT d.discounttype FROM stores s\nFULL JOIN discounts d ON s.stor_id = d.stor_id\nWHERE s.stor_name IS NULL;", note:"(Echtes Ergebnis: Initial Customer, Volume Discount. Analysten-Logik: \"Zeig mir alle Rabatt-Aktionen im System, die gar keinem Geschäft zugeordnet sind und nur sinnlos Speicherplatz fressen.\")"}
      ]},
     {title:"Die goldene Regel: Welchen JOIN brauche ich jetzt?",
      was:"Sie hilft dir zu entscheiden, ob du wirklich einen FULL JOIN brauchst oder ob ein einfacherer LEFT/RIGHT JOIN reicht.",
      einfach:"Als Analyst musst du dich bei jeder Abfrage kurz fragen: Was ist das Ziel meines Dashboards? Was ist meine \"Wahrheit\"?",
      merksatz:["💡 Die Entscheidungs-Matrix:<br><br>**1. Das Fundament ist links (`LEFT JOIN`):** \"Meine Basis sind die Buchhandlungen. Ich will alle sehen. Ob sie Rabatte haben oder nicht, ist zweitrangig.\" (Das ist der häufigste Fall im Alltag!)<br><br>**2. Das Fundament ist rechts (`RIGHT JOIN`):** \"Meine Basis sind die Rabatte. Ich will alle Rabatt-Aktionen sehen, auch die unvergebenen. Ob Buchhandlungen fehlen, ist mir egal.\"<br><br>**3. Keine Kompromisse (`FULL JOIN`):** \"Beide Tabellen sind mir absolut gleich wichtig. Ich suche aktiv nach Fehlern und Lücken auf BEIDEN Seiten.\""],
      syntax:"LEFT JOIN  → Basis ist links, Rest optional\nRIGHT JOIN → Basis ist rechts, Rest optional\nFULL JOIN  → beide Seiten absolut gleich wichtig",
      beispiele:[]},
     {kind:"detail", title:"Nerd-Fakt: `FULL JOIN` in echtem MySQL",
      text:"Solltest du zufällig mit der Datenbank **MySQL** arbeiten, wirst du merken, dass der Befehl `FULL JOIN` dort gar nicht existiert! Profis behelfen sich dort, indem sie einen `LEFT JOIN` und einen `RIGHT JOIN` bauen und beide mit einem `UNION` (wie im UNION-Kapitel gelernt) aufeinanderstapeln."}
   ]},
];

const QUESTIONS = [{"id":"select-1","topic":"select_from","difficulty":1,"de_prompt":"Wähle alle Spalten und Zeilen aus der Tabelle authors aus.","sql":"SELECT * FROM authors","test_params":[{}]},{"id":"select-2","topic":"select_from","difficulty":1,"de_prompt":"Wähle Vor- und Nachname (au_fname, au_lname) aller Autor:innen aus.","sql":"SELECT au_fname, au_lname FROM authors","test_params":[{}]},{"id":"select-3","topic":"select_from","difficulty":1,"de_prompt":"Wähle den Vornamen aller Autor:innen aus, aber benenne die Spalte in der Ausgabe in first_name um (AS).","sql":"SELECT au_fname AS first_name FROM authors","test_params":[{}]},{"id":"select-4","topic":"select_from","difficulty":1,"de_prompt":"Wähle alle unterschiedlichen (keine Duplikate) Nachnamen der Autor:innen aus (DISTINCT).","sql":"SELECT DISTINCT au_lname FROM authors","test_params":[{}]},{"id":"select-5","topic":"select_from","difficulty":1,"de_prompt":"Wähle alle eindeutigen title_id aus, die jemals in der Tabelle sales verkauft wurden.","sql":"SELECT DISTINCT title_id FROM sales","test_params":[{}]},{"id":"select-6","topic":"select_from","difficulty":1,"de_prompt":"Wähle title, price und ytd_sales aus der Tabelle titles aus.","sql":"SELECT title, price, ytd_sales FROM titles","test_params":[{}]},{"id":"select-7","topic":"select_from","difficulty":2,"de_prompt":"Wähle job_id und job_desc aus der Tabelle jobs aus. Benenne die Spalten in der Ausgabe in id und description um.","sql":"SELECT job_id AS id, job_desc AS description FROM jobs","test_params":[{}]},{"id":"select-8","topic":"select_from","difficulty":1,"de_prompt":"Wähle die Namen aller Verlage (pub_name) aus der Tabelle publishers aus.","sql":"SELECT pub_name FROM publishers","test_params":[{}]},{"id":"where-1","topic":"where","difficulty":1,"de_prompt":"Wähle Vor- und Nachname der Autor:innen mit Nachname 'Ringer' aus.","sql":"SELECT au_fname, au_lname FROM authors WHERE au_lname = 'Ringer'","test_params":[{}]},{"id":"where-2","topic":"where","difficulty":1,"de_prompt":"Wähle Vor- und Nachname der Autor:innen mit Nachname '{lname}' aus.","sql":"SELECT au_fname, au_lname FROM authors WHERE au_lname = '{lname}'","param_pool":{"lname":["Carson","Green","White","Dull","Smith","Straight","Bennet"]},"test_params":[{"lname":"Carson"},{"lname":"Green"},{"lname":"White"}]},{"id":"where-3","topic":"where","difficulty":1,"de_prompt":"Wähle Bestellnummer, Bestelldatum und Menge aus sales aus, bei denen genau {qty} Bücher verkauft wurden.","sql":"SELECT ord_num, ord_date, qty FROM sales WHERE qty = {qty}","param_pool":{"qty":[3,5,10,15,20,25,30,35,40,50,75]},"allow_empty":true,"test_params":[{"qty":20},{"qty":15},{"qty":75}]},{"id":"where-4","topic":"where","difficulty":2,"de_prompt":"Wähle Vor- und Nachname der Autor:innen aus, deren Vorname 'Anne' UND Nachname 'Ringer' ist.","sql":"SELECT au_fname, au_lname FROM authors WHERE au_fname = 'Anne' AND au_lname = 'Ringer'","test_params":[{}]},{"id":"where-5","topic":"where","difficulty":2,"de_prompt":"Wähle Name und Stadt aller Verlage aus, die entweder in Deutschland ('Germany') ODER Frankreich ('France') sitzen.","sql":"SELECT pub_name, city FROM publishers WHERE country = 'Germany' OR country = 'France'","test_params":[{}]},{"id":"where-6","topic":"where","difficulty":2,"de_prompt":"Wähle Vorname, Nachname und Stadt der Autor:innen aus, deren Vorname 'Dean' ist UND die entweder aus 'Oakland' oder 'Berkeley' kommen. Tipp: Klammern nicht vergessen.","sql":"SELECT au_fname, au_lname, city FROM authors WHERE au_fname = 'Dean' AND (city = 'Oakland' OR city = 'Berkeley')","test_params":[{}]},{"id":"where-7","topic":"where","difficulty":2,"de_prompt":"Wähle Name, Stadt und Land aller Verlage aus, die NICHT in den USA sitzen.","sql":"SELECT pub_name, city, country FROM publishers WHERE country != 'USA'","test_params":[{}]},{"id":"where-8","topic":"where","difficulty":2,"de_prompt":"Wähle Vorname, Nachname und Stadt der Autor:innen aus 'Oakland' oder 'Berkeley', deren Nachname NICHT 'Straight' ist.","sql":"SELECT au_fname, au_lname, city FROM authors WHERE (city = 'Oakland' OR city = 'Berkeley') AND au_lname != 'Straight'","test_params":[{}]},{"id":"where-9","topic":"where","difficulty":2,"de_prompt":"Wähle Name, Stadt, Bundesland und Land aller Verlage aus, bei denen das Bundesland (state) fehlt (IS NULL).","sql":"SELECT pub_name, city, state, country FROM publishers WHERE state IS NULL","test_params":[{}]},{"id":"where-10","topic":"where","difficulty":1,"de_prompt":"Wähle Name, Stadt und Bundesland aller Stores aus, die NICHT in Kalifornien ('CA') liegen. Probier diesmal <> statt !=.","sql":"SELECT stor_name, city, state FROM stores WHERE state <> 'CA'","test_params":[{}]},{"id":"sort-1","topic":"sort_agg","difficulty":1,"de_prompt":"Wähle title und ytd_sales aus titles aus, aufsteigend sortiert nach ytd_sales.","sql":"SELECT title, ytd_sales FROM titles ORDER BY ytd_sales","sortCol":1,"sortDir":"asc","test_params":[{}]},{"id":"sort-2","topic":"sort_agg","difficulty":1,"de_prompt":"Wähle Titel und Jahresverkäufe (ytd_sales) aus titles aus, absteigend sortiert nach ytd_sales.","sql":"SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC","sortCol":1,"sortDir":"desc","test_params":[{}]},{"id":"sort-3","topic":"sort_agg","difficulty":2,"de_prompt":"Wähle die Top 5 Titel mit den meisten ytd_sales aus.","sql":"SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC LIMIT 5","test_params":[{}]},{"id":"sort-4","topic":"sort_agg","difficulty":1,"de_prompt":"Was ist die maximale Anzahl an Büchern, die jemals in einer einzigen Bestellung verkauft wurde?","sql":"SELECT MAX(qty) FROM sales","test_params":[{}],"alt":{"sql":"SELECT title_id, qty FROM sales ORDER BY qty DESC LIMIT 1","note":"MAX() ist kompakter und macht sofort klar, dass du einen Extremwert suchst — du bekommst aber nur die Zahl selbst. ORDER BY + LIMIT 1 ist etwas länger, zeigt dir dafür die ganze Zeile, z.B. WELCHE Bestellung das war."}},{"id":"sort-5","topic":"sort_agg","difficulty":1,"de_prompt":"Was kostet das günstigste Buch (MIN)?","sql":"SELECT MIN(price) FROM titles","test_params":[{}],"alt":{"sql":"SELECT title, price FROM titles WHERE price IS NOT NULL ORDER BY price LIMIT 1","note":"Gleiches Prinzip wie bei MAX(): MIN() liefert nur die Zahl, ORDER BY + LIMIT zeigt zusätzlich, welcher Titel das ist. Achte bei ORDER BY auf NULL-Werte — die stehen bei ASC ganz vorne, deshalb hier WHERE price IS NOT NULL."}},{"id":"sort-6","topic":"sort_agg","difficulty":1,"de_prompt":"Wie viele Zeilen gibt es in der Tabelle authors?","sql":"SELECT COUNT(*) FROM authors","test_params":[{}]},{"id":"sort-7","topic":"sort_agg","difficulty":1,"de_prompt":"Wie hoch ist die Summe aller year-to-date sales (ytd_sales)?","sql":"SELECT SUM(ytd_sales) FROM titles","test_params":[{}]},{"id":"sort-8","topic":"sort_agg","difficulty":2,"de_prompt":"Wie hoch ist der durchschnittliche Buchpreis, gerundet auf 2 Nachkommastellen?","sql":"SELECT ROUND(AVG(price), 2) FROM titles","test_params":[{}]},{"id":"sort-9","topic":"sort_agg","difficulty":2,"de_prompt":"Wähle in einer einzigen Abfrage Anzahl, Durchschnitt und Summe der qty aus sales aus.","sql":"SELECT COUNT(qty), AVG(qty), SUM(qty) FROM sales","test_params":[{}]},{"id":"sort-10","topic":"sort_agg","difficulty":2,"de_prompt":"Wie hoch ist die durchschnittliche verkaufte Menge (qty) für den Store mit der stor_id '{stor_id}'?","sql":"SELECT AVG(qty) FROM sales WHERE stor_id = '{stor_id}'","param_pool":{"stor_id":["6380","7066","7067","7131","7896","8042"]},"allow_empty":true,"test_params":[{"stor_id":"7131"},{"stor_id":"7067"},{"stor_id":"8042"}]},{"id":"sort-11","topic":"sort_agg","difficulty":2,"de_prompt":"Wie hoch ist der durchschnittliche Preis der Bücher vom Typ '{type}'?","sql":"SELECT AVG(price) FROM titles WHERE type = '{type}'","param_pool":{"type":["business","mod_cook","psychology","trad_cook","popular_comp"]},"test_params":[{"type":"psychology"},{"type":"business"},{"type":"trad_cook"}]},{"id":"sort-12","topic":"sort_agg","difficulty":2,"de_prompt":"Aus wie vielen unterschiedlichen Bundesstaaten kommen unsere Autor:innen (COUNT DISTINCT)?","sql":"SELECT COUNT(DISTINCT state) FROM authors","test_params":[{}]},{"id":"pattern-1","topic":"pattern","difficulty":1,"de_prompt":"Wähle alle Buchtitel aus, die das Wort 'cooking' enthalten (LIKE).","sql":"SELECT title FROM titles WHERE title LIKE '%cooking%'","test_params":[{}]},{"id":"pattern-2","topic":"pattern","difficulty":1,"de_prompt":"Wähle alle Titel aus, die mit 'The' beginnen.","sql":"SELECT title FROM titles WHERE title LIKE 'The%'","test_params":[{}]},{"id":"pattern-3","topic":"pattern","difficulty":2,"de_prompt":"Wähle Vor- und Nachname der Autor:innen aus, deren Nachname mit '{letter}' beginnt.","sql":"SELECT au_fname, au_lname FROM authors WHERE au_lname LIKE '{letter}%'","param_pool":{"letter":["S","C","G","D","B","M"]},"allow_empty":true,"test_params":[{"letter":"S"},{"letter":"C"},{"letter":"G"}]},{"id":"pattern-4","topic":"pattern","difficulty":1,"de_prompt":"Wähle Name und Adresse aller Stores aus, deren Adresse auf 'Ave.' endet.","sql":"SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.'","test_params":[{}]},{"id":"pattern-5","topic":"pattern","difficulty":2,"de_prompt":"Wähle Name und Adresse aller Stores aus, die in einer 'Ave.' ODER 'St.' liegen.","sql":"SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.' OR stor_address LIKE '%St.'","test_params":[{}]},{"id":"pattern-6","topic":"pattern","difficulty":2,"de_prompt":"In der Tabelle employee steckt im emp_id ein Muster, das zeigt, ob die Person weiblich oder männlich ist. Wähle alle Mitarbeitenden aus, deren emp_id auf 'F' endet.","sql":"SELECT * FROM employee WHERE emp_id LIKE '%F'","test_params":[{}]},{"id":"pattern-7","topic":"pattern","difficulty":1,"de_prompt":"Wähle Name und Bundesstaat aller Stores aus, die entweder in Kalifornien ('CA') oder Oregon ('OR') liegen. Benutze IN.","sql":"SELECT stor_name, state FROM stores WHERE state IN ('CA', 'OR')","test_params":[{}]},{"id":"pattern-8","topic":"pattern","difficulty":1,"de_prompt":"Wähle alle Titel vom Typ 'psychology', 'mod_cook' oder 'trad_cook' aus (IN).","sql":"SELECT title FROM titles WHERE type IN ('psychology', 'mod_cook', 'trad_cook')","test_params":[{}]},{"id":"pattern-9","topic":"pattern","difficulty":2,"de_prompt":"Wähle alle Autor:innen aus, die NICHT aus 'Salt Lake City', 'Ann Arbor' oder 'Oakland' kommen (NOT IN).","sql":"SELECT * FROM authors WHERE city NOT IN ('Salt Lake City', 'Ann Arbor', 'Oakland')","test_params":[{}]},{"id":"pattern-10","topic":"pattern","difficulty":1,"de_prompt":"Wähle alle Bestellnummern aus sales aus, bei denen zwischen 25 und 45 Büchern verkauft wurden (BETWEEN).","sql":"SELECT ord_num FROM sales WHERE qty BETWEEN 25 AND 45","test_params":[{}]},{"id":"pattern-11","topic":"pattern","difficulty":2,"de_prompt":"Wähle Titel und Preis aller Bücher aus, deren Preis zwischen {lo} und {hi} liegt.","sql":"SELECT title, price FROM titles WHERE price BETWEEN {lo} AND {hi}","param_pool":{"lo_hi":[[5,10],[10,15],[15,20],[8,12]]},"allow_empty":true,"test_params":[{"lo":5,"hi":10},{"lo":10,"hi":15},{"lo":15,"hi":20}]},{"id":"pattern-12","topic":"pattern","difficulty":1,"de_prompt":"Wähle alle Verkäufe aus, die zwischen '1993-03-11' und '1994-09-13' getätigt wurden (BETWEEN mit Datum).","sql":"SELECT * FROM sales WHERE ord_date BETWEEN '1993-03-11' AND '1994-09-13'","test_params":[{}]},{"id":"pattern-13","topic":"pattern","difficulty":2,"de_prompt":"Wähle die Nachnamen der Autor:innen aus, die mit 'D' beginnen UND genau 4 Buchstaben lang sind. Tipp: dafür brauchst du den Unterstrich-Platzhalter _, nicht %.","sql":"SELECT au_lname FROM authors WHERE au_lname LIKE 'D___'","test_params":[{}]},{"id":"group-1","topic":"group_having","difficulty":1,"de_prompt":"Finde die Gesamtzahl der Autor:innen pro Bundesstaat (GROUP BY state).","sql":"SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state","test_params":[{}],"alt":{"sql":"SELECT state, COUNT(au_id) AS total_authors FROM authors GROUP BY state","note":"COUNT(*) zählt alle Zeilen, COUNT(au_id) nur Zeilen, in denen au_id nicht NULL ist. Hier macht es keinen Unterschied, weil au_id ein Primärschlüssel ist (nie NULL). Bei Spalten, die NULL enthalten können, liefern beide Varianten unterschiedliche Ergebnisse — dann bewusst wählen!"}},{"id":"group-2","topic":"group_having","difficulty":2,"de_prompt":"Zähle, wie viele Autor:innen es pro Bundesland (state) gibt, absteigend sortiert nach der Anzahl.","sql":"SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state ORDER BY total_authors DESC","sortCol":1,"sortDir":"desc","test_params":[{}]},{"id":"group-3","topic":"group_having","difficulty":2,"de_prompt":"Was ist der Preis des teuersten Titels pro Verlag (GROUP BY pub_id)?","sql":"SELECT pub_id, ROUND(MAX(price),2) AS max_price FROM titles GROUP BY pub_id","test_params":[{}]},{"id":"group-4","topic":"group_having","difficulty":2,"de_prompt":"Finde die Top 3 Stores mit den meisten verkauften Büchern (SUM(qty)).","sql":"SELECT stor_id, SUM(qty) AS total_qty FROM sales GROUP BY stor_id ORDER BY total_qty DESC LIMIT 3","test_params":[{}]},{"id":"group-5","topic":"group_having","difficulty":2,"de_prompt":"Finde das durchschnittliche job_lvl pro job_id aus employee, aufsteigend sortiert.","sql":"SELECT job_id, AVG(job_lvl) AS avg_lvl FROM employee GROUP BY job_id ORDER BY avg_lvl ASC","sortCol":1,"sortDir":"asc","test_params":[{}]},{"id":"group-6","topic":"group_having","difficulty":2,"de_prompt":"Finde für jede Kombination aus Buchtyp (type) und Verlag (pub_id), wie viele Bücher es gibt.","sql":"SELECT type, pub_id, COUNT(*) AS book_number FROM titles GROUP BY type, pub_id","test_params":[{}]},{"id":"group-7","topic":"group_having","difficulty":2,"de_prompt":"Zähle pro Kombination aus Typ (type) und Verlag (pub_id) die Anzahl der Titel und berechne den durchschnittlichen Preis, gerundet auf 2 Nachkommastellen.","sql":"SELECT type, pub_id, COUNT(*) AS qty, ROUND(AVG(price),2) AS avg_price FROM titles GROUP BY type, pub_id","test_params":[{}]},{"id":"group-8","topic":"group_having","difficulty":3,"de_prompt":"Behalte aus der letzten Abfrage nur die Kombinationen mit einem Durchschnittspreis über 12 (HAVING statt WHERE!).","sql":"SELECT type, pub_id, COUNT(*) AS numb, AVG(price) AS avg_price FROM titles GROUP BY type, pub_id HAVING avg_price > 12","test_params":[{}]},{"id":"group-9","topic":"group_having","difficulty":3,"de_prompt":"Zeige alle Bundesstaaten und Städte, in denen es {n} oder mehr Autor:innen mit Vertrag gibt (SUM(contract) >= {n}).","sql":"SELECT state, city, SUM(contract) AS sum_contract FROM authors GROUP BY state, city HAVING sum_contract >= {n}","param_pool":{"n":[1,2]},"test_params":[{"n":1},{"n":2}]},{"id":"join-1","topic":"joins","difficulty":1,"de_prompt":"Wähle die Bestellnummer (ord_num) aus sales aus, gib der Tabelle den Alias 's' und benutze die Schreibweise s.ord_num.","sql":"SELECT s.ord_num FROM sales AS s","test_params":[{}]},{"id":"join-2","topic":"joins","difficulty":2,"de_prompt":"Wähle Titel und Verlagsname aller Bücher aus (auch wenn kein Verlag zugeordnet ist).","sql":"SELECT t.title, p.pub_name FROM titles t LEFT JOIN publishers p ON t.pub_id = p.pub_id","test_params":[{}]},{"id":"join-3","topic":"joins","difficulty":2,"de_prompt":"Wähle Bestellnummer, Menge und Buchtitel für alle Verkäufe aus (nutze USING).","sql":"SELECT s.ord_num, s.qty, t.title FROM sales s LEFT JOIN titles t USING(title_id)","test_params":[{}]},{"id":"join-4","topic":"joins","difficulty":2,"de_prompt":"Wähle den vollständigen Namen aller Mitarbeitenden und den Namen des Verlags, für den sie arbeiten.","sql":"SELECT e.fname, e.minit, e.lname, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id","test_params":[{}]},{"id":"join-5","topic":"joins","difficulty":2,"de_prompt":"Wähle den vollständigen Namen und die Jobbezeichnung (job_desc) aller Mitarbeitenden aus.","sql":"SELECT e.fname, e.minit, e.lname, j.job_desc FROM employee e LEFT JOIN jobs j ON e.job_id = j.job_id","test_params":[{}]},{"id":"join-6","topic":"joins","difficulty":3,"de_prompt":"Wähle Name, Jobbezeichnung und Verlagsname aller Mitarbeitenden aus – dafür brauchst du zwei JOINs in einer Abfrage.","sql":"SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id","test_params":[{}]},{"id":"join-7","topic":"joins","difficulty":3,"de_prompt":"Wähle Name, Jobbezeichnung und Verlagsname der Mitarbeitenden aus, die für '{pub_name}' arbeiten.","sql":"SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e INNER JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id WHERE p.pub_name = '{pub_name}'","param_pool":{"pub_name":["New Moon Books","Binnet & Hardley","Algodata Infosystems","Five Lakes Publishing","Ramona Publishers","GGG&G","Scootney Books","Lucerne Publishing"]},"allow_empty":true,"test_params":[{"pub_name":"Binnet & Hardley"},{"pub_name":"New Moon Books"},{"pub_name":"Algodata Infosystems"}]},{"id":"join-8","topic":"joins","difficulty":2,"de_prompt":"Wähle Verlagsname und PR-Info (pub_info) aller Verlage aus Berkeley, Kalifornien aus.","sql":"SELECT p.pub_name, pubi.pr_info FROM publishers p LEFT JOIN pub_info pubi USING(pub_id) WHERE p.city = 'Berkeley' AND p.state = 'CA'","test_params":[{}]},{"id":"join-9","topic":"joins","difficulty":2,"de_prompt":"Wähle Name, stor_id, Rabatttyp und Rabatt (discounttype, discount) aus discounts für ALLE Stores – auch die ohne Rabatt.","sql":"SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s LEFT JOIN discounts d USING(stor_id)","test_params":[{}]},{"id":"join-10","topic":"joins","difficulty":2,"de_prompt":"Wähle Store-Name, Store-ID, Rabatttyp und Rabatthöhe aller Stores aus, die tatsächlich einen Rabatt anbieten (nur Stores mit echtem Treffer in discounts).","sql":"SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s INNER JOIN discounts d USING(stor_id)","test_params":[{}]},{"id":"join-11","topic":"joins","difficulty":2,"de_prompt":"Nutze RIGHT JOIN: Wähle Rabatttyp und Store-Name aller Einträge aus discounts aus.","sql":"SELECT d.discounttype, s.stor_name FROM discounts d LEFT JOIN stores s USING(stor_id)","test_params":[{}]},{"id":"case-1","topic":"case","difficulty":2,"de_prompt":"Wähle alles aus sales aus und füge eine neue Spalte sales_category hinzu: qty >= 50 'high sales', 20 <= qty < 50 'medium sales', sonst 'low sales'.","sql":"SELECT *, CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category FROM sales","test_params":[{}],"alt":{"sql":"SELECT *, CASE WHEN qty < 20 THEN 'low sales' WHEN qty < 50 THEN 'medium sales' ELSE 'high sales' END AS sales_category FROM sales","note":"Beide Varianten liefern hier dasselbe Ergebnis, weil sich die Bedingungen nicht überschneiden — einmal fängst du oben (größter Wert zuerst) an, einmal unten (kleinster Wert zuerst) und sparst dir dadurch eine Bedingung. Wichtig: sobald sich Bedingungen überschneiden könnten, entscheidet allein die Reihenfolge der WHEN-Zeilen, welche Kategorie gewinnt — SQL prüft von oben nach unten und nimmt die erste, die passt."}},{"id":"case-2","topic":"case","difficulty":3,"de_prompt":"Berechne für jede der drei sales_category (high/medium/low sales) die Gesamtmenge verkaufter Bücher (SUM(qty)).","sql":"SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category","test_params":[{}]},{"id":"case-3","topic":"case","difficulty":3,"de_prompt":"Bilde mit CASE WHEN die Verkaufskategorien 'high sales' (qty >= 50), 'medium sales' (20 bis unter 50) und 'low sales' (Rest) aus sales, summiere qty je Kategorie, und zeige nur Kategorien mit einer Summe über 100, absteigend sortiert.","sql":"SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category HAVING total_sold > 100 ORDER BY total_sold DESC","sortCol":1,"sortDir":"desc","test_params":[{}]},{"id":"case-4","topic":"case","difficulty":3,"de_prompt":"Finde den durchschnittlichen Buchpreis pro Verlag für die Preiskategorien <=5 'super low', <=10 'low', <=15 'medium', sonst 'high'. Beschränke dich auf die Typen 'business', 'trad_cook' und 'psychology'. Runde den Durchschnitt.","sql":"SELECT pub_id, CASE WHEN price <= 5 THEN 'super low' WHEN price <= 10 THEN 'low' WHEN price <= 15 THEN 'medium' ELSE 'high' END AS price_category, ROUND(AVG(price)) AS average_price FROM titles WHERE type IN ('business','trad_cook','psychology') GROUP BY pub_id, price_category","test_params":[{}]},{"id":"sub-1","topic":"subquery","difficulty":2,"de_prompt":"Finde den Namen des Verlags mit dem höchsten Vorschuss (advance) – benutze eine Subquery.","sql":"SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles ORDER BY advance DESC LIMIT 1)","test_params":[{}],"alt":{"sql":"SELECT pub_name FROM publishers WHERE pub_id IN (SELECT pub_id FROM titles WHERE advance = (SELECT MAX(advance) FROM titles))","note":"Die erste Variante (ORDER BY + LIMIT 1) ist kürzer. Die zweite mit MAX() in einer zweiten Subquery ist etwas länger, verhält sich aber anders bei einem Gleichstand: sie zeigt ALLE Verlage mit dem Höchstwert, nicht nur einen zufälligen."}},{"id":"sub-2","topic":"subquery","difficulty":2,"de_prompt":"Liste die Titel aller Bücher auf, die von Verlagen aus 'Boston' veröffentlicht wurden.","sql":"SELECT title FROM titles WHERE pub_id IN (SELECT pub_id FROM publishers WHERE city = 'Boston')","test_params":[{}],"alt":{"sql":"SELECT t.title FROM titles t JOIN publishers p USING(pub_id) WHERE p.city = 'Boston'","note":"Die Subquery ist gut lesbar, wenn du nur EINE Bedingung aus der anderen Tabelle brauchst. Sobald du zusätzlich Spalten aus der anderen Tabelle mit ausgeben willst (z.B. den Verlagsnamen selbst), lohnt sich der JOIN, weil die Subquery dir diese Spalten gar nicht zur Verfügung stellt."}},{"id":"sub-3","topic":"subquery","difficulty":2,"de_prompt":"Finde die Autor:innen, die mehr als ein Buch geschrieben haben.","sql":"SELECT au_fname, au_lname FROM authors WHERE au_id IN (SELECT au_id FROM titleauthor GROUP BY au_id HAVING COUNT(title_id) > 1)","test_params":[{}],"alt":{"sql":"SELECT au_fname, au_lname FROM authors a WHERE (SELECT COUNT(*) FROM titleauthor ta WHERE ta.au_id = a.au_id) > 1","note":"Beide kommen zum gleichen Ergebnis. Die GROUP BY/HAVING-Subquery läuft nur EINMAL komplett durch titleauthor. Die correlated Subquery rechnet für JEDE Zeile aus authors neu nach — bei kleinen Tabellen wie hier egal, bei großen Datenmengen spürbar langsamer."}},{"id":"sub-4","topic":"subquery","difficulty":3,"de_prompt":"Liste alle Autor:innen mit der Anzahl ihrer Bücher auf – benutze eine correlated Subquery im SELECT-Teil.","sql":"SELECT au_lname, au_fname, (SELECT COUNT(title_id) FROM titleauthor ta WHERE ta.au_id = a.au_id) AS book_no FROM authors a","test_params":[{}]},{"id":"sub-5","topic":"subquery","difficulty":3,"de_prompt":"Finde alle Titel, deren Preis mehr als {pct}% über dem Durchschnittspreis liegt.","sql":"SELECT title, price FROM titles WHERE price > (SELECT AVG(price) * {factor} FROM titles)","param_pool":{"pct_factor":[[10,1.1],[20,1.2],[15,1.15]]},"allow_empty":true,"test_params":[{"pct":10,"factor":1.1},{"pct":20,"factor":1.2}]},{"id":"sub-6","topic":"subquery","difficulty":2,"de_prompt":"Finde den Namen des Verlags, der die meisten Bücher veröffentlicht hat.","sql":"SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles GROUP BY pub_id ORDER BY COUNT(*) DESC LIMIT 1)","test_params":[{}],"alt":{"sql":"SELECT p.pub_name FROM publishers p JOIN titles t ON p.pub_id = t.pub_id GROUP BY p.pub_name ORDER BY COUNT(t.title_id) DESC LIMIT 1","note":"Die Subquery mit LIMIT 1 ist kurz und funktioniert gut, wenn du wirklich nur den EINEN Spitzenreiter brauchst. Der JOIN mit GROUP BY ist die bessere Basis, wenn du die Abfrage später erweitern willst — z.B. auf die Top 5 statt nur Platz 1."}},{"id":"sub-7","topic":"subquery","difficulty":2,"de_prompt":"Liste die Titel auf, die noch nie verkauft wurden (NOT IN).","sql":"SELECT title FROM titles WHERE title_id NOT IN (SELECT title_id FROM sales)","test_params":[{}]},{"id":"sub-8","topic":"subquery","difficulty":3,"de_prompt":"Finde die Mitarbeitenden mit demselben Job wie '{fname} {lname}'.","sql":"SELECT fname, lname, job_id FROM employee WHERE job_id = (SELECT job_id FROM employee WHERE fname = '{fname}' AND lname = '{lname}')","param_pool":{"name":[["Aria","Cruz"],["Annette","Roulet"],["Ann","Devon"],["Carlos","Hernadez"],["Daniel","Tonini"]]},"test_params":[{"fname":"Aria","lname":"Cruz"},{"fname":"Daniel","lname":"Tonini"}]},{"id":"func-1","topic":"functions","difficulty":1,"de_prompt":"Füge eine Spalte hinzu, die zeigt, wie viele Zeichen der Nachname jeder Autorin/jedes Autors hat (LENGTH).","sql":"SELECT au_lname, LENGTH(au_lname) AS lname_len FROM authors","test_params":[{}]},{"id":"func-2","topic":"functions","difficulty":1,"de_prompt":"Wie lautet der Vorname jeder Autorin/jedes Autors in Großbuchstaben (UPPER)?","sql":"SELECT UPPER(au_fname) AS fname_upper FROM authors","test_params":[{}]},{"id":"func-3","topic":"functions","difficulty":2,"de_prompt":"Verbinde Vor- und Nachname der Autor:innen zu einer einzigen Spalte, mit Leerzeichen dazwischen (CONCAT).","sql":"SELECT CONCAT(au_fname, ' ', au_lname) AS full_name FROM authors","test_params":[{}]},{"id":"func-4","topic":"functions","difficulty":2,"de_prompt":"Berechne den Unterschied in Tagen zwischen dem Erscheinungsdatum (pubdate) jedes Buchs und heute (DATEDIFF).","sql":"SELECT title, DATEDIFF(CURDATE(), pubdate) AS days_since_pub FROM titles","test_params":[{}]},{"id":"func-5","topic":"functions","difficulty":2,"de_prompt":"Wie viele Jahre ist es her, seit jeder Titel veröffentlicht wurde (TIMESTAMPDIFF)?","sql":"SELECT title, TIMESTAMPDIFF(YEAR, pubdate, CURDATE()) AS years_since_pub FROM titles","test_params":[{}]},{"id":"func-6","topic":"functions","difficulty":2,"de_prompt":"Zeige Erscheinungsjahr und -monat jedes Titels im Format 'YYYY-MM' (DATE_FORMAT).","sql":"SELECT title, DATE_FORMAT(pubdate, '%Y-%m') AS pub_year_month FROM titles","test_params":[{}]},{"id":"func-7","topic":"functions","difficulty":1,"de_prompt":"Verbinde Verlagsname und Stadt zu einer Spalte, getrennt durch Komma.","sql":"SELECT CONCAT(pub_name, ', ', city) AS name_city FROM publishers","test_params":[{}]},{"id":"func-8","topic":"functions","difficulty":3,"de_prompt":"Finde den/die Titel mit dem längsten Buchtitel (über eine Subquery, damit es auch bei mehreren gleich langen Titeln funktioniert).","sql":"SELECT title FROM titles WHERE LENGTH(title) = (SELECT MAX(LENGTH(title)) FROM titles)","test_params":[{}],"alt":{"sql":"SELECT title FROM titles ORDER BY LENGTH(title) DESC LIMIT 1","note":"ORDER BY + LIMIT ist einfacher zu schreiben, zeigt bei einem Gleichstand (zwei gleich lange Titel) aber nur EINEN davon. Die Subquery mit MAX(LENGTH()) zeigt dir ALLE Titel, die den Rekord halten — bei Fragen wie 'wer/was ist der Spitzenreiter' oft die robustere Wahl."}},{"id":"func-9","topic":"functions","difficulty":2,"de_prompt":"Zeige die ersten 5 Zeichen der Adresse aller Autor:innen, deren Nachname mit 'C' beginnt (LEFT).","sql":"SELECT au_fname, au_lname, LEFT(address, 5) AS address_start FROM authors WHERE au_lname LIKE 'C%'","test_params":[{}],"alt":{"sql":"SELECT au_fname, au_lname, SUBSTRING(address, 1, 5) AS address_start FROM authors WHERE au_lname LIKE 'C%'","note":"LEFT() und SUBSTRING() machen hier dasselbe. LEFT() ist kürzer und eindeutig für 'von vorne X Zeichen'. SUBSTRING(text, start, länge) ist flexibler, weil du damit auch mitten im Text oder ab einer beliebigen Position anfangen kannst."}},{"id":"func-10","topic":"functions","difficulty":2,"de_prompt":"Finde alle Titel, bei denen der Unterschied zwischen heute und dem Erscheinungsdatum mehr als {n} Tage beträgt.","sql":"SELECT title, DATEDIFF(CURDATE(), pubdate) AS days_diff FROM titles WHERE DATEDIFF(CURDATE(), pubdate) > {n}","param_pool":{"n":[1000,5000,10000,12000]},"test_params":[{"n":1000},{"n":5000},{"n":10000}]},{"id":"func-11","topic":"functions","difficulty":3,"de_prompt":"Finde die Titel, deren Länge über der durchschnittlichen Titellänge liegt.","sql":"SELECT title FROM titles WHERE LENGTH(title) > (SELECT AVG(LENGTH(title)) FROM titles)","test_params":[{}]},{"id":"func-12","topic":"functions","difficulty":2,"de_prompt":"Finde Autor:innen, bei denen Vor- und Nachname gleich lang sind.","sql":"SELECT au_fname, au_lname FROM authors WHERE LENGTH(au_fname) = LENGTH(au_lname)","test_params":[{}]},{"id":"adv-1","topic":"advanced","difficulty":2,"de_prompt":"Wie groß ist der Unterschied zwischen dem teuersten und dem günstigsten Buchpreis? Runde auf 2 Nachkommastellen.","sql":"SELECT ROUND(MAX(price) - MIN(price), 2) AS difference FROM titles","test_params":[{}]},{"id":"adv-2","topic":"advanced","difficulty":3,"de_prompt":"Finde die Titel, bei denen die verkaufte Gesamtmenge (SUM(qty)) eine gerade Zahl ist (Modulo %).","sql":"SELECT t.title, SUM(s.qty) AS total_sold FROM titles t INNER JOIN sales s ON t.title_id = s.title_id GROUP BY t.title_id HAVING total_sold % 2 = 0","test_params":[{}]},{"id":"adv-3","topic":"advanced","difficulty":3,"de_prompt":"Berechne den Umsatz (Preis × verkaufte Menge) pro Titel.","sql":"SELECT t.title, ROUND(SUM(t.price * s.qty), 2) AS revenue FROM titles t JOIN sales s USING(title_id) GROUP BY t.title_id","test_params":[{}],"alt":{"sql":"SELECT t.title, (SELECT ROUND(SUM(t.price * s.qty), 2) FROM sales s WHERE s.title_id = t.title_id) AS revenue FROM titles t","note":"Der JOIN mit GROUP BY ist die üblichere und meist schnellere Lösung. Die correlated Subquery rechnet für jeden Titel einzeln nach — bei größeren Datenmengen spürbar langsamer. Es gibt aber einen echten inhaltlichen Unterschied, nicht nur Geschmackssache: der INNER JOIN lässt Titel ohne Verkäufe komplett weg (hier 2 Titel), die correlated Subquery zeigt sie zusätzlich mit NULL als Umsatz. Je nachdem, ob 'kein Umsatz' als Zeile sichtbar sein soll oder nicht, ist das eine bewusste Entscheidung, kein Zufall."}},{"id":"adv-4","topic":"advanced","difficulty":3,"de_prompt":"Cheryl Carson und Charlene Locksley haben geheiratet – wie hoch ist ihr gemeinsamer Umsatz (Preis × Menge über alle ihre Bücher)?","sql":"SELECT SUM(t.price * s.qty) AS revenue_total FROM titles t JOIN sales s USING(title_id) JOIN titleauthor ta USING(title_id) JOIN authors a USING(au_id) WHERE (a.au_fname = 'Cheryl' AND a.au_lname = 'Carson') OR (a.au_fname = 'Charlene' AND a.au_lname = 'Locksley')","test_params":[{}],"alt":{"sql":"SELECT SUM(t.price * s.qty) AS revenue_total FROM titles t JOIN sales s USING(title_id) WHERE t.title_id IN (SELECT ta.title_id FROM titleauthor ta JOIN authors a USING(au_id) WHERE (a.au_fname = 'Cheryl' AND a.au_lname = 'Carson') OR (a.au_fname = 'Charlene' AND a.au_lname = 'Locksley'))","note":"Beide kommen zum gleichen Ergebnis. Die zweite Variante trennt das Problem in zwei Schritte: erst herausfinden, WELCHE Bücher den beiden gehören (Subquery), dann erst den Umsatz dafür berechnen. Das ist oft leichter zu debuggen, wenn mal etwas nicht stimmt — du kannst die Subquery einzeln laufen lassen und prüfen."}},{"id":"adv-5","topic":"advanced","difficulty":2,"de_prompt":"Wie viele Bücher wurden insgesamt von den Verlagen mit der pub_id '0736' und '0877' veröffentlicht?","sql":"SELECT COUNT(*) AS total_books FROM titles WHERE pub_id IN ('0736', '0877')","test_params":[{}]},{"id":"adv-6","topic":"advanced","difficulty":3,"de_prompt":"Fi /* ================= MySQL-Kompatibilitätsschicht ================= */

function mysqlCompat(sql){
  sql = sql.replace(/\bLEFT\s*\(/gi, "LEFTSTR(");
  sql = sql.replace(/\bRIGHT\s*\(/gi, "RIGHTSTR(");
  sql = sql.replace(/(TIMESTAMPDIFF\s*\(\s*)(YEAR|MONTH|DAY|WEEK|HOUR|MINUTE|SECOND)(\s*,)/gi, "$1'$2'$3");
  sql = sql.replace(/^\s*USE\s+\w+\s*;?\s*/i, "");
  return sql;
}

function parseSqlDate(s){
  if (s===null || s===undefined) return null;
  const datePart = String(s).split(" ")[0];
  const d = new Date(datePart+"T00:00:00Z");
  return isNaN(d.getTime()) ? null : d;
}

const MONTHS_DE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS_DE = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function registerUdfs(db){
  db.create_function("CONCAT", function(...args){
    if (args.some(a=>a===null||a===undefined)) return null;
    return args.join("");
  });
  db.create_function("LEFTSTR", function(s,n){ return s===null ? null : String(s).slice(0, Number(n)); });
  db.create_function("RIGHTSTR", function(s,n){
    if (s===null) return null;
    n = Number(n);
    return n>0 ? String(s).slice(-n) : "";
  });
  db.create_function("CURDATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("CURRENT_DATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("DATEDIFF", function(a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    return Math.round((da-db_)/86400000);
  });
  db.create_function("TIMESTAMPDIFF", function(unit,a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    const days = Math.round((db_-da)/86400000);
    unit = String(unit).toUpperCase();
    if (unit==="DAY") return days;
    if (unit==="YEAR"){
      let y = db_.getUTCFullYear()-da.getUTCFullYear();
      if ((db_.getUTCMonth()<da.getUTCMonth()) || (db_.getUTCMonth()===da.getUTCMonth() && db_.getUTCDate()<da.getUTCDate())) y--;
      return y;
    }
    if (unit==="MONTH"){
      let m = (db_.getUTCFullYear()-da.getUTCFullYear())*12 + (db_.getUTCMonth()-da.getUTCMonth());
      if (db_.getUTCDate() < da.getUTCDate()) m--;
      return m;
    }
    return days;
  });
  db.create_function("DATE_FORMAT", function(s, fmt){
    const d = parseSqlDate(s);
    if (!d) return null;
    let out = "";
    for (let i=0;i<fmt.length;i++){
      if (fmt[i]==="%" && i+1<fmt.length){
        const spec = fmt[i+1];
        if (spec==="Y") out += String(d.getUTCFullYear()).padStart(4,"0");
        else if (spec==="m") out += String(d.getUTCMonth()+1).padStart(2,"0");
        else if (spec==="d") out += String(d.getUTCDate()).padStart(2,"0");
        else if (spec==="e") out += String(d.getUTCDate());
        else if (spec==="M") out += MONTHS_DE[d.getUTCMonth()];
        else if (spec==="W") out += WEEKDAYS_DE[(d.getUTCDay()+6)%7];
        else out += spec;
        i++;
      } else out += fmt[i];
    }
    return out;
  });
  db.create_function("CHAR_LENGTH", function(s){ return s===null ? null : String(s).length; });
}

function rewriteRightJoin(sql){
  const m = sql.match(/^(.*?FROM\s+)([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+RIGHT\s+JOIN\s+([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+(ON\s+[\s\S]+?|USING\s*\([\s\S]+?\))(\s+(?:WHERE|GROUP BY|ORDER BY|LIMIT)[\s\S]*)?$/i);
  if (!m) return null;
  const [, pre, tblA, tblB, cond, rest] = m;
  return `${pre}${tblB} LEFT JOIN ${tblA} ${cond}${rest||""}`;
}

function execSqlRaw(sql){
  const res = db.exec(sql);
  if (!res.length) return {columns:[], values:[]};
  return res[res.length-1];
}

function execSqlSafe(sql){
  try{
    return execSqlRaw(sql);
  }catch(e){
    if (/RIGHT\s+JOIN/i.test(sql) && /RIGHT and FULL OUTER JOINs? are not (currently )?supported/i.test(e.message)){
      const rewritten = rewriteRightJoin(sql);
      if (rewritten){ return execSqlRaw(rewritten); }
    }
    throw e;
  }
}

function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ================= Fragen-Engine ================= */

function fillTemplate(tpl, params){
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (params[k]!==undefined ? params[k] : m));
}

function pickParams(q){
  if (!q.param_pool) return {};
  const pool = q.param_pool;
  const result = {};
  for (const key of Object.keys(pool)){
    const values = pool[key];
    const choice = values[Math.floor(Math.random()*values.length)];
    if (Array.isArray(choice)){
      if (key==="lo_hi"){ result.lo=choice[0]; result.hi=choice[1]; }
      else if (key==="pct_factor"){ result.pct=choice[0]; result.factor=choice[1]; }
      else if (key==="name"){ result.fname=choice[0]; result.lname=choice[1]; }
    } else {
      result[key] = choice;
    }
  }
  return result;
}

function buildInstance(q){
  const params = pickParams(q);
  const sql = mysqlCompat(fillTemplate(q.sql, params));
  const promptText = fillTemplate(q.de_prompt, params);
  let refResult = null, refError = null;
  try{ refResult = execSqlSafe(sql); }
  catch(e){ refError = e.message; }
  return {qdef:q, params, sql, promptText, refResult, refError};
}

function normVal(v){
  if (v===null || v===undefined) return null;
  if (typeof v === "number") return Math.round(v*10000)/10000;
  if (typeof v === "string") return v.trim();
  return v;
}
function rowKey(row){ return row.map(v=>String(v)).join(""); }

function compareResults(expected, actual){
  if (!expected) return {ok:false, reason:"no_reference"};
  if (expected.columns.length !== actual.columns.length){
    return {ok:false, reason:"column_count", expCols:expected.columns.length, actCols:actual.columns.length};
  }
  const exp = expected.values.map(r=>r.map(normVal));
  const act = actual.values.map(r=>r.map(normVal));
  if (exp.length !== act.length){
    return {ok:false, reason:"row_count", expRows:exp.length, actRows:act.length};
  }
  const expSorted = [...exp].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  const actSorted = [...act].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  for (let i=0;i<expSorted.length;i++){
    for (let j=0;j<expSorted[i].length;j++){
      if (expSorted[i][j] !== actSorted[i][j]) return {ok:false, reason:"value_mismatch"};
    }
  }
  return {ok:true};
}

function checkMonotonic(actual, colIdx, dir){
  const vals = actual.values.map(r=>r[colIdx]);
  for (let i=1;i<vals.length;i++){
    const a=vals[i-1], b=vals[i];
    if (a===null||b===null) continue;
    if (dir==="asc" && a>b) return false;
    if (dir==="desc" && a<b) return false;
  }
  return true;
}

function gradeAnswer(inst, actual){
  const cmp = compareResults(inst.refResult, actual);
  if (!cmp.ok) return cmp;
  if (inst.qdef.sortCol !== undefined){
    if (!checkMonotonic(actual, inst.qdef.sortCol, inst.qdef.sortDir)){
      return {ok:false, reason:"sort_missing"};
    }
  }
  return {ok:true};
}

function explainFailure(reason, extra, topic){
  const t = TOPICS.find(x=>x.id===topic);
  switch(reason){
    case "column_count":
      return `Deine Abfrage liefert <b>${extra.actCols}</b> Spalte(n), erwartet werden <b>${extra.expCols}</b>. Schau nochmal in der Aufgabenstellung nach, welche Spalten genau gefragt sind.`;
    case "row_count":
      if (extra.actRows > extra.expRows)
        return `Deine Abfrage liefert <b>mehr Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich filtert deine Bedingung nicht genug ein.<br><br>${t.concept}`;
      return `Deine Abfrage liefert <b>weniger Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich ist deine Bedingung zu streng, oder AND/OR sind vertauscht.<br><br>${t.concept}`;
    case "value_mismatch":
      return `Die Anzahl der Zeilen passt, aber die <b>Werte stimmen nicht überein</b>. Prüfe Berechnungen, Gruppierung oder Rundung.<br><br>${t.concept}`;
    case "sort_missing":
      return `Deine Werte stimmen, aber die <b>Sortierung passt nicht</b>. Denk an ORDER BY (und die Richtung ASC/DESC).`;
    case "no_reference":
      return `Für diese Frage konnte im Hintergrund keine Referenzlösung berechnet werden — das ist ein Fehler im Tool, nicht bei dir. Klick auf "Nächste Frage".`;
    default:
      return t.concept;
  }
}

function explainSqlError(msg){
  if (/no such column/i.test(msg)) return `Diese Spalte gibt es in der Tabelle nicht. Schau links in der Seitenleiste nach den passenden Spaltennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/no such table/i.test(msg)) return `Diese Tabelle gibt es nicht. Schau links in der Seitenleiste nach den verfügbaren Tabellennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/syntax error/i.test(msg)) return `Da steckt ein Tippfehler in der SQL-Syntax (z.B. fehlendes Komma, Klammer oder Anführungszeichen).<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  return `SQL-Fehler: <span class="text-faint">${msg}</span>`;
}

function renderTopicBars(history){
  const byTopic = {};
  history.forEach(e=>{

    const t = TOPICS.find(x=>x.id===id);
    if (!t) return "";
    const pct = Math.round(100*s.correct/s.total);

  }).join("");
  return rows || `<div class="text-faint" style="font-size:12.5px;">Noch keine Übungen erfasst — leg los, dann füllt sich das hier.</div>`;

function renderDifficultyStats(history){
  const levels = [1,2,3];
  const labels = {1:"🌶️ mild", 2:"🌶️🌶️ scharf", 3:"🌶️🌶️🌶️ sehr scharf"};
  const counts = levels.map(l=>history.filter(e=>e.difficulty===l).length);
  const maxCount = Math.max(1, ...counts);
  const rows = levels.map((lvl,i)=>{
    const items = history.filter(e=>e.difficulty===lvl);
    const count = items.length;
    const correct = items.filter(e=>e.correct).length;
    const avgMs = count ? items.reduce((a,e)=>a+(e.durationMs||0),0)/count : 0;
    const pct = count ? Math.round(100*correct/count) : 0;
    const barPct = Math.round(100*count/maxCount);
    return `<div class="tb-row">
      <div class="tb-label">${labels[lvl]}</div>
      <div class="tb-track"><div class="tb-fill" style="width:${barPct}%;background:var(--accent-2)"></div></div>
      <div class="tb-pct">${count ? `${count}× · ${pct}% · ⌀${formatDuration(avgMs)}` : "–"}</div>
    </div>`;
  }).join("");
  return rows;
}

function renderTrendChart(history){
  const byDay = {};
  history.forEach(e=>{
    const key = new Date(e.ts).toISOString().slice(0,10);
    if (!byDay[key]) byDay[key] = {correct:0, total:0};
    byDay[key].total++;
    if (e.correct) byDay[key].correct++;
  });
  const days = Object.keys(byDay).sort();
  if (days.length < 2){
    return `<div class="text-faint" style="font-size:12.5px;">Noch nicht genug Tage mit Übungen für einen Verlauf — komm an einem anderen Tag wieder.</div>`;
  }
  const w = 640, h = 150, pad = 26;
  const pts = days.map((d,i)=>{
    const x = pad + (days.length>1 ? (i/(days.length-1))*(w-2*pad) : (w-2*pad)/2);
    const pct = byDay[d].correct/byDay[d].total;
    const y = h-pad - pct*(h-2*pad);
    return {x, y, pct, d, count: byDay[d].total};
  });
  const path = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const areaPath = `${path} L${pts[pts.length-1].x.toFixed(1)},${h-pad} L${pts[0].x.toFixed(1)},${h-pad} Z`;
  const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--accent-2)" stroke="var(--bg-alt)" stroke-width="1.5"><title>${p.d}: ${Math.round(p.pct*100)}% (${p.count} Aufgaben)</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="trend-svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>
    <path d="${areaPath}" fill="color-mix(in srgb, var(--accent) 16%, transparent)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${dots}
  </svg>
  <div class="text-faint" style="font-size:11px;margin-top:4px;">${days[0]} bis ${days[days.length-1]} &middot; Linie = Tages-Erfolgsquote, oben = 100%</div>`;
}

/* ---------- Spalten-Resizer (Referenz | Code | Schema, jede Spalte einzeln scroll- und breitenverstellbar) ---------- */
(function initColResizers(){
  function makeResizer(handleId, targetId, side, min, max){
    const handle = document.getElementById(handleId);
    const target = document.getElementById(targetId);
    if (!handle || !target) return;
    let startX = 0, startWidth = 0;
    function pointerX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
    function onMove(e){
      const dx = pointerX(e) - startX;
      let newWidth = side === "left" ? startWidth + dx : startWidth - dx;
      newWidth = Math.max(min, Math.min(max, newWidth));
      target.style.width = newWidth + "px";
      if (cm && cm.refresh) cm.refresh();
    }
    function onUp(){
      handle.classList.remove("dragging");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onUp);
    }
    function onDown(e){
      startX = pointerX(e);
      startWidth = target.getBoundingClientRect().width;
      handle.classList.add("dragging");
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      document.addEventListener("touchmove", onMove, {passive:false});
      document.addEventListener("touchend", onUp);
      e.preventDefault();
    }
    handle.addEventListener("mousedown", onDown);
    handle.addEventListener("touchstart", onDown, {passive:false});
  }
  makeResizer("resizer-left", "sidebar", "left", 220, 520);
  makeResizer("resizer-right", "syntax-panel", "right", 220, 560);
})();

function insertAtCursor(text){
  if (!cm || !cm.getWrapperElement || !document.body.contains(cm.getWrapperElement())) return;
  const cursor = cm.getCursor();
  cm.replaceRange(text, cursor, cursor, "+input");
  const newPos = {line: cursor.line, ch: cursor.ch + text.length};
  cm.setCursor(newPos);
  cm.focus();
}
function mdInline(s){
  if (s==null) return "";
  return String(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
const SQL_HL_KEYWORDS = new Set(["SELECT","FROM","WHERE","AND","OR","NOT","AS","DISTINCT","JOIN","INNER","LEFT","RIGHT","FULL","OUTER","CROSS","ON","USING","GROUP","BY","ORDER","HAVING","LIMIT","ASC","DESC","INSERT","INTO","VALUES","UPDATE","SET","DELETE","IN","LIKE","BETWEEN","IS","NULL","EXISTS","UNION","ALL","ANY","CASE","WHEN","THEN","ELSE","END","COUNT","MIN","MAX","AVG","SUM","COALESCE","IFNULL","CONCAT","SUBSTR","SUBSTRING","LENGTH","CHAR_LENGTH","UPPER","LOWER","ROUND","NOW","DATE","STRFTIME"]);
function highlightSql(sql){
  if (sql==null) return "";
  const str = String(sql);
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([\p{L}_][\p{L}\p{N}_]*)|(\s+)|([^\sA-Za-z0-9_']+)/gu;
  let out = "", m;
  while ((m = re.exec(str)) !== null) {
    const tok = m[0];
    if (m[1] !== undefined) out += `<span class="tok-comment">${escapeHtml(tok)}</span>`;
    else if (m[2] !== undefined) out += `<span class="tok-str">${escapeHtml(tok)}</span>`;
    else if (m[3] !== undefined) out += `<span class="tok-num">${escapeHtml(tok)}</span>`;
