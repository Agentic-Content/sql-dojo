     {t:"EXISTS prüft nur: gibt es mindestens EINE Zeile?", merk:"EXISTS liefert wahr/falsch — nicht die Werte selbst, nur OB überhaupt etwas gefunden wurde.", b:"EXISTS steht mit einer Subquery dahinter. SQL prüft für jede Zeile der äußeren Abfrage: liefert die Subquery MINDESTENS eine Zeile? Wenn ja, ist die Bedingung wahr — WELCHE Werte die Subquery dabei liefert, ist völlig egal, deshalb schreibt man in der Subquery oft einfach SELECT 1 statt einer echten Spalte.", ex:"SELECT au_lname FROM authors a\nWHERE EXISTS (SELECT 1 FROM titleauthor ta WHERE ta.au_id = a.au_id);\n\n→ 19 von 23 Autor:innen (siehe Tabelle oben) — die mit mindestens einem Buch"},
     {t:"EXISTS ist fast immer eine correlated Subquery", merk:"Die Subquery bei EXISTS bezieht sich fast immer auf die äußere Zeile — genau wie bei correlated Subqueries.", b:"Damit EXISTS pro Zeile etwas Sinnvolles prüfen kann, verweist die Subquery normalerweise auf die aktuelle Zeile der äußeren Abfrage (hier: ta.au_id = a.au_id). Ohne diesen Bezug würde EXISTS für JEDE Zeile dasselbe liefern — immer wahr oder immer falsch, nicht besonders nützlich.", ex:"WHERE EXISTS (SELECT 1 FROM titleauthor ta WHERE ta.au_id = a.au_id)\n\n→ 'ta.au_id = a.au_id' verweist auf die äußere Zeile 'a' — für jede Autor:in wird neu geprüft"},
     {t:"NOT EXISTS — das Gegenteil, findet Fehlendes", merk:"NOT EXISTS findet Zeilen, für die die Subquery NICHTS liefert.", b:"Genau wie NOT IN das Gegenstück zu IN ist, ist NOT EXISTS das Gegenstück zu EXISTS. Praktisch für dieselbe Art von Frage wie NOT IN: 'zeig mir alles, wozu es KEINEN passenden Eintrag gibt'.", ex:"SELECT title FROM titles t\nWHERE NOT EXISTS (SELECT 1 FROM sales s WHERE s.title_id = t.title_id);\n\n→ dieselben 2 Titel wie beim NOT IN im Subquery-Thema: 'The Psychology of Computer Cooking' und 'Net Etiquette'"},
     {t:"EXISTS vs. IN — wann welches?", kind:"detail", merk:"Bei einfachen Wertlisten reicht IN. Bei mehreren Bedingungen ist EXISTS oft klarer — und bei NULL-Werten in der Subquery zuverlässiger.", b:"Für die meisten einfachen Fälle sind IN und EXISTS austauschbar und liefern dasselbe Ergebnis. EXISTS wird vor allem dann bevorzugt, wenn die Subquery mehrere Bedingungen braucht — dann ist der Code oft leichter zu lesen. Ein zweiter, weniger bekannter Grund: enthält die Subquery bei NOT IN irgendwo einen NULL-Wert, liefert NOT IN überraschend GAR KEIN Ergebnis mehr (getestet und bestätigt) — NOT EXISTS hat dieses Problem nicht.", ex:"Beide finden dieselben Autor:innen:\nWHERE au_id IN (SELECT au_id FROM titleauthor)\nWHERE EXISTS (SELECT 1 FROM titleauthor ta WHERE ta.au_id = a.au_id)"}
   ]},
  {id:"full_join", icon:"➕", color:"#f43f5e", title:"FULL JOIN",
   concept:"FULL JOIN zeigt ALLE Zeilen aus BEIDEN Tabellen, mit oder ohne Treffer auf der jeweils anderen Seite — quasi LEFT JOIN und RIGHT JOIN gleichzeitig. Fehlende Gegenstücke werden NULL, das kann jetzt auf beiden Seiten passieren.",
   example:"stores FULL JOIN discounts:<br>→ alle 6 Stores (auch ohne Rabatt) UND alle Rabatt-Einträge (auch ohne zugeordneten Store)",
   syntax:"SELECT ...\nFROM tabelleA a\nFULL JOIN tabelleB b ON a.spalte = b.spalte;",
   intro:"<b>Wozu brauchst du das überhaupt?</b> Du kennst schon LEFT JOIN (alles von links, Rest NULL) und RIGHT JOIN (alles von rechts, Rest NULL). FULL JOIN kombiniert beides: es zeigt ALLE Zeilen aus BEIDEN Tabellen — auch die, die auf der jeweils anderen Seite gar keinen Treffer haben. Genau da, wo bei LEFT JOIN Zeilen von rechts fehlen würden und bei RIGHT JOIN Zeilen von links fehlen würden, zeigt FULL JOIN einfach alles, mit NULL an den fehlenden Stellen.",
   worked:{
     note:"6 Stores, aber nur 1 hat einen eigenen Rabatt — und 2 Rabatte gehören zu KEINEM bestimmten Store:",
     headers:["stor_name","discounttype"],
     rows:[["Eric the Read Books","NULL"],["Bookbeat","Customer Discount"],["NULL","Initial Customer"],["NULL","Volume Discount"]],
   },
   lesson:[
     {t:"FULL JOIN zeigt alles von BEIDEN Seiten", merk:"FULL JOIN = LEFT JOIN + RIGHT JOIN gleichzeitig — nichts geht verloren, auf keiner Seite.", b:"FULL JOIN zeigt ALLE Zeilen der linken UND ALLE Zeilen der rechten Tabelle. Gibt es auf der jeweils anderen Seite keinen Treffer, stehen dort NULL-Werte — das kann jetzt auf BEIDEN Seiten passieren, nicht nur auf einer wie bei LEFT/RIGHT JOIN.", ex:"SELECT s.stor_name, d.discounttype\nFROM stores s\nFULL JOIN discounts d ON s.stor_id = d.stor_id;\n\n→ alle 6 Stores UND alle Rabatt-Einträge, auch die ohne Gegenstück (siehe Tabelle oben)"},
     {t:"Erkennen, wo genau eine Zeile 'einsam' ist", merk:"IS NULL auf der jeweils anderen Seite zeigt dir, wo eine Zeile ohne Gegenstück geblieben ist.", b:"Nach einem FULL JOIN kannst du mit WHERE ... IS NULL gezielt nachschauen, welche Zeilen auf der einen oder anderen Seite kein Gegenstück gefunden haben — praktisch, um z.B. 'Stores ohne Rabatt' oder 'Rabatte ohne zugeordneten Store' herauszufiltern.", ex:"... WHERE d.discounttype IS NULL;\n→ nur Stores OHNE eigenen Rabatt (aus der Tabelle oben: Eric the Read Books)\n\n... WHERE s.stor_name IS NULL;\n→ nur Rabatte OHNE zugeordneten Store (Initial Customer, Volume Discount)"},
     {t:"FULL JOIN, LEFT JOIN oder RIGHT JOIN — welches brauchst du wirklich?", merk:"Willst du wirklich nichts verlieren, auf keiner Seite: FULL JOIN. Reicht eine Basistabelle: LEFT oder RIGHT.", b:"FULL JOIN ist der Sonderfall für 'zeig mir wirklich alles, von beiden Seiten' — in der Praxis brauchst du das seltener als LEFT JOIN, weil meistens EINE der beiden Tabellen klar die 'Basis' ist (siehe JOIN-Thema: 'welche Tabelle kommt nach links'). FULL JOIN lohnt sich vor allem, wenn beide Seiten gleichberechtigt sind und du gezielt nach Lücken auf BEIDEN Seiten suchst.", ex:"Nur Stores, auch ohne Rabatt → LEFT JOIN reicht.\nNur Rabatte, auch ohne Store → RIGHT JOIN reicht.\nBeides gleichzeitig, nichts verlieren → FULL JOIN."}
   ]},
];

const QUESTIONS = [{"id": "select-1", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle Spalten und Zeilen aus der Tabelle authors aus.", "sql": "SELECT * FROM authors", "test_params": [{}]}, {"id": "select-2", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname (au_fname, au_lname) aller Autor:innen aus.", "sql": "SELECT au_fname, au_lname FROM authors", "test_params": [{}]}, {"id": "select-3", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle den Vornamen aller Autor:innen aus, aber benenne die Spalte in der Ausgabe in first_name um (AS).", "sql": "SELECT au_fname AS first_name FROM authors", "test_params": [{}]}, {"id": "select-4", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle unterschiedlichen (keine Duplikate) Nachnamen der Autor:innen aus (DISTINCT).", "sql": "SELECT DISTINCT au_lname FROM authors", "test_params": [{}]}, {"id": "select-5", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle alle eindeutigen title_id aus, die jemals in der Tabelle sales verkauft wurden.", "sql": "SELECT DISTINCT title_id FROM sales", "test_params": [{}]}, {"id": "select-6", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle title, price und ytd_sales aus der Tabelle titles aus.", "sql": "SELECT title, price, ytd_sales FROM titles", "test_params": [{}]}, {"id": "select-7", "topic": "select_from", "difficulty": 2, "de_prompt": "Wähle job_id und job_desc aus der Tabelle jobs aus. Benenne die Spalten in der Ausgabe in id und description um.", "sql": "SELECT job_id AS id, job_desc AS description FROM jobs", "test_params": [{}]}, {"id": "select-8", "topic": "select_from", "difficulty": 1, "de_prompt": "Wähle die Namen aller Verlage (pub_name) aus der Tabelle publishers aus.", "sql": "SELECT pub_name FROM publishers", "test_params": [{}]}, {"id": "where-1", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname der Autor:innen mit Nachname 'Ringer' aus.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname = 'Ringer'", "test_params": [{}]}, {"id": "where-2", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Vor- und Nachname der Autor:innen mit Nachname '{lname}' aus.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname = '{lname}'", "param_pool": {"lname": ["Carson", "Green", "White", "Dull", "Smith", "Straight", "Bennet"]}, "test_params": [{"lname": "Carson"}, {"lname": "Green"}, {"lname": "White"}]}, {"id": "where-3", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Bestellnummer, Bestelldatum und Menge aus sales aus, bei denen genau {qty} Bücher verkauft wurden.", "sql": "SELECT ord_num, ord_date, qty FROM sales WHERE qty = {qty}", "param_pool": {"qty": [3, 5, 10, 15, 20, 25, 30, 35, 40, 50, 75]}, "allow_empty": true, "test_params": [{"qty": 20}, {"qty": 15}, {"qty": 75}]}, {"id": "where-4", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vor- und Nachname der Autor:innen aus, deren Vorname 'Anne' UND Nachname 'Ringer' ist.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_fname = 'Anne' AND au_lname = 'Ringer'", "test_params": [{}]}, {"id": "where-5", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name und Stadt aller Verlage aus, die entweder in Deutschland ('Germany') ODER Frankreich ('France') sitzen.", "sql": "SELECT pub_name, city FROM publishers WHERE country = 'Germany' OR country = 'France'", "test_params": [{}]}, {"id": "where-6", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vorname, Nachname und Stadt der Autor:innen aus, deren Vorname 'Dean' ist UND die entweder aus 'Oakland' oder 'Berkeley' kommen. Tipp: Klammern nicht vergessen.", "sql": "SELECT au_fname, au_lname, city FROM authors WHERE au_fname = 'Dean' AND (city = 'Oakland' OR city = 'Berkeley')", "test_params": [{}]}, {"id": "where-7", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name, Stadt und Land aller Verlage aus, die NICHT in den USA sitzen.", "sql": "SELECT pub_name, city, country FROM publishers WHERE country != 'USA'", "test_params": [{}]}, {"id": "where-8", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Vorname, Nachname und Stadt der Autor:innen aus 'Oakland' oder 'Berkeley', deren Nachname NICHT 'Straight' ist.", "sql": "SELECT au_fname, au_lname, city FROM authors WHERE (city = 'Oakland' OR city = 'Berkeley') AND au_lname != 'Straight'", "test_params": [{}]}, {"id": "where-9", "topic": "where", "difficulty": 2, "de_prompt": "Wähle Name, Stadt, Bundesland und Land aller Verlage aus, bei denen das Bundesland (state) fehlt (IS NULL).", "sql": "SELECT pub_name, city, state, country FROM publishers WHERE state IS NULL", "test_params": [{}]}, {"id": "where-10", "topic": "where", "difficulty": 1, "de_prompt": "Wähle Name, Stadt und Bundesland aller Stores aus, die NICHT in Kalifornien ('CA') liegen. Probier diesmal <> statt !=.", "sql": "SELECT stor_name, city, state FROM stores WHERE state <> 'CA'", "test_params": [{}]}, {"id": "sort-1", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wähle title und ytd_sales aus titles aus, aufsteigend sortiert nach ytd_sales.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales", "sortCol": 1, "sortDir": "asc", "test_params": [{}]}, {"id": "sort-2", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wiederhole die letzte Abfrage, aber sortiere diesmal absteigend.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "sort-3", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wähle die Top 5 Titel mit den meisten ytd_sales aus.", "sql": "SELECT title, ytd_sales FROM titles ORDER BY ytd_sales DESC LIMIT 5", "test_params": [{}]}, {"id": "sort-4", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Was ist die maximale Anzahl an Büchern, die jemals in einer einzigen Bestellung verkauft wurde?", "sql": "SELECT MAX(qty) FROM sales", "test_params": [{}], "alt": {"sql": "SELECT title_id, qty FROM sales ORDER BY qty DESC LIMIT 1", "note": "MAX() ist kompakter und macht sofort klar, dass du einen Extremwert suchst — du bekommst aber nur die Zahl selbst. ORDER BY + LIMIT 1 ist etwas länger, zeigt dir dafür die ganze Zeile, z.B. WELCHE Bestellung das war."}}, {"id": "sort-5", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Was kostet das günstigste Buch (MIN)?", "sql": "SELECT MIN(price) FROM titles", "test_params": [{}], "alt": {"sql": "SELECT title, price FROM titles WHERE price IS NOT NULL ORDER BY price LIMIT 1", "note": "Gleiches Prinzip wie bei MAX(): MIN() liefert nur die Zahl, ORDER BY + LIMIT zeigt zusätzlich, welcher Titel das ist. Achte bei ORDER BY auf NULL-Werte — die stehen bei ASC ganz vorne, deshalb hier WHERE price IS NOT NULL."}}, {"id": "sort-6", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wie viele Zeilen gibt es in der Tabelle authors?", "sql": "SELECT COUNT(*) FROM authors", "test_params": [{}]}, {"id": "sort-7", "topic": "sort_agg", "difficulty": 1, "de_prompt": "Wie hoch ist die Summe aller year-to-date sales (ytd_sales)?", "sql": "SELECT SUM(ytd_sales) FROM titles", "test_params": [{}]}, {"id": "sort-8", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist der durchschnittliche Buchpreis, gerundet auf 2 Nachkommastellen?", "sql": "SELECT ROUND(AVG(price), 2) FROM titles", "test_params": [{}]}, {"id": "sort-9", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wähle in einer einzigen Abfrage Anzahl, Durchschnitt und Summe der qty aus sales aus.", "sql": "SELECT COUNT(qty), AVG(qty), SUM(qty) FROM sales", "test_params": [{}]}, {"id": "sort-10", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist die durchschnittliche verkaufte Menge (qty) für den Store mit der stor_id '{stor_id}'?", "sql": "SELECT AVG(qty) FROM sales WHERE stor_id = '{stor_id}'", "param_pool": {"stor_id": ["6380", "7066", "7067", "7131", "7896", "8042"]}, "allow_empty": true, "test_params": [{"stor_id": "7131"}, {"stor_id": "7067"}, {"stor_id": "8042"}]}, {"id": "sort-11", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Wie hoch ist der durchschnittliche Preis der Bücher vom Typ '{type}'?", "sql": "SELECT AVG(price) FROM titles WHERE type = '{type}'", "param_pool": {"type": ["business", "mod_cook", "psychology", "trad_cook", "popular_comp"]}, "test_params": [{"type": "psychology"}, {"type": "business"}, {"type": "trad_cook"}]}, {"id": "sort-12", "topic": "sort_agg", "difficulty": 2, "de_prompt": "Aus wie vielen unterschiedlichen Bundesstaaten kommen unsere Autor:innen (COUNT DISTINCT)?", "sql": "SELECT COUNT(DISTINCT state) FROM authors", "test_params": [{}]}, {"id": "pattern-1", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Buchtitel aus, die das Wort 'cooking' enthalten (LIKE).", "sql": "SELECT title FROM titles WHERE title LIKE '%cooking%'", "test_params": [{}]}, {"id": "pattern-2", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Titel aus, die mit 'The' beginnen.", "sql": "SELECT title FROM titles WHERE title LIKE 'The%'", "test_params": [{}]}, {"id": "pattern-3", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Vor- und Nachname der Autor:innen aus, deren Nachname mit '{letter}' beginnt.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_lname LIKE '{letter}%'", "param_pool": {"letter": ["S", "C", "G", "D", "B", "M"]}, "allow_empty": true, "test_params": [{"letter": "S"}, {"letter": "C"}, {"letter": "G"}]}, {"id": "pattern-4", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle Name und Adresse aller Stores aus, deren Adresse auf 'Ave.' endet.", "sql": "SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.'", "test_params": [{}]}, {"id": "pattern-5", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Name und Adresse aller Stores aus, die in einer 'Ave.' ODER 'St.' liegen.", "sql": "SELECT stor_name, stor_address FROM stores WHERE stor_address LIKE '%Ave.' OR stor_address LIKE '%St.'", "test_params": [{}]}, {"id": "pattern-6", "topic": "pattern", "difficulty": 2, "de_prompt": "In der Tabelle employee steckt im emp_id ein Muster, das zeigt, ob die Person weiblich oder männlich ist. Wähle alle Mitarbeitenden aus, deren emp_id auf 'F' endet.", "sql": "SELECT * FROM employee WHERE emp_id LIKE '%F'", "test_params": [{}]}, {"id": "pattern-7", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle Name und Bundesstaat aller Stores aus, die entweder in Kalifornien ('CA') oder Oregon ('OR') liegen. Benutze IN.", "sql": "SELECT stor_name, state FROM stores WHERE state IN ('CA', 'OR')", "test_params": [{}]}, {"id": "pattern-8", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Titel vom Typ 'psychology', 'mod_cook' oder 'trad_cook' aus (IN).", "sql": "SELECT title FROM titles WHERE type IN ('psychology', 'mod_cook', 'trad_cook')", "test_params": [{}]}, {"id": "pattern-9", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle alle Autor:innen aus, die NICHT aus 'Salt Lake City', 'Ann Arbor' oder 'Oakland' kommen (NOT IN).", "sql": "SELECT * FROM authors WHERE city NOT IN ('Salt Lake City', 'Ann Arbor', 'Oakland')", "test_params": [{}]}, {"id": "pattern-10", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Bestellnummern aus sales aus, bei denen zwischen 25 und 45 Büchern verkauft wurden (BETWEEN).", "sql": "SELECT ord_num FROM sales WHERE qty BETWEEN 25 AND 45", "test_params": [{}]}, {"id": "pattern-11", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle Titel und Preis aller Bücher aus, deren Preis zwischen {lo} und {hi} liegt.", "sql": "SELECT title, price FROM titles WHERE price BETWEEN {lo} AND {hi}", "param_pool": {"lo_hi": [[5, 10], [10, 15], [15, 20], [8, 12]]}, "allow_empty": true, "test_params": [{"lo": 5, "hi": 10}, {"lo": 10, "hi": 15}, {"lo": 15, "hi": 20}]}, {"id": "pattern-12", "topic": "pattern", "difficulty": 1, "de_prompt": "Wähle alle Verkäufe aus, die zwischen '1993-03-11' und '1994-09-13' getätigt wurden (BETWEEN mit Datum).", "sql": "SELECT * FROM sales WHERE ord_date BETWEEN '1993-03-11' AND '1994-09-13'", "test_params": [{}]}, {"id": "pattern-13", "topic": "pattern", "difficulty": 2, "de_prompt": "Wähle die Nachnamen der Autor:innen aus, die mit 'D' beginnen UND genau 4 Buchstaben lang sind. Tipp: dafür brauchst du den Unterstrich-Platzhalter _, nicht %.", "sql": "SELECT au_lname FROM authors WHERE au_lname LIKE 'D___'", "test_params": [{}]}, {"id": "group-1", "topic": "group_having", "difficulty": 1, "de_prompt": "Finde die Gesamtzahl der Autor:innen pro Bundesstaat (GROUP BY state).", "sql": "SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state", "test_params": [{}], "alt": {"sql": "SELECT state, COUNT(au_id) AS total_authors FROM authors GROUP BY state", "note": "COUNT(*) zählt alle Zeilen, COUNT(au_id) nur Zeilen, in denen au_id nicht NULL ist. Hier macht es keinen Unterschied, weil au_id ein Primärschlüssel ist (nie NULL). Bei Spalten, die NULL enthalten können, liefern beide Varianten unterschiedliche Ergebnisse — dann bewusst wählen!"}}, {"id": "group-2", "topic": "group_having", "difficulty": 2, "de_prompt": "Wiederhole die letzte Abfrage, aber sortiere absteigend nach der Anzahl.", "sql": "SELECT state, COUNT(*) AS total_authors FROM authors GROUP BY state ORDER BY total_authors DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "group-3", "topic": "group_having", "difficulty": 2, "de_prompt": "Was ist der Preis des teuersten Titels pro Verlag (GROUP BY pub_id)?", "sql": "SELECT pub_id, ROUND(MAX(price),2) AS max_price FROM titles GROUP BY pub_id", "test_params": [{}]}, {"id": "group-4", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde die Top 3 Stores mit den meisten verkauften Büchern (SUM(qty)).", "sql": "SELECT stor_id, SUM(qty) AS total_qty FROM sales GROUP BY stor_id ORDER BY total_qty DESC LIMIT 3", "test_params": [{}]}, {"id": "group-5", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde das durchschnittliche job_lvl pro job_id aus employee, aufsteigend sortiert.", "sql": "SELECT job_id, AVG(job_lvl) AS avg_lvl FROM employee GROUP BY job_id ORDER BY avg_lvl ASC", "sortCol": 1, "sortDir": "asc", "test_params": [{}]}, {"id": "group-6", "topic": "group_having", "difficulty": 2, "de_prompt": "Finde für jede Kombination aus Buchtyp (type) und Verlag (pub_id), wie viele Bücher es gibt.", "sql": "SELECT type, pub_id, COUNT(*) AS book_number FROM titles GROUP BY type, pub_id", "test_params": [{}]}, {"id": "group-7", "topic": "group_having", "difficulty": 2, "de_prompt": "Erweitere die letzte Abfrage um den durchschnittlichen Preis pro Kombination, gerundet auf 2 Nachkommastellen.", "sql": "SELECT type, pub_id, COUNT(*) AS qty, ROUND(AVG(price),2) AS avg_price FROM titles GROUP BY type, pub_id", "test_params": [{}]}, {"id": "group-8", "topic": "group_having", "difficulty": 3, "de_prompt": "Behalte aus der letzten Abfrage nur die Kombinationen mit einem Durchschnittspreis über 12 (HAVING statt WHERE!).", "sql": "SELECT type, pub_id, COUNT(*) AS numb, AVG(price) AS avg_price FROM titles GROUP BY type, pub_id HAVING avg_price > 12", "test_params": [{}]}, {"id": "group-9", "topic": "group_having", "difficulty": 3, "de_prompt": "Zeige alle Bundesstaaten und Städte, in denen es {n} oder mehr Autor:innen mit Vertrag gibt (SUM(contract) >= {n}).", "sql": "SELECT state, city, SUM(contract) AS sum_contract FROM authors GROUP BY state, city HAVING sum_contract >= {n}", "param_pool": {"n": [1, 2]}, "test_params": [{"n": 1}, {"n": 2}]}, {"id": "join-1", "topic": "joins", "difficulty": 1, "de_prompt": "Wähle die Bestellnummer (ord_num) aus sales aus, gib der Tabelle den Alias 's' und benutze die Schreibweise s.ord_num.", "sql": "SELECT s.ord_num FROM sales AS s", "test_params": [{}]}, {"id": "join-2", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Titel und Verlagsname aller Bücher aus (auch wenn kein Verlag zugeordnet ist).", "sql": "SELECT t.title, p.pub_name FROM titles t LEFT JOIN publishers p ON t.pub_id = p.pub_id", "test_params": [{}]}, {"id": "join-3", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Bestellnummer, Menge und Buchtitel für alle Verkäufe aus (nutze USING).", "sql": "SELECT s.ord_num, s.qty, t.title FROM sales s LEFT JOIN titles t USING(title_id)", "test_params": [{}]}, {"id": "join-4", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle den vollständigen Namen aller Mitarbeitenden und den Namen des Verlags, für den sie arbeiten.", "sql": "SELECT e.fname, e.minit, e.lname, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id", "test_params": [{}]}, {"id": "join-5", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle den vollständigen Namen und die Jobbezeichnung (job_desc) aller Mitarbeitenden aus.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc FROM employee e LEFT JOIN jobs j ON e.job_id = j.job_id", "test_params": [{}]}, {"id": "join-6", "topic": "joins", "difficulty": 3, "de_prompt": "Wähle Name, Jobbezeichnung und Verlagsname aller Mitarbeitenden aus – dafür brauchst du zwei JOINs in einer Abfrage.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e LEFT JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id", "test_params": [{}]}, {"id": "join-7", "topic": "joins", "difficulty": 3, "de_prompt": "Wähle Name, Jobbezeichnung und Verlagsname der Mitarbeitenden aus, die für '{pub_name}' arbeiten.", "sql": "SELECT e.fname, e.minit, e.lname, j.job_desc, p.pub_name FROM employee e INNER JOIN publishers p ON e.pub_id = p.pub_id LEFT JOIN jobs j ON e.job_id = j.job_id WHERE p.pub_name = '{pub_name}'", "param_pool": {"pub_name": ["New Moon Books", "Binnet & Hardley", "Algodata Infosystems", "Five Lakes Publishing", "Ramona Publishers", "GGG&G", "Scootney Books", "Lucerne Publishing"]}, "allow_empty": true, "test_params": [{"pub_name": "Binnet & Hardley"}, {"pub_name": "New Moon Books"}, {"pub_name": "Algodata Infosystems"}]}, {"id": "join-8", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Verlagsname und PR-Info (pub_info) aller Verlage aus Berkeley, Kalifornien aus.", "sql": "SELECT p.pub_name, pubi.pr_info FROM publishers p LEFT JOIN pub_info pubi USING(pub_id) WHERE p.city = 'Berkeley' AND p.state = 'CA'", "test_params": [{}]}, {"id": "join-9", "topic": "joins", "difficulty": 2, "de_prompt": "Wähle Name, stor_id, Rabatttyp und Rabatt (discounttype, discount) aus discounts für ALLE Stores – auch die ohne Rabatt.", "sql": "SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s LEFT JOIN discounts d USING(stor_id)", "test_params": [{}]}, {"id": "join-10", "topic": "joins", "difficulty": 2, "de_prompt": "Wiederhole die letzte Abfrage, aber zeige nur Stores an, die tatsächlich einen Rabatt anbieten.", "sql": "SELECT s.stor_name, s.stor_id, d.discounttype, d.discount FROM stores s INNER JOIN discounts d USING(stor_id)", "test_params": [{}]}, {"id": "join-11", "topic": "joins", "difficulty": 2, "de_prompt": "Nutze RIGHT JOIN: Wähle Rabatttyp und Store-Name aller Einträge aus discounts aus.", "sql": "SELECT d.discounttype, s.stor_name FROM discounts d LEFT JOIN stores s USING(stor_id)", "test_params": [{}]}, {"id": "case-1", "topic": "case", "difficulty": 2, "de_prompt": "Wähle alles aus sales aus und füge eine neue Spalte sales_category hinzu: qty >= 50 'high sales', 20 <= qty < 50 'medium sales', sonst 'low sales'.", "sql": "SELECT *, CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category FROM sales", "test_params": [{}], "alt": {"sql": "SELECT *, CASE WHEN qty < 20 THEN 'low sales' WHEN qty < 50 THEN 'medium sales' ELSE 'high sales' END AS sales_category FROM sales", "note": "Beide Varianten liefern hier dasselbe Ergebnis, weil sich die Bedingungen nicht überschneiden — einmal fängst du oben (größter Wert zuerst) an, einmal unten (kleinster Wert zuerst) und sparst dir dadurch eine Bedingung. Wichtig: sobald sich Bedingungen überschneiden könnten, entscheidet allein die Reihenfolge der WHEN-Zeilen, welche Kategorie gewinnt — SQL prüft von oben nach unten und nimmt die erste, die passt."}}, {"id": "case-2", "topic": "case", "difficulty": 3, "de_prompt": "Berechne für jede der drei sales_category (high/medium/low sales) die Gesamtmenge verkaufter Bücher (SUM(qty)).", "sql": "SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category", "test_params": [{}]}, {"id": "case-3", "topic": "case", "difficulty": 3, "de_prompt": "Erweitere die letzte Abfrage: zeige nur Kategorien mit einer Summe über 100, absteigend sortiert.", "sql": "SELECT CASE WHEN qty >= 50 THEN 'high sales' WHEN qty >= 20 AND qty < 50 THEN 'medium sales' ELSE 'low sales' END AS sales_category, SUM(qty) AS total_sold FROM sales GROUP BY sales_category HAVING total_sold > 100 ORDER BY total_sold DESC", "sortCol": 1, "sortDir": "desc", "test_params": [{}]}, {"id": "case-4", "topic": "case", "difficulty": 3, "de_prompt": "Finde den durchschnittlichen Buchpreis pro Verlag für die Preiskategorien <=5 'super low', <=10 'low', <=15 'medium', sonst 'high'. Beschränke dich auf die Typen 'business', 'trad_cook' und 'psychology'. Runde den Durchschnitt.", "sql": "SELECT pub_id, CASE WHEN price <= 5 THEN 'super low' WHEN price <= 10 THEN 'low' WHEN price <= 15 THEN 'medium' ELSE 'high' END AS price_category, ROUND(AVG(price)) AS average_price FROM titles WHERE type IN ('business','trad_cook','psychology') GROUP BY pub_id, price_category", "test_params": [{}]}, {"id": "sub-1", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde den Namen des Verlags mit dem höchsten Vorschuss (advance) – benutze eine Subquery.", "sql": "SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles ORDER BY advance DESC LIMIT 1)", "test_params": [{}], "alt": {"sql": "SELECT pub_name FROM publishers WHERE pub_id IN (SELECT pub_id FROM titles WHERE advance = (SELECT MAX(advance) FROM titles))", "note": "Die erste Variante (ORDER BY + LIMIT 1) ist kürzer. Die zweite mit MAX() in einer zweiten Subquery ist etwas länger, verhält sich aber anders bei einem Gleichstand: sie zeigt ALLE Verlage mit dem Höchstwert, nicht nur einen zufälligen."}}, {"id": "sub-2", "topic": "subquery", "difficulty": 2, "de_prompt": "Liste die Titel aller Bücher auf, die von Verlagen aus 'Boston' veröffentlicht wurden.", "sql": "SELECT title FROM titles WHERE pub_id IN (SELECT pub_id FROM publishers WHERE city = 'Boston')", "test_params": [{}], "alt": {"sql": "SELECT t.title FROM titles t JOIN publishers p USING(pub_id) WHERE p.city = 'Boston'", "note": "Die Subquery ist gut lesbar, wenn du nur EINE Bedingung aus der anderen Tabelle brauchst. Sobald du zusätzlich Spalten aus der anderen Tabelle mit ausgeben willst (z.B. den Verlagsnamen selbst), lohnt sich der JOIN, weil die Subquery dir diese Spalten gar nicht zur Verfügung stellt."}}, {"id": "sub-3", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde die Autor:innen, die mehr als ein Buch geschrieben haben.", "sql": "SELECT au_fname, au_lname FROM authors WHERE au_id IN (SELECT au_id FROM titleauthor GROUP BY au_id HAVING COUNT(title_id) > 1)", "test_params": [{}], "alt": {"sql": "SELECT au_fname, au_lname FROM authors a WHERE (SELECT COUNT(*) FROM titleauthor ta WHERE ta.au_id = a.au_id) > 1", "note": "Beide kommen zum gleichen Ergebnis. Die GROUP BY/HAVING-Subquery läuft nur EINMAL komplett durch titleauthor. Die correlated Subquery rechnet für JEDE Zeile aus authors neu nach — bei kleinen Tabellen wie hier egal, bei großen Datenmengen spürbar langsamer."}}, {"id": "sub-4", "topic": "subquery", "difficulty": 3, "de_prompt": "Liste alle Autor:innen mit der Anzahl ihrer Bücher auf – benutze eine correlated Subquery im SELECT-Teil.", "sql": "SELECT au_lname, au_fname, (SELECT COUNT(title_id) FROM titleauthor ta WHERE ta.au_id = a.au_id) AS book_no FROM authors a", "test_params": [{}]}, {"id": "sub-5", "topic": "subquery", "difficulty": 3, "de_prompt": "Finde alle Titel, deren Preis mehr als {pct}% über dem Durchschnittspreis liegt.", "sql": "SELECT title, price FROM titles WHERE price > (SELECT AVG(price) * {factor} FROM titles)", "param_pool": {"pct_factor": [[10, 1.1], [20, 1.2], [15, 1.15]]}, "allow_empty": true, "test_params": [{"pct": 10, "factor": 1.1}, {"pct": 20, "factor": 1.2}]}, {"id": "sub-6", "topic": "subquery", "difficulty": 2, "de_prompt": "Finde den Namen des Verlags, der die meisten Bücher veröffentlicht hat.", "sql": "SELECT pub_name FROM publishers WHERE pub_id = (SELECT pub_id FROM titles GROUP BY pub_id ORDER BY COUNT(*) DESC LIMIT 1)", "test_params": [{}], "alt": {"sql": "SELECT p.pub_name FROM publishers p JOIN titles t ON p.pub_id = t.pub_id GROUP BY p.pub_name ORDER BY COUNT(t.title_id) DESC LIMIT 1", "note": "Die Subquery mit LIMIT 1 ist kurz und funktioniert gut, wenn du wirklich nur den EINEN Spitzenreiter brauchst. Der JOIN mit GROUP BY ist die bessere Basis, wenn du die Abfrage später erweitern willst — z.B. auf die Top 5 statt nur Platz 1."}}, {"id": "sub-7", "topic": "subquery", "difficulty": 2, "de_prompt": "Liste die Titel auf, die noch nie verkauft wurden (NOT IN).", "sql": "SELECT title FROM titles WHERE title_id NOT IN (SELECT title_id FROM sales)", "test_params": [{}]}, {"id": "sub-8", "topic": "subquery", "difficulty": 3, "de_prompt": "Finde die Mitarbeitenden mit demselben Job wie '{fname} {lname}'.", "sql": "SELECT fname, lname, job_id FROM employee WHERE job_id = (SELECT job_id FROM employee WHERE fname = '{fname}' AND lname = '{lname}')", "param_pool": {"name": [["Aria", "Cruz"], ["Annette", "Roulet"], ["Ann", "Devon"], ["Carlos", "Hernadez"], ["Daniel", "Tonini"]]}, "test_params": [{"fname": "Aria", "lname": "Cruz"}, {"fname": "Daniel", "lname": "Tonini"}]}, {"id": "func-1", "topic": "functions", "difficulty": 1, "de_prompt": "Füge eine Spalte hinzu, die zeigt /* ================= MySQL-Kompatibilitätsschicht ================= */

function mysqlCompat(sql){
  sql = sql.replace(/\bLEFT\s*\(/gi, "LEFTSTR(");
  sql = sql.replace(/\bRIGHT\s*\(/gi, "RIGHTSTR(");
  sql = sql.replace(/(TIMESTAMPDIFF\s*\(\s*)(YEAR|MONTH|DAY|WEEK|HOUR|MINUTE|SECOND)(\s*,)/gi, "$1'$2'$3");
  sql = sql.replace(/^\s*USE\s+\w+\s*;?\s*/i, "");
  return sql;
}

function parseSqlDate(s){
  if (s===null || s===undefined) return null;
  const datePart = String(s).split(" ")[0];
  const d = new Date(datePart+"T00:00:00Z");
  return isNaN(d.getTime()) ? null : d;
}

const MONTHS_DE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS_DE = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function registerUdfs(db){
  db.create_function("CONCAT", function(...args){
    if (args.some(a=>a===null||a===undefined)) return null;
    return args.join("");
  });
  db.create_function("LEFTSTR", function(s,n){ return s===null ? null : String(s).slice(0, Number(n)); });
  db.create_function("RIGHTSTR", function(s,n){
    if (s===null) return null;
    n = Number(n);
    return n>0 ? String(s).slice(-n) : "";
  });
  db.create_function("CURDATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("CURRENT_DATE", function(){ return new Date().toISOString().slice(0,10); });
  db.create_function("DATEDIFF", function(a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    return Math.round((da-db_)/86400000);
  });
  db.create_function("TIMESTAMPDIFF", function(unit,a,b){
    const da=parseSqlDate(a), db_=parseSqlDate(b);
    if (!da || !db_) return null;
    const days = Math.round((db_-da)/86400000);
    unit = String(unit).toUpperCase();
    if (unit==="DAY") return days;
    if (unit==="YEAR"){
      let y = db_.getUTCFullYear()-da.getUTCFullYear();
      if ((db_.getUTCMonth()<da.getUTCMonth()) || (db_.getUTCMonth()===da.getUTCMonth() && db_.getUTCDate()<da.getUTCDate())) y--;
      return y;
    }
    if (unit==="MONTH"){
      let m = (db_.getUTCFullYear()-da.getUTCFullYear())*12 + (db_.getUTCMonth()-da.getUTCMonth());
      if (db_.getUTCDate() < da.getUTCDate()) m--;
      return m;
    }
    return days;
  });
  db.create_function("DATE_FORMAT", function(s, fmt){
    const d = parseSqlDate(s);
    if (!d) return null;
    let out = "";
    for (let i=0;i<fmt.length;i++){
      if (fmt[i]==="%" && i+1<fmt.length){
        const spec = fmt[i+1];
        if (spec==="Y") out += String(d.getUTCFullYear()).padStart(4,"0");
        else if (spec==="m") out += String(d.getUTCMonth()+1).padStart(2,"0");
        else if (spec==="d") out += String(d.getUTCDate()).padStart(2,"0");
        else if (spec==="e") out += String(d.getUTCDate());
        else if (spec==="M") out += MONTHS_DE[d.getUTCMonth()];
        else if (spec==="W") out += WEEKDAYS_DE[(d.getUTCDay()+6)%7];
        else out += spec;
        i++;
      } else out += fmt[i];
    }
    return out;
  });
  db.create_function("CHAR_LENGTH", function(s){ return s===null ? null : String(s).length; });
}

function rewriteRightJoin(sql){
  const m = sql.match(/^(.*?FROM\s+)([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+RIGHT\s+JOIN\s+([`"\w]+(?:\s+(?:AS\s+)?[`"\w]+)?)\s+(ON\s+[\s\S]+?|USING\s*\([\s\S]+?\))(\s+(?:WHERE|GROUP BY|ORDER BY|LIMIT)[\s\S]*)?$/i);
  if (!m) return null;
  const [, pre, tblA, tblB, cond, rest] = m;
  return `${pre}${tblB} LEFT JOIN ${tblA} ${cond}${rest||""}`;
}

function execSqlRaw(sql){
  const res = db.exec(sql);
  if (!res.length) return {columns:[], values:[]};
  return res[res.length-1];
}

function execSqlSafe(sql){
  try{
    return execSqlRaw(sql);
  }catch(e){
    if (/RIGHT\s+JOIN/i.test(sql) && /RIGHT and FULL OUTER JOINs? are not (currently )?supported/i.test(e.message)){
      const rewritten = rewriteRightJoin(sql);
      if (rewritten){ return execSqlRaw(rewritten); }
    }
    throw e;
  }
}

function base64ToUint8Array(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ================= Fragen-Engine ================= */

function fillTemplate(tpl, params){
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (params[k]!==undefined ? params[k] : m));
}

function pickParams(q){
  if (!q.param_pool) return {};
  const pool = q.param_pool;
  const result = {};
  for (const key of Object.keys(pool)){
    const values = pool[key];
    const choice = values[Math.floor(Math.random()*values.length)];
    if (Array.isArray(choice)){
      if (key==="lo_hi"){ result.lo=choice[0]; result.hi=choice[1]; }
      else if (key==="pct_factor"){ result.pct=choice[0]; result.factor=choice[1]; }
      else if (key==="name"){ result.fname=choice[0]; result.lname=choice[1]; }
    } else {
      result[key] = choice;
    }
  }
  return result;
}

function buildInstance(q){
  const params = pickParams(q);
  const sql = mysqlCompat(fillTemplate(q.sql, params));
  const promptText = fillTemplate(q.de_prompt, params);
  let refResult = null, refError = null;
  try{ refResult = execSqlSafe(sql); }
  catch(e){ refError = e.message; }
  return {qdef:q, params, sql, promptText, refResult, refError};
}

function normVal(v){
  if (v===null || v===undefined) return null;
  if (typeof v === "number") return Math.round(v*10000)/10000;
  if (typeof v === "string") return v.trim();
  return v;
}
function rowKey(row){ return row.map(v=>String(v)).join(""); }

function compareResults(expected, actual){
  if (!expected) return {ok:false, reason:"no_reference"};
  if (expected.columns.length !== actual.columns.length){
    return {ok:false, reason:"column_count", expCols:expected.columns.length, actCols:actual.columns.length};
  }
  const exp = expected.values.map(r=>r.map(normVal));
  const act = actual.values.map(r=>r.map(normVal));
  if (exp.length !== act.length){
    return {ok:false, reason:"row_count", expRows:exp.length, actRows:act.length};
  }
  const expSorted = [...exp].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  const actSorted = [...act].sort((a,b)=> rowKey(a)<rowKey(b) ? -1 : (rowKey(a)>rowKey(b) ? 1 : 0));
  for (let i=0;i<expSorted.length;i++){
    for (let j=0;j<expSorted[i].length;j++){
      if (expSorted[i][j] !== actSorted[i][j]) return {ok:false, reason:"value_mismatch"};
    }
  }
  return {ok:true};
}

function checkMonotonic(actual, colIdx, dir){
  const vals = actual.values.map(r=>r[colIdx]);
  for (let i=1;i<vals.length;i++){
    const a=vals[i-1], b=vals[i];
    if (a===null||b===null) continue;
    if (dir==="asc" && a>b) return false;
    if (dir==="desc" && a<b) return false;
  }
  return true;
}

function gradeAnswer(inst, actual){
  const cmp = compareResults(inst.refResult, actual);
  if (!cmp.ok) return cmp;
  if (inst.qdef.sortCol !== undefined){
    if (!checkMonotonic(actual, inst.qdef.sortCol, inst.qdef.sortDir)){
      return {ok:false, reason:"sort_missing"};
    }
  }
  return {ok:true};
}

function explainFailure(reason, extra, topic){
  const t = TOPICS.find(x=>x.id===topic);
  switch(reason){
    case "column_count":
      return `Deine Abfrage liefert <b>${extra.actCols}</b> Spalte(n), erwartet werden <b>${extra.expCols}</b>. Schau nochmal in der Aufgabenstellung nach, welche Spalten genau gefragt sind.`;
    case "row_count":
      if (extra.actRows > extra.expRows)
        return `Deine Abfrage liefert <b>mehr Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich filtert deine Bedingung nicht genug ein.<br><br>${t.concept}`;
      return `Deine Abfrage liefert <b>weniger Zeilen</b> (${extra.actRows}) als erwartet (${extra.expRows}) — vermutlich ist deine Bedingung zu streng, oder AND/OR sind vertauscht.<br><br>${t.concept}`;
    case "value_mismatch":
      return `Die Anzahl der Zeilen passt, aber die <b>Werte stimmen nicht überein</b>. Prüfe Berechnungen, Gruppierung oder Rundung.<br><br>${t.concept}`;
    case "sort_missing":
      return `Deine Werte stimmen, aber die <b>Sortierung passt nicht</b>. Denk an ORDER BY (und die Richtung ASC/DESC).`;
    case "no_reference":
      return `Für diese Frage konnte im Hintergrund keine Referenzlösung berechnet werden — das ist ein Fehler im Tool, nicht bei dir. Klick auf "Nächste Frage".`;
    default:
      return t.concept;
  }
}

function explainSqlError(msg){
  if (/no such column/i.test(msg)) return `Diese Spalte gibt es in der Tabelle nicht. Schau links in der Seitenleiste nach den passenden Spaltennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/no such table/i.test(msg)) return `Diese Tabelle gibt es nicht. Schau links in der Seitenleiste nach den verfügbaren Tabellennamen.<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  if (/syntax error/i.test(msg)) return `Da steckt ein Tippfehler in der SQL-Syntax (z.B. fehlendes Komma, Klammer oder Anführungszeichen).<br><br><span class="text-faint">Fehlermeldung: ${msg}</span>`;
  return `SQL-Fehler: <span class="text-faint">${msg}</span>`;
}

function escapeHtml(s){

const SQL_HL_KEYWORDS = new Set(["SELECT","FROM","WHERE","AND","OR","NOT","AS","DISTINCT","JOIN","INNER","LEFT","RIGHT","FULL","OUTER","CROSS","ON","USING","GROUP","BY","ORDER","HAVING","LIMIT","ASC","DESC","INSERT","INTO","VALUES","UPDATE","SET","DELETE","IN","LIKE","BETWEEN","IS","NULL","EXISTS","UNION","ALL","ANY","CASE","WHEN","THEN","ELSE","END","COUNT","MIN","MAX","AVG","SUM","COALESCE","IFNULL","CONCAT","SUBSTR","SUBSTRING","LENGTH","CHAR_LENGTH","UPPER","LOWER","ROUND","NOW","DATE","STRFTIME"]);
function highlightSql(sql){
  if (sql==null) return "";
  const str = String(sql);
  const re = /('(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^\sA-Za-z0-9_']+)/g;
  let out = "", m;
  while ((m = re.exec(str)) !== null) {
    const tok = m[0];
    if (m[1] !== undefined) out += `<span class="tok-str">${escapeHtml(tok)}</span>`;
    else if (m[2] !== undefined) out += `<span class="tok-num">${escapeHtml(tok)}</span>`;
    else if (m[3] !== undefined) {
      out += SQL_HL_KEYWORDS.has(tok.toUpperCase())
        ? `<span class="tok-kw">${escapeHtml(tok)}</span>`
        : `<span class="tok-id">${escapeHtml(tok)}</span>`;
    }
    else out += escapeHtml(tok);
  }
  return out;
}

/* ---------- Mini-Dashboard: kleines Balkendiagramm unter Mehrzeilen-Ergebnissen ---------- */
function isNumericCol(res, idx){
  return res.values.every(r => r[idx]!==null && r[idx]!=="" && !isNaN(Number(r[idx])));
}
function detectChartData(res){
  if (!res.values.length || res.values.length < 2) return null; // kein Chart bei 0/1 Zeile
  const nCols = res.columns.length;
  let numIdx = -1;
  for (let i = nCols-1; i>=0; i--){
    if (isNumericCol(res, i)){ numIdx = i; break; }
  }
  if (numIdx === -1) return null; // keine numerische Spalte -> kein Chart
  let labelIdx = -1;
  for (let i=0;i<nCols;i++){
    if (i===numIdx) continue;
    if (!isNumericCol(res, i)){ labelIdx = i; break; }
  }
  if (labelIdx === -1){
    labelIdx = res.columns.findIndex((c,i)=>i!==numIdx);
  }
  if (labelIdx === -1) return null;
  const rows = res.values.map(r=>({label:String(r[labelIdx]), value:Number(r[numIdx])}));
  return {labelCol: res.columns[labelIdx], valueCol: res.columns[numIdx], rows};
}
function renderMiniChart(res){
  const data = detectChartData(res);
  if (!data) return "";
  let rows = data.rows;
  const truncated = rows.length > 12;
  if (truncated) rows = rows.slice(0,12);
  const max = Math.max(...rows.map(r=>Math.abs(r.value)), 1);
  const bars = rows.map(r=>{
    const pct = Math.max(2, Math.round(100*Math.abs(r.value)/max));
    return `<div class="chart-row">
      <span class="chart-label" title="${String(r.label).replace(/"/g,'&quot;')}">${r.label}</span>
      <div class="chart-track"><div class="chart-fill" style="width:${pct}%"></div></div>
      <span class="chart-val">${r.value}</span>
    </div>`;
  }).join("");
  return `<div class="mini-chart">
    <div class="mc-head">📊 ${data.valueCol} nach ${data.labelCol}${truncated? ' · erste 12':''}</div>
    ${bars}
  </div>`;
}

function renderPreviewModal(){
  const {name, columns, rows, sortCol, sortDir, filter} = previewState;

    const f = filter.toLowerCase();
    filtered = rows.filter(r => r.some(v => String(v).toLowerCase().includes(f)));
  }
  let sorted = filtered;
  if (sortCol !== null){
    sorted = [...filtered].sort((a,b)=>{
      const av=a[sortCol], bv=b[sortCol];
      if (av===bv) return 0;
      if (av===null) return 1;
      if (bv===null) return -1;
      return (av>bv?1:-1) * (sortDir==="asc"?1:-1);
    });
  }
  const modal = document.getElementById("modal-root");
  modal.innerHTML = `

      </div>
    </div>`;
  const inp = document.getElementById("preview-search");
  if (inp){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }

  if (topics.length===1){
    const t = topics[0];
    const coreSteps = t.lesson.filter(s=>s.kind!=="detail");
    const detailSteps = t.lesson.filter(s=>s.kind==="detail");
    body = `
      <div class="lesson-card">
        <h2 style="--tc:${t.color}">${t.icon} ${t.title}</h2>
        ${t.intro ? `<div class="lesson-intro" style="--tc:${t.color}">${t.intro}</div>` : ""}
        ${renderWorkedTable(t.worked, t.color)}
        ${coreSteps.map((step,i)=>lessonStepHtml(step, t.color, i+1)).join("")}
        ${detailSteps.length ? `<div class="detail-heading">${t.detailHeading || "Gut zu wissen — optional, aber praktisch"}</div>` : ""}
        ${detailSteps.map(step=>lessonStepHtml(step, t.color)).join("")}
      </div>`;
  } else {
    body = `
      <div class="lesson-card">
        <h2>📚 Kurze Erinnerung zu deinen ${topics.length} Themen</h2>
        <p class="text-faint" style="font-size:13px;margin-top:-6px;">Mehrere Themen gleichzeitig gewählt — hier die Kurzfassung mit Beispiel zu jedem Thema. Für die volle Lektion mit allen Schritten wähle oben nur ein einzelnes Thema.</p>
        ${topics.map(t=>`
          <div class="lesson-condensed">
            <span class="lc-icon" style="--tc:${t.color}">${t.icon}</span>
            <div style="flex:1;">
              <b style="--tc:${t.color};color:${t.color}">${t.title}</b><br>
              <span class="text-faint" style="font-size:13px;">${t.concept}</span>
              <div class="lex">${t.example}</div>
            </div>
          </div>
        `).join("")}
      </div>`;
  }
  el.innerHTML = body + `
    <div class="start-row">
      <button class="secondary" onclick="showScreen('setup')">← Zurück</button>
      <button class="good" onclick="startSession(setupState.topics, setupState.count, false)">Verstanden, los geht's →</button>
    </div>`;
}

/* ---------- Question session ---------- */
function startSession(topics, count, freeplay, roundRobin){
  // Guarantee at least one question per selected topic first (shuffled order),
  // then fill the rest adaptively based on where mistakes happen.
  const shuffled = [...topics].sort(()=>Math.random()-0.5);
  const fixedQueue = count===null ? [] : shuffled.slice(0, Math.min(count, shuffled.length));

  session = {
    freeplay: !!freeplay, roundRobin: !!roundRobin, topics, targetCount: count,
    answered:0, correct:0, streak:0, bestStreak:0,
    topicStats:{}, current:null, wrongOnCurrent:0, hintTier:0,
    fixedQueue, queueIndex:0,
  };
  topics.forEach(t=> session.topicStats[t] = {asked:0, correct:0});
  nextQuestion();
  showScreen("question");
  updateHud();
}

function pickTemplate(topics, avoidId){
  const pool = QUESTIONS.filter(q=>topics.includes(q.topic) && q.id!==avoidId);
  const usePool = pool.length ? pool : QUESTIONS.filter(q=>topics.includes(q.topic));
  const weights = usePool.map(q=>{
    const stats = session.topicStats[q.topic] || {asked:0, correct:0};
    const wrongCount = Math.max(0, stats.asked - stats.correct);
    return 1 + wrongCount*1.5;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for (let i=0;i<usePool.length;i++){ r -= weights[i]; if (r<=0) return usePool[i]; }
  return usePool[usePool.length-1];
}

function nextQuestion(){
  if (session.targetCount!==null && session.answered >= session.targetCount){
    return endSession();
  }
  const avoidId = session.current ? session.current.qdef.id : null;
  let template;
  if (session.queueIndex < session.fixedQueue.length){
    const forcedTopic = session.fixedQueue[session.queueIndex];
    template = pickTemplate([forcedTopic], avoidId);
    session.queueIndex++;
  } else {
    template = pickTemplate(session.topics, avoidId);
  }
  session.current = buildInstance(template);
  session.wrongOnCurrent = 0;
  session.hintTier = 0;
  renderQuestion();
}

function updateHud(){
  const hud = document.getElementById("hud");
  if (!session){ hud.innerHTML=""; return; }
  hud.innerHTML = `
    ${session.freeplay? `<span class="chip" style="color:#9a9cec;border-color:#7477d855;">🎲 Freeplay</span>`:""}
    ${session.roundRobin? `<span class="chip" style="color:#34d399;border-color:#10b98155;">🔁 Themen-Rundgang</span>`:""}
    <span class="chip">✅ ${session.correct}/${session.answered}${session.targetCount?'/'+session.targetCount:''}</span>
    <span class="chip streak">🔥 Streak ${session.streak}</span>
    <button class="ghost small" onclick="if(confirm('Runde wirklich beenden?')) endSession()">Runde beenden</button>
  `;
}

function renderQuestion(){
  updateHud();
  const inst = session.current;
  const topic = TOPICS.find(t=>t.id===inst.qdef.topic);
  const stars = "★".repeat(inst.qdef.difficulty) + "☆".repeat(3-inst.qdef.difficulty);
  const pct = session.targetCount ? Math.min(100, Math.round(100*session.answered/session.targetCount)) : Math.min(100, session.answered*4);

  const badgeHtml = session.freeplay
    ? `<span class="topic-badge" style="--tc:#7477d8">❓ Freeplay — worum geht's wohl?</span>`
    : `<span class="topic-badge" style="--tc:${topic.color}">${topic.icon} ${topic.title}</span><span class="stars">${stars}</span>`;

  const el = document.getElementById("screen-question");
  el.innerHTML = `
    <div class="q-header">
      ${badgeHtml}
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="text-faint" style="font-size:12px;">${session.roundRobin ? `noch ${session.targetCount-session.answered} Frage${session.targetCount-session.answered===1?'':'n'}` : `${session.answered+1}${session.targetCount?'/'+session.targetCount:''}`}</span>
    </div>
    <div class="q-card"><p>${inst.promptText}</p></div>
    ${!session.freeplay ? `
    <details class="refcard topic-refcard">
      <summary>📖 Syntax &amp; Merksätze — ${topic.title} <span class="text-faint" style="font-weight:400;">zum Nachschlagen, während du übst</span></summary>
      <div class="refbody">
        <div class="topic-syntax">${topic.syntax.replace(/</g,"&lt;")}</div>
        ${topic.diagram==="joins" ? renderJoinDiagram() : ""}
        ${(()=>{ let n=0; return topic.lesson.map(step=>lessonStepHtml(step, topic.color, step.kind==="detail"?null:++n)).join(""); })()}
      </div>
    </details>` : ""}
    <div class="editor-wrap">
      <div class="editor-toolbar">
        <span>MySQL-Editor</span>
        <span><span class="kbd">Cmd</span> / <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> zum Ausführen</span>
      </div>
      <div id="editor-container"></div>
    </div>
    <div class="run-row">
      <button onclick="runAndCheck()">▶ Ausführen &amp; prüfen</button>
    </div>
    <div class="hint-row">
      <button class="secondary small" id="hint-btn" onclick="showHint()">💡 Tipp (0/3)</button>
      <button class="ghost small" onclick="if(confirm('Aufgeben und Lösung zeigen?')) giveUp()">🏳 Aufgeben</button>
    </div>
    <div id="hint-zone"></div>
    <div class="results-panel" id="results-panel">
      <div class="rp-head">Ergebnis</div>
      <div class="rp-body"><div class="empty-note">Noch keine Abfrage ausgeführt.</div></div>
    </div>
    <div id="feedback-zone"></div>
  `;

  if (cm) cm.toTextArea && cm.toTextArea();
  cm = CodeMirror(document.getElementById("editor-container"), {
    value: "-- Schreib deine Abfrage hier...\n",
    mode: "text/x-mysql",
    theme: "dracula",
    lineNumbers: true,
    matchBrackets: true,
    indentUnit: 4,
    extraKeys: {
      "Cmd-Enter": runAndCheck,
      "Ctrl-Enter": runAndCheck,
    }
  });
  setTimeout(()=>cm.focus(), 50);
  document.getElementById("hint-zone").innerHTML = "";
}

/* ---------- Tiered hints ---------- */
const SQL_KEYWORDS = new Set(["SELECT","FROM","WHERE","GROUP","BY","HAVING","ORDER","LIMIT","JOIN","LEFT","RIGHT",
  "INNER","ON","USING","AS","AND","OR","NOT","IN","LIKE","BETWEEN","IS","NULL","DISTINCT","CASE","WHEN","THEN",
  "ELSE","END","COUNT","SUM","AVG","MIN","MAX","ROUND","CONCAT","LENGTH","CHAR_LENGTH","UPPER","LOWER",
  "SUBSTRING","LEFTSTR","RIGHTSTR","DATEDIFF","TIMESTAMPDIFF","DATE_FORMAT","CURDATE","CURRENT_DATE","DESC","ASC"]);

function sqlToSkeleton(sql){
  let out = sql.replace(/'[^']*'/g, "'___'");
  out = out.replace(/\b\d+(\.\d+)?\b/g, "___");
  out = out.replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g, (word)=>{
    return SQL_KEYWORDS.has(word.toUpperCase()) ? word.toUpperCase() : "___";
  });
  return out;
}

function planFromSql(sql){
  const parts = [];
  if (/\(SELECT/i.test(sql)) parts.push("eine Subquery in Klammern");
  if (/\bJOIN\b/i.test(sql)) parts.push("ein JOIN zwischen Tabellen");
  if (/CASE\s+WHEN/i.test(sql)) parts.push("CASE WHEN für eine neue Kategorien-Spalte");
  if (/GROUP BY/i.test(sql)) parts.push("GROUP BY");
  if (/HAVING/i.test(sql)) parts.push("HAVING (nach dem GROUP BY)");
  if (/\bWHERE\b/i.test(sql)) parts.push("WHERE zum Filtern einzelner Zeilen");
  if (/\bDISTINCT\b/i.test(sql)) parts.push("DISTINCT");
  if (/(COUNT|SUM|AVG|MIN|MAX)\s*\(/i.test(sql)) parts.push("eine Aggregatfunktion (COUNT/SUM/AVG/MIN/MAX)");
  if (/\bLIKE\b/i.test(sql)) parts.push("LIKE mit einem Platzhalter (% oder _)");
  if (/\bIN\s*\(/i.test(sql)) parts.push("IN mit einer Werteliste");
  if (/BETWEEN/i.test(sql)) parts.push("BETWEEN für einen Bereich");
  if (/DATEDIFF|TIMESTAMPDIFF|DATE_FORMAT/i.test(sql)) parts.push("eine Datumsfunktion");
  if (/CONCAT|LENGTH|LEFTSTR|RIGHTSTR|SUBSTRING|UPPER/i.test(sql)) parts.push("eine Textfunktion");
  if (/ORDER BY/i.test(sql)) parts.push("ORDER BY zum Sortieren");
  if (/LIMIT/i.test(sql)) parts.push("LIMIT zum Abschneiden");
  return parts;
}

function explainQuery(sql){
  const plan = planFromSql(sql);
  return plan.length ? "Diese Lösung nutzt: " + plan.join(", ") + "." : "Diese Lösung ist eine einfache SELECT/WHERE-Abfrage ohne weitere Extras.";
}

function currentHintTopic(){ return TOPICS.find(t=>t.id===session.current.qdef.topic); }

function showHint(){
  session.hintTier = Math.min(3, (session.hintTier||0) + 1);
  renderHints();
}

function renderHints(){
  const inst = session.current;
  const tier = session.hintTier||0;
  const topic = currentHintTopic();
  let html = "";
  if (tier>=1){
    const label = session.freeplay
      ? `Das gehört zum Thema <b>${topic.icon} ${topic.title}</b>.`
      : `Erinnerung: ${topic.concept}`;
    html += `<div class="hint-box"><div class="hb-tier">Tipp 1 · Kategorie</div>${label}</div>`;
  }
  if (tier>=2){
    const plan = planFromSql(inst.sql);
    const label = plan.length ? "Du brauchst ungefähr: " + plan.join(", ") + "." : "Hier reicht ein einfaches SELECT mit WHERE — kein besonderes Extra-Werkzeug nötig.";
    html += `<div class="hint-box"><div class="hb-tier">Tipp 2 · Bauplan</div>${label}</div>`;
  }
  if (tier>=3){
    html += `<div class="hint-box"><div class="hb-tier">Tipp 3 · Skelett</div>Fülle die Lücken selbst aus:<code>${sqlToSkeleton(inst.sql).replace(/</g,"&lt;")}</code></div>`;
  }
  document.getElementById("hint-zone").innerHTML = html;
  const btn = document.getElementById("hint-btn");
  if (btn){
    btn.textContent = tier>=3 ? "💡 Tipp (alle genutzt)" : `💡 Tipp (${tier}/3)`;
    btn.disabled = tier>=3;
  }
}

function giveUp(){
  const inst = session.current;
  const stats = session.topicStats[inst.qdef.topic];
  session.answered++; stats.asked++; session.streak = 0;
  const topic = currentHintTopic();
  document.getElementById("feedback-zone").innerHTML = `
    <div class="feedback bad">
      <h3>🏳 Hier ist die Lösung</h3>
      <div class="body">${explainQuery(inst.sql)}</div>
      <div class="solution-box">${inst.sql.replace(/</g,"&lt;")}</div>
      ${session.freeplay ? `<div class="body" style="margin-top:10px;">💡 Thema war: <b>${topic.icon} ${topic.title}</b> — ${topic.concept}</div>` : ""}
      <div class="actions">
        <button onclick="nextQuestion()">Verstanden, nächste Frage →</button>
      </div>
    </div>`;
  document.getElementById("hint-zone").innerHTML = "";
  updateHud();
}

function runAndCheck(){
  const userSql = cm.getValue();
  const resultsPanel = document.getElementById("results-panel").querySelector(".rp-body");
  const feedbackZone = document.getElementById("feedback-zone");
  let actual;
  try{
    actual = execSqlSafe(mysqlCompat(userSql));
  }catch(e){
    resultsPanel.innerHTML = `<div class="error-note">${e.message}</div>`;
    feedbackZone.innerHTML = renderFeedbackHtml(false, explainSqlError(e.message), null);
    session.wrongOnCurrent++;
    return;
  }
  resultsPanel.innerHTML = actual.values.length
    ? renderTableHtml(actual) + renderMiniChart(actual)
    : `<div class="empty-note">Deine Abfrage lief fehlerfrei, liefert aber 0 Zeilen.</div>`;

  const verdict = gradeAnswer(session.current, actual);
  handleVerdict(verdict);
}

function handleVerdict(verdict){
  const inst = session.current;
  const topic = inst.qdef.topic;
  const stats = session.topicStats[topic];
  const feedbackZone = document.getElementById("feedback-zone");

  if (verdict.ok){
    if (session.wrongOnCurrent===0){ session.streak++; session.bestStreak=Math.max(session.bestStreak, session.streak); }
    else { session.streak = 0; }
    session.correct++;
    session.answered++;
    stats.asked++; stats.correct++;
    feedbackZone.innerHTML = renderFeedbackHtml(true, pickPraise(), null);
    if (session.freeplay){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">💡 Thema war: ${TOPICS.find(t=>t.id===topic).icon} ${TOPICS.find(t=>t.id===topic).title}</div>${TOPICS.find(t=>t.id===topic).concept}</div>`;
    }
    if (inst.qdef.alt){
      feedbackZone.innerHTML += `<div class="alt-box"><div class="ab-title">🔀 Es gibt noch einen anderen guten Weg</div>
        <code>${inst.qdef.alt.sql.replace(/</g,"&lt;")}</code>${inst.qdef.alt.note}</div>`;
    }
    document.getElementById("hint-zone").innerHTML = "";
    updateHud();
    launchConfetti();
  } else {
    session.wrongOnCurrent++;
    if (session.wrongOnCurrent===1) session.streak = 0;
    const explanation = explainFailure(verdict.reason, verdict, topic);
    feedbackZone.innerHTML = renderFeedbackHtml(false, explanation, TOPICS.find(t=>t.id===topic).example);
    updateHud();
  }
}

function pickPraise(){
  const arr = ["Richtig! 🎉","Nailed it! 💪","Genau so! ✨","Sauber gelöst! 🔥","Perfekt! 🚀","Stark! 🧠"];
  return arr[Math.floor(Math.random()*arr.length)];
}

function renderFeedbackHtml(ok, message, example){
  if (ok){
    return `
      <div class="feedback ok">
        <h3>✅ ${message}</h3>
        <div class="actions">
          <button onclick="nextQuestion()">Nächste Frage →</button>
        </div>
      </div>`;
  }
  const inst = session.current;
  return `
    <div class="feedback bad">
      <h3>🤔 Noch nicht ganz</h3>
      <div class="body">${message}</div>
      ${example ? `<div class="example-box"><b>Anderes Beispiel:</b> ${example}</div>` : ""}
      <div class="actions">
        <button class="secondary" onclick="document.getElementById('feedback-zone').innerHTML=''; cm.focus();">Nochmal versuchen</button>
        <button class="ghost" onclick="giveUp()">Lösung anzeigen</button>
      </div>
    </div>`;
}

/* ---------- Confetti ---------- */
function launchConfetti(){
  const root = document.getElementById("confetti-root");
  const colors = ["#7477d8","#e0a458","#22c55e","#ec4899","#6fa8dc","#f59e0b"];
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  for (let i=0;i<28;i++){
    const s = document.createElement("span");
    s.style.left = Math.random()*100+"vw";
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDelay = (Math.random()*0.4)+"s";
    s.style.animationDuration = (1.8+Math.random()*1.2)+"s";
    wrap.appendChild(s);
  }
  root.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 3200);
}

/* ---------- Summary ---------- */
function endSession(){
  const topicRows = Object.entries(session.topicStats).filter(([,s])=>s.asked>0).map(([id,s])=>{
    const t = TOPICS.find(x=>x.id===id);
    const pct = Math.round(100*s.correct/s.asked);
    return `<div class="tb-row">
      <div class="tb-label">${t.icon} ${t.title}</div>
      <div class="tb-track"><div class="tb-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="tb-pct">${pct}%</div>
    </div>`;
  }).join("");

  const perfect = session.answered>0 && session.correct===session.answered;
  lastSession = session;

  const el = document.getElementById("screen-summary");
  el.innerHTML = `
    <div class="summary-card">
      ${perfect ? `<div class="crown">🎉</div><div class="sub">Alles richtig — sauber!</div>` : ""}
      <div class="big-score">${session.correct}/${session.answered}</div>
      <div class="sub">richtig beantwortet &middot; bester Streak: ${session.bestStreak} 🔥</div>
      <div class="topic-bars">${topicRows || '<div class="text-faint" style="font-size:13px;">Keine Fragen beantwortet.</div>'}</div>
      <div class="start-row" style="justify-content:center;margin-top:24px;">
        <button class="secondary" onclick="showScreen('setup'); renderSetup();">Zur Startseite</button>
        <button class="good" onclick="startSession(lastSession.topics, lastSession.targetCount, lastSession.freeplay, lastSession.roundRobin)">Nochmal, gleiche Runde ↻</button>
      </div>
    </div>`;
  showScreen("summary");
  if (perfect) launchConfetti();
}

/* ================= Boot ================= */
function base64Ready(){
  initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` }).then(SQL=>{
    const bytes = base64ToUint8Array(DB_B64);
    db = new SQL.Database(bytes);
    registerUdfs(db);
    renderSchemaTree();
    renderSetup();
  }).catch(err=>{
    document.getElementById("screen-setup").innerHTML = `<div class="setup-card"><h2>Fehler beim Laden</h2><p>${err.message}</p></div>`;
  });
}
base64Ready();
